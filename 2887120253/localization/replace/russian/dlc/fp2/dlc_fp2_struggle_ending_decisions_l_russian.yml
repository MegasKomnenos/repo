 ##### Hostility #####         #замена иберии на хаммерфелл. в файле отсутствует большое количество строк из ванили
 struggle_iberia_ending_hostility_decision_desc:0 "Пришла пора сильному лидеру наконец-то вытащить эту провинцию из трясины бесконечных войн и разладов. Хаммерфеллом будет править [ROOT.Char.GetFaith.GetAdjectiveNoTooltip|l][Select_CString(ROOT.Char.IsFemale, 'ая', 'ий' )] [ROOT.Char.Custom('GetQueenKing')|l] под [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip|l]им знаменем!"
 struggle_iberia_ending_hostility_decision_tooltip:0 "Покончить с [Concept( 'struggle', 'борьбой' )|E] за Хаммерфелл"
 struggle_iberia_ending_hostility_decision_confirm:1 "Покончить с хаммерфельской борьбой"
 # Triggers
 struggle_iberia_ending_hostility_decision_kingdom_tt:0 "Вы [Concept( 'hold', 'удерживаете' )|E] и [Concept( 'completely_control', 'полностью контролируете' )|E] не менее 2 [de_jure|El] [Concept( 'kingdoms', 'королевств' )|E] в империи [GetTitleByKey('e_hammerfell').GetNameNoTier] ([SCOPE.ScriptValue('fp2_struggle_ending_kingdom_counter_value')|0]/[SCOPE.ScriptValue('fp2_struggle_hostility_kingdom_total_value')|0])"
 struggle_iberia_ending_hostility_decision_region_tt:2 "Никакой другой [Concept( 'independent', 'независимый' )|E] [Concept( 'struggle_involved', 'участвующий в борьбе' )|E] [Concept( 'ruler', 'правитель' )|E] не контролирует более [SCOPE.ScriptValue('fp2_struggle_hostility_region_percent_value')|0]% региона [GetGeographicalRegion('mundus_tamriel_hammerfell').GetName]"
 # Effects
 fp2_struggle_hostility_conversion_tt:1 "Скорость [Concept( 'councillor_tasks', 'заданий' )|E] $task_conversion$ и $task_promote_culture$ в [Concept( 'region', 'регионе' )|E] [GetGeographicalRegion('mundus_tamriel_hammerfell').GetName]: #P +50%#!"
 fp2_struggle_hostility_conversion_holy_tt:0 "Скорость [Concept( 'councillor_tasks', 'задания' )|E] $task_conversion$ в [Concept( 'region', 'регионе' )|E] [GetGeographicalRegion('mundus_tamriel_hammerfell').GetName]: #P +50%#!"
 fp2_struggle_hostility_conversion_culture_tt:0 "Скорость [Concept( 'councillor_tasks', 'задания' )|E] $task_promote_culture$ в [Concept( 'region', 'регионе' )|E] [GetGeographicalRegion('mundus_tamriel_hammerfell').GetName]: #P +50%#!"
 fp2_struggle_hostility_acceptance_tt:0 "Вражда в Хаммерфелле"
 # Modifiers
 fp2_struggle_hostility_house_faith_modifier_desc:0 "Этот дом завоевал большую часть Хаммерфелла во имя своей веры."
 fp2_struggle_hostility_house_culture_modifier_desc:0 "Этот дом завоевал большую часть Хаммерфелла во имя своего народа."
 fp2_struggle_hostility_house_combined_modifier_desc:0 "Этот дом завоевал большую часть Хаммерфелла во имя своих веры и народа."
 ##### Compromise #####
 struggle_iberia_ending_compromise_decision_desc:0 "Эти бесконечные конфликты из-за провинции лишь ослабляют нас всех. Пришло время признать, что вновь объединить Хаммерфелл не получится. Нас устроит и [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]."
 # Triggers
 struggle_iberia_ending_compromise_decision_kingdom_tt:0 "Вы [Concept( 'hold', 'удерживаете' )|E] и [Concept( 'completely_control', 'полностью контролируете' )|E] любое из [de_jure|El] [Concept( 'kingdom', 'королевств' )|E] в империи [GetTitleByKey('e_hammerfell').GetNameNoTier]  ([SCOPE.ScriptValue('fp2_struggle_ending_kingdom_counter_value')|0]/[SCOPE.ScriptValue('fp2_struggle_conciliation_kingdom_total_value')|0])"
 struggle_iberia_ending_compromise_decision_region_tt:0 "Вы контролируете менее [SCOPE.ScriptValue('fp2_struggle_compromise_owned_percent_value')|0]% [Concept( 'region', 'региона' )|E] [GetGeographicalRegion('mundus_tamriel_hammerfell').GetName] (Сейчас: [SCOPE.ScriptValue('struggle_iberia_ending_compromise_decision_region_owned_percent_value')|0]%)"
 struggle_iberia_ending_compromise_decision_other_region_tt:0 "Никакой другой [Concept( 'independent', 'независимый' )|E] [Concept( 'struggle_involved', 'участвующий в борьбе' )|E] [Concept( 'ruler', 'правитель' )|E] не контролирует [SCOPE.ScriptValue('fp2_struggle_compromise_involved_percent_value')|0]% или более [Concept( 'region', 'региона' )|E] [GetGeographicalRegion('mundus_tamriel_hammerfell').GetName]."
 # EK TODO STRUGGLE: check if we want to limit this to kings only
 struggle_iberia_ending_compromise_decision_independent_tt:0 "Ни у каких других [Concept( 'independent', 'независимых' )|E] [Concept( 'struggle_involved', 'участвующих в борьбе' )|E] [Concept( 'ruler', 'правителей' )|E] нет [Concept( 'title', 'титулов' )|E] [Concept( 'king', 'короля' )|E] или [Concept( 'emperor', 'императора' )|E] (Сейчас: [SCOPE.ScriptValue('struggle_iberia_ending_compromise_decision_independent_counter_value')|0])"
 struggle_iberia_ending_compromise_decision_interloper_tt:0 "Более [SCOPE.ScriptValue('fp2_struggle_compromise_uninvolved_percent_value')]% [Concept( 'region', 'региона' )|E] [GetGeographicalRegion('mundus_tamriel_hammerfell').GetName] удерживают [Concept( 'struggle_interloper', 'вмешавшиеся' )|E] или [Concept( 'struggle_uninvolved', 'не участвующие в борьбе' )|E] [Concept( 'rulers', 'правители' )|E] (Сейчас: [SCOPE.ScriptValue('struggle_iberia_ending_compromise_decision_region_interloper_percent_value')|1]%)"
 # Effects
 fp2_struggle_compromise_create_new_kingdoms_tt:0 "Каждое [Concept( 'independent', 'независимое' )|E] или отдельное [Concept( 'duchy', 'герцогство' )|E] в [Concept( 'region', 'регионе' )|E] [GetGeographicalRegion('mundus_tamriel_hammerfell').GetName] становится [de_jure|El] [Concept( 'kingdom', 'королевством' )|E]"
 fp2_struggle_compromise_create_new_empires_tt:1 "Каждое [de_jure|El] [Concept( 'kingdom', 'королевство' )|E] в [Concept( 'region', 'регионе' )|E] [GetGeographicalRegion('mundus_tamriel_hammerfell').GetName], имеющее более [EmptyScope.ScriptValue('fp2_struggle_compromise_ending_minimal_empire_size')|0] [Concept( 'counties', 'графств' )|E], становится [de_jure|El] [Concept( 'empire', 'империей' )|E]. Остальные королевства [de_jure|El] войдут в состав соседней [Concept( 'empire', 'империи' )|E]."
 TRUCE_FP2_COMPROMISE:0 "Компромисс в Хаммерфелле"
 # Modifiers
 fp2_struggle_compromise_house_reward_modifier_desc:0 "Держава под началом этого дома вышла из борьбы за Хаммерфелл."
 fp2_struggle_compromise_defensive_reward_modifier_desc:1 "Это графство — историческая столица одного из хаммерфельских государств, пережившая столетия борьбы."
 ##### Conciliation ######
 struggle_iberia_ending_conciliation_decision_desc:0 "Залечить многовековые раны будет непросто, но нам нужно это сделать, если мы хотим наконец принести в провинцию долгий мир. Воистину, Хаммерфелл принадлежит нам всем."
 #Effects
 fp2_struggle_conciliation_acceptance_tt:0 "Примирение в Хаммерфелле"
 fp2_struggle_conciliation_join_war_tt:1 "Навсегда разрешает [Concept( 'rulers', 'правителям' )|E] [Concept( 'struggle_involved', 'участвующих в борьбе' )|E] [Concept( 'culture', 'культур' )|E] и [Concept( 'faith', 'конфессий' )|E] присоединяться друг к другу в оборонительных [Concept( 'wars', 'войнах' )|E] против захватчиков из-за пределов региона [GetGeographicalRegion('mundus_tamriel_hammerfell').GetName]"
 # Modifiers
 fp2_struggle_conciliation_house_reward_modifier_desc:0 "Этот дом признал, что путь к долгосрочному миру в Хаммерфелле лежит через терпимость и дружбу."
