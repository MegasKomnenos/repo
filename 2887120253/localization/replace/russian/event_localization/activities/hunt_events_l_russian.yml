l_russian:
 hunt.1002.desc_wounded_courtier:0 "[ROOT.Char.Custom('LocalAnimalDesc')|U] летит над ущельем, и мы пытаемся не отставать, но наши ездовые звери начинают спотыкаться, и вдруг [hunting_courtier_1.GetTitledFirstNamePossessive] с криком летит на землю.\n\nНа вид ничего серьезного, но все же [hunting_courtier_1.GetTitleTierName|l] корчится от боли."
 hunt.1002.desc:0 "Я вижу только, как [ROOT.Char.Custom('LocalAnimal')] бежит по ущелью, и мы следуем за зверем… Весь мир сужается до этой восхитительной погони. [hunting_courtier_1.GetTitledFirstName] рядом со мной, лают собаки, кричат люди… Мы медленно настигаем добычу — меня охватывает невероятное возбуждение!"     #замена лошадей на обобщённых зверей
 
 hunt.4012.desc:1 "Я скачу впереди отряда, и вдруг [ROOT.Char.Custom('TerrainType')] словно замирает, окутавшись плотной, почти материальной тишиной. Я едва слышу своё дыхание.\n\nЯ собираюсь повернуть назад, к остальным, но вдруг вижу зверя. Очертания его неясны, будто во сне, но это [ROOT.Char.Custom('LocalAnimal')] со шкурой белой, как снег."

 hunt.5002.a:0 "Возвращайся на своего скакуна, [hunt_participant.GetFirstNameNoTooltip]…"
 hunt.5003.desc.flower:1 "[hunt_participant.GetSheHe|U] что-то кладёт мне за ухо. «Хоть этому цветку и не сравниться с тобой, при взгляде на него мне сразу вспоминаешься ты.»"

 hunt.9001.desc_opening:0 "Охота подходит к концу, и мы седлаем своих скакунов. Вскоре [ROOT.Char.Custom('TerrainType')] останется позади,"
 