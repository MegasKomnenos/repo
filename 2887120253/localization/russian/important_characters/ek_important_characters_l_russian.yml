 imp_char_camoran_arenthia1_009_desc_440:0 "$bm_warlordrising_reaper_maevelle_desc$"
 
 imp_char_camoran_arenthia1_009_desc_450:0 "Мэвэль оказалась неспособна справиться с угрозой, исходящей от коловианских пришельцев, и была свергнута Нендером Сумеречная Лоза, который наконец дал бой Цицерону Пуллии."
 
 #Habais
 imp_char_shabu_001:0 ""
 imp_char_shabu_001_desc:0 "[SelectLocalization( GreaterThan_CFixedPoint( GetGlobalVariable('start_year').GetValue, '(CFixedPoint)3360' ), 'imp_char_shabu_001_desc_450', 'imp_char_shabu_001_desc_440' )]"
 imp_char_shabu_001_desc_440:0 "$bm_warlordrising_reaper_habais_desc$"
 imp_char_shabu_001_desc_450:0 "Хабаис проявил себя как умелый лидер и сохранил порядок в Дюне, расширив при этом свои владения. Благодаря усилиям Хабаиса, Дюна встречает Междуцарствие и его беспорядки как бастион стабильности в Анеквине."
 
 #Nendaer
 imp_char_vinedusk_1:0 ""
 imp_char_vinedusk_1_desc:0 "[SelectLocalization( GreaterThan_CFixedPoint( GetGlobalVariable('start_year').GetValue, '(CFixedPoint)3360' ), 'imp_char_vinedusk_1_desc_450', 'imp_char_vinedusk_1_desc_440' )]"
 imp_char_vinedusk_1_desc_440:0 "$bm_warlordrising_reaper_nendaer_desc$"
 imp_char_vinedusk_1_desc_450:0 "Нендер сверг беспомощных Каморанов и теперь самолично возглавляет босмеров Арентии. Его борьба против коловианского военачальники Пуллии до сих пор была успешна, и все арентийцы понимают, что «королевству Южного Вельда» осталось недолго."
 
 
