 ## EK2 Characters ##
 
 #King Aenedhel, King of Falinesti
 imp_char_camoran_017:0 ""
 imp_char_camoran_2f_desc:0 "Сохранять мир внутри босмерского клане — задача не из лёгких сама по себе, что уж говорить о том, каково быть миротворцев всего Валенвуда. Энедель Миротворец, первый среди равных король-Каморан, справлялся с этим превосходно, его способности просто поражали.\n\nНе было конфликтов, которых он не мог прекратить, недопонимания, которого он не мог разрешить, врагов, которых он не мог помирить. В ходу была поговорка: «Слова Энеделя бьют точнее стрел Эплира»; свидетельство того, насколько высоко оценивали его дипломатические способности.\n\nВ 2Э 420, когда стало известно, что Фалинести вместе со всеми обитателями (которых стали считать мёртвыми) исчез, подопечные короля погрузились в траур. По всей стране слышны были плач и крики отчаяния, и Сильвенар Эделорн слёг с болезнью на три года. Энедель Миротворец стал Энеделем Оплакиваемым.\n\nОбрушение имперской власти и утрата главного миротворца привели к тому, что разобщённые короли и королевы из династии Каморан, из которых наиболее примечательными были ветви Сильвенара и Древлего Корня, все заявили о своих претензиях на титул верховного королевства. Сад И'ффре стоял на краю тотальной анархии."

 #Nord Adventurer who kicked out previous Bruma ruler
 imp_char_frostbeard_98:0 ""
 imp_char_frostbeard_98_desc:0 "Король Борвир стал правителем Брумы по праву завоевателя, убив имперского графа Януса на ступенях его замка.\n\nЕго отец, Эйнар Инеевая Борода, зарабатывал на жизнь охотясь на троллей в лесах графства Брума; этого более чем хватало и для него, и для сына. Он трагически погиб в стычке со стражниками-вымогателями: они хотели получить треть его добычи вместо положенной десятой доли. Борвир обратился к капитану стражи, требуя наказания виновных, но в ответ был брошен в тюрьму. Там бы он и сгинул, если бы не милость графа.\n\nУбеждённый в идее справедливого правления, Борвир попросил заступничества у имперского графа Януса, изложив свои невзгоды. К его чести, Янус предложил соглашение, согласно которому Борвиру должны были вдвое компенсировать стоимость украденного тролльего жира, Эйнара — похоронить за счёт государства, а кроме того, Борвир получал законное право на поединок с убийцами отца.\n\nНо Борвиру было мало. Он хотел, чтобы голова капитана стражи слетела с плеч! Янус не был к этому готов, поэтому повторил своё предложение, на что Борвир ответил отказом.\n\nВ последовавший месяц все замешанные стражники были убиты, их тела — обобраны. Борвир поклялся на крови убить Януса и возглавил банду вместе с другими обделёнными нордами. В 2Э 432 он захватил Бруму и выполнил свою клятву. После этого на выборном собрании главы кланов признали Борвира «Королём Брумы», а сына Борвира Харальда — его наследником. Харальд вступил в наследование в 2Э 439, оставаясь в тени своего предшественника."

 #Last King of Orsinium
 imp_char_golzarga_101:0 ""
 imp_char_golzarga_101_desc:0 "Башаг гро-Орсиниум Голзарга взошёл на трон всего за несколько лет до ужасной гибели Савириен-Чорака. Его ночи были замутнены дурными знамениями, лишая его сил, которыми когда-то полнилось его могучее тело.\n\nНаследники рода Голзарга должны были отличаться выдающимся характером, владеть правом, и, #EMP что наиболее важно#!, дипломатией. Существование Орсиниума #bold зависело#! от выраженного или подразумеваемого одобрения бретонцев. Никто не хотел повторения безрассудств короля Голкарра.\n\nБашаг не выглядел сильнейшим из принцев на бумаге, но служба в легионе потентата и дипломатический опыт сделали его достойным кандидатом. Ключевым прорывом в исполнении его королевских амбиций был 425 год Второй эры, когда зимой Савириен-Чорак отправил запечатанное послание, пообещав Орсиниуму статус провинции, но только в том случае, если «легат Башаг Голзарга будет избран королём орков». Сделка была настолько многообещающей, что орочьи кланы охотно согласились. Башаг настоял на том, чтобы сразиться с непокорными претендентами, взяв в свидетели вождей и имперскую делегацию.\n\nПрошло пять лет, и Башаг стал тенью прошлого себя. Самого могущественного орсимера в Тамриэле мучил экзистенциальный ужас… Всё прояснилось, когда в 2Э 431 к воротам подошла коалиция под предводительством Шорнхельма: орки были слишком слабы! Орсиниум Голзарги продержался всего год против мощи бретоно-редгардского союза. Целые орочьи кланы сгинули в ходе разорения города или вынуждены были отступить в ротгарские твердыни своих предков.\n\nКлан Ял выжил, но Ротгар не был их домом. Предки этого клана обитали в Скайриме, его и выбрал назначением их исхода вождь Яшнаг."

 # Cyril II aka guy who ridiculed the Potentate, then got executed. what great surprise
 imp_char_cuptor_98:0 ""
 imp_char_cuptor_98_desc:0 "Никто не знает наверняка, чем Кирилла II, имперского графа Бравила, так привлекла сатира над #LORE [Concept('compendium_potentate', 'потентатом')]#!. Возможно, виной всему какой-то магнат, вставлявший ему палки в колёса? Или, быть может, игнорирование со стороны циснибенских префектов? Всё-таки его род пользовался наибольшим доверием в Сиродиле эпохи Савириен-Чорака…\n\nУ Кирилла была собственная печать, освобождение от многих налогов и право на содержание собтвенного войска — символ особого статуса в Тамриэле после событий Бардмонта. Потентат воспринимал Купторов как родственников. Но пристрастия Савириена со временем привели к тому, что Кирилл перестал его уважать.\n\nВ своей дерзости он дошёл до того, чтобы проспонсировать анонимного автора повести «Севилион Коракк». Севилион Коракк в ней — это король с переменчивым характером, страдающий шепелявостью и склонный к бездействию, — лишь незначительно скрытая критика сюзерена, в которой для лучшего эффекта реальность сочетается с вымыслом. Большинство читателей сходятся в том, что цикл достигает высшей точки в части под названием «Севилион Коракк: тень Варсидия», а также «Севилион Коракк: мемуары Сидория».\n\nКирилл становился всё более дерзким, пока однажды не зашёл слишком далеко. Во время очередного собрания Совета старейшин в связи с кризисом, спровоцированным нерешительностью Савириена, он едко подметил, что «прототип и в подмётки не годится Севилиону». Доверенные помощники Савириен-Чорака, или же он сам, организовали тайное расследование. В ходе него в поместье графа обнаружили многочисленные копии «Селивиона Коракка» наряду с письмами и векселями, подтверждающими финансовые связи с автором книг.\n\nКирилл II был обвинён в государственной измене, лишён графских полномочий и лично обезглавлен потентатом мечом «Королева Клыков». Принца Венара официально помиловали и позволили ему уехать, однако ещё некоторое время его преследовали «лоялисты», которые хотели выслужиться перед сюзереном."

 imp_char_blackrose_dyaan_01:0 ""
 imp_char_blackrose_dyaan_01_desc:0 "Аиисхара считали выдающимся лидером и переговорщиком: он проявлял дипломатию в общении с соплеменниками, Хистом и различными народами Чернотопья во времена неопределённости и невзгод. Переселив большинство лилмотитских свор в избранные им земли вокруг новой Чёрной Розы, Аиисхар усилил защиту рощ, вверенных лилмотитам Хистом, предотвратив конфликты с аргонианами.\n\nПри его правлении у лилмотитов появилась надежда на будущий реванш и возможность вернуть утраченные города. Говоря кратко, Аиисхар вёл свой народ по пути к величию, но внезапная и горькая ссора с сыном вынудила его изгнать своего ребёнка и назначить наследником новорождённую дочь — решение, которое ставило под угрозу всё его наследие, выкованное с таким трудом."

 imp_char_atla_205:0 ""
 imp_char_atla_205_desc:0 "Аурил II был гордым человеком и превосходным королём. Он унаследовал маленький пост-айлейдский город-государство и превратил его в королевство, достойное своего названия. Не желая мириться с тем, чтобы другие города за пределами ворот Солреста сгинули в трясинах Чернотопья, а также стремясь уберечь блудные племена севера от посягательств наг, Аурил, где используя убеждение, а где силу, распространил свою милость и покровительство на все оставшиеся племена йеспестов.\n\nВ течение своей жизни он удерживал тонкое равновесие между легитимацией по подобию айлейдского тирана и настроенностью на будущее и отказ от наиболее презираемых обычаев диких эльфов. Говорили, что ореола славы и ужаса, окружавшего его, хватало, чтобы отвадить от Солреста потенциальных захватчиков; но увы, харизму нельзя унаследовать так же, как трон.\n\nАурил погиб, пытаясь сжечь мосты Лейавина: повелитель Эсдруф не хотел, чтобы йеспестский король вмешивался в его планы на экономическую доминацию над Топальским заливом."

 imp_char_indoril_alma_rula:0 ""
 imp_char_indoril_alma_rula_desc:0 "Четыре ординаторских ордена манят молодых воителей, что стремятся проявить свою веру, так же, как мотыльков манит свет. Для Фарвила Индорила, который с самого момента рождения в 2Э 345 был посвящён АЛЬМСИВИ, это было священным долгом.\n\nРазумеется, молодому меру предстояло пройти духовную подготовку. К радости его учителей, он много времени посвящал размышлениям о схоластике Храма и каймерской истории. Но при этом он также ежедневно тренировался в учебных поединках со своим отцом, отставным генералом Брэйносом.\n\nФарвил, двоюродный брат грандмастера Матина, принёс клятву Ординации в 2Э 361, вступив сразу во все четыре ордена. Чтобы почтить желание его покойного отца, он стал боевым ординатором, оставив доктринальное направление, к которому у него были склонности. Выдающаяся служба в ордене Войны, а также опыт в других орденах — в особенности в ордене Доктрины и Ординации — принесли ему уважение среди коллег. Со временем его имя стали произносить с почтением, и он вступил в состязание с другими за должность Альма Рулы.\n\nКогда в 2Э 380 был проведён священный конклав Трёх Живых Богов по выбору их мирского голоса, Фарвил, всего через два десятка лет службы, стал самым молодым Альма Рулой в истории Храма. На голосовании Фарвил имел поддержку ордена Войны и ордена Доктрины. Чашу весов в его пользу склонил орден Дозора, выбравший его, вместо кандидата от инквизиции.\n\nПрошёл один человеческий век, и вот уже Фарвил руководит могущественным Храмом Трибунала, владеющим, помимо трёх архиканоничеств, значительными территориями в Некроме и на Вварденфелле."

 imp_char_skjoralmor_99:0 ""
 imp_char_skjoralmor_99_desc:0 "Скьоралморы ведут род от легендарного основателя Фолкрита, Бьярфруда Скьоралмора. Отец Фалька, Тадгейр прославился как реформатор, выведший владение из кризиса. Вынужденно он сократил военные расходы — решение, которое тогда казалось разумным.\nФальк, унаследовавший трон в 2Э 425, был способным правителем, но при этом слишком скупым, чтобы повысить военные расходы в период нарастающей опасности. Никакие увещевания хускарла и даже принца Хакквильда не могли побудить его принять меры.\n\nПоступившие в конце 2Э 431 вести о том, что орочье племя Ял направляется в сторону Фолкрита, затерялись в вихре политических событий, вызванных выборным собранием в Солитьюде. Ярл Фальк формально поддержал коронацию Сварта, который в остальном почти не проявлял себя в отношении Зала Серых Сосен.\n\nВсё изменилось, когда орки наконец прошли через Врата Предела и вторглись на Родину нордов в начале 2Э 432. Нордские ярлы Предела побоялись их остановить, но уведомили остальные владения. Верховный король Сварт вместе с оставшимися монархами запада организовал военный совет. Всего через несколько дней ярл Морфала Хьорта отозвала свою поддержку, усомнившись в армии Фолкрита — основной цели орочьей атаки. Таким образом, в Войне сосен принимали участие только войска Хаафингара, Вайтрана и хлипкое ополчение Фолкрита.\nПервые стычки не окончились однозначным итогом, так как орки не осаждали крепости на пути к Фолкриту: вместо этого они разоряли вайтранские сёла ради пополнения припасов. Наконец состоялось генеральное сражение — битва при Краснополье, где коалиция нордов проиграла, не учтя налаженное орками снабжение.\n\nСварт и Торриг, разгневанные на короля Фалька за его самовольство и бессилие, решились на последнюю попытку защитить южное владение: битву при Гранитном Зале в 2Э 433. И вновь центр армии, который составляли фолкритские войска, пал первым, но на сей раз подмога не подоспела. Этим поражением Фальк выкопал себе могилу.\n\nПродержавшись на волоске от гибели в течение ещё года, он погиб в 2Э 434 от руки Яшнага Яла в ходе осады Фолкрита. В тот год Хакквильд оплакивал и отца, и корону.

 imp_char_pardus_998:0 ""
 imp_char_pardus_998_desc:0 "В 345 году Второй эры герцогиня Клавдия Парда родила дочь. Юная принцесса, которую назвали Камиллой, с ранних лет проявляла способности к военному делу. Она проводила детство за настольными играми, учебными поединками и военными играми. Герцогиня Клавдия отправила свою дочь быть помощницей Атрея Фурии. Под надзором лучшего из римменейских генералов, нестойкий талант перерос в устойчивую компетентность.\n\nВ ходе первой осады Врат Рубежа в начале 2Э 356 она передавала приказы между различными армейскими подразделениями. Увидев, как во время отчаянной вылазки генерала Атрея растерзала насмерть сенч-кавалерия, она заставила противника горько заплатить, прежде чем уйти в отступление. Каджиты отправились зализывать раны, и их атакующие силы серьёзно ослабли. Вторая осада Врат Рубежа, состоявшаяся осенью 360 года, окончилась сокрушительным поражением каджитов. Клавдия Суровая гнала беспорядочно отступающую анеквинскую армию вплоть до Риммена, пользуясь этой возможностью, чтобы занять и укрепить бассейн реки Ларсий.\n\nК 2Э 383, когда Камилла II унаследовала титул матери, верховья Ларсия уже были усыпаны римменейскими поселениями. Герцогиня принялась за обезглавливание командирского состава Анеквины.\n\nНе имея в распоряжении компетентных военных, королева Мирани вынужденно назначила генералами близнецов-сутай Фа'драна и Эсджеро, которые должны были оборонять город в 2Э 389 от осады. Близилась битва близнецов-сутай. Обведя вокруг пальца неопытных генералов, Камилла подчистую разгромила анеквинский гарнизон внутри самих римменских стен. Потеряв армию, испуганные жители города и королевская семья остались без защиты. Мирани бежала из Риммена в Керур вместе с ближайшими советниками и новорождённой дочерью, Падалой. Так было основано королевство Риммен. Из дома Пард вышла королева Камилла I Завоевательница."

 imp_char_alma_rula_llothis:0 ""
 imp_char_alma_rula_llothis_desc:0 "Святой Ллотис Благочестивый был современником и соратником Трибунала. Он сформулировал основные обряды и принципы Храма Трибунала и исполнял роль символического мостика между богами и верующими."

 imp_char_alma_rula_olms:0 ""
 imp_char_alma_rula_olms_desc:0 "Святой Олмс Беспристрастный — данмерский покровитель лавочников и конторщиков, святой-покровитель дома Индорил. Олмс был основателем орденов Ординаторов, ему принадлежит заслуга разработки и формулирования основных принципов проверок, испытаний и раскаяния."
 
