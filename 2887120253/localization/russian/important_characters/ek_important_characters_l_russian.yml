 #Cicero
 imp_char_pullia_1:0 ""
 imp_char_pullia_1_desc:0 "[SelectLocalization( GreaterThan_CFixedPoint( GetGlobalVariable('start_year').GetValue, '(CFixedPoint)3360' ), 'imp_char_pullia_1_desc_450', 'imp_char_pullia_1_desc_440' )]"
 imp_char_pullia_1_desc_440:0 "$bm_warlordrising_reaper_cicero_desc$"
 imp_char_pullia_1_desc_450:0 "Попытка Цицерона построить долгоживущее коловианское королевство к югу от Стрида до сих пор не показала себя успешной. Анеквинцы при первой возможности отбили свой священный город Рол'ху, а племя Сумеречная Лоза объединило под своим знаменем босмеров Арентии. Но, наверное, самым тяжёлым ударом для Цицерона была гибель его жены во время налёта самого Нендера Сумеречная Лоза."
 
 #Maevelle
 imp_char_camoran_arenthia1_009:0 ""
