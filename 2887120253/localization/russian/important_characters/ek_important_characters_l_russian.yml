 ### OTHER
  
 #Alessia
 imp_char_alessian_100:0 ""
 imp_char_alessian_100_desc:0 "Алессия возглавила полномасштабное восстание рабов против айлейдов, что привело к образованию Первой империи.\n\nСтав императрицей, она основала новую религию, сочетавшую в себе элементы нордских и альдмерских верований.\n\nБлагословив Алессию и её наследников драконьей кровью и преподнеся ей Амулет Королей, Акатош заключил с ней соглашение, согласно которому он будет сдерживать барьер между Нирном и Обливионом до тех пор, пока она и её потомки правят Империей во имя его." #dont know about AoK being given by aka, or originating from ayleids. going with the gem existed before with ayleids as whitegold's stone, akatosh responsible for the actual amulet and its properties

 #Reman
 imp_char_reman_100:0 ""
 imp_char_reman_100_desc:0 "Ремана, рождённого, что более вероятно, от связи пастушки и мелкого дворянина, называли сыном союза короля Хрола и духа Алессии.\n\nВ ходе акавирского вторжения в конце #LORE [Concept('compendium_first_era', 'Первой эры')]#! Реман возглавлял в борьбе против захватчиков армии объединённого Сиродила. Кульминация противостояния состоялась в ходе битвы в Белом проходе, когда, как говорят, едва услышав его голос, цаэски склонились, назвав его драконорождённым.\n\nИ пусть за всю свою жизнь он так и не возьмёт себе титула, Реман завоюет большую часть Тамриэля, основав Вторую империю."

 #Reman III
 imp_char_reman_104:0 ""
 imp_char_reman_104_desc:0 "Третий своего имени и последний из династии Реман III взошёл на престол в 1Э 2877, примерно к середине Восьмидесятилетней войны с Морровиндом. В его способностях в военном деле никто не сомневался — император был прославленным охотником на драконов. Таким же воинским дарованием обладал и его сын, наследный принц Джуйлек, чей талант в полиокретике сумел положить конец затянувшемуся конфликту с Морровиндом.\n\nВоодушевлённый победой, достигнутой за три поколения, Реман III оказался в неведении о тёмных делах своего потентата, Версидью-Шайе. Тот уничтожил всю императорскую семью и заключил Сервантский мир с Трибуналом в 1Э 2920. Мир, что стал гарантией независимости Морровинда, сохранявшейся вплоть до самого падения #LORE [Concept('compendium_potentate', 'Потентата')]#!." 
 
 #Divayth Fyr
 imp_char_fyr_100:0 ""
 imp_char_fyr_100_desc:0 "Про Дивайта Фира ходит много слухов и историй, и даже самые преувеличенные из них, скорее всего, далеки от истины. Он, уж точно, один из самых могущественных магов современного Тамриэля, и, возможно, самый эксцентричный."

 #Vardengroet
 imp_char_vardengroet_gyron:0 ""
 imp_char_vardengroet_gyron_desc:0 "Жирону Варденгрёту пророчили судьбу того, кто будет нести мудрость и наставление окружающим, и он стал могущественным бессмертным магом, которого уважают многие по всему Тамриэлю."

 #Yagrum Bagarn 
 imp_char_bagarn_1000:0 ""
 imp_char_bagarn_1000_desc:0 "Ягрум некогда был выдающимся мастером и служил под началом самого тонального архитектора Кагренака. Глубина его знаний столь велика, что непостижима для большинства людей и меров, и всё же его поиски выживших представителей его расы до сих пор были бесплодны."

 #Indoril Nerevar
 imp_char_mora_109:0 ""
 imp_char_mora_109_desc:0 "Один из величайших каймерских героев, Индорил Неревар, был Наставником и Первым Советником, что объединил дома Ресдайна против двемеров и нордов. Он скончался от ран вскоре после битвы у Красной горы, в чём могло — или не могло — быть замешано предательство."
 
 #Almalexia
 imp_char_indoril_100:0 ""
 imp_char_indoril_100_desc:0 "Альма Лаэса, Айем, позже ставшая известной как богиня народа данмеров Альмалексия, будучи смертной являлась дочерью дома Индорил, правительницей в своём праве, а так же женой и ближайшим советником Неревара. После его смерти она и ещё два его соратника обретут божественность, создав Трибунал АЛЬМСИВИ."
 
 #Sotha Sil
 imp_char_sotha_100:0 ""
 imp_char_sotha_100_desc:0 "Сет из дома Сота оказался единственным выжившим после нападения лорда #LORE [compendium_daedra|l]#! Мерунеса Дагона, в ходе которого погибли все члены его семьи, в том числе мать и сестра. Пройдёт время, и он станет близким соратником каймерского короля Индорила Неревара, и примет участие в Войне Первого Совета. Он обретёт божественность как один из трёх членов трибунала АЛЬМСИВИ под именем Сота Сил."

 #Vivec
 imp_char_vehk_100:0 ""
 imp_char_vehk_100_desc:0 "Ранние годы того, кто позже станет богом Трибунала Вивеком, покрыты завесой тайны. Собственным его рассказам можно верить не более, чем легендам и мифам. Что известно точно, так это то, что Век был близким советником и соратником каймерского короля Индорила Неревара, и ему суждено было стать богом в числе трёх членов Трибунала АЛЬМСИВИ после битвы у Красной горы."
 
 #Dumac Dwarf-Orc
 imp_char_duamaka_100:0 ""
 imp_char_duamaka_100_desc:0 "Думак $nick_dwarf_orc$, также известный как Думалакат или Король Гномов, был королём двемеров. Какое-то время Думак и Неревар были неразлучными друзьями, и последний даже получил от него в подарок на свадьбу парные клинки. Но их дружбе было не суждено пережить замысел Кагренака. Думак, который не был в него посвящён, не стал уступать и пошёл войной за свой народ: так началась Война Первого совета. В конце концов он нашёл свой конец в битве у Красной горы, незадолго до полного исчезновения его народа."

 #Mane Rid-Thar-ri'Datta
 imp_char_mane_001:0 ""
 imp_char_mane_001_desc:0 "Рид-Тар-ри'Датта стал первым Гривой, получившим власть над Конфедерацией Эльсвейр. Как и всякий Грива до и после него, он был рождён под мифическими Тёмными лунами, однако нельзя отрицать, что его харизма затмила таковую у любого из его предшественников.\n\nВ 311 году Второй эры, после того как уния, установленная между Не-Квин-Алом и Па'алатином, сделала путешествия безопасными, Грива отправился в храм Танца Двух Лун в Рол'хе, чтобы проповедовать массам. Он пришёл, чтобы явить Риддл'Тара, Танец Двух Лун, космического бога Порядка и истинного пути, по которому следует направиться каджитам. Явлению Риддл'Тара было суждено смести разрозненные пути, что существовали до него, приведя к множественным преследования против противившихся душ.\n\nРазграбление Не Квин-ала в 2Э 326 вынудило королевскую семью покинуть свою вотчину в центральных землях и перебраться в Риммен, что позволило распространяться влиянию Гривы без каких-либо ограничений. В 370 году клан Брей из Анеквины официально передал власть в Конфедерации Пророку Риддл'Тара, закрепив его абсолютную власть от Дюны до Сенчала.\n\nПосле сотни лет жизни пророк умер в 390 году Второй эры в тот же миг, когда скромная пара из Пеллитины принесла на свет новую жизнь под Тёмными лунами…"
 
 #King Keirgo of Anequina and Elsweyr Confederacy
 imp_char_anequina_002:0 ""
 imp_char_anequina_002_desc:0 "Кейрго был королём Анеквины из легендарного клана Брэев. Его женитьба на королеве Пеллитины Эшите ознаменовала создание #LORE [compendium_elsweyr_confederacy]#!. Союз между знатью встревожил их подданных среди племён, которые почувствовали себя преданными.\n\nПока Сиродил был занят последствиями убийства потентата Версидью-Шайе, монархам Эльсвейрам приходилось собственными силами разбираться с восставшими племенами. В 2Э 326 столица Не Квин-Ала была разорена, а королевская семья — убита. Выжил только шестилетний Далима Брэй, внук короля Кейрго."

 #Queen Padala of Anequina
 imp_char_anequina_003:0 ""
 imp_char_anequina_003_desc:0 "Королева Анеквины Падала, будучи потомком самого Дарлока Брэя, происходит из древнего и пользующегося почётом клана Брэй. В 2Э 309 её прапрадед король Кейрго женился на королеве Пеллитины Эшите, впервые за всю историю объединив Эльсвейр.\n\nУвы, Эльсвейр всё ещё был далёк от единства: события 2Э 326 привели к гибели королевской семьи; выжил только дед Падалы, Далима Брэй, впоследствии ставший правителем Риммена.\n\nМирани, мать Падалы, унаследовала Риммен от Далимы и правила вплоть до 3Э 389, когда город был завоёван Камиллой Пардой Завоевательницей из рода их бывших вассалов. После потери Риммена во владении клана Брэй осталась только крепость Керур на юге.\n\nОднако в недавнем прошлом Падала сумела изменить ход истории своей семьи, отбив у римменейцев Долину Рубежа в 2Э 429."

 #Last High King of Hammerfell
 imp_char_phyllocid_1001:0 ""
 imp_char_phyllocid_1001_desc:0 "Выдающиеся времена требуют выдающихся королей и Ар-Азал был таким. Ловкий наездник, умелый мечник, превосходный управляющий, его мудрость можно было сравнить лишь с таковой у императоров Йокуды из мифов.\n\nПолитические ошибки верховного короля Джа-Фра толкнули его державу на грань гражданской войны. К счастью, молодой верховный король мог положиться на поддержку блистательной Закиб, жрицы Тавы. Открытая война между Венценосцами и Предшественниками была отсрочена на поколение: он взял себе в жёны дочерей лидеров обеих фракций. Свадебный союз трона Хегата с лидерами обеих партий приносил свои плоды, пока не обрушил на государство новый кризис.\n\nДва королевских принца, один коронованный в Хегате и второй, правящий в Антифиллосе, подобно его предкам, сейчас стоят во главе каждой из фракций. Ар-Азал виден в каждом из них, но ни один из них не может назваться и в половину столь же великим человеком, каким был их отец…"

 #Last proper High King of Skyrim
 imp_char_flamehair_999:0 ""
 imp_char_flamehair_999_desc:0 "В течение более столетия три поколения клана Огненные Волосы удерживали за собой титул верховного короля, до того как Логрольф занял трон во дворце Королей в 2Э 394. Беспрецедентный случай со времён великой династии Исграмора!\n\nУпрекнуть за это нордов и их совет вождей тяжело, особенно учитывая благонадёжность отпрысков этого рода. Логрольф был идеалом нордского монарха: он вёл своих танов в битву, делил добычу, нечестивым нёс своё суждение, а пострадавшим воздаяние.\n\nБаланс силы, торговли и влияния сместился в сторону Виндхельма, и стало ясно, что город останется столицей в обозримом будущем. За эту перемену заплатили доки Солитьюда и рынки Вайтрана.\n\nПричём у первого понесла ущерб не только казна, но и гордость. Синий дворец оставался резиденцией верховного короля долгое время в конце #LORE [Concept('compendium_first_era', 'Первой эры')]#!. Логрольф был последней каплей, а Фрейдис, как казалось, вылеплена из того же теста, что и её праотцы.\n\nЧерез год после убийства #LORE [Concept('compendium_potentate', 'потентата')]#! Савириен-Чорака та же участь постигла и Логрольфа, и Сварт, ярл Солитьюда и верховный управитель Скайрима, с поддержкой западных владений объявил себя верховным королём, в то время как восточные владения признали дочь Логрольфа. Дети Неба снова погрязли в междоусобице."

 #The guy from 2920 :>
 imp_char_akavir_99:0 ""
 imp_char_akavir_99_desc:0 "Версидью-Шайе обеспечил илнивирцам непревзойдённую значимость в течение четырёх веков после смерти Ремана III. Быстро расправившись с императорской семьёй и захватив контроль над оставшимися органами власти, он объявил 2920 «последним годом #LORE [Concept('compendium_first_era', 'Первой эры')]#!».\n\nФормально обретя абсолютную власть в первом году #LORE [Concept('compendium_second_era', 'Второй эры')]#!, Версидью-Шайе начал правление с круговорота политических заключений, убийств и дворцовых переворотов, которые вошли в историю как «Реманские репрессии». Чёрная Роза, Белая Роза и, в первую очередь, Аменос, стали местами ссылки непокорных сторонников Реманов.\n\nИ всё равно переход к новому режиму происходил с серьёзным сопротивлением, достигшим пика в 2Э 283 в ходе «Бардмонтского мятежа». Конфликт, продлившийся тридцать семь лет, закончился роспуском вассальных армий и устранением последних неподчинившихся правителей Тамриэля.\n\nЛишённая финансовых и военных возможностей империя не могла поддерживать порядок в самой себе. В связи с этим в 2Э 320 проконсул Диниерас-Вес обратился к своему гегемону, предложив делегировать молодой Гильдии бойцов миротворческие функции.\n\nВласть Змеиного Короля оборвало то же, что и позволило её получить: кинжал наёмного убийцы. Он был убит в 2Э 324, передав трон сыну Савириен-Чораку. Меньше чем через треть от срока его правления дело всей его жизни прекратит существование."

 #Last Potentate
 imp_char_akavir_100:0 ""
 imp_char_akavir_100_desc:0 "Существует соблазн описать Савириен-Чорака как неподготовленного управителя, на которого внезапно обрушилась абсолютная власть… что окончилось ожидаемым результатом. Однако правда несколько произаичнее: столь долгое властвование Версидью-Шайе над империей — это чудо, которое едва ли могло повториться.\n\nНе в силах совладать с государственной системой, выстроенной под его вездесущего родича, Савириен-Чорак пал жертвой исполнительского паралича. Важные вопросы, которые ему приносили сегодня, получали запоздалое решение от потентата неделями позже, когда местные власти в обход иерархии уже опередили его.\n\nНо списывать со счетов Савириен-Чорака полностью нельзя: его здравомыслия было достаточно, чтобы признать Орсиниум провинцией и подавить несогласных. К тому же, он отличался #bold куда меньшей#! кровожадностью, чем его отец: за #bold всё#! его правление «Королева Клыков», их родовой клинок, лишила головы меньше дворян, чем во время одного только #bold Бардмонтского мятежа#!, в ходе которого меч часто окропляла королевская кровь.\n\nЭто особенно выделяет ситуацию с Кириллом II Куптором, который в 2Э 400 на собственной шее ощутил, к чему может привести публичная поддержка сатиры над его сюзереном! Затем Савириен-Чорак назначил проконсулом Сиен-Драсси, не позволив принцу Венару унаследовать должность его нахального отца, чем ещё больше унизил дом Куптор.\n\nГоды шли, и недовольство росло, пока в 2Э 430 безжизненное тело Савириен-Чорака не обнаружили в его дворце в Сенчале. Исполнители убийства потентата, гильдия убийц и фанатики Мефалы Мораг Тонг, также устранили всех прямых наследников, в точности как когда-то поступили с Реманом. Точка кипения была достигнута и стало очевидно, что Вторая империя наконец начала своё падение.\n\nНо объявившийся малоизвестный претендент по имени Айксниерас-Вес приведёт к неожиданному повороту в этой истории…"
