 ##### 2E 440 Bookmarks
 
 ##Warlord Rising
 
 #Attrebus
 imp_char_sosildor_100:0 ""
 imp_char_sosildor_100_desc:0 "[SelectLocalization( GreaterThan_CFixedPoint( GetGlobalVariable('start_year').GetValue, '(CFixedPoint)3360' ), 'imp_char_sosildor_100_desc_450', 'imp_char_sosildor_100_desc_440' )]" #use current yesr - gametime, careful with months
 #imp_char_sosildor_100_desc_440:0 "Attrebus Sosildor has succeeded in uniting the Colovian kingdoms under the Colovian Estates and now stands as Cyrodiil's protector.\n\nMost Nibenese, however, remain loyal to the Tsaesci, fearful of losing their influence over the Heartlands."
 imp_char_sosildor_100_desc_440:0 "$bm_warlordrising_attrebus_desc$"
 imp_char_sosildor_100_desc_450:0 "Аттреб Сосильдор сокрушил #LORE [Concept('compendium_potentate', 'Потентат')]#! и установил собственную власть над Имперским островом. Его планы на Сиродил не приходились по вкусу нибенейской знати, которая видела в них угрозу своему положению в центральных землях, Румаре. Потому неудивительно, что правители долины Нибена восстали против Аттреба. Разразившаяся волна сотрясла Сиродил и окончилась смертью генерала."

