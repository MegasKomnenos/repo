 imp_char_pellitine_002_desc_450:0 "Попытки Кахады сделать её державу господствующей силой в Топальском заливе не увенчались успехом. Однако она унаследовала от двоюродной сестры Аши-ры трон королевства Пеллитина, когда та скончалась 2Э 448. Через год Кахада умерла от сердечного приступа, передав своему сыну М'Харре более могучий Сенчал, чем был до неё."
 
