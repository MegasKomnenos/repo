l_russian:
 ## Formable Kingdoms
 # Craglorn
 form_craglorn_kingdom_decision:0 "Основать королевство Краглорн"
 form_craglorn_kingdom_decision_desc:0 "Регион Краглорн наконец объединён. Должно быть провозглашено новое королевство, претендующее на все земли между горами Драконьего Хвоста и Джерольскими горами."
 form_craglorn_kingdom_decision_tooltip:0 "Основать королевство Краглорн"
 form_craglorn_kingdom_decision_confirm:0 "Королевство, благословлённое звездами!"
 form_craglorn_kingdom_decision_effects_de_jure_tt:0 "Все герцогства в [Concept('region', 'регионе')|E] Краглорн становятся [de_jure|E] вассалами королевства Краглорн"
 # Glenumbra
 form_glenumbra_kingdom_decision:0 "Основать королевство Гленумбра"
 form_glenumbra_kingdom_decision_desc:0 "Склоки мелких королей за холмы Гленумбры не утихали с незапамятных времён. Довольно! Объединённое королевство Гленумбра наконец под моим контролем…"
 form_glenumbra_kingdom_decision_tooltip:0 "Вы создадите новое [kingdom|E] в Гленумбре"
 form_glenumbra_kingdom_decision_confirm:0 "[Select_CString(ROOT.Char.IsFemale, 'Новая', 'Новый')] [ROOT.Char.GetLadyLord|U] Гленумбры!"
 form_glenumbra_kingdom_decision_effects_de_jure_tt:0 "Все герцогства в [Concept('region', 'регионе')|E] Гленумбра становятся [de_jure|E] вассалами королевства Гленумбра"
 form_glenumbra_kingdom_decision_integrate_balfiera_tt:0 "Если герцогство Балфиера полностью контролируется, оно становится частью королевства Гленумбра"
 # Rivenspire
 form_rivenspire_kingdom_decision:0 "Основать королевство Ривенспайр"
 form_rivenspire_kingdom_decision_desc:0 "Склоки мелких королей за скалистые горы Ривенспайра не утихали с незапамятных времён. Довольно! Объединённое королевство Ривенспайр наконец под моим контролем…"
 form_rivenspire_kingdom_decision_tooltip:0 "Вы создадите новое [kingdom|E] в Ривенспайре"
 form_rivenspire_kingdom_decision_confirm:0 "[Select_CString(ROOT.Char.IsFemale, 'Новая', 'Новый')] [ROOT.Char.GetLadyLord|U] Ривенспайра!"
 form_rivenspire_kingdom_decision_effects_de_jure_tt:0 "Все герцогства в [Concept('region', 'регионе')|E] Ривенспайр становятся [de_jure|E] вассалами королевства Ривенспайр"
 # Wrothgarian Mountains
 form_greater_wrothgar_kingdom_decision:0 "Основать королевство Великий Ротгар"
 form_greater_wrothgar_kingdom_decision_desc:0 "Бретонцы, орки и предельцы поколениями претендовали на разрозненные земли Великого Ротгара. Пора разрешить этот спор раз и навсегда, объявив себя единоличным правителем региона!"
 form_greater_wrothgar_kingdom_decision_tooltip:0 "Вы создадите новое [kingdom|E] в Великом Ротгаре"
 form_greater_wrothgar_kingdom_decision_confirm:0 "[Select_CString(ROOT.Char.IsFemale, 'Новая', 'Новый')] [ROOT.Char.GetLadyLord|U] Великого Ротгара!"
 form_greater_wrothgar_kingdom_decision_effects_de_jure_tt:0 "Все герцогства в [Concept('region', 'регионе')|E] Великий Ротгар становятся [de_jure|E] вассалами королевства Великий Ротгар"
 # Bangkorai
 form_bangkorai_kingdom_decision:0 "Основать королевство Бангкорай"
 form_bangkorai_kingdom_decision_desc:0 "Я наконец [Select_CString(ROOT.Char.IsFemale, 'установила', 'установил')] контроль над Бангкораем, так называемым «Щитом Хай-Рока». Этот регион непрекращающихся междоусобных войн в конце концов объединён под моим правлением!"
 form_bangkorai_kingdom_decision_tooltip:0 "Вы создадите новое [kingdom|E] в Бангкорае"
 form_bangkorai_kingdom_decision_confirm:0 "[Select_CString(ROOT.Char.IsFemale, 'Первая', 'Первый')] [ROOT.Char.GetLadyLord|U] Бангкорая!"
 form_bangkorai_kingdom_decision_effects_de_jure_tt:0 "Все герцогства в регионах Бангкорай и Эвермор становятся [de_jure|E] вассалами королевства Великий Бангкорай"
 # Auridon
 form_auridon_kingdom_decision:0 "Объединить Ауридон"
 form_auridon_kingdom_decision_desc:0 "Будучи целью набегов на протяжении столетий, страж Саммерсетских островов, Ауридон сейчас разделён и слаб. Если мы хотим процветать, заняв своё законное место на архипелаге, Ауридон должен быть объединён!"
 form_auridon_kingdom_decision_tooltip:0 "Вы создадите новое [kingdom|E] в Ауридоне"
 form_auridon_kingdom_decision_confirm:0 "[Select_CString(ROOT.Char.IsFemale, 'Первая', 'Первый')] [ROOT.Char.GetLadyLord|U] Ауридона!"
 form_auridon_kingdom_decision_effects_de_jure_tt:0 "Все герцогства в [Concept('region', 'регионе')|E] Ауридон становятся [de_jure|E] вассалами королевства Ауридон"
 ## Formable Empires
 form_cyrodiil_decision:0 "#R Создать Сиродильскую империю — ИИ#!"
 form_cyrodiil_decision_desc:0 "#R Вы не должны видеть этот текст: это решение для ИИ.\n\nСлишком долго Сиродил был разделён. Место могучей империи заняли враждующие лорды и разрозненные провинции. Но я это изменю. Сердце Тамриэля вновь будет едино. Рубиновый трон, престол императоров прошлого, ждёт достойного правителя, и я отвечу на его зов.#!"
 form_cyrodiil_decision_tooltip:0 "Вы создадите новое [empire|El] в Сиродиле."
 form_cyrodiil_decision_confirm:0 "Новый император Сиродила!"
 holds_colovian_estates_or_nibenay:0 "Требуется титул [GetTitleByKey('e_colovian_estates').GetNameNoTier] или [GetTitleByKey('e_nibenay').GetNameNoTier]"
 restore_cyrodiil_percentage:0 "You control at least #V 75%#! of [counties|E] in [GetGeographicalRegion('mundus_tamriel_cyrodiil').GetName] (Current: [SCOPE.ScriptValue('cyrodiil_decision_region_owned_percent_value')|0]%)"
 