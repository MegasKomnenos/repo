l_russian:
 form_pirate_confederacy_the_isles_decision:0 "Основать Пиратскую конфедерацию Островов"
 form_pirate_confederacy_the_isles_decision_desc:0 "Острова Абесинского моря — дом для негодяев и флибустьеров всех мастей. Порознь мы лишь заноза в чьей-то заднице… Но если я смогу объединить нас, абесинских пиратов, мы будем ходить в такие налёты, какие Тамриэль ещё не видывал!"
 form_pirate_confederacy_the_isles_decision_tooltip:0 "Могущественный пират мог бы объединить Абесинское море…"
 form_pirate_confederacy_the_isles_decision_confirm:0 "Созвать флот и налётчиков!"
 form_pirate_confederacy_the_isles_de_jure_tt:0 "Все [duchies|El] в регионе $mundus_tamriel_pirate_conf_the_isles$ станут [de_jure|El] частью новой державы"
 has_raided_for_a_thousand_gold_ct:0 "Вы получили 1000 [Concept('gold', 'золота')|E] набегами (сейчас получено [ROOT.Var('total_loot').GetValue])"
 form_normal_confederacy_the_isles_decision:0 "Основать королевство Абесинские острова"
 form_normal_confederacy_the_isles_decision_desc:0 "Острова Абесинского моря принадлежат к самым разным королевствам. Но тот, кто смог бы их объединить, достиг бы невообразимого могущества над всем Абесинским морем — а его берега будут открыты для завоевания."
 form_normal_confederacy_the_isles_decision_tooltip:0 "Могущественный правитель мог бы объединить Абесинское море…"
 form_normal_confederacy_the_isles_decision_confirm:0 "Созвать флотилиии и каперов!"

 
 ### Attrebus/Interregnum decisions
 attrebus_interregnum_decision:0 "Междуцарствие?"
 attrebus_interregnum_decision_desc:0 "После краха #LORE [Concept('compendium_potentate', 'потентата')]#! Совет старейшин принял решение предоставить вам чрезвычайные полномочия для разрешения назревающего политического кризиса.\n\nВам, однако же, придётся действовать быстро, так как запас терпения у верховного канцлера ограничен…"
 attrebus_interregnum_decision_tooltip:0 "Что будет с Сиродилом в грядущую эпоху?"
 attrebus_interregnum_decision_confirm:0 "Вызвать Совет старейшин!"
 attrebus_interregnum_decision_required_tasks_tt:0 "Вы выполнили #R [THIS.Var('attrebus_required_tasks_complete').GetValue|0]#! из 3 [Concept('required_tasks', 'обязательных заданий')|E], необходимых, чтобы умилостивить Совет старейшин. Осталось ещё #R [THIS.Var('attrebus_years_pseudo_emperor_left').GetValue|0] года#! до того как у Совета закончится терпение."
 attrebus_interregnum_decision_optional_tasks_tt:0 "Вы выполнили #R [THIS.Var('attrebus_optional_tasks_complete').GetValue|0]#! из 3 [Concept('optional_tasks', 'дополнительных заданий')|E]. Эти задания не продлевают ваши полномочия, но, выполняя их, вы можете повлиять на Тамриэль, не считаясь с мнением Совета старейшин или вовсе идя им наперекор."
 attrebus_interregnum_decision_early_effect_tt:0 "Вы можете также принять решение передать власть обратно Совету раньше, чем они того потребуют. Начнётся Междуцарствие, и вы утратите возможность реализовать собственные амбиции по влиянию на судьбу Сиродила."
 attrebus_interregnum_decision_death_effect_tt:0 "Если вы умрёте до того, как Совет старейшин попросит передать обратно власть в их руки, они заберут контроль над Имперским островом.\n#N Вы потеряете титул Сиродильский потентат.\nВся владения, не входящие де-юре в первые титул вашего наследника, будут утрачены.#!"
 
 attrebus_repay_debts_decision:0 "Отдать долг Совету старейшин"
 attrebus_repay_debts_decision_desc:0 "Совет старейшин профинансировал вашу войну против потентата, и от вас ожидается выплата долга. Хранилища Имперского города помогли немного уменьшить сумму долга перед Советом, но этого недостаточно."
 attrebus_repay_debts_decision_tooltip:0 "Вы отдадите долг Совету старейшин"
 attrebus_repay_debts_decision_confirm:0 "Отправить выплату верховному канцлеру."
 attrebus_potentate_attrebus_repay_debts_desc:0 "Ваш долг перед Советом старейшин будет выплачен"
 attrebus_potentate_required_task_2_fulfilled_desc:0 "Вы #P выполнили#! второе [required_task|El], «[required_task_2|El]»"
 attrebus_potentate_ec_debts_repayed_desc:0 "Когда Совет старейшин начнёт править Имперским островом, в его казне будет больше средств"
 
 attrebus_rebuild_imperial_legion_decision:0 "Восстановить Имперский легион"
 attrebus_rebuild_imperial_legion_decision_desc:0 "В Имперском легионе, опоре империй Алессии и Ремана, со времён последних дней потентата царил беспорядок. Предосудительное отношение цаэски и десятилетия без должного надзора нанесли вред этой благородной организации, и нам, возможно, придётся восстанавливать его с нуля…"
 attrebus_rebuild_imperial_legion_decision_tooltip:0 "Реформировать Имперский легион и вновь доказать Тамриэлю, что Сиродилу суждено быть центром мира!"
 attrebus_rebuild_imperial_legion_decision_confirm:0 "Сформировать Первый легион!"
 attrebus_rebuild_imperial_legion_decision_1000_legionnaires:0 "Полностью улучшенные #V $armored_legionaires$# в количестве не менее 1000 состоят в рядах ваших [Concept('men_at_arms', 'профессионалов')|E]"
 attrebus_rebuild_imperial_legion_decision_300_lc:0 "Полностью улучшенная [Concept('light_cavalry', 'лёгкая кавалерия')|E] из не менее 300 человек состоитв рядах ваших [Concept('men_at_arms', 'профессионалов')|E]"
 attrebus_rebuild_imperial_legion_decision_good_knights:0 "Вам служат не менее #V 10 [Concept('knights', 'рыцарей')|E]#! с [Concept('prowess', 'доблестью')|E] #V 12 или выше#!"
 attrebus_potentate_attrebus_imperial_legion_rebuilt_desc:0 "Имперский легион будет восстановлен, и последнее слово при выборе его лидера останется за вами"
 attrebus_potentate_attrebus_will_increase_personal_power_desc:0 "Это задание приведёт к #P усилению#! вашей личной власти и легитимности." 
 attrebus_potentate_optional_task_3_fulfilled_desc:0 "Вы #P выполнили#! третье [optional_task|El], «[optional_task_3|El]»"
 
 attrebus_draft_tsaesci_act_decision:0 "Утвердить акт о цаэски"
 attrebus_draft_tsaesci_act_decision_desc:0 "Большинство местных правителей считает акавирское властвование над Сиродилом и Тамриэлем тёмной страницей в истории провинции.\n\nДаже после падения потентата некоторые графства и правители в Имперской провинции всё ещё придерживаются старых акавирских традиций, и Совет старейшин поручил вам удостовериться, что никто из них больше не ступит на сиродильскую землю и Имперский остров, дабы провинция вновь не попала в руки акавирцев."
 attrebus_draft_tsaesci_act_decision_tooltip:0 "Официально изгнать акавирцев из Сиродила"
 attrebus_draft_tsaesci_act_decision_confirm:0 "Обезглавить змею!"
 attrebus_draft_tsaesci_act_decision_no_tsaesci_ruler_imperial_isle:0 "Ни один из правителей на Имперском Острове не принадлежит к культуре с [Concept('heritage', 'наследием')|E] цаэски"
 attrebus_draft_tsaesci_act_decision_no_tsaesci_province_imperial_isle:0 "Ни в одной из провинций на Имперском Острове нет культуры с [Concept('heritage', 'наследием')|E] цаэски"

 attrebus_draft_tsaesci_act_decision_effect_desc:0 "После утверждения акта о цаэски все правители акавирского происхождения в вашей державе утратят свои владения в пользу вас. В каждом акавирском графстве изменится [culture|El], но при этом вдвое уменьшится [development|El].\nЭтот эффект также будет распространяться на любое другое графство, которое войдёт в состав важей державы после утверждения акта."
 attrebus_tsaesci_county_title:0 "Цаэски изгнаны из графства"
 attrebus_tsaesci_county_desc:0 "Графство [title.GetBaseName] наше, и его акавирское население изгнано."
 
 attrebus_end_akaviri_rule_decision:0 "Покончить с правлением акавирцев"
 attrebus_end_akaviri_rule_decision_desc:0 "Теперь, после утверждения акта о цаэски, пришло время покончить с любым проявлением акавирского правления в Сиродиле.\nНикто из них не должен владеть территорией на нашей родине, и никакое из крупных акавирских поселений не должно осквернять нашу провинцию!"
 attrebus_end_akaviri_rule_decision_tooltip:0 "Добиться того, чтобы в Сиродиле не было ни единого акавирца"
 attrebus_end_akaviri_rule_decision_confirm:0 "Конец тёмной эпохи!"
 attrebus_end_akaviri_rule_decision_no_tsaesci_ruler_cyrodiil:0 "Ни один правитель в регионе [GetGeographicalRegion('mundus_tamriel_cyrodiil').GetName] не обладает [Concept('heritage', 'наследием')|E] цаэски"
 attrebus_end_akaviri_rule_decision_no_tsaesci_province_cyrodiil:0 "Ни одна провинция в регионе [GetGeographicalRegion('mundus_tamriel_cyrodiil').GetName] не обладает [Concept('heritage', 'наследием')|E] цаэски"
 attrebus_potentate_required_task_1_fulfilled_desc:0 "Вы #P выполнили#! первое [required_task|El], «[required_task_1|E]»"
 
 attrebus_secure_heartlands_decision:0 "Обезопасить Румаре"
 attrebus_secure_heartlands_decision_desc:0 "В центре Сиродила расположены два важнейших актора провинции: Имперский город и Совет старейшин, заседающий в своих залах.\nВаш захват Имперского города и оккупация амбициозными военачальниками соседствующих земель вызвали беспокойство у Совета старейшин, и они поручили вам убедиться, что Румаре будет лояльно и не станет представлять угрозу."
 attrebus_secure_heartlands_decision_tooltip:0 "Обезопасить Румаре для Совета старейшин"
 attrebus_secure_heartlands_decision_confirm:0 "Румаре наше!"
 attrebus_secure_heartlands_decision_vassal_heartlands_positive_opinion:0 "Каждый прямой вассал в Румаре имеет #P положительное#! мнение о вас"
 attrebus_secure_heartlands_decision_full_control_imperial_isle:0 "Уровень [Concept('control', 'контроля')|E] в каждом графстве на Имперском острове должен быть равен 90 или более"
 attrebus_secure_heartlands_desc:0 "Вы обезопасите Румаре и успокоите Совет старейшин, сделав их залы недосягаемыми для любого захватчика"
 attrebus_potentate_required_task_3_fulfilled_desc:0 "Вы #P выполнили#! третье [required_task|El], «[required_task_3|E]»"
 attrebus_potentate_ec_control_heartlands_desc:0 "Когда Совет старейшин начнёт править Имперским островом, он будет контролировать всё Румаре"
 
 attrebus_a_militant_faith_decision:0 "Воинственная вера"
 attrebus_a_militant_faith_decision_desc:0 "Веками наша конфессия, [ROOT.Char.GetFaith.GetAdjective], сосуществовала с различными мелкими культами и другими религиями. Хотя для многих из наших единоверцев это предмет гордости, некоторая часть духовенства, напротив, упирает на то как важно для нашей конфессии быть сильной в грядущие времена. Я не принадлежу к духовенству, но знаю, что многие за мной последуют…"
 attrebus_a_militant_faith_decision_tooltip:0 "Мир меняется, и наша [faith|El] тоже!"
 attrebus_a_militant_faith_decision_confirm:0 "Новая эпоха для праведных?"
 attrebus_a_militant_faith_desc:0 "Вам предоставится возможность внести изменения в вашу конфессию:\n$EFFECT_LIST_BULLET$Оставить доктрину «[GetFaithDoctrine('doctrine_pluralism_pluralistic').GetBaseName]» и получить бонус к [Concept('fervor', 'рвению')|E]\n$EFFECT_LIST_BULLET$Поменять на «[GetFaithDoctrine('doctrine_pluralism_righteous').GetBaseName]», а догмат «[GetFaithDoctrine('tenet_adaptive').GetBaseName]» на «[GetFaithDoctrine('tenet_mendicant_preachers').GetBaseName]»\n$EFFECT_LIST_BULLET$Поменять на «[GetFaithDoctrine('doctrine_pluralism_fundamentalist').GetBaseName]», а догмат «[GetFaithDoctrine('tenet_adaptive').GetBaseName]» на «[GetFaithDoctrine('tenet_armed_pilgrimages').GetBaseName]»"
 attrebus_potentate_optional_task_1_fulfilled_desc:0 "Вы #P выполнили#! первое [optional_task|El], «[optional_task_1|E]»"
 
 potentate_control_heartlands_decision:0 "Потентат Румаре"
 potentate_control_heartlands_decision_desc:0 "Веками мы выступали хранителями Имперского острова будучи потентатами ныне сгинувшей Империи Ремана. Теперь, когда наше время уходит со дня на день, нужно удостовериться, что у нашего народа будет своё место в Тамриэле — и где найти место лучше, чем в самом сердце Сиродила?"
 potentate_control_heartlands_decision_tooltip:0 "Наш народ обретёт свой дом в сердце Империи!"
 potentate_control_heartlands_decision_effect:0 "Наша [culture|El] станет [Concept('native', 'коренной')|E] для региона [GetGeographicalRegion('mundus_tamriel_cyrodiil_heartlands').GetName]"
 potentate_control_heartlands_decision_confirm:0 "Новый дом!"
 
 ### Orsinium
 create_orsinium_decision:0 "Возродить Орсиниум"
 create_orsinium_decision_desc:0 "История Тамриэля помнит много Орсиниумов. Раз за разом королевство орков создавалось, затем разрушалось и создавалось вновь. Правитель-орсимер, располагающий достаточным могуществом, может претендовать на то, чтобы стать новым королём орков и возродить старое королевство отверженного народа. \n \n( #S Важно#!: Если вы [duke|El], вы сможете расширить [de_jure|El] границы Орсиниума только в пределах де-юре территорий [Concept('kingdom', 'королевства')|E] в котором вы его основали)."
 create_orsinium_decision_tooltip:0 "Создать королевство Орсиниум!"
 create_orsinium_decision_confirm:0 "За Орсиниум!"
 create_orsinium_decision_cd:0 "Ваша [capital|El] не находится в столичном герцогстве другого [Concept('kingdom', 'королевства')|E] и имеет орсимерскую [Concept('culture', 'культуру')|E]"
 create_orsinium_decision_alt_cd:0 "Ваша [capital|El] не находится внутри столичного [Concept('duchy', 'герцогства')|E] другого [de_jure|El] [Concept('kingdom', 'королевства')|E] (например, герцогства Имперский остров в королевстве Румаре)"
 orsinium_hold_capital_duchy_cd:0 "Вы удерживаете [duchy|El], в котором расположена ваша [capital|El]"
 orsinium_county_culture_cd:0 "Ваша [capital|El] разделяет вашу культуру"
 create_orsinium_kingdom_decision:0 "Возродить Орсиниум"
 create_orsinium_kingdom_decision_confirm:0 "За Орсиниум!"
 
 form_orsinium_empire_decision:0 "Основать Великий Орсиниум"
 form_orsinium_empire_decision_desc:0 "Теперь, когда королевство Орсиниум было основано вновь, нас ждёт новый, лучший Орсиниум: более сильный и великий."
 form_orsinium_empire_decision_tooltip:0 "Орсиниум станет великим снова!"
 form_orsinium_empire_decision_confirm:0 "За Великий Орсиниум!"
 expanded_orsinium_cd:0 "Вы расширили [de_jure|El] границы королевства Орсиниум за пределы его изначального [Concept('duchy', 'герцогства')|E]"
 orsinium_kingdom_requirement_cd: "У вас должно быть как минимум 4 титула [Concept('kingdom', 'королевств')|E]"
 form_orsinium_empire_decision_effect:0 "Все титулы [Concept('kingdom', 'королевств')|E], которые вы [Concept('completely_control', 'полностью контролируете')|E], становятся частью Великого Орсиниума"
 
 old_orsinium_capital_decision:0 "Захватить Старый Орсиниум"
 old_orsinium_capital_decision_desc:0 "Первоначальный Орсиниум был построен на слабозащищённых холмах, возвыщающихся над бухтой Кораблекрушений. С тех пор его несметное число раз разоряли орды бретонцев. Пришло время вновь занять эти земли как истинную столицу отверженного народа."
 old_orsinium_capital_decision_tooltip:0 "Перенести столицу Орсиниума обратно в Старый Орсиниум"
 old_orsinium_capital_decision_confirm:0 "Традиции превыше всего!"
 
 expand_orsinium_decision:0 "Расширить Орсиниум"
 expand_orsinium_decision_desc:0 "Нужно расширить рубежи Орсиниума, чтобы он охватывал все территории своего бывшего [de_jure|El] [Concept('kingdom', 'королевства')|E]. Только сильный Орсиниум станет Орсиниумом на века."
 expand_orsinium_decision_tooltip:0 "Расширить королевство Орсиниум!"
 expand_orsinium_decision_confirm:0 "За Орсиниум!"
 expand_orsinium_decision_cd:0 "Вы удерживаете первоначальное [de_jure|El] [kingdom|El] Орсиниума"
 
 reintegrate_orsinium_decision:0 "Реинтегрировать Орсиниум"
 reintegrate_orsinium_decision_desc:0 "Одно из ваших герцогств захватили себе орсимеры, провозгласив его своим новым Орсиниумом. Орсиниуму суждено пасть, так же, как это уже случалось в прошлом, и отверженный народ отправится в скитания."
 reintegrate_orsinium_decision_tooltip:0 "Уничтожить мерзкий Орсиниум!"
 reintegrate_orsinium_decision_confirm:0 "С Орсиниумом покончено!"
 reintegrate_orsinium_decision_cd:0 "Вы владеете столичным [Concept('duchy', 'герцогством')|E] Орсиниума"
 no_orsimer_king_vassal_cd:0 "Орсиниум не удерживает вассал-орсимер"
 orsinium_culture_regains_pariah_status:0 "The [regained_pariah_culture.GetName] снова становятся [Concept('pariah', 'гонимыми')|E], что выражается в том, что их [culture|El] снова обретает [Concept('innovation', 'инновацию')|E] #V Гонимый народ#!"
 
 ### Nibenay
 establish_new_nibenay_kingdom_decision:0 "Основать новое королевство в восточном Нибенее"
 establish_new_nibenay_kingdom_decision_desc:0 "Хотя земли к востоку от реки Нибен номинально считаются частью Имперских графств Бравил и Лейавин, контроль над регионам давался их лордам с большим трудом. На этих неприкаянных землях амбициозные военачальник мог бы основать собственное королевство."
 establish_new_nibenay_kingdom_decision_tooltip:0 "Вы создадите новое [kingdom|El] в восточном Нибенее."
 establish_new_nibenay_kingdom_decision_confirm:0 "Новый, лучший Нибеней!"
 establish_new_nibenay_kingdom_decision_ce:0 "Название вашего нового королевства меняется в соответствии со столичным герцогством."
 establish_new_nibenay_kingdom_ct:0 "Вы [Concept('completely_control', 'полностью контролируете')|E] 4 смежных [Concept('duchies', 'герцогства')|E], относящихся к [Concept('kingdom', 'королевству')|E] Бравил и расположенных к востоку от реки Нибен"
 
 integrate_nibenay_decision:0 "Интегрировать восточный Нибеней"
 integrate_nibenay_decision_desc:0 "Как законный правитель восточного Нибенея вы можете интегрировать больше его земель в своё королевство."
 integrate_nibenay_decision_tooltip:0 "Восточный Нибеней принадлежит мне!"
 integrate_nibenay_decision_confirm:0 "За Нибеней!"
 integrate_nibenay_decision_ce:0 "Каждое герцогство в списке, отвечающее требованиям, [de_jure|El] станет частью титула [GetTitleByKey('k_nibenay').GetNameNoTier]."
 
 reintegrate_nibenay_decision:0 "Реинтегрировать восточный Нибеней"
 reintegrate_nibenay_decision_desc:0 "Земли между восточным берегом реки Нибен и горами Валус исторически со времён Первой империи принадлежали Бравилу и Лейавину. Пришло время вернуть их в наши руки."
 reintegrate_nibenay_decision_tooltip:0 "Таков закон!"
 reintegrate_nibenay_decision_confirm:0 "Реинтегрировать!"
 reintegrate_nibenay_kingdom_ct:0 "Вы владеете [Concept('duchy', 'герцогством')|E] в восточной части Нибенея, которое ранее относилось к вашему [Concept('kingdom', 'королевству')|E]"
  accept_colovia_nibenay_divide_decision:0 "Трон Поверженных Королей"
  accept_colovia_nibenay_divide_decision_desc:0 "Со времён смерти Ремана III на Рубиновом троне не было достойного императора. Даже генералу Аттребу не удалось установить центральную власть. А в отсутствие Империи, возможно, для Коловии и Нибенея — двух половин, составляющих [GetTitleByKey('e_cyrodiil').GetNameNoTier] — лучше будет продолжать существовать как независимые державы.\nБыть может, пора формально признать два региона как отдельные друг от друга, как было в последний раз в дни, предшествовашие Второй империи."
  accept_colovia_nibenay_divide_decision_tooltip:0 "Разделить Сиродил на две [de_jure|El] [empires|El]"
  accept_colovia_nibenay_divide_decision_confirm:0 "Поверженное единство земли Поверженных Королей"
  accept_colovia_nibenay_divide_decision.colovia_vassals.tt:0 "К Коловии отходят следующие королевства: #V Анвил#!, #V Кватч#!, #V Скинград#!, #V Коррол#! и #V Брума#!"
  accept_colovia_nibenay_divide_decision.nibenay_vassals.tt:0 "К Нибенею отходят следующие королевства: #V Румаре#!, #V Чейдинхол#!, #V Бравил#! и #V Лейавин#!"
  accept_colovia_nibenay_divide_decision.create_de_jure_empires.tt:0 "Обе половины Сиродила теперь станут [de_jure|El] империями, претендующими только на приписанные им Имперские графства."
  accept_colovia_nibenay_divide_decision.reunite_cyrodiil.tt:0 "Если одна из империй полностью объединит свою часть Сиродила, она сможет #V бросить вызов другой с целью объединить провинцию#!, завладев титулом #bold Империя Сиродил#!, если преуспеет.\nТот, кто при помощи #V умелой дипломатии и заключения династических браков#!, завладеет обеими [de_jure|El] империями, также сможет их объединить."

 colovia_march_east_decision:0 "Приготовиться к походу на восток"
 colovia_march_east_decision_desc:0 "Слишком долго Сиродил был разделён. Наша власть над Коловией неоспорима, и пришло время отправить войска на восток, чтобы покорить нибенейские королевства и наконец объединить Сиродил."
 colovia_march_east_tooltip:0 "Сиродилу нужен новый император!"
 colovia_march_east_decision_tooltip:0 "Сиродилу нужен новый император!"
 colovia_march_east_decision_confirm:0 "За Сиродил!"
 colovia_march_east_decision.claim_nibenay.tt:0 "Если вы навяжете претензию на титул Нибенея войной, то будете коронованы как [Select_CString(ROOT.Char.IsFemale, 'императрица', 'император')] Сиродила."
 colovia_march_east_decision.no_nibenay.tt:0 "В случае, если восточная половина Сиродила останется без своего повелителя, у вас будет [casus_belli|El] на отдельные её части за увеличенную стоимость."
 
 nibenay_march_west_decision:0 "Приготовиться к походу на запад"
 nibenay_march_west_decision_desc:0 "Слишком долго Сиродил был разделён. Наши позиции в Нибенее сильны, и пришло время западу покориться, как было раньше в течение многих веков."
 nibenay_march_west_tooltip:0 "Сиродилу нужен новый император!"
 nibenay_march_west_decision_tooltip:0 "Сиродилу нужен новый император!"
 nibenay_march_west_decision_confirm:0 "За Сиродил!"
 nibenay_march_west_decision.claim_colovia.tt:0 "Если вы навяжете претензию на титул Коловии войной, то будете коронованы как [Select_CString(ROOT.Char.IsFemale, 'императрица', 'император')] Сиродила."
 nibenay_march_west_decision.no_colovia.tt:0 "В случае, если западная половина Сиродила останется без своего повелителя, у вас будет [casus_belli|El] на отдельные её части за увеличенную стоимость."
 
 ### Others
 establish_lingua_tamrielis_decision:0 "Учредить лингва тамриэлис"
 establish_lingua_tamrielis_decision_desc:0 "Разные провинции Тамриэля говорят каждая на своём языке, от чего страдают и торговля, и межкультурные взаимоотношения. Теперь, когда я контролирую обширные территории, было бы разумно продвинуть свой язык на роль официального языка Империи, и весь Тамриэль вскоре согласится с этим."
 establish_lingua_tamrielis_decision_tooltip:0 "Продвинуть новый общий язык Тамриэля — ваш собственный!"
 establish_lingua_tamrielis_decision_confirm:0 "[ROOT.Char.GetCulture.GetCollectiveNounNoTooltip]ое господство!"
 every_county_your_culture_gets_modifier:0 "Каждое [county|El], разделяющее вашу культуру, — и внутри вашей державы и за её пределами"
 completely_controls_two_empires_ct:0 "Вы [Concept('completely_control', 'полностью контролируете')|E] две [empires|E] и все их [de_jure|El] территории"
 
###Nedic Confederation
 restore_nedic_kingdom_decision: "Объединить недов"
 restore_nedic_kingdom_decision_desc: "До нашествия Ра Гада наш народ был объединён в конфедерацию свободных племён, которые клялись в верности верховному королю из Небесного Предела. Сейчас для нашего народа всё это — лишь далёкое прошлое, но я могу объявить себя [Select_CString(ROOT.Char.IsFemale, 'наследницей', 'наследником' )] этой древней державы, объединив земли наших предков."
 restore_nedic_kingdom_decision_tooltip: "Вы создадите новое [empire|El] недов"
 restore_nedic_kingdom_decision_confirm: "Больше мы никому не покоримся!"
 form_nedic_kingdom_scripted_effect_de_jure_tt: "Все королевства в [Concept( 'region', 'регионе' )|E] [GetGeographicalRegion('ek_nedic_kingdom_region').GetName] станут [de_jure|El] вассалами верховного королевства [nedic_confederation.GetNameNoTier]"
 
