l_russian:
 # Destroy the Bridges of Leyawiin
 destroy_bridges_leyawiin_decision:0 "Разрушить мосты Лейавина"
 destroy_bridges_leyawiin_decision_desc_vassal:0 "Мосты Лейавина позволяют тому, кто владеет городом, по собственному усмотрению пропускать или разворачивать корабли, направляющиеся в Румаре через Топальскую бухту. Чтобы берега Румаре развивались и процветали, не завися от прихотей владельца города, мосты нужно уничтожить."
 destroy_bridges_leyawiin_decision_desc_direct:0 "Мосты Лейавина позволяют тому, кто владеет городом, по собственному усмотрению пропускать или разворачивать корабли, направляющиеся в Румаре через Топальскую бухту.\nХотя для Лейавина это, несомненно, благо, возможно их уничтожение принесёт пользу."
 destroy_bridges_leyawiin_decision_disables_bridges_leyawiin_01_ct:0 "Здание $building_type_bridges_leyawiin_01$ станет не активно, а его эффекты перестанут действовать"
 destroy_bridges_leyawiin_decision_enables_buildings_imperial_isle_ct:0 "Здания $building_type_imperial_city_harbor_01$ and $building_type_port_hestra_01$ снова будут активны"
 destroy_bridges_leyawiin_decision_enables_port_buildings_rumare_ct:0 "Цепочка зданий $building_type_common_tradeport_01$ снова станет доступна для графств, расположенных по берегам Румаре"
 repair_destroy_bridges_leyawiin_wait_a_month_ct:0 "#weak Должен пройти месяц, прежде чем последствия этого решения проявят себя#!"
 destroy_bridges_leyawiin_decision_confirm: "Сломать мосты!"
 destroy_bridges_leyawiin_decision_tooltip: "Власть, которую Лейавин имеет над торговлей в Румаре, неприемлема."
 
 repair_bridges_leyawiin_decision:0 "Восстановить мосты Лейавина"
 repair_bridges_leyawiin_decision_desc:0 "Процветание Лейавина завязано на его великих мостах, благодаря которым город может собирать плату с торговых кораблей, плывущих в сторону Румаре из Топальской бухты. Несколько лет назад эти мосты были уничтожены, и сейчас пришло время их восстановить во благо города."
 repair_bridges_leyawiin_decision_enables_bridges_leyawiin_01_ct:0 "Здание $building_type_bridges_leyawiin_01$ станет активно"
 repair_bridges_leyawiin_decision_disables_buildings_imperial_isle_ct:0 "Здания $building_type_imperial_city_harbor_01$ и $building_type_port_hestra_01$ будут не активны, а их эффекты перестанут действовать"
 repair_bridges_leyawiin_decision_disables_port_buildings_rumare_ct:0 "Цепочка зданий $building_type_common_tradeport_01$ станет недоступна для графств, расположенных по берегам Румаре"
 repair_bridges_leyawiin_decision_confirm: "Восстановить мосты!"
 repair_bridges_leyawiin_decision_tooltip: "Лейавин вновь будет контролировать Нибен."
 
 # Summon Thurvokun
 summon_thurvokun_decision:0 "Возрождение Турвокуна"
 summon_thurvokun_decision_desc:0 "Пора воспользоваться самым ценным сокровищем из глубин Логова Клыка: костями некогда могучего дракона Турвокуна.\n\nСильный некромант, располагающий большой магической энергией, сможет подчинить эти останки нашей воле."
 summon_thurvokun_decision_effect:0 "Турвокун восстанет из мёртвых и присоединится к вашей армии."
 summon_thurvokun_decision_tooltip:0 "Дракон шевелится — пусть он пробудится, чтобы подчиняться мне."
 summon_thurvokun_decision_confirm:0 "Подготовьтесь к ритуалу!"
 cannot_summon_thurvokun:0 "Your faith forbids you to use the #V 'Raise Thurvokun'#! [decision|E]"
 
 # Summon the Hollow
 summon_hollow_decision:0 "Воззвать к Полым"
 summon_hollow_decision_desc:0 "Идёт война, и пришло время воспользоваться силой трона Лесного короля. Нам будут служить Полые, готовые сражаться и исполнять наши приказы."
 summon_hollow_decision_tooltip:0 "Положиться на Полых в надежде, что они помогут в войне."
 summon_hollow_decision_confirm:0 "За Лесного короля!"
 
 # Undertake Trials of Alkosh
 trials_of_alkosh_decision:0 "Пройти испытания Алкоша"
 trials_of_alkosh_decision_desc:0 "Испытания Алкоша изначально были выработаны Прайдом Алкоша для подготовки воинов-монахов. Сейчас их может пройти любая доблестная душа: кто угодно при моём дворе и даже я [Select_CString(ROOT.Char.IsFemale, 'сама', 'сам' )], если захочу. Но к этому нужно подойти с осмотрительностью: на прохождение испытаний даётся всего одна попытка. После провала за мной будет тянуться шлейф позора, но триумф в испытаниях — великая честь и слава."
 trials_of_alkosh_decision_tooltip:0 "Пройти различные испытания, чтобы проверить силу, веру и проницательность."
 trials_of_alkosh_decision_confirm:0 "Я покажу, чего стою!"

 # Cut Sunspire Funding
 cut_sunspire_funding_decision:0 "Прекратить финансирование Солнечного Шпиля"
 cut_sunspire_funding_decision_desc:0 "Всё великое обходится дорого, и, пожалуй, великий храм Солнечного Шпиля не стоит тех затрат, которые уходят на его обслуживание. Некогда он был важнейшим местом поклонения, но, с тех пор Риддл'Тар занял место Алкоша в качестве главного бога каджитского пантеона, число монахов и паломников постепенно сокращалось.\n\nБыть может, пора смириться с судьбой и прекратить дальнейшее вливание средств, даже если это будет означать утрату этой святыни из-за невозможности содержать её на одни только пожертвования."
 cut_sunspire_funding_decision_tooltip:0 "Уведомите монахов"
 cut_sunspire_funding_decision_confirm:0 "Моя казна скажет мне спасибо"

 # Dragonguard Pirates. Arrr!
 turn_dragonguard_pirate_decision:0 "Сделать из Приливного острова пиратское логово"
 turn_dragonguard_pirate_decision_desc:0 "Самым ценным из того, что Драконья стража оставила на Приливном острове, является сам остров. Ежедневно загруженные богатствами корабли пересекают треугольник между Сенчалом, Соулрестом и Лейавином и так и ждут, когда их ограбят. Древняя островная крепость — отличная база для ведения операций, а в скрытой гавани наши корабли будут укрыты от любопытствующих глаз и защищены от атак возмездия.\n\nВсего несколько находчивых усовершенствований позволят нам превратить это место в непревзойдённое пиратское логово, обиталище ужаса, из которого мы будем править морем."
 turn_dragonguard_pirate_decision_tooltip:0 "Топальское море будет трепещать перед вашим флотом"
 turn_dragonguard_pirate_decision_confirm:0 "Работайте, сухопутные крысы!"

 # Defile Hidden Moon Crypts
 defile_hidden_moon_crypts_decision:0 "Осквернить крипты Скрытой Луны"
 defile_hidden_moon_crypts_decision_desc:0 "Слишком долго крипты Скрытой Луны держали дозор над Пепельным Шрамом и его покойниками. Как и орден, который некогда обитал здесь, они теперь отголоски прошлого, лишённые цели в меняющемся мире.\n\nВ моих силах превратить эти крипты в базу моей некромантской деятельности. Тем самым я наделю их новым предназначением и извлеку выгоду из реликвий, знаний и трупов, которые оставили здесь монахи."
 defile_hidden_moon_crypts_decision_effect:0 "У разрушения защитных оберегов могут быть непредвиденные последствия."
 defile_hidden_moon_crypts_decision_tooltip:0 "Скоро мёртвые воители восстанут из пепельных песков."
 defile_hidden_moon_crypts_decision_confirm:0 "Сломать последние печати!"

 # Defile Rimmen Necropolis
 defile_rimmen_necropolis_decision:0 "Осквернить Некрополь Риммена"
 defile_rimmen_necropolis_decision_desc:0 "Наследием Золотого Зверя Дарлока Брэя стала обширная империя и тысячи трупов. Величайшие из его воинов упокоились в Некрополе Риммена. К его расширению приложили руку и гордые Гривы, выбиравшие некрополь местом своего захоронения.\n\nВозможно, пора продолжить дело Золотого Зверя: воскресить этих воинов и завоевать новые земли."
 defile_rimmen_necropolis_decision_tooltip:0 "Армия Дарлока Брэя восстанет и вновь будет сражаться в этих землях."
 defile_rimmen_necropolis_decision_confirm:0 "Идите и откройте могилы!"

 # Defile Deep Graves
 defile_deep_graves_decision:0 "Осквернить Глубокие Могилы"
 defile_deep_graves_decision_desc:0 "Место под названием Глубокие Могилы используются для погребения с тех пор как аргониане живут в Чернотопье. Тысячи лет мёртвых передавали болоту, пригвоздив могильными столбами, чтобы тело не уплывало и не превращалось в болотного гниляка.\n\nНо, как и всё в этих местах, трупы — это тоже ресурс. Разве не расточительно было бы просто оставить их гнить?"
 defile_deep_graves_decision_tooltip:0 "Болото извергнет сотни оживших воинов, которые пополнят наши войска."
 defile_deep_graves_decision_confirm:0 "Вырвать могильные столбы!"

 # Convert Chapel of Zenithar
 turn_zenithar_ch_khajiit_decision:0 "Преобразовать часовню Зенитара"
 turn_zenithar_ch_khajiit_decision_desc:0 "Часовня Зенитара — великий храм, посвящённый чужеземному богу. Но потратив достаточно средств, мы можем преобразовать его в место поклонения Двум Лунам."
 turn_zenithar_ch_khajiit_decision_tooltip:0 "Преобразовать часовню Зенитара"
 turn_zenithar_ch_khajiit_decision_confirm:0 "Слава Джоун и Джоуду!"
 
 # Defile Bone Orchard
 defile_bone_orchard_decision:0 "Defile the Barrowbough"
 defile_bone_orchard_decision_desc:0 "The Barrowbough has stood as a silent sentinel over this hill since time immemorial. To have one's bones buried here, after the body is honored by the Green Pact, is a great honor. As a result, the hill has grown, just like the tree atop it. It is now filled with countless bones, which can be forced to walk and fight once more - if only the tree's protection is broken."
 defile_bone_orchard_decision_tooltip:0 "The roots are torn asunder, compelled to relinquish the bones they have safeguarded for ages."
 defile_bone_orchard_decision_confirm:0 "Unearth the dead!"

 # Awake Earth Bone
 awake_earth_bone_decision:0 "Awake Earth Bone"
 awake_earth_bone_decision_desc:0 "With the Barrowbough firmly under my dominion, the time has come to claim that which has long been concealed: the bones of an ancient Ehlnofey.\n\nThough buried deep beneath the roots, their very essence still reverberates through the land. With sufficient magicka, I shall harness that power and bend it to my will."
 awake_earth_bone_decision_effect:0 "A giant being of terrible strength will be brought under your control."
 awake_earth_bone_decision_tooltip:0 "Let an ancient Ehlnofey awake under your command."
 awake_earth_bone_decision_confirm:0 "Prepare the Ritual!"
 cannot_summon_earth_bone:0 "Your faith forbids you to use the  #V 'Awake Earth Bone'#! [decision|E]"

 # Defile Heart of Valenwood
 defile_heart_of_valenwood_decision:0 "Defile the Heart of Valenwood"
 defile_heart_of_valenwood_decision_desc:0 "The seals, once foolishly erected to contain the true power of the Heart of Valenwood, have been broken. This relic of the Dawn Era, a metaphor made manifest, holds potential that is both mysterious and incomprehensible to most. However, I understand its significance: changing the heart means to change the forest itself. And I intend to change it for my needs."
 defile_heart_of_valenwood_decision_effect:0 "This decision may have serious consequences for all of Valenwood"
 defile_heart_of_valenwood_decision_tooltip:0 "The tree will be filled with dark magic until it's very essence is altered."
 defile_heart_of_valenwood_decision_confirm:0 "Let the Forest be at my command!"

 # Defile Treehenge Resting Place
 defile_treehenge_resting_place_decision:0 "Defile Treehenge Resting Place"
 defile_treehenge_resting_place_decision_desc:0 "The Green Ladies have lalways protected these lands — ferocious in life, steadfast in death. At the Treehenge Resting Place, their bodies lie buried while their souls roam the woods, bestowing their strength upon worthy Bosmer. But if someone were to seize control of this sacred place, unearth their bodies, and capture their souls, they could wield their immense power. And I have the means to make that happen."
 defile_treehenge_resting_place_decision_tooltip:0 "The ancient souls of the Green Ladies will be captured and their hatred twisted against their own people."
 defile_treehenge_resting_place_decision_confirm:0 "Enslave those souls!"

 # Turn Cathedral of the Golden Path into Bosmer temple
 turn_golden_path_cathedral_decision:0 "Convert Cathedral of the Golden Path"
 turn_golden_path_cathedral_decision_desc:0 "The Cathedral of the Golden Path is dedicated to gods foreign to our lands, its towering stone walls daring to overshadow the nearby trees. It is time to reclaim this place and transform it into a space of worship for our own people."
 turn_golden_path_cathedral_decision_tooltip:0 "Convert Cathedral of the Golden Path"
 turn_golden_path_cathedral_decision_confirm:0 "Gather the Greenspeakers!"

 # Turn Woodheart Sewers into Smuggle Hideout
 turn_woodheart_pirate_decision:0 "Turn Woodheart Sewers into Smuggle Hideout"
 turn_woodheart_pirate_decision_desc:0 "The ancient sewers of Woodhearth are a haven for those who see opportunity where others see ruin. Let us claim this forgotten underworld and shape it into a hidden stronghold, where the relentless flow of goods and gold can thrive, far from prying eyes."
 turn_woodheart_pirate_decision_tooltip:0 "This will increase the profits to be made but comes at a cost of control"
 turn_woodheart_pirate_decision_confirm:0 "Let's move in the Skooma!"

 # Defile Sancre Tor
 defile_sancre_tor_decision:0 "Defile Sancre Tor"
 defile_sancre_tor_decision_desc:0 "Sancre Tor. There is no other place in Cyrodiil with a history like this one. From here, Empires were born — and crumbled into dust.\n\nNow, it is time to turn the tides of fate once more from within these very walls. Treasures lie buried here, ripe for the taking, and those who once guarded them will soon serve my will."
 defile_sancre_tor_decision_tooltip:0 "Turn this sacred place into an endless source of undead"
 defile_sancre_tor_decision_confirm:0 "Invade the Crypts!"

 # Defile Great Chapel of Arkay
 defile_great_chapel_of_arkay_decision:0 "Defile the Great Chapel of Arkay"
 defile_great_chapel_of_arkay_decision_desc:0 "Arkay - the eternal adversary. His priests remain a relentless thorn, and his rites bar us from the souls we seek. The Chapel at the heart of Cheydinhal stands as a monument to his influence, but the time has come to reveal to all of Tamriel that this god no longer holds the power to shield it from those who wield the true power of necromancy."
 defile_great_chapel_of_arkay_decision_tooltip:0 "Turn this hallowed sanctuary into a bastion of necromancy"
 defile_great_chapel_of_arkay_decision_confirm:0 "Desecrate these Altars!"

 # Sanctify Ontus Quarry
 sanctify_ontus_quarry_decision:0 "Sanctify the Ontus Qarry"
 sanctify_ontus_quarry_decision_desc:0 "Mining a mountain for its ore is already a sacrilege, yet one that is sadly necessary for our survival. But quarrying stone is vile desecration, stripping the mountain of its sacred flesh. We must destroy the quarry and build a shrine in its place - a symbol of repentance and a vow to take only what we truly need."
 sanctify_ontus_quarry_decision_tooltip:0 "Destroy the gantrries, burn the tools, tear down every structure!"
 sanctify_ontus_quarry_decision_confirm:0 "Let the mountain heal"

 