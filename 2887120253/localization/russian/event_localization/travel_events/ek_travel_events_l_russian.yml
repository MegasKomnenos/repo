 ek_travel_events.0010.t:0 "$travel_event_prefix$ Зимнее умиротворение"
 ek_travel_events.0010.desc:0 "Я в провинции [ROOT.Char.GetCurrentLocation.GetName]. Местность [ROOT.Char.GetCurrentLocation.GetTerrain.GetNameNoTooltip] после обильного снегопада встретила нас безмятежным пейзажем. Всюду вокруг нас творения природы оказались укутаны снежным покровом.\n\nСвет, каскадом отражаясь в свисающих сосульках, дополнял сияющую картину морозного чуда. Лёгкое дуновение ветра складывалось в мелодичную серенаду.\n\nПровинцию [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] зима как будто одарила своим нежным объятием, позволив ненадолго взглянуть на рай."
 ek_travel_events.0010.a:0 "Давайте ненадолго остановимся и полюбуемся."
 ek_travel_events.0010.b:0 "Отличная возможность для тренировки."
 ek_travel_events.0010.b.success: "Тренировка проходит успешно"
 ek_travel_events.0010.b.failure: "Тренироваться в таких условиях — изнурительно"
 ek_travel_events.0010.c:0 "Нам нельзя терять времени!"
 
 ek_travel_events.0015.t:0 "$travel_event_prefix$ Дорожные святилища Тамриэля"
 ek_travel_events.0015.desc:0 "В своём путешествии через провинцию [ROOT.Char.GetCurrentLocation.GetName] я [Select_CString(ROOT.Char.IsFemale, 'наткнулась', 'наткнулся')] на дорожное святилище: священное место, посвящённое #LORE [Concept('compendium_divines', 'Божествам')]#!. Эти разбросанные по территории материка святилища, украшенные изображениями местных божеств, обладают высокой духовной значимостью и часто служат как проводники в Этериус.\n\nСчитается, что они направляют души на пути к загробной жизни. Лорд Корвус Диренни как-то предположил, что эти святилища можно использовать для быстрого перемещения, однако детали такого процесса остаются загадкой — одним из элементов мистического полотна божественных тайн Тамриэля."
 ek_travel_events.0015.a:0 "Надо попробовать использовать это святилище как портал!"
 ek_travel_events.0015.a.tt:0 "Вы преуспели"
 ek_travel_events.0015.a.effect:0 "Вы телепортируетесь к следующей точке вашего маршрута!"
 ek_travel_events.0015.a.tt_fail:0 "Ничего не происходит"
 ek_travel_events.0015.a.tt_critical_fail:0 "Вы допускаете серьёзную ошибку"
 ek_travel_events.0015.b:0 "Прочитать короткую молитву Божествам"
 ek_travel_events.0015.c:0 "Спасибо, но я предпочитаю путешествовать более привычными способами."

 ek_travel_events.0020.t:0 "$travel_event_prefix$ Расцвет весны"
 ek_travel_events.0020.desc:0 "В провинции [ROOT.Char.GetCurrentLocation.GetName], которую я [Select_CString(ROOT.Char.IsFemale, 'посетила', 'посетил')] в ходе своего путешествия, природа предстала передо мной во всей красе. Воздух наполняло ленивое жужжание пчёл. Бабочки-парусники грациозно порхали на фоне ясного голубого неба.\n\nНежный ветер разносил аромат цветов, распустившихся, словно взрыв красок на этой живописной картине встречи весны."
 ek_travel_events.0020.a:0 "Мы можем остаться и насладиться видом подольше…"
 ek_travel_events.0020.b:0 "Надо искать припасы, наверняка в этих местах есть что-то съедобное"
 ek_travel_events.0020.b.success: "Вокруг полно еды"
 ek_travel_events.0020.b.failure: "Природа хоть и прекрасна, но не щедра"
 ek_travel_events.0020.c:0 "Отличная погода для путешествия!"

 ek_travel_events.0025.t:0 "$travel_event_prefix$ Любовь публики"
 ek_travel_events.0025.desc:0 "В провинции [ROOT.Char.GetCurrentLocation.GetName] моё внимание привлекла толпа. Неподалёку располагалась арена, откуда доносились ликование и грохот аплодисментов, и эти собравшиеся встречали местного чемпиона, облачённого в доспех.\n\nМои приближённые быстро разогнали крестьян, и я лично [Select_CString(ROOT.Char.IsFemale, 'встретилась', 'встретился ' )] с чемпионом. [champion.GetSheHe|U] [Select_CString(champion.IsFemale, 'представилась и сказала', 'представился и сказал' )], что [champion.GetHerHis] зовут [champion.GetFirstName] и до сих пор никто не победил [champion.GetHerHis] на арене и местные считают [champion.GetHerHis] [Select_CString(champion.IsFemale, 'героиней', 'героем' )]."
 ek_travel_events.0025.a:0 "Можно взять автограф?"
 ek_travel_events.0025.azura:0 "Клянусь Азурой, клянусь Азурой!"
 ek_travel_events.0025.b:0 "Для меня будет честью, если вы составите мне компанию."
 ek_travel_events.0025.c:0 "Я вызываю вас на дружеский поединок!"
 ek_travel_events.0025.c.success:0 "Вы побеждаете чемпиона"
 ek_travel_events.0025.c.failure:0 "Чемпион побеждает вас"
 ek_travel_events.0025.d:0 "Да, да, впечатляет."

 ek_travel_events.0030.t:0 "$travel_event_prefix$ Старые солдаты"
 ek_travel_events.0030.desc:0 "Неподалёку от места под названием [ROOT.Char.GetCurrentLocation.GetName] мне [Select_CString(soldier.IsFemale, 'повстречалась', 'повстречался' )] [soldier.GetFirstName], угрюмый солдат. [soldier.GetSheHe|U] [Select_CString(soldier.IsFemale, 'рассказала', 'рассказал' )] мне о своём павшем товарище, который погиб во время недавней войны. [soldier.GetFirstName] [Select_CString(soldier.IsFemale, 'попросила', 'попросил' )] оказать [soldier.GetHerHim] услугу: доставить меч и кольцо покойного соратника [soldier.GetHerHis] безутешной семье, живущей в провинции [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetNameNoTooltip]."
 ek_travel_events.0030.a:0 "Во сколько ты оцениваешь мою помощь?"
 ek_travel_events.0030.b:0 "Не беспокойся, я помогу."
 ek_travel_events.0030.c:0 "Я тебе не посыльный!"

 ek_travel_events.0035.t:0 "$travel_event_prefix$ The Witches Festival"
 ek_travel_events.0035.desc:0 "As my entourage and I moved through [ROOT.Char.GetCurrentLocation.GetName], an eerie stillness took hold. Under darkened skies thick with the scent of harvest, we came upon a strange gathering. People in macabre costumes danced around a bonfire, laughter echoing through the trees.\n\nAt the center stood a woman in a tattered robe, clutching a gnarled staff. She calles herself the "Witchmother" and watches over this strange activity."
 ek_travel_events.0035.a:0 "I want to learn your ways."
 ek_travel_events.0035.b:0 "Join me and my coven."
 ek_travel_events.0035.c:0 "Seems like a harmless festival. Enjoy it."
 ek_travel_events.0035.d:0 "Taste a brew from the Witchmother."
 ek_travel_events.0035.d.tt:0 "You will be offered a variety of different concoctions to choose from."
 ek_travel_events.0035.e:0 "Torches. Now!"
 ek_travel_events.0035.f:0 "I have no time for this."

 ek_travel_events.0036.t:0 "$travel_event_prefix$ The Witchmother's Bargain"
 ek_travel_events.0036.desc:0 "The Witchmother greets my interest in her craft with an unsettling smile. And her eyes gleam with otherworldly knowledge as she presents a choice of mysterious brews to mark the Witches' Festival. Their odor is unsettling, to say the least.\n\nHowever, there sure is power in these brews, and so the Witchmother awaits my decision."
 ek_travel_events.0036.a:0 "This bloody-red brew looks good!"
 ek_travel_events.0036.a.tt:0 "You become infected with [GetTrait('sanguinare_vampiris').GetName( GetNullCharacter )]!"
 ek_travel_events.0036.b:0 "This one looks very meaty and tasty!"
 ek_travel_events.0036.b.tt:0 "You become infected with [GetTrait('sanies_lupinus').GetName( GetNullCharacter )]!"
 ek_travel_events.0036.c:0 "The muddy one surely has to be healthy!"
 ek_travel_events.0036.d:0 "I've changed my mind, I want to go."

 ek_travel_events.0040.t:0 "$travel_event_prefix$ The Windmill"
 ek_travel_events.0040.desc:0 "As I traverse [ROOT.Char.GetCurrentLocation.GetName], I notice a strange building atop a small hill. Its towering structure reaches up into the sky, and four wooden arms reach out from a central axis, with large spans of cloth between them. Its enormous, flat blades spin in a mesmerizing dance, powered by the invisible force of the wind. A sense of wonder overtakes me as I behold this ingenious creation. What is its purpose? How does it function?\n\nIt may cause a significant delay in my travel, but I could take this the opportunity to study these buildings in detail, with the hope of eventually recreating them at home."
 ek_travel_events.0040.a:0 "I have to study those!"
 ek_travel_events.0040.b:0 "A proof of [windmill_culture.GetName] ingenuity."
 ek_travel_events.0040.c:0 "I have to destroy them!"
 ek_travel_events.0040.d:0 "Whatever, we have to move on."

 ek_travel_events.0045.t:0 "$travel_event_prefix$ Глядя на звёзды"
 ek_travel_events.0045.desc:0 "Этой ночью мы разбили лагерь под ясным небом. Отдыхая после долгой дороги, я лежу у костра, глядя на необычный и чудесный мир, простирающийся над нашими головами — мир [Concept('star_signs', 'созвездий')|E]. Они приглядывают за нами, оберегая от чудных напастей, возникающих вне пределов их мира. Каждая звезда — это какая-то способность или сила, которая помогает нам справляться с трудностями жизни.\n\nС рождения я несу благословение своего знака созвездия, но до сих пор я не [Select_CString(ROOT.Char.IsFemale, 'размышляла', 'размышлял' )] об этом. Сейчас хорошая возможность этим заняться, если бы не тяжёлая усталость от прошедшего дня."
 ek_travel_events.0045.a:0 "Предаться мыслям о текущем созвездии."
 ek_travel_events.0045.b:0 "Пойти спать."

 ek_travel_events.0050.t:0 "$travel_event_prefix$ Тайник"
 ek_travel_events.0050.desc:0 "Уличив возможность побыть в одиночестве, я [Select_CString(ROOT.Char.IsFemale, 'заметила', 'заметил' )] в расщелине запертый сундук. Возможно, это разбойничий клад или, быть может, сокровище какого-то авантюриста.\n\nМеня манит возможность испытать свои навыки, и я раздумываю над тем, чтобы его открыть. Хозяина поблизости не видно, и я могу забрать себе содержимое — надеюсь, оно того стоит."
 ek_travel_events.0050.a:0 "Я знаю, как взламывать замки."
 ek_travel_events.0050.a.success:0 "Вы успешно взламываете замок"
 ek_travel_events.0050.a.failure:0 "Замок не поддаётся"
 ek_travel_events.0050.b:0 "Я его сломаю!"
 ek_travel_events.0050.b.success:0 "Вы успешно ломаете замок"
 ek_travel_events.0050.b.failure:0 "Замок слишком крепкий"
 ek_travel_events.0050.c:0 "«Открыть замок» — простое заклинание"
 ek_travel_events.0050.d:0 "[alteration_mage.GetFirstName|U], открой его своей магией!"
 ek_travel_events.0050.e:0 "Чтобы бы там ни лежало, это не моё дело."

 ek_travel_events.0055.t: "$travel_event_prefix$ A Ringing Plant"
 ek_travel_events.0055.desc.intro: "As I travel through [ROOT.Char.GetCurrentLocation.GetName] a peculiar sound interrupts my journey, prompting me to pause and investigate its origin."
 ek_travel_events.0055.desc.herbalist: "\n\nTo my pleasant surprise, I discover a Nirnroot at a nearby waterway! I know enough about herbalism to recognize the strange and powerful properties of this plant. Every alchemist would pay a fair price for it, although I could examine it myself and try to unlock more of its secrets."
 ek_travel_events.0055.desc.entourage_herbalist: "\n\nAs [herbalist_character.GetFirstName] joins me in my examination, [herbalist_character.GetSheHe] enlightens me about this plant, identifying it as a Nirnroot—a highly mysterious botanical specimen with potent alchemical properties that perplex herbalists across all of Mundus. The prospect of taking it with us holds the promise of unlocking valuable insights and knowledge."
 ek_travel_events.0055.desc: "\n\nTo my surprise, I discover that the source of this enigmatic noise is a plant with unusual characteristics I've never before encountered. It thrives near the water, boasting broad leaves that emit a faint luminescence and a constant sound that can be heard even from several feet away."
 ek_travel_events.0055.a: "I am going to study it."
 ek_travel_events.0055.b: "[herbalist_character.GetFirstNameNoTooltip|U], decipher its secrets."
 ek_travel_events.0055.c: "I wonder what it tastes like?"
 ek_travel_events.0055.c.success: "Oddly enough, you learn something from eating it."
 ek_travel_events.0055.d: "That will fetch a nice price in the next town."

 ek_travel_events.0065.t:0 "The High Cost of Lying"
 ek_travel_events.0065.desc:0 "[revenge.GetFirstName] strides up with a sly grin, the air of a schemer about [revenge.GetHerHim]. "My [revenge.Custom2('RelationToMeShort', ROOT.Char)|U], I've got a proposition," [revenge.GetSheHe] begins. "Before I joined this merry band of cutthroats, I ran with another group—just as unscrupulous as ours, if not more so. That was until a rival crew, led by [bandit.GetFirstName], decided to wipe us out. I'm the only one who made it."\n\nI tilt my head, skeptical. "And what does this have to do with us, [revenge.GetFirstNameNoTooltip]?"\n\n"[bandit.GetFirstName]'s lot are holed up right here in [ROOT.Char.GetCurrentLocation.GetName]. That presents us with a chance: revenge for me, profit for us.""
 ek_travel_events.0065.a:0 "We should be careful about this."
 ek_travel_events.0065.a.success:0 "The plot succeeds"
 ek_travel_events.0065.a.failure:0 "The plot is foiled"
 ek_travel_events.0065.b:0 "I will deal with [bandit.GetHerHim] myself!"
 ek_travel_events.0065.b.success:0 "You best [bandit.GetFirstName]"
 ek_travel_events.0065.b.failure:0 "[bandit.GetFirstName] bests you"
 ek_travel_events.0065.failure.death.tt:0 "[revenge.GetFirstName] is killed during the attempt"
 ek_travel_events.0065.d:0 "That is too risky."

 ek_travel_events.0070.t:0 "$travel_event_prefix$ Gift of a Mad[mad_person.GetWomenMen]"
 ek_travel_events.0070.desc: "I have no idea where [mad_person.GetName] came from, but suddenly, [mad_person.GetSheHe] is beside me as I travel through [ROOT.Char.GetCurrentLocation.GetNameNoTooltip]. [mad_person.GetHerHis|U] grin is wide, too wide as [mad_person.GetSheHe] holds up a bizarre relic with a theatrical flourish. It radiates an inexplicable allure, as if it hums with the laughter of unseen voices. Its design is strange, its purpose indiscernible, yet it calls to me with an almost mocking insistence.\n\n"A special gift, for this very special day." [mad_person.GetSheHe] declares, eyes alight with an unsettling glee.\n\nI sense this is no ordinary artifact, for the Mad God's chaotic touch lingers upon it, tempting me to reach out and claim it for myself."
 ek_travel_events.0070.a:0 "Oooh, shiny!"
 ek_travel_events.0070.a.tt:0 "You're too sane for this."
 ek_travel_events.0070.b:0 "Thank you, Mad God!"
 ek_travel_events.0070.c:0 "By [ROOT.GetCharacter.GetFaith.HighGodName], destroy this relic!"
 ek_travel_events.0070.d:0 "I have no use for such odd trinkets."

 ek_travel_events.0075.t:0 "$travel_event_prefix$ Осколки Этериуса"
 ek_travel_events.0075.desc:0 "Исследуя [ROOT.Char.GetCurrentLocation.GetTerrain.GetNameNoTooltip], я [Select_CString(ROOT.Char.IsFemale, 'наткнулась', 'наткнулся')] на нечто необычное: небесный осколок. В них содержится сущность самого Нирна.\n\nОни падают на Нирн из Этериуса во время особых моментов лунного цикла и выглядят как сверкающая серебристая призма. Известно, что небесные осколки могут даровать поразительные способности. Сегодня один из таких осколков, нетронутый источник силы, озарил меня своим светом."
 ek_travel_events.0075.stewardship:0 "Я чувствую, что мне под силу заключить любую сделку!"
 ek_travel_events.0075.intrigue:0 "Я чувствую, как каждый секрет открывается мне!"
 ek_travel_events.0075.magic:0 "Я чувствую, как раскрывается мой магический потенциал!"
 ek_travel_events.0075.learning:0 "Я [Select_CString(ROOT.Char.IsFemale, 'могла', 'мог')] бы часами изучать его свойства!"
 ek_travel_events.0075.martial:0 "Я чувствую, как вижу все возможные стратегии!"
 ek_travel_events.0075.prowess:0 "Я чувствую, что могу победить любого воина!"
 ek_travel_events.0075.diplomacy:0 "Я чувствую, как мне под силу закончить любую войну!"
 ek_travel_events.0075.c:0 "Светится он ярко, но давайте не будем задерживаться."

# General Danger
 ek_travel_events.4000.t:0 "$travel_danger_prefix$ Ужас из глубин"
 ek_travel_events.4000.desc:0 "Название «[current_location.GetName|U]» местные произносят шёпотом и с опаской, кажется, остерегаясь этого места. Говорят, что здесь расположился очень странный культ, «[brethren_leader.GetFaith.GetAdjective]», занимающийся человеческими жертвоприношениями.\n\n[brethren_leader.GetName] тем не менее тепло приветствует меня как глава местных #L [brethren_leader.GetFaith.GetAdjective]их#! последователей и предлагает составить им компанию в часовне на «Собрании». [Select_CString(ROOT.Char.IsFemale, 'Уверена', 'Уверен' )] слухи о жертвоприношениях абсолютно беспочвенны…\n\nПогодите-ка. Куда [Select_CString(kidnapped_character.IsFemale, 'пропала', 'пропал' )] [kidnapped_character.GetFirstName]?"
 ek_travel_events.4000.a:0 "Скорее, уходим из этого места!"
 ek_travel_events.4000.b:0 "[brethren_leader.Custom('InsultNoun')], ты об этом пожалеешь!"
 ek_travel_events.4000.b.success:0 "Вы даёте отпор #L [brethren_leader.GetFaith.GetNameNoTooltip]им#! культистам и спасаете своего спутника по имени [kidnapped_character.GetFirstNameNoTooltip]"
 ek_travel_events.4000.b.failure:0 "Вы с трудом спасаетесь оттуда"

 ek_travel_events.4005.t:0 "$travel_danger_prefix$ Мрачные руины"
 ek_travel_events.4005.desc:0 "[ROOT.Char.GetCurrentLocation.GetTerrain.GetNameNoTooltip] провинции [ROOT.Char.GetCurrentLocation.GetTerrain.GetNameNoTooltip] усеяны руинами из глубины веков. Для кого-то — достопримечательность, а для неосторожных путников — опасная ловушка. Мне едва хватило времени понять, что происходит, прежде чем я [Select_CString(ROOT.Char.IsFemale, 'ударилась', 'ударился')] о землю, повредив ногу.\n\n"
 ek_travel_events.4005.azura:0 "Я оказываюсь глубоко внутри скрытого подземного святилища. То, что я вижу, завораживает сознание: всё вокруг озаряет загадочный свет, и это небесное сияние одновременно спутывает мысли и пленяет. Чарующий затаённый алтарь украшен каскадами фонтанов и необычной растительностью с листьями розового цвета, будто бы не из этого мира. Вдали виднеется расплывчатое изображение серебряного города. Шептания, изрекающие древние мифы, и игра света и тени создают ауру трансцендентной красоты в этом таинственном подземном царстве."
 ek_travel_events.4005.boethiah:0 "Лабиринтообразные, ведущие в никуда коридоры, вывели меня к могучей статуе. На меня, замахнувшись мечом, взирал воин, будто бы готовившийся к удару. Из пола торчали изогнутые шипы, дополняя и без того угрожающую картину.\n\nМои уши наполнили голоса, агрессивно требовавшие, чтобы я [Select_CString(ROOT.Char.IsFemale, 'сдалась и поклялась', 'сдался и поклялся')] в вечном служении."
 ek_travel_events.4005.clavicus:0 "Светящиеся в темноте растения издают зловещее свечение, атмосфера этого места отягощена тёмной, жуткой энергией. Алтари, на которых красуются таинственные символы, служат точками притяжения в этом странном святилище.\n\nВ воздухе как будто бы резонируют произнесённые шёпотом желания и зловещие обещания. В зашифрованных посланиях на стене говорится о цене, которую многие заплатили за свои устремления."
 ek_travel_events.4005.dagon:0 "Хаотичные руины источают дух беспрестанного разрушения и буйного преображения. Пустующие залы изуродованы клочками выжженной земли и разрушенными остатками каких-то конструкций. Безмолвие господствует в этом месте, и никакое живое присутствие не нарушает зловещую тишину, пронизывающую это брошенное место."
 ek_travel_events.4005.hermaeus:0 "Эти таинственные руины источают тревожную ауру безграничного знания и зловещей судьбы. Их внутреннее устройство непостоянно: бесконечные библиотеки сменяют большие, таящие какую-то тайну открытые пространства, и в воздухе витает дух жуткого напряжения. Призраки учёных шепчут о забытых истинах, а в тенях виднеются монструозные конструкции. Тьма скрывает за собой откровение и опасность, призывая лишь отважные умы исследовать свои таинственные глубины."
 ek_travel_events.4005.hircine:0 "Поначалу мне казалось, что это обычная естественная пещера, но, углубляясь внутрь, я [Select_CString(ROOT.Char.IsFemale, 'увидела', 'увидел')] нарисованные кровью изображения на голой породе. Меня обуревало угнетающее чувство, будто кто-то выслеживает меня. Я внимательно [Select_CString(ROOT.Char.IsFemale, 'прислушивалась', 'прислушивался')] к каждому звуку, и тогда-то я [Select_CString(ROOT.Char.IsFemale, 'услышал', 'услышала')]: где-то вдали, вне моего поля зрения кто-то дует в охотничий рог."
 ek_travel_events.4005.malacath:0 "Дым и пепел покрывают всё, что открылось перед моими глазами. Я откашливаюсь, стараясь, чтобы всё это не попало ко мне в лёгкие. Сбив дыхание, спотыкаясь, я нахожу странный сад. Он выглядит заброшенным, будто призрак утраченного величия.\n\nИздалека до меня доносится звук молота, бьющего по наковальне и голос, требующий подчинения."
 ek_travel_events.4005.mephala:0 "Жуткое присутствие ощущается глубоко внутри этого подземного святилища. Тускло освящённые пещеры скрывают древние секреты, а их стены искусно украшены узорами, напоминающими пауков. Светящиеся грибы испускают зловещее, пульсирующее свечение. Всё окружение пронизывает ощущение какой-то тайны, интриги. Необычные паукообразные существа тихо рыскают в этой тёмной бездне, и их присутствие усиливает чувство тревоги и неопределённости. Угловатые багровые кристаллы вздымаются из каменных образований, отражая кроваво-красный свет, дополняющий таинственную обстановку."
 ek_travel_events.4005.meridia:0 "Я [Select_CString(ROOT.Char.IsFemale, 'наблюдала', 'наблюдал')] перед собой занимательную картину. То, что меня окружало, напоминало коралловый риф, а в воздухе парили камни. Дорожки из разноцветной были — или это такие облака — устилали странную «землю» подо мной — на удивление твёрдую, хоть и похожу на светящуюся жидкость. Казалось, в устройстве этого сокрытое святилище таятся древние магические секреты."
 ek_travel_events.4005.molag:0 "Глубоко в бездне под землёй я [Select_CString(ROOT.Char.IsFemale, 'чувствовала', 'чувствовал')] тревожное присутствие. Эта аура навевает ощущение украденной сущности, мрачного подражания. Подземное царство, в котором я [Select_CString(ROOT.Char.IsFemale, 'очутилась', 'очутился')], кажется, никогда не знало тепла, оно негостеприимное и безжизненное , будто тёмное отражение извращённой страсти. Чувство страха и угнетения в воздухе такое густое, что его можно пощупать, и каждый, кто ступает сюда, погружается в гнетущий ужас."
 ek_travel_events.4005.namira:0 "В сердце тайного святилища доминирует потусторонняя, зловещая атмосфера. Невидимые силы, кажется, просачиваются сквозь воздух, создавая плотную завесу тени и интриги. Воздух пронизывают шептания о загадочных силах и непостижимых секретах, и вошедший сюда оказывается погружён в тревожную ауру неведомого. Святилище источает зловещее чувство того, как древние тайны и сокрытые истины манят из глубин неизведанного."
 ek_travel_events.4005.nocturnal:0 "В мрачном пространстве этого подземного храма царят непрекращающиеся сумерки. Тёмные колонны вздымаются из беспросветных глубин, частично скрытые неуходящей тьмой. Воздух вокруг тяжёлый, наполненный аурой таинственной заброшенности, и это ощущение усиливают зашифрованные письмена и полуразрушенные залы, в которых эхом слышатся забытые секреты."
 ek_travel_events.4005.peryite:0 "В глубинах этого подземного святилища таинственная атмосфера окутывает посетителя духом загадочной торжественности. Тускло освещённые залы украшены занимательными символами, указывающими на секреты, таящиеся в тенях. Это место отмечено присутствием зловещей ауры, призывающей тех, кто спустился в эту святыню, поразмышлять над таинственной значимостью его сокрытых обрядов и непостижимого смысла."
 ek_travel_events.4005.sanguine:0 "Бессчётные коридоры соединяют бесчисленные хаотично расположенные залы, каждый из них призван удовлетворить одну из множества самых разнообразных потребностей или страстей — вот что представляет собой это подземное святилище кутежа.\n\nРадостный и соблазнительный голос взывает ко мне, предлагая остаться здесь навечно."
 ek_travel_events.4005.sheogorath:0 "Плутая по подземелью, я неожиданно для себя [Select_CString(ROOT.Char.IsFemale, 'оказалась', 'оказался')] в этом приводящем в замешательство месте. Перед моими моими глазами простиралось царство парадоксов. Я не [Select_CString(ROOT.Char.IsFemale, 'нашла', 'нашёл')] в нём проявлений живой души, но повсюду были зловещие признаки безумия, от которых я [Select_CString(ROOT.Char.IsFemale, 'начала', 'начал')] сомневаться в собственном рассудке."
 ek_travel_events.4005.vaermina:0 "Разглядев то, что предстало передо мной, я [Select_CString(ROOT.Char.IsFemale, 'окаменела', 'окаменел')]. Отчаяние и ужас обуревали меня от осознания этого кошмарного видения. Обстановка вокруг выглядела сюрреалистично и, казалось, менялась, когда я [Select_CString(ROOT.Char.IsFemale, 'оборачивалась', 'оборачивался')], чтобы определить, где нахожусь.\n\nХолодный, но при этом гипнотизирующий голос взывал ко мне. Он склонял меня служить ей, поклоняться ей в вечном сне."
 ek_travel_events.4005.a:0 "Матерь Душ, до чего умиротворительно твоё присутствие."
 ek_travel_events.4005.b:0 "Твоя сфера не одурачит меня, Космический Разделитель!" # changed those to reference the invokation lorebook from TR
 ek_travel_events.4005.c:0 "Я сдаюсь, Тёмный Воин. Отныне и навеки моя душа принадлежит тебе."
 ek_travel_events.4005.d:0 "Твои заговоры — ничто перед стойкостью моей веры, Обманщица Народов."
 ek_travel_events.4005.e:0 "Повелитель Пагубных Желаний, я желаю заключить сделку."
 ek_travel_events.4005.f:0 "Твои сделки мне не интересны!"
 ek_travel_events.4005.g:0 "Владыка секретов, позволь учиться у тебя."
 ek_travel_events.4005.h:0 "Твои тёмные знания для меня ничего не значат!"
 ek_travel_events.4005.i:0 "Владыка Погони, позволь мне поохотиться на слабых!"
 ek_travel_events.4005.j:0 "[Select_CString(ROOT.Char.IsFemale, 'Последовательница', 'Последователь' )] [ROOT.GetCharacter.GetFaith.HighGodNamePossessive] ни за что не склонится перед зверем!"
 ek_travel_events.4005.k:0 "Пощади своего верного слугу, Яростный!"
 ek_travel_events.4005.l:0 "Силой [ROOT.GetCharacter.GetFaith.HighGodNamePossessive] я изгоняю тебя, Проклятый!"
 ek_travel_events.4005.m:0 "Великий и Могущественнейший Владыка, я здесь, чтобы служить!"
 ek_travel_events.4005.n:0 "Пламенный Тиран, [ROOT.GetCharacter.GetFaith.HighGodName] изгоняет тебя!"
 ek_travel_events.4005.o:0 "[Select_CString(ROOT.Char.IsFemale, 'Твоя новая ученица прибыла', 'Твой новый ученик прибыл')], Учитель Тайных Искусств"
 ek_travel_events.4005.p:0 "Я никогда не угожу в твою паутину!"
 ek_travel_events.4005.q:0 "Светозарная, Солнечный Огонь, я лишь желаю служить…"
 ek_travel_events.4005.r:0 "Ведьма Света, тебе меня не ослепить!"
 ek_travel_events.4005.s:0 "Научи меня, Тёмный Отец…"
 ek_travel_events.4005.ta:0 "Ты меня не поработишь, Осквернитель!"
 ek_travel_events.4005.u:0 "Пустота зовёт…"
 ek_travel_events.4005.v:0 "Сгнившая, твоя тьма не осквернит меня!"
 ek_travel_events.4005.x:0 "Королева Теней, укрой меня своей тьмой."
 ek_travel_events.4005.y:0 "Я не исчезну в твоих тенях!"
 ek_travel_events.4005.z:0 "Надзиратель, я [Select_CString(ROOT.Char.IsFemale, 'готова', 'готов')] приступить к своему заданию."
 ek_travel_events.4005.1:0 "Чтоб мне никогда не подхватить твои хвори!"
 ek_travel_events.4005.2:0 "Я склоняюсь перед тобой, Кровью-Созданное-Удовольствие."
 ek_travel_events.4005.3:0 "Именем [ROOT.GetCharacter.GetFaith.HighGodNamePossessive] будь ты проклят, извращённый демон!"
 ek_travel_events.4005.4:0 "Безумец, я сдаюсь твоему безумию!"
 ek_travel_events.4005.5:0 "Да не охватит меня твоё сумасшествие, Безумный Бог!"
 ek_travel_events.4005.6:0 "Да, Владычица, да, Дарующая, я буду служить."
 ek_travel_events.4005.7:0 "Никогда не являйся ко мне во снах!"
 ek_travel_events.4005.run:0 "К-как отсюда выбраться?!"

 ek_travel_events.4010.t:0 "$travel_danger_prefix$ Дурная кровь"
 ek_travel_events.4010.desc:0 "Вокруг [ROOT.Char.Custom('TerrainType')]. Солнце зашло, и наша группа сбилась с пути. Послышался пронзительный крик, и внезапно я [Select_CString(ROOT.Char.IsFemale, 'осталась', 'остался')] один на один с чудовищем.\n\nОно было покрыто кровью и смотрело на меня безумными, налитыми кровью глазами. Я [Select_CString(ROOT.Char.IsFemale, 'вспомнила', 'вспомнил')] истории, которые мне рассказывали на ночь, про то, как вампиры превращают обычных людей в диких чудовищ — кровавых монстров.\n\nОдин из них прямо сейчас стоял передо мной, смотря прямо в душу."
 ek_travel_events.4010.a:0 "[ROOT.Char.GetFaith.HighGodName|U], сжалься надо мной!"
 ek_travel_events.4010.a.success:0 "Вы одолеваете кровавого монстра"
 ek_travel_events.4010.a.failure:0 "Кровавый монстр побеждает"
 ek_travel_events.4010.b:0 "Склонись перед хозяином, зверь!"
 ek_travel_events.4010.c:0 "Позволить монстру укусить, чтобы заразиться вампиризмом."
 ek_travel_events.4010.c.tt:0 "Вы заражаетесь [GetTrait('sanguinare_vampiris').GetName( GetNullCharacter )]!"
 ek_travel_events.4010.d: "Бежать без оглядки."
 ek_travel_events.4010.d.flavor: "Вы убегаете далеко в ночную тьму."

 ek_travel_events.4015.t: "$travel_danger_prefix$ Зов полной луны"
 ek_travel_events.4015.intro: "Tonight is a beautiful night. The red moon Secunda hangs full in the sky and drawn by its silent call, I wander away from the camp, seeking a moment of peace under its crimson light.\n\nBut what should have been a tranquil moment of solitude is shattered as I hear "
 ek_travel_events.4015.werebat: "a high-pitched shriek, followed by an enormous shadow descending from the towering trees of Valenwood. A Werebat! The monstrous creature barely misses my head as it swoops past, its leathery wings beating the air violently. It circles back, eyes glowing with predatory hunger, preparing for another attack."
 ek_travel_events.4015.werevulture: "a guttural screech from above, followed by the ominous sound of heavy wings cutting through the warm night air of Hammerfell. A Werevulture! Its twisted form dives toward me, its talons outstretched to rend flesh from bone."
 ek_travel_events.4015.werecrocodile: "a deep, rumbling growl from the nearby swamp, followed by the rustling of reeds. Emerging from the murky waters of Black Marsh, its eyes reflecting the moonlight, is a massive Werecrocodile. Its elongated maw drips with saliva as it lumbers forward, muscles tensed for the kill."
 ek_travel_events.4015.wereboar: "the sound of heavy hooves pounding against the earth, accompanied by an enraged, guttural snort. A Wereboar of Highrock! The hulking beast charges toward me, tusks gleaming in the moonlight, its bristled fur matted with the remnants of past hunts."
 ek_travel_events.4015.werelion: "a deep, reverberating roar that seems to shake all of Elysweyr. A Werelion! Its golden mane is streaked with blood, its feline eyes locked onto me with a predator's gaze. It moves with a hunter's grace, muscles coiling, ready to pounce."
 ek_travel_events.4015.werewolf: "a bone-chilling howl that echoes through the night. A Werewolf! Its lupine form emerges from the underbrush, fangs bared, eyes burning with a savage hunger. The beast stands on two legs, towering over me, ready to strike."
 ek_travel_events.4015.a:0 "You will not claim me!"
 ek_travel_events.4015.a.success:0 "You defeat the lycan"
 ek_travel_events.4015.a.failure:0 "The lycan defeats you"
 ek_travel_events.4015.b:0 "Recognize your own, we share the beastblood."
 ek_travel_events.4015.c:0 "Share your power with me, beast. Bite!"
 ek_travel_events.4015.c.tt:0 "You become infected with [GetTrait('sanies_lupinus').GetName( GetNullCharacter )]!"
 ek_travel_events.4015.d: "Run, as fast as you can."
 ek_travel_events.4015.d.flavor: "You flee into the night, hiding away from the monster."

 ek_travel_events.4020.t:0 "$travel_danger_prefix$ Жуткая тварь"
 ek_travel_events.4020.desc:0 "Во время перехода через [ROOT.Char.GetCurrentLocation.GetTerrain.GetNameNoTooltip] провинции [ROOT.Char.GetCurrentLocation.GetName], я [Select_CString(ROOT.Char.IsFemale, 'наступила', 'наступил' )] на камень — и он оттолкнул меня. Сделав шаг назад и приготовившись к худшему, я, вместе с сопровождающими, [Select_CString(ROOT.Char.IsFemale, 'увидела', 'увидел' )], как «камень» встаёт и пытается ущипнуть меня за ногу.\n\nЭто оказался грязевой краб. В этой местности они нередки, но раздражают от этого ничуть не меньше."
 ek_travel_events.4020.a:0 "Время пришло, тварь."
 ek_travel_events.4020.a.success:0 "Вам удаётся прикончить грязевого краба"
 tooltip.ek_travel_events.4020.a.success:0 "Грязевой краб повержен!"
 ek_travel_events.4020.a.failure:0 "Грязевой краб побеждает в бою"
 tooltip.ek_travel_events.4020.a.failure:0 "Вы терпите поражение!"
 ek_travel_events.4020.a.failure.death.tt:0 "В самом деле?"
 ek_travel_events.4020.b:0 "Это же мой новый лучший друг!"
 ek_travel_events.4020.c:0 "Просто уйти."
 ek_travel_events.4020.c.flavor:0 "Обогнать грязевого краба должно быть несложно…"

 ek_travel_events.4025.t:0 "$travel_danger_prefix$ Вор!"
 ek_travel_events.4025.desc:0 "Я [Select_CString(ROOT.Char.IsFemale, 'продолжала', 'продолжал' )] свой путь дальше, вглубь провинции [ROOT.Char.GetCurrentLocation.GetName], и внезапно по моей спине прошёл холодок. Как только я [Select_CString(ROOT.Char.IsFemale, 'почувствовала', 'почувствовала' )] чьё-то тревожное присутствие где-то сзади, тишину пронзил угрожающий голос.\n\n«Короче, давай сюда все, что у тебя есть ценного, а то выпотрошу, как рыбку», — прошипел опасный незнакомец и, как ночной призрак, явился из теней."
 ek_travel_events.4025.a:0 "Вот, возьми, только оставь меня в покое."
 ek_travel_events.4025.b:0 "Я скорее умру!"
 ek_travel_events.4025.b.success:0 "Вы побеждаете вора"
 ek_travel_events.4025.b.failure:0 "Вор побеждает вас"
 ek_travel_events.4025.b.failure.death.tt:0 "Вор убивает вас"
 ek_travel_events.4025.c:0 "Уходи. Сейчас же."
 ek_travel_events.4025.c.success:0 "Вы угрожаете вору"
 ek_travel_events.4025.c.failure:0 "Вор не поддаётся угрозам" 
 ek_travel_events.4025.d:0 "А что, похоже, что у меня деньги есть?"
 ek_travel_events.4025.d.success:0 "Вы убеждаете вора"
 ek_travel_events.4025.d.failure:0 "Вор не убеждён"
 ek_travel_events.4025.failure.death.tt:0 "Вор убивает вас"
 ek_travel_events.4025.e:0 "У меня нет на это времени."

 ek_travel_events.4030.t:0 "$travel_danger_prefix$ Неприкаянные мертвецы"
 ek_travel_events.4030.desc:0 "В одном месте в провинции [ROOT.Char.GetCurrentLocation.GetName] стоял неприятный дух разложения. Здешние красоты сгинули под напором времени и мрака. Живые души сторонились этих земель, ибо они стали царством мёртвых.\n\nРаздался гулкий стон, а затем ещё один и ещё. Из мрака появились они: извращённые человеческие останки, с плотью, едва держащейся на ломких костях. В пустых глаза горел неественный голод. Они пристально смотрели на меня и моих спутников."
 ek_travel_events.4030.a:0 "Они обретут смерть и покой."
 ek_travel_events.4030.a.success:0 "Вы побеждаете нежить"
 ek_travel_events.4030.a.failure:0 "Нежить оказывается сильнее"
 ek_travel_events.4030.b:0 "Сгинь в огне очищающей магии!"
 ek_travel_events.4030.c: "Отныне они будут служить мне!"
 ek_travel_events.4030.d: "Именем [ROOT.GetCharacter.GetFaith.HighGodNamePossessive], отступаем!"
 ek_travel_events.4030.d.tt: "Вы бегите сквозь толпу нежити, бросая своих спутников."

 ek_travel_events.4035.t:0 "$travel_danger_prefix$ Песчаная буря!"
 ek_travel_events.4035.desc:0 "For those who brave the desert, peril lurks beyond hungry creatures, the scorching sun, and unrelenting thirst - it's the very sand itself. Suspended in the air by an abrupt storm, it carries the potential to engulf anything in its path, whether it be a structure, a caravan, or a solitary wanderer. I stand in awe, my heart pounding, as I behold such a tempest on the distant horizon, hurtling toward my location like a ferocious beast.\n\nIt may be wise the seek immediate shelter. However, waiting for it to subside might entail a lengthy delay in my travels."
 ek_travel_events.4035.a:0 "Push through this!"
 ek_travel_events.4035.a.success:0 "You survive the storm."
 ek_travel_events.4035.a.failure:0 "[dead_character.GetFirstNameNoTooltip|U] gets lost in the storm."
 ek_travel_events.4035.a.critical_failure:0 "Everyone perishes in the storm."
 ek_travel_events.4035.b:0 "Build a shelter and wait till the storm is over."

 ek_travel_events.4040.t: "$travel_danger_prefix$ Ливень"
 ek_travel_events.4040.intro: "Dark clouds have gathered over [current_location.GetName|U], and what starts as a light drizzle suddenly turns into a torrential downpour. Visibility fades, and all of Mundus seems to be swallowed by the storm.\n\n"
 ek_travel_events.4040.woodland: "The dense canopy above offers little protection as heavy raindrops drip through the leaves, soaking everything below. The scent of wet moss and bark fills the air, and the sound of water rushing through the undergrowth drowns out all else."
 ek_travel_events.4040.highland: "The winds howl through the rocky crags, and every step on the uneven terrain risks a slip or fall. Far below, streams swell into raging torrents, carving fresh paths through the valleys."
 ek_travel_events.4040.wetland: "The downpour quickly floods the marshes, turning shallow pools into deep, murky waters. The ground beneath my feet becomes a treacherous sludge, sucking at my boots with every step."
 ek_travel_events.4040.dryland: "The parched earth greedily drinks the rain, but the hardened ground cannot absorb it fast enough. Small rivulets form, carving paths through the cracked soil, while distant thunder rumbles across the open plains."
 ek_travel_events.4040.lowland: "Fields and roads vanish beneath pools of water as the earth becomes a vast mire of mud and standing rain. Crops bend under the weight of the storm, and distant rivers swell with the sudden deluge."
 ek_travel_events.4040.a: "It's just a bit of rain."
 ek_travel_events.4040.a.failure: "[ill_character.GetName] catches a cold in the rain"
 ek_travel_events.4040.b: "Refreshing to feel the water upon my scales!"
 ek_travel_events.4040.c: "Make shelter until it's over."

 ek_travel_events.4045.t: "$travel_danger_prefix$ A Hungry Rodent"
 ek_travel_events.4045.desc: "At first, it was barely noticeable, but now the pattern is undeniable - the camps provisions are vanishing, piece by piece. A loaf of bread here, a strip of dried meat there… No one has seen the culprit, yet faint tracks of little paws are imprinted in the dirt near the supplies.\n\nThere is no doubt: a skeever has infested the stores, growing bolder with each passing night."
 ek_travel_events.4045.a: "Cursed Vernim!"
 ek_travel_events.4045.b: "Buy a bunch of traps in the next town."
 ek_travel_events.4045.c: "I will catch that beast myself."
 ek_travel_events.4045.c.tt: "Catching the Skeever may lead to additional choices."

 ek_travel_events.4046.t: "Captured Rodent."
 ek_travel_events.4046.desc: "After keeping watch near the supplies for some time, I finally manage to confront the culprit - a scrawny skeever, just as I suspected - and drive it into a corner. It scurries frantically but finds no escape.\n\nDespite its reputation as a filthy pest, there’s something oddly endearing about the little creature as it trembles, its whiskers twitching nervously."
 ek_travel_events.4046.a: "Actually… I want to tame it."
 ek_travel_events.4046.b: "Just end it's life."
 ek_travel_events.4046.c: "Skeever can be eaten, too. Can it not?"

 ek_travel_events.4050.t: "$travel_danger_prefix$ Caught in the Trap"
 ek_travel_events.4050.desc: "The quiet of the camp is shattered by a sudden cry of pain. I turn just in time to see [wounded_character.GetName] collapse to the ground, clutching [wounded_character.GetHerHis] leg. A cruel set of rusted jaws is clamped tightly around [wounded_character.GetHerHis] calf - one of the skeever traps we set up to keep those pesky rodents away.\n\nI have no idea how [wounded_character.GetSheHe] managed to step into it, but blood now seeps between the jagged metal teeth. One thing is certain: [wounded_character.GetHerHis] leg won’t be walking anywhere for a while."
 ek_travel_events.4050.a: "Please, [physician.GetName] take a look at [wounded_character.GetHerHis] leg."  
 ek_travel_events.4050.a.success: "[physician.GetName] manages to heal the leg"
 ek_travel_events.4050.a.failure: "[physician.GetName] provides insufficient treatment"
 ek_travel_events.4050.b: "Thats nothing a bit of magic can't heal."
 ek_travel_events.4050.c: "Let's rest and give [wounded_character.GetHerHim] time to recover."
 ek_travel_events.4050.d: "We march on, try to keep up."
 ek_travel_events.4050.d.failure: "The leg gets infected"
 ek_travel_events.4050.d.critical_failure: "The leg gets infected beyond saving"

 ek_travel_events.4055.t: "$travel_danger_prefix$ The Bountyhunter"
 ek_travel_events.4055.desc: "The snap of a twig is my only warning before a figure steps from the shadows with [bountyhunter.GetHerHis] weapon drawn. "It wasn’t easy tracking you down," [bountyhunter.GetSheHe] says. "Let alone catching you on your own. But your bounty is worth a small fortune, making the effort worthwhile. Dead or alive, makes no difference to me. So, the choice is yours."\n\nI instinctively reach for my own weapon. There’s indeed no one else around - just me and this hunter, who seemingly knows [bountyhunter.GetHerHis] craft all too well."
 ek_travel_events.4055.a: "Thats a hefty sum on my head. How about I pay it to you?"
 ek_travel_events.4055.b: "Heres an idea: take the gold and leave me alone."
 ek_travel_events.4055.c: "You are a skillfull [bountyhunter.GetWomenMan]. Why not join forces?"
 ek_travel_events.4055.c.success: "[bountyhunter.GetName] joins your camp"
 ek_travel_events.4055.c.failure: "[bountyhunter.GetName] refuses and attacks"
 ek_travel_events.4055.d: "I submit. Take me to jail."
 ek_travel_events.4055.e: "You won't take me alive!"
 ek_travel_events.4055.duel.tt:0 "@death_icon! [bountyhunter.GetFirstName] and you will fight to the death."

 ek_travel_events.4056.t: "Bountyhunters End"
 ek_travel_events.4056.desc: "The fight is over. [bountyhunter.GetName] lies motionless, [bountyhunter.GetHerHis] weapon slipping from [bountyhunter.GetHerHis] grasp. It was a hard-fought duel, but in the end, only one of us could walk away.\n\nI take a deep breath, steadying myself. The bounty hunter’s pursuit ends here."
 ek_travel_events.4056.a: "[bountyhunter.GetSheHE|U] put up a good fight."

### Highrock
# Highrock Flavor
 ek_travel_events_highrock.0001.t:0 "$travel_event_prefix$ Народ Гленумбры"
 ek_travel_events_highrock.0001.desc:0 "Путешествующий по Гленумбре неминуемо увидит поразительное разнообразие этого региона. Дения, испытывающая сильное влияние Даггерфолла, чествует «одержимость приключениями» и воспитывает дух независимости. В её лесах живёт религиозная общность, [GetReligionByKey('wyrd_religion').GetAdherentNamePlural], поклоняющиеся природе.\n\nВ Камбрейских холмах, на которых раскинулся Камлорн, можно наблюдать целую смесь бретонских культур. Местное население славится ремёслами и искусством, а их культуру обогащают истории о призраках и глубокие традиции. В Королевском Кордоне, регионе, защищённом горной цепью, расположился Кроссвич, кипящий жизнью перекрёсток торговых путей, где обитает множество охотников и придорожных грабителей."
 ek_travel_events_highrock.0001.a:0 "Какой многоликий народ! Я хочу знать о нём больше."
 ek_travel_events_highrock.0001.b:0 "Грабители? Не будем задерживаться!"

 ek_travel_events_highrock.0005.t:0 "$travel_event_prefix$ Скалы Бетони"
 ek_travel_events_highrock.0005.desc:0 "Больше всего на острове Бетони меня поразили скалы на его берегах: высокие и непреклонные. Эти исполины заслужили свою славу, отвадив от острова множество врагов. В старинные времена на Бетони ходила легенда о грозном каменном чудище, которое метало в море острые скалы, губя опрометчивых моряков. И хотя этот миф далёк от правды, скалы от этого не становятся менее величественными.\n\nСреди естественных укреплений надёжно укрыт гордый бастион королей Бетони — крепость Небесного Пика, построенная во времена правления Ремана II. Она — зеркало истории острова, и из неё было отражено множество атак."
 ek_travel_events_highrock.0005.a:0 "Выдающаяся фортификация! Нужно это изучить."
 ek_travel_events_highrock.0005.b:0 "Продолжим путь…"
 
# Highrock Danger
 ek_travel_events_highrock.4000.t:0 "$travel_danger_prefix$ Колдуньи Ведьминой топи"
 ek_travel_events_highrock.4000.desc:0 "Путешествуя по провинции [ROOT.Char.GetCurrentLocation.GetName], я случайно [Select_CString(ROOT.Char.IsFemale, 'обнаружила', 'обнаружил')] себя среди Ведьминых топей — обстоятельство весьма досадное. Пока я осторожно [Select_CString(ROOT.Char.IsFemale, 'искала', 'искал')] обратный путь, я ненамеренно [Select_CString(ROOT.Char.IsFemale, 'наступила', 'наступил')] на ветку, издавшую звонкий хруст, чем привлёк внимание местных ведьм.\n\nЭтих весьма необычных на вид, и даже уродливых, колдуний с посохами, кажется, оскорбило моё присутствие. Через некоторое время я уже [Select_CString(ROOT.Char.IsFemale, 'улепётывала', 'улепётывал')], оставив в топях часть снаряжения. Ведьмы продолжали преследовать меня, пока я [Select_CString(ROOT.Char.IsFemale, 'удирала', 'удирал')], стремясь попутно не угодить в пасть к крокодилам.\n\nВоздух сотрясали их смешки и проклятия. Нужно было оторваться от болотных ведьм и выбраться из этой коварной трясины."
 ek_travel_events_highrock.4000.a:0 "Хватит убегать, приготовиться к бою!"
 ek_travel_events_highrock.4000.a.success:0 "Вы выбрались и остались живы"
 ek_travel_events_highrock.4000.a.failure:0 "Ведьмы оказались сильнее"
 ek_travel_events_highrock.4000.b:0 "Возможно, если я проявлю интерес к их образу жизни…"
 ek_travel_events_highrock.4000.c:0 "Бежать! Бежать без оглядки!"

 ek_travel_events_highrock.4005.t:0 "$travel_danger_prefix$ Пернатые твари"
 ek_travel_events_highrock.4005.desc:0 "На пути через провинцию [ROOT.Char.GetCurrentLocation.GetName], нас поджидала опасная встреча: внезапно напали агрессивные гарпии.\n\nЭти крылатые твари представляют серьёзную опасность на дороге." 
 ek_travel_events_highrock.4005.a:0 "Я преподам вам урок!"
 ek_travel_events_highrock.4005.a.success:0 "Вы побеждаете гарпий"
 ek_travel_events_highrock.4005.a.failure:0 "Гарпии оказываются сильнее"
 ek_travel_events_highrock.4005.b:0 "Стража, расчистить дорогу!"
 ek_travel_events_highrock.4005.b.t:0 "Наёмники, которых вы наняли, позаботятся о проблеме."
 ek_travel_events_highrock.4005.c:0 "Я взорву их!"
 ek_travel_events_highrock.4005.c.flavor:0 "Прогнать тварей, используя магию разрушения."
 ek_travel_events_highrock.4005.d:0 "Скорее, бежим!"

# Highrock Location
 ek_travel_events_highrock.8000.t:0 "$travel_event_prefix$ Кристалл Башни"
 ek_travel_events_highrock.8000.desc:0 "Кристальная башня, символ альтмерского наследия, возвышающийся на севере Саммерсета. Её венчает Прозрачный Закон, таинственный кристалл, благодаря которому башня защищает Саммерсет невидимой аурой, свойства которой уходят корнями в древнюю альдмерскую мудрость. Башня и Прозрачный Закон являются памятниками раннеальдмерских поселенцев и эльфийского единства и воплощают собой прозрачность и принципы управления государством.\n\nХотя точная природа Прозрачного Закона является предметом дискуссий среди учёных, некоторые верят, что он отражает собой альтмерские идеалы и усиливает безопасность острова, создавая уникальную связь между народом альтмеров и их башней. Другие обосновывают его свойства древней альдмерской магией — загадка, которая остаётся нераскрытой."
 ek_travel_events_highrock.8000.a:0 "Его магические свойства заслуживают пристального изучения."
 ek_travel_events_highrock.8000.b:0 "Я [Select_CString(ROOT.Char.IsFemale, 'должна', 'должен')] обсудить его культурную значимость с местными учёными."
 ek_travel_events_highrock.8000.c:0 "Вид красивый, но мы торопимся."

 ek_travel_events_highrock.8005.t:0 "$travel_event_prefix$ Жемчужина залива"
 ek_travel_events_highrock.8005.desc:0 "Вэйрест, жемчужина западного Тамриэля может похвастаться как блистательным прошлым, так и великолепным настоящим. Он считается вершиной бретонской культуры и своим сиянием затмевает все остальные города в Хай-Роке.\n\nЕго улицы резонируют с эхом гениальных умов, нашедших отражение в городской архитектуре, крышах с фронтонами и бурлящих жизнью рынках. В отличие от даггерфольцев, жители Вэйреста любят свою историю, но не захвачены ей с головой.\n\nВизит в Вэйрест пропитан духом современности, но при этом город наделён очарованием тысячелетней цивилизации."
 ek_travel_events_highrock.8005.a:0 "Поистине, один из выдающихся городов нашего времени."

 ek_travel_events_highrock.8010.t:0 "$travel_event_prefix$ Славный Баламат"
 ek_travel_events_highrock.8010.desc:0 "Эхо истории провинции [ROOT.Char.GetCurrentLocation.GetName] пело в её ветрах, пока мы путешествовали через эти земли. Среди древних камней и корявых сучьев великие ветра нашёптывали сказания о давно усопших королях-мудрецах. Одинокие колонны и велкиндские реликвии, отрицая ход времени, стояли и напоминали об их мудрости.\n\nНад арками, изогнутыми словно натянутая тетива, простиралось бескрайнее небо, в вышине которого ревели величайшие бури, которые, будто дикие звери, жаждали усмирения. Здесь сокрытое ущелье хранит тайны древнего #LORE [Concept( 'compendium_aldmeris', 'Альдмериса' )]#!, запечатанные внутри его затерянных глубин."
 ek_travel_events_highrock.8010.a:0 "Мне не терпится разгадать эти тайны!"
 ek_travel_events_cyrodiil.8005.b:0 "Увы, у меня нет времени."

 ek_travel_events_highrock.8015.t:0 "$travel_event_prefix$ Слёзы Анурраме"
 ek_travel_events_highrock.8015.desc:0 "I came across Erokii's ancient ruins, once a splendid city. Its story revolves around Princess Anurraame, celebrated for her beauty and wisdom. To forge alliances, she married a distant prince, but as love dwindled, she found solace in a young champion from her city.\n\nHer indiscretion led to a siege by her husband, fueled by rage. Seeking aid from her lover, she was betrayed for riches. Desperate, she turned to Mephala, who created the Tear of Anurraame from her hatred-fueled tears. She then unleashed its power, obliterating the city and its armies. Now, only a crypt remains, hiding the elusive Tear, waiting to be uncovered."
 ek_travel_events_highrock.8015.a:0 "I will uncover it!"
 ek_travel_events_highrock.8015.b:0 "Rather fascinating bit of history!"
 ek_travel_events_highrock.8015.c:0 "Ну и ну, очередные айлейдские руины…"

 ek_travel_events_highrock.8020.t:0 "$travel_event_prefix$ Ода сторожевой башне"
 ek_travel_events_highrock.8020.desc:0 "В своих странствиях через [ROOT.Char.GetCurrentLocation.GetTerrain.GetNameNoTooltip] я [Select_CString(ROOT.Char.IsFemale, 'натолкнулась', 'натолкнулся' )] на заброшенные развалины сторожевой башни. Древняя каменная кладка разрушилась, каменные блоки потрескались и сломались. В этом меланхоличном пейзаже я [Select_CString(ROOT.Char.IsFemale, 'узрела', 'узрел' )] отражение собственного изнурённого духа.\n\nБыть может, некогда эта обезлюдевшая постройка была символом надежды, но теперь она воплощает утраченные возможности и забытые мечты. Оглядывая руины, я не [Select_CString(ROOT.Char.IsFemale, 'могла', 'мог' )] не задуматься о неумолимом ходе времени и неизбежности разрушения."
 ek_travel_events_highrock.8020.a:0 "Нужно всегда быть наготове к превратностям судьбы!"
 ek_travel_events_highrock.8020.b:0 "Это была бы прекрасная башня, если бы за ней ухаживали…"
 ek_travel_events_highrock.8020.c:0 "Не будем здесь задерживаться."

### Hammerfell
# Hammerfell Flavor
 ek_travel_events_hammerfell.0001.t:0 "$travel_event_prefix$ The Knowledge of the Sand"
 ek_travel_events_hammerfell.0001.desc:0 "Among all the places in Tamriel, the Alik'r desert stands out as one of the most adept at safeguarding its secrets. Entire civilizations lie entombed beneath the shifting sands, and the winds that sweep through the dunes carry with them the forgotten prayers and thoughts of lost wanderers.\n\nYet, there is even more to this mysterious land than that. Every traveler who ventures through the Alik'r is acquainted with the peculiar crimson mist that emerges from the sands in the morning, only to vanish by noon. This eerie mist appears to be a manifestation of the magical properties of the stone, which has been weathered into the fine sand of the Alik'r over countless ages. I find myself pondering the possibility of harnessing this phenomenon with further study."
 ek_travel_events_hammerfell.0001.a:0 "Spend more time on the mysteries of sand."
 ek_travel_events_hammerfell.0001.a.success:0 "You extract some Arcana from the desert."
 ek_travel_events_hammerfell.0001.a.failure:0 "The sand eludes you."
 ek_travel_events_hammerfell.0001.b:0 "I would rather continue my journey."

 ek_travel_events_hammerfell.0005.t:0 "$travel_event_prefix$ 'On the Immortality of Dust'"
 ek_travel_events_hammerfell.0005.desc:0 "The Alik'r Desert may be a perilous expanse, but it possesses its own unique allure. At least to [peot_character.GetFirstName], this arid realm seems to hold a distinct charm. I can see [poet_character.GetHerHim] being inspired by this surroudning as [poet_character.GetSheHe] draws near me and suddenly readies [poet_character.GetHerselfHimself] to recite with eloquence:\n\n'A sacred flame rises above the fire,\nThe ghosts of great men and women without names,\nCities long dead rise and fall in the flame,\nThe Dioscori Song of Revelation,\nBursting walls and deathless rock,\nFiery sand that heals and destroys.'\n\nWith a gentle smile, [poet_character.GetSheHe] elucidates, "This is a verse penned by Weltan of Sentinel, celebrating the Alik’r. It's quite beautiful, wouldn't you agree?""
 ek_travel_events_hammerfell.0005.a:0 "Teach me to write something like that."
 ek_travel_events_hammerfell.0005.a.success:0 "You develop a sense for poetry in the desert."
 ek_travel_events_hammerfell.0005.a.failure:0 "Your lyrical efforts are fruitless."
 ek_travel_events_hammerfell.0005.b:0 "You are right, it's exquisite."
 ek_travel_events_hammerfell.0005.c:0 "I don't really care about poetry."

# Hammerfell Danger
 ek_travel_events_hammerfell.4000.t:0 "$travel_danger_prefix$ Duneripper Attack!"
 ek_travel_events_hammerfell.4000.desc:0 "It happened in the blink of an eye. One moment, we were making good progress under the scorching sun of the Alik'r desert, and in the next, the sand beneath our very feet started to whirl, eventually giving birth to a creature that few are ever unfortunate enough to witness:\n\nThis monstrous entity had a shoulder height equivalent to that of a fully grown horse and was three times as long. With massive claws, it sent sand into the air and boasted an enormous gaping maw, poised to engulf its prey whole.\n\nA duneripper!"
 ek_travel_events_hammerfell.4000.a:0 "Gather around me, fight back!"
 ek_travel_events_hammerfell.4000.a.success:0 "You manage to drive the beast off."
 ek_travel_events_hammerfell.4000.a.failure:0 "[duneripper_food.GetFirstNameNoTooltip|U] was snatched by the duneripper."
 ek_travel_events_hammerfell.4000.b:0 "I bring that beast down!"
 ek_travel_events_hammerfell.4000.b.success:0 "You slay the duneripper."
 ek_travel_events_hammerfell.4000.b.failure:0 "You are killed by the duneripper."
 ek_travel_events_hammerfell.4000.c:0 "Run and hide."
 ek_travel_events_hammerfell.4000.c.t:0 "Someone else might be killed by the duneripper."

 ek_travel_events_hammerfell.4005.t:0 "$travel_danger_prefix$ The Price of Water"
 ek_travel_events_hammerfell.4005.desc:0 "During a stop at an oasis to replenish my water reserves, I am suddenly confronted by a peculiar creature. It's half snake and half woman, adorned with exotic jewelry and armed with long, menacing claws, all set beneath a scaly face with two cunning eyes. A desert Lamia!\n\nTo my even greater surprise, the creature begins to speak. Its forked tongue makes it a bit challenging to understand, but it becomes clear that the Lamia wants some form of payment for the water I've just taken, as she considers it her own. Considering her apparent fondness for expensive jewelry, offering some gold may suffice to appease her, if I wish to avoid violence, that is."
 ek_travel_events_hammerfell.4005.a:0 "Pay the Lamia."
 ek_travel_events_hammerfell.4005.b:0 "I pay only in steel, beast!"
 ek_travel_events_hammerfell.4005.b.success:0 "You slay the Lamia."
 ek_travel_events_hammerfell.4005.b.failure:0 "You are killed by the Lamia."
 ek_travel_events_hammerfell.4005.c:0 "Guards, take care of this."
 ek_travel_events_hammerfell.4005.c.t:0 "The Lamia will be driven off by your mercenary guards."

 ek_travel_events_hammerfell.4010.t:0 "$travel_danger_prefix$ A Scorpions Sting"
 ek_travel_events_hammerfell.4010.desc:0 "The scorpions of Hammerfell are feared even beyond the borders of the country. Those dwelling deep in the Alik’r desert are rumored to grow as large as horses and pose a well-known danger to unwary travelers. However, the smaller ones can be equally deadly, as [unlucky_character.GetFirstName] is just about to discover. Without a warning, [unlucky_character.GetSheHe] screams in pain and collapses to the ground, and I can only take a glimpse of a scorpion scurrying away after injecting its deadly poison into [unlucky_character.GetHerHis] veins.\n\nWithout immediate assistance, [unlucky_character.GetFirstNameNoTooltip] is likely to die at the spot."
 ek_travel_events_hammerfell.4010.a:0 "I know a spell against that poison!"
 ek_travel_events_hammerfell.4010.b:0 "[traveling_court_physician.GetFirstName|U] help [unlucky_character.GetHerHim]!"
 ek_travel_events_hammerfell.4010.c:0 "That scorpion would make for a lovely pet."
 ek_travel_events_hammerfell.4010.c.success:0 "You catch the scorpion."
 ek_travel_events_hammerfell.4010.c.failure:0 "The scorpion eludes you."
 ek_travel_events_hammerfell.4010.d:0 "There is nothing that can be done…"

 ek_travel_events_hammerfell.4015.t:0 "$travel_danger_prefix$ Shifting Sands"
 ek_travel_events_hammerfell.4015.desc:0 "No one can deny the strangeness of the Alik’r. It's as if the desert itself is a living, breathing entity, an elusive and ever-changing presence that defies the comprehension of any ordinary mind. The dunes appear to shift when I'm not looking, the strangely warm wind abruptly changes direction, and even the sand beneath my feet seems to move. During the day, an eerie red mist often obscures the sun, while at night, clouds of swirling sand blot out the sky which makes it hard to find any point of orientation.\n\nI now understand how easy it is to become disoriented in this place. If I don't tread carefully, it may be quite some time before I can find my way out again."
 ek_travel_events_hammerfell.4015.a:0 "I am already lost."
 ek_travel_events_hammerfell.4015.b:0 "[caravan_master.GetFirstName|U] do you know the way?"
 ek_travel_events_hammerfell.4015.c:0 "Good thing we have [desert_warrior_character.GetFirstName] with us."

# Hammerfell Location
 ek_travel_events_hammerfell.8000.t:0 "$travel_event_prefix$ Древнейший узник"
 ek_travel_events_hammerfell.8000.desc:0 "Во время путешествия через провинцию [ROOT.Char.GetCurrentLocation.GetName] удивительное зрелище открылось моим глазам: в мистической темнице томилась печальная пленённая душа — [prisoner.GetFirstName]. [prisoner.GetSheHe|U] [Select_CString(prisoner.IsFemale, 'поведала', 'поведала' )] мне историю о плене и рабстве у могущественного мага древности.\n\nЯ могу помочь [prisoner.GetHerHim], но мне нужно будет расшифровать заклятие, при помощи которого [prisoner.GetFirstNameNoTooltip] [Select_CString(prisoner.IsFemale, 'была заточена', 'был заточён' )]. Как [prisoner.GetSheHe] говорит, заклятие это невероятно сложное, и до сих пор никому это не удавалось. [prisoner.GetSheHe|U] также обещает в случае успеха рассказать, где лежат сокровища древнего мага."
 ek_travel_events_hammerfell.8000.a:0 "Я хочу знать, где сокровища!"
 ek_travel_events_hammerfell.8000.a.tt:0 "Вы расшифровываете заклятие"
 ek_travel_events_hammerfell.8000.a.tt_fail:0 "Вы зря тратите время и решаете бросить эту затею"
 ek_travel_events_hammerfell.8000.b:0 "Плевать на сокровища, идём вместе!"
 ek_travel_events_hammerfell.8000.c:0 "Возможно, на обратном пути…"

 ek_travel_events_hammerfell.8005.t:0 "$travel_event_prefix$ Жемчужина Алик'ра"
 ek_travel_events_hammerfell.8005.desc:0 "В древности Ра Гада Предшественников приплыла из Йокуды, высадившись в Хегате. Они освободили его от местных враждебно настроенных обитателей, затем двинулись исследовать берег и обнаружили место будущего города Сентинель, процветающий причал, изобилующий фруктовыми деревьями.\n\nСановник Яхуб решил выбрать это место своим домом, он основал Сентинель и, наняв местных жителей, выстроил могучий город.\n\nСегодня в честь Яхуба на знамени Сентинеля изображён полумесяц. Жители также отмечают праздник Куму Алезер'и Яхуб, на котором по обычаю делятся гранатами."
 ek_travel_events_hammerfell.8005.a:0 "Изобилующий фруктовыми деревьями? Звучит интересно."
 ek_travel_events_hammerfell.8005.b:0 "У тактик Ра Гада может быть полезное применение…"
 ek_travel_events_hammerfell.8005.c:0 "Меня больше занимает продолжение путешествия."

### Valenwood
# Valenwood Flavor
 ek_travel_events_valenwood.0001.t:0 "$travel_event_prefix$ Kollopi Harvesting"
 ek_travel_events_valenwood.0001.desc:0 "Many dangers and secrets lie concealed within the depths of Valenwood, but there are also wondrous sights to behold that remain unseen by those who never dare to explore this treacherous green expanse.\n\nThe spectacle my traveling group stumbles upon is one of these wonders: a gathering of Imga during their renowned Kollopi Harvest. The Kollopi, small rodents that reside on the outermost branches of graht oak trees, can only be reached by the most agile individuals, who skillfully leap between the slender branches. It's a remarkable display of dexterity."
 ek_travel_events_valenwood.0001.a:0 "Stay a while and watch the spectacle."
 ek_travel_events_valenwood.0001.b:0 "I want to join in!"
 ek_travel_events_valenwood.0001.b.success:0 "You impress the Imga"
 ek_travel_events_valenwood.0001.b.failure:0 "You fail and hurt yourself"
 ek_travel_events_valenwood.0001.c:0 "Whats the point? Move on."

 ek_travel_events_valenwood.0002.t:0 "$travel_event_prefix$ The Kollopi Feast"
 ek_travel_events_valenwood.0002.desc:0 "To everyone's surprise, you not only show skills equal to the Imga, but you even surpass some of them. You reach out to branches so distant that even the elusive Kollopi had believed themselves safe there. With your assistance, the Apemen manage to collect such a substantial number of Kollopi that they extend an invitation for you to stay and join them in their upcoming feast.\n\nThis is undoubtedly a tremendous honor, but it would also mean a further delay in my journey. Alternatively, I could propose the idea of having one of them accompany me on my travels to gain a deeper understanding of their culture."
 ek_travel_events_valenwood.0002.a:0 "Join the Feast."
 ek_travel_events_valenwood.0002.b:0 "Recruit one of the Harvesters."
 ek_travel_events_valenwood.0002.c:0 "That was fun, but it's time to go now."

 ek_travel_events_valenwood.0015.t:0 "$travel_event_prefix$ Древесная архитектура"
 ek_travel_events_valenwood.0015.desc:0 "Тот, кто побывал в этой удивительной провинции, не мог не поразиться занимательным парадоксом местной архитектуры. Договор ветви и листа, запрещающий причинять урон деревьям, любому архитектору показался бы непреодолимой преградой. Но местные [architect.GetFaith.GetAdherentNamePlural], благодаря этим, как кажется, абсурдным ограничениям, выработали уникальную разновидность искусства и ремесла, которую можно повсюду наблюдать в их поселениях.\n\nВстреча с местным архитектором по имени [architect.GetFirstName] и [architect.GetHerHis] рассказ о мастерской адаптации к этим самоограничениям меня невероятно впечатлили. [architect.GetSheHe|U] объяснила, как [architect.GetHerHis] народ нашёл способы не просто выживать, но и процветать, живя в этой земле беспрекословных правил и обожания к деревьям. "
 ek_travel_events_valenwood.0015.a:0 "Мы многому можем у них научиться!"
 ek_travel_events_valenwood.0015.b:0 "К счастью, нам это всё не нужно."

 ek_travel_events_valenwood.0005.t:0 "$travel_event_prefix$ Предания сказителей"
 ek_travel_events_valenwood.0005.desc:0 "Сказители занимают уникальную, мистическую роль в сердце босмерского общества. Их завораживающее повествование сплетается в яркие истории, которые глубоко резонируют в душе тех, кто их слушает. Они вызывают сильный эмоциональный отклик и формируют глубокие связи.\n\nХотя лишь немногие из них умеют создавать неотличимые от реальности иллюзии, все босмеры-сказители — прирождённые рассказчики, плетущие роскошные полотна из легенд их богатой культуры.\n\n[spinner.GetFirstName], [Select_CString(spinner.IsFemale, 'одна', 'один')] из таких сказителей, [Select_CString(spinner.IsFemale, 'предложила ', 'предложил')] нашей группе послушать историю. Мы остались восхищённо слушать."
 ek_travel_events_valenwood.0005.a:0 "Можете рассказать что-то ещё, пожалуйста?"
 ek_travel_events_valenwood.0005.b:0 "Можно ли этому научиться?"
 ek_travel_events_valenwood.0005.c:0 "Хватит с меня!"

# Valenwood Danger
 ek_travel_events_valenwood.4000.t:0 "$travel_danger_prefix$ A Horrible Awakening"
 ek_travel_events_valenwood.4000.desc:0 "I really needed some sleep after a long day of travel, but something awakens me in the middle of the night. There is a heavy weight resting on my chest; I can't move and can barely breathe. For a brief moment, it all seems like a bad dream, but then a stream of moonlight falls through an opening in my tent. What I see is worse than any nightmare:\n\nA giant tick - a Hoarvor - sits on my chest, slowly drinking my blood from an open wound, numbed by the creature's poison. I have no idea how much blood I already lost on that monster but I feel severely weakened, and if I don't act quickly, this night might be my last."
 ek_travel_events_valenwood.4000.a:0 "Get off me, you beast!"
 ek_travel_events_valenwood.4000.a.success:0 "You manage to shake the Hoarvor off"
 ek_travel_events_valenwood.4000.a.failure:0 "The creature will satisfy it's thirst on your blood"
 ek_travel_events_valenwood.4000.b:0 "Blast it into pieces!"
 ek_travel_events_valenwood.4000.c:0 "Scream for help, as loud as you can."

 ek_travel_events_valenwood.4005.t:0 "$travel_danger_prefix$ Winged Mimics"
 ek_travel_events_valenwood.4005.desc:0 "I expected to see and hear many strange things during my travel through the thick undergrowth of Valenwood, but the weird creatures gathering above my head now are exceeding my wildest expectations. They resemble legless birds with swollen bellies and menacing glowing eyes. However, it's not their appearance that disturbs me the most; it's their endless chatter. In fact, they seem to repeat every word I've spoken in the last few hours in a mocking tone, mixing my sentences into a confusing gibberish.\n\nIt's really taking a toll on my nerves, and screaming at them only seems to make things worse. If I don't manage to get rid of them, I'll have to endure their presence for many more days, and I don't know if I am able to take much more of that."
 ek_travel_events_valenwood.4005.a:0 "Just try to ignore them."
 ek_travel_events_valenwood.4005.b:0 "[hunter_character.GetFirstNameNoTooltip|U] you are a hunter, shoot them down."
 ek_travel_events_valenwood.4005.b.success:0 "[hunter_character.GetFirstNameNoTooltip|U] shoots down the mimics"
 ek_travel_events_valenwood.4005.b.failure:0 "[hunter_character.GetFirstNameNoTooltip|U] misses the mimics"
 ek_travel_events_valenwood.4005.c:0 "Those beasts have picked the wrong target!"
 ek_travel_events_valenwood.4005.c.success:0 "You shoot down the mimics"
 ek_travel_events_valenwood.4005.c.failure:0 "You miss the mimics"

 ek_travel_events_valenwood.4010.t:0 "$travel_danger_prefix$ Death from Above"
 ek_travel_events_valenwood.4010.desc:0 "It really came out of nothing. In one moment, [unlucky_character.GetFirstName] was chatting with me as we wander in the shadow of a giant graht-oak, and in the next, [unlucky_character.GetHerHis] head gets smashed in by a heavy object, and [unlucky_character.GetSheHe] falls down without the time to even make a noise.\n\nI stand there, shocked, not sure if we are under attack until I fully realize what happened: a giant seed capsule was falling from the tree's twigs above us, hitting [unlucky_character.GetFirstNameNoTooltip] right on the head. [unlucky_character.GetHerHis|U] death was  as sudden as it is final, and there is nothing we can do for [unlucky_character.GetHerHim] anymore."
 ek_travel_events_valenwood.4010.a:0 "Cover your heads, there may be more of that!"

 ek_travel_events_valenwood.4015.t:0 "$travel_danger_prefix$ Murderous Plants"
 ek_travel_events_valenwood.4015.desc:0 "Valenwood is really no place to be careless. This realm operates by its own unique logic and laws, and it seems that even the flora here can be deadly. What appeared to be a harmless vine suddenly springs to life as we pass by, seizing [strangled_character.GetFirstName] and pulling [strangled_character.GetHerHim] into the undergrowth. As I rush to [strangled_character.GetHerHis] aid with my weapon drawn, I realize [strangled_character.GetSheHe]'s caught by a strangler, a carnivorous plant with long, thorny tentacles. I'm cautious about approaching that murderous piece of vegetation, to avoid my own demise, but if no one intervenes, [strangled_character.GetFirstNameNoTooltip] will be suffocated on the spot, and [strangled_character.GetHerHis] body will only serve to further enrich Valenwood's soil."
 ek_travel_events_valenwood.4015.a:0 "I cut you free!"
 ek_travel_events_valenwood.4015.a.success:0 "You manage to rescue [strangled_character.GetFirstNameNoTooltip]"
 ek_travel_events_valenwood.4015.a.failure:0 "You fail to rescue [strangled_character.GetFirstNameNoTooltip]"
 ek_travel_events_valenwood.4015.b:0 "[prowess_character.GetFirstNameNoTooltip|U] help [strangled_character.GetHerHim]!"
 ek_travel_events_valenwood.4015.b.success:0 "[prowess_character.GetFirstNameNoTooltip|U] manages to rescue [strangled_character.GetFirstNameNoTooltip]"
 ek_travel_events_valenwood.4015.b.failure:0 "[prowess_character.GetFirstNameNoTooltip|U] fails to rescue [strangled_character.GetFirstNameNoTooltip]"
 ek_travel_events_valenwood.4015.c:0 "There is nothing we can do…"

 ek_travel_events_valenwood.4020.t:0 "$travel_danger_prefix$ Facing a Hollow"
 ek_travel_events_valenwood.4020.desc:0 "I had heard of the Hollow before: They were builders and architects from a foreign coast who attempted to construct a city in Valenwood, but perished centuries ago, turned into stone themselves. It's said that they now serve the Wilderking, who uses them as guardians of his realm.\n\nHowever, I had not expected to suddenly come face to face with a Hollow myself. But there it stands, menacingly blocking our path. It's impossible to discern any emotion from the crumbling face covered in moss, and the eyes are as empty as the name 'Hollow' implies. However, the way that entity moves and acts leaves no room for doubt: it sees us as a threat, and we have to either appease it, or prepare for a fight."
 ek_travel_events_valenwood.4020.a:0 "Pay your respect to that strange creature."
 ek_travel_events_valenwood.4020.b:0 "Don't hurt us, [wilderking_character.GetFirstNameNoTooltip] follows your god as well!"
 ek_travel_events_valenwood.4020.c:0 "Let's see how tough that thing really is…"
 ek_travel_events_valenwood.4020.c.success:0 "You overcome the Hollow"
 ek_travel_events_valenwood.4020.c.failure:0 "This foe proves to be too much for you"

# Valenwood Location
 ek_travel_events_valenwood.8000.t:0 "$travel_event_prefix$ Ode to the Elden Tree"
 ek_travel_events_valenwood.8000.desc:0 "My journey brings me to the heart of Valenwood, where the ancient Elden Tree stands as a testament to the ages. Its roots delve deep into history, its branches stretch into myth. The shapers, guardians of growth, work around its immense base, tending to the young saplings with reverence, but to the Elden Tree itself, they do not dare extend their touch.\n\nThe air hums with the whispered wisdom of the owl perched on a high limb and the silent slither of the snake along the trunk. Fey and beast alike move through the shadows cast by the great tree, each taking a moment to acknowledge its grandeur. In the Elden Tree's embrace, the world's storms are stilled and the noise of conflict is quelled."
 ek_travel_events_valenwood.8000.a:0 "Meditate on the Elden Tree's power."
 ek_travel_events_valenwood.8000.b:0 "Observe the shapers' diligence."
 ek_travel_events_valenwood.8000.c:0 "Rest beneath the sprawling boughs."
 ek_travel_events_valenwood.8000.d:0 "Move on without looking back."

### Blackmarsh
# Blackmarsh Flavor
 ek_travel_events_blackmarsh.0001.t:0 "$travel_event_prefix$ Гидеон и граница"
 ek_travel_events_blackmarsh.0001.desc:0 "Дорога привела меня в Гидеон, регион, в котором смешались айлейдская, имперская, котрингская и аргонианская культуры. К моему счастью, мне [Select_CString(local.IsFemale, 'встретилась', 'встретился')] [local.GetFirstName], [Select_CString(local.IsFemale, 'которая рада была', 'который рад был')] поведать мне больше об этом.\n\nНесмотря на космополитическую традицию этого региона, его преимущественно населяют аргониане. Будучи долгое время подверженными сиродильскому влиянию, они адаптировали свой язык, обычаи и манеру ведения торговли, пожертвовав древними традициями. Они относятся к чужеземцам с подозрением из-за долгой истории приграничных конфликтов. Завести с этими аргонианами дружбу непросто."
 ek_travel_events_blackmarsh.0001.a:0 "Как эти культуры так хорошо уживаются вместе?"
 ek_travel_events_blackmarsh.0001.b:0 "Заключить нужные союзы, должно быть, критически важно!"
 ek_travel_events_blackmarsh.0001.c:0 "Очень интересно, но надо поторапливаться."

 ek_travel_events_blackmarsh.0005.t:0 "$travel_event_prefix$ Племя алых грёз"
 ek_travel_events_blackmarsh.0005.desc:0 "В Чёрном Лесе аргониане, живущие у границы, творчески используют древние руины как убежища, благодаря их защитным свойствам. К примеру, племена алых грёз и хацлил укрываются в аргонианских и айлейдских во время засухи, проводя ритуалы с применением живицы, чтобы находить артефакты, которые затем применяют в быту."
 ek_travel_events_blackmarsh.0005.a:0 "Эти адаптивные стратегии заслуживают внимания."
 ek_travel_events_blackmarsh.0005.b:0 "Я как-нибудь вернусь, чтобы узнать об этом больше…"

 ek_travel_events_blackmarsh.0010.t:0 "$travel_event_prefix$ Речные гребни"
 ek_travel_events_blackmarsh.0010.desc:0 "В ходе путешествия вглубь Чернотопья мне повстречались скрытные нака-деш, иначе известные как речные гребни, племя аргониан, обязанных своим обликом Хисту и родным топям. Это племя гостеприимно, но при этом безразлично по отношению к чужеземцам. Живут они на затопленных болотах, где рыбачат необычным способом: при помощи щук-ошиджа.\n\nНесмотря на наши межкультурные различия и ограниченные контакты, встреча с этим племенем позволила мне с новой стороны увидеть разнообразие и уникальность аргонианских племён."
 ek_travel_events_blackmarsh.0010.a:0 "Навык межкультурного контакта весьма полезен…"
 ek_travel_events_blackmarsh.0010.b:0 "У меня нет времени на праздное шатание."

 ek_travel_events_blackmarsh.0015.t:0 "$travel_event_prefix$ Colorful Mating Dances"
 ek_travel_events_blackmarsh.0015.desc:0 "Traversing the treacherous swamps of Black Marsh, we all brace for the worst as we notice some strange lights not far from us shining through the trees. But as we carefully approach them, it soon becomes clear that there is no danger here – this time at least. Instead, we find a bunch of small creatures dancing through the air, displaying a range of beautiful colors and patterns. These small Swamp Jellies display some distant resemblance to the much larger Netch, with long tentacles under a gas-filled body.\n\nSeeing them move in some kind of complex mating dance, leaves even the most battle-hardened individual of my group stunned by this display of unexpected beauty."
 ek_travel_events_blackmarsh.0015.a:0 "A welcome distraction for a while."
 ek_travel_events_blackmarsh.0015.b:0 "Pretty, but we have to go on."

 ek_travel_events_blackmarsh.0020.t:0 "$travel_event_prefix$ The Ancestor Lizard"
 ek_travel_events_blackmarsh.0020.desc:0 "Black Marsh may be the homeland of my people, but even for us Argonians, it conceals mysteries and surprises. And so, my entire group comes to an abrupt halt as we spot a magnificent lizard observing us from a nearby tree. I instantly recognize it as one of the renowned ancestor lizards, the very same species that was shaped into the very own ancestors of my people by the Hist, many centuries ago.\n\nConfronted with such a sudden reminder of our history and the enduring role the Hist plays for our people, I can't help but feel a profound sense of humility and gratitude, sending shivers down my scales."
 ek_travel_events_blackmarsh.0020.a:0 "It is important to reflect our origin."
 ek_travel_events_blackmarsh.0020.b:0 "We have to focus on the future."

 ek_travel_events_blackmarsh.0025.t:0 "$travel_event_prefix$ The Making of Wading-Nests"
 ek_travel_events_blackmarsh.0025.desc:0 "In the Argonian tribal lands, I encountered a remarkable communal effort: the construction of wading-nest houses. This traditional undertaking began with the assembly of sturdy wooden stakes and the creation of a foundation by crafting a floor across them. What set this practice apart was its communal nature, involving the entire tribe.\n\nRather than a solitary endeavor, the construction of these nests was a collective activity filled with purpose. The tribes saw it as essential for quick reconstruction in the face of floods and a source of communal enjoyment. It also facilitated knowledge transfer, with elders passing down vital skills to the younger generation. In this communal effort, the Argonians' unity and practical wisdom shone brightly."
 ek_travel_events_blackmarsh.0025.a:0 "I must dive into this shining example of union!"
 ek_travel_events_blackmarsh.0025.b:0 "What? No professional architects? How barbaric!"

 ek_travel_events_blackmarsh.0030.t:0 "$travel_event_prefix$ Межплеменные связи"
 ek_travel_events_blackmarsh.0030.desc:0 "Повидав в путешествиях множество аргонианских племён, я [Select_CString(ROOT.Char.IsFemale, 'обнаружила', 'обнаружил' )] одну их культурную особенность, которая обманывает ожидания. Несмотря на случаи насильственных конфликтов вроде налётов и стычек, аргониане из разных племён относятся друг к другу как к братьям и сёстрам по кладке. Фундаментом этих уз является история аргонианского единства в борьбе против захватчиков и то, как народ корня понимает взаимозависимость между племенами.\n\nКак [Select_CString(tribal.IsFemale, 'объяснила', 'объяснил' )] мне [tribal.GetFirstName], в этом играет роль и вера аргониан в перерождение души, которая воспитывает прощение и сплочённость. Такая выдающаяся способность отпускать конфликты может послужить уроком прощения и братства."
 ek_travel_events_blackmarsh.0030.a:0 "Вот оно — истинное прощение… Я хочу прочувствовать это подольше."
 ek_travel_events_blackmarsh.0030.b:0 "[tribal.GetFirstNameNoTooltip], расскажи нам больше!"
 ek_travel_events_blackmarsh.0030.c:0 "Эти варварские обычаи довольно странные…"

 ek_travel_events_blackmarsh.0035.t:0 "$travel_event_prefix$ Призрачный народ"
 ek_travel_events_blackmarsh.0035.desc:0 "Во время путешествия по провинции [ROOT.Char.GetCurrentLocation.GetName], [Select_CString(guide.IsFemale, 'наша проводница', 'наш проводник' )] внезапно [Select_CString(guide.IsFemale, 'остановилась', 'остановился' )], предупредив нас, что где-то неподалёку находится ужасный «Вискхлил-Тзел». После долгих уговоров и подкупов, [guide.GetSheHe] неохотно [Select_CString(guide.IsFemale, 'рассказала', 'рассказал' )] о вискхлил, «призрачном народе». Это загадочное племя аргониан, известное бледным цветом чешуек и зловещей репутацией. Они слывут «ворами мертвых» и похитителями тел. По ночам они выходят из мрака Глухой топи, чтобы поохотиться на неосторожных путников.\n\nРасспросив других местных, я [Select_CString(ROOT.Char.IsFemale, 'выяснила', 'выяснил' )], что этих таинственных аргониан также обвиняют в расхищении могил и воровстве душ умерших путём сотворения презренных ритуалов."
 ek_travel_events_blackmarsh.0035.a:0 "Меня должны бояться так же, как их."
 ek_travel_events_blackmarsh.0035.b:0 "Их скрытность внушает уважение!"
 ek_travel_events_blackmarsh.0035.c:0 "Давайте выбираться отсюда."

# Blackmarsh Danger
 ek_travel_events_blackmarsh.4000.t:0 "$travel_danger_prefix$ О вориплазмах"
 ek_travel_events_blackmarsh.4000.desc:0 "Сведения о вориплазмах от местных жителей поражают воображение. Рассказывают, что эти создания замечают жертву издалека, быстро сокращают дистанцию и поглощают её до того, как она успевает заметить опасность. Вскоре вориплазма срыгивает голые кости и отступает в своё прогретое солнцем логово. Эти невероятные слизеподобные существа не поддаются осмыслению традиционной наукой. Не имея видимых органов чувств и какой-либо анатомии, они выказывают невероятную подвижность и охотничью прыть, которые, как кажется, не соответствуют их примитивной природе.\n\nК сожалению, мой спутник, [attacked_character.GetFirstName], не успев это осознать, [Select_CString(attacked_character.IsFemale, 'оказалась', 'оказался')] жертвой вориплазмы и прямо сейчас она собирается [attacked_character.GetHerHis] переварить. Мне нужно действовать незамедлительно."
 ek_travel_events_blackmarsh.4000.a.success:0 "Вы успешно побеждаете вориплазму"
 ek_travel_events_blackmarsh.4000.a.failure:0 "Вориплазма оказывается сильнее"

 ek_travel_events_blackmarsh.4005.t:0 "$travel_danger_prefix$ Тощеболоты Чернотопья"
 ek_travel_events_blackmarsh.4005.desc:0 "Встретить тощеболота во мраке Чернотопья не так-то сложно, однако при этом эти создания не представляют серьёзной опасности для экспедиций, хотя, как правило, они обитают у наиболее любопытных мест в окрестности.\n\nПока [attacked_character.GetFirstName] [Select_CString(attacked_character.IsFemale, 'исследовала', 'исследовал')] встретившиеся нам на пути руины, [attacked_character.GetHerHis] застало врасплох одно из этих неуклюжих безголовых существ. Нужно быстро принять решение, от которого будет зависеть наша безопасность."
 ek_travel_events_blackmarsh.4005.a:0 "Ходячая куча компоста мне не ровня!"
 ek_travel_events_blackmarsh.4005.a.success:0 "Вы успешно побеждаете тощеболота"
 ek_travel_events_blackmarsh.4005.a.failure:0 "Тощеболот оказывается сильнее"
 ek_travel_events_blackmarsh.4005.b:0 "К оружию, [attacked_character.GetFirstNameNoTooltip] [Select_CString(ROOT.Char.IsFemale, 'должна быть спасена', 'должен быть спасён')]!"
 ek_travel_events_blackmarsh.4005.b:0 "Наёмники, которых вы наняли, возьмут на себя тощеболота и спасут атакованного персонажа по имени [attacked_character.GetFirstNameNoTooltip]."
 ek_travel_events_blackmarsh.4005.c:0 "Мне нужно спасаться!"

# Blackmarsh Location
 ek_travel_events_blackmarsh.8000.t:0 "$travel_event_prefix$ Разграбленные занмиры"
 ek_travel_events_blackmarsh.8000.desc:0 "На пути через руины в провинции [ROOT.Char.GetCurrentLocation.GetName] я наблюдаю реалии этих земель без прикрас. Ко мне подходит [scavenger.GetFirstName] и рассказывает о том, как выживает, словно жук-навозник, выискивая ценности среди останков наследия древних культур.\n\nЯ отмечаю, что слушаю рассказ [Select_CString(scavenger.IsFemale, 'расхитительницы', 'расхитителя')] о том, как [scavenger.GetSheHe] влачит свою жизнь, на фоне поразительных древних руин. В Зал-Итиксе находятся одни из древнейших занмиров Тенетопи. Я неторопливо проникаюсь будоражащей красотой этих заброшенных земель, которых ход времени и жадность проходимцев лишили древних артефактов, которыми они некогда были богаты."
 ek_travel_events_blackmarsh.8000.a:0 "Я предлагаю тебе милостыню и молитву."
 ek_travel_events_blackmarsh.8000.b:0 "Почему бы тебе не присоединиться к нам?"
 ek_travel_events_blackmarsh.8000.c:0 "Мне жаль это слышать."

 ek_travel_events_blackmarsh.8005.t:0 "$travel_event_prefix$ Ворота в Топи"
 ek_travel_events_blackmarsh.8005.desc:0 "Чернолесский тракт привёл меня к прекрасному городу Гидеон, месту, где встречаются Чёрный лес и Чернотопье. Это уникальное поселение привлекает звероловов, дровосеков, травников и охотников на экзотических зверей из близлежащих болот.\n\Некогда Гидеон был могучей имперской крепостью времён Второй империи, и часть его истории лишь предстоит отыскать среди старинных имперских руин и городских развалин. К особняку губернатора ведёт аллея, вдоль которой тянутся дома и ведётся торговля, — символ живого духа города."
 ek_travel_events_blackmarsh.8005.a:0 "Это важный торговый узел!"
 ek_travel_events_blackmarsh.8005.b:0 "Наверняка здесь можно найти редкие травы!"
 ek_travel_events_blackmarsh.8005.c:0 "Прошу прощения, как отсюда уехать?"

 ek_travel_events_blackmarsh.8010.t:0 "$travel_event_prefix$ Основание Зуука"
 ek_travel_events_blackmarsh.8010.desc:0 "Наследие лорда Зуука живо в Тенетопи и по сей день. После падения Ремана Сиродила III он вернулся в эти болота, основав здесь небольшое поселение. Прошло пять поколений, деревня процветала, и в честь великого лорда-основателя её переименовали в Зуук, имя, которое эхом отдаётся сквозь историю, а первоначальное название было утрачено.\n\nДетали жизни Зуука в Имперском дворце остаются невыясненными, однако его богатство, благородство и выдающаяся щедрость оставили на народе котринги нестираемый след. Имя Зуука будут чтить и грядущие поколения его наследников."
 ek_travel_events_blackmarsh.8010.a:0 "Какая славная история!"
 ek_travel_events_blackmarsh.8010.b:0 "На фольклор у нас нет времени."

 ek_travel_events_blackmarsh.8015.t:0 "$travel_danger_prefix$ Город Змея-Значит-Смерть"
 ek_travel_events_blackmarsh.8015.desc:0 "Это гиблое место, нужно уходить как можно скорее. Я уж лучше прокрадусь на судно, отплывающее из Лилмота, чем останусь в этой проклятой бездне.\n\nНе так давно нам пришлось проломить стену занмира, чтобы продолжить путь. Мороз прошёл по моей коже от того, что я там [Select_CString(ROOT.Char.IsFemale, 'увидела', 'увидел')]: зал был усеян трупами аргониан. Мне много доводилось их видеть, но в этот раз что-то было иначе.\n\nЯ [Select_CString(ROOT.Char.IsFemale, 'ощущала', 'ощущал')] зловещее присутствие, с которым раньше никогда не [Select_CString(ROOT.Char.IsFemale, 'сталкивалась', 'сталкивался')]. Как только мой взор упал на одно из тел, я [Select_CString(ROOT.Char.IsFemale, 'поняла', 'понял')], что, если не убегу, это место станет моей вечной тюрьмой."
 ek_travel_events_blackmarsh.8015.a:0 "ВЫПУСТИТЕ МЕНЯ! ВЫПУСТИТЕ!"

### Elsweyr
# Elsweyr Flavor
 ek_travel_events_elsweyr.0001.t:0 "$travel_event_prefix$ Не просто скакун"
 ek_travel_events_elsweyr.0001.desc:0 "Переход через [ROOT.Char.GetCurrentLocation.GetTerrain.GetNameNoTooltip] провинции [ROOT.Char.GetCurrentLocation.GetName] практически невозможно осуществить без местного проводника и стойких сенч-ратов, верхом на которых они перемещаются. [offended.GetFirstName] милостиво [Select_CString(offended.IsFemale, 'предложила', 'предложил')] сопроводить нас в дороге.\n\nМы остановились на короткий отдых, и я [Select_CString(ROOT.Char.IsFemale, 'заметила', 'заметил')], что на одном из сенчей нет наездника. Я [Select_CString(ROOT.Char.IsFemale, 'решила', 'решил')] задать вопрос, после которого [offended.GetFirstNameNoTooltip] [Select_CString(offended.IsFemale, 'оглядела', 'оглядел')] меня вытаращенными глазами.\n\n«А это что, запасной скакун?» — Я [Select_CString(ROOT.Char.IsFemale, 'спросила', 'спросил' )].\n\n«Нет», — [Select_CString(offended.IsFemale, 'ответила', 'ответил')] [offended.GetFirstNameNoTooltip]. «Это мой двоюродный брат»."
 ek_travel_events_elsweyr.0001.a:0 "Извините, пожалуйста!"
 ek_travel_events_elsweyr.0001.b:0 "Возьмите это золото в знак моего извинения."
 ek_travel_events_elsweyr.0001.c:0 "Так мне можно на нём прокатиться?"

# Elsweyr Danger

# Elsweyr Location
 ek_travel_events_elsweyr.8000.t:0 "$travel_event_prefix$ Священные воды Сияющего моря"
 ek_travel_events_elsweyr.8000.desc:0 "Каждый лучик света, которым Луны одаривают морские волны в Топальском заливе, собирается здесь, в этой прекрасной гавани — Лунной бухте. Эта естественная пещера укрыта от палящего полуденного солнца, а нежный свет Лун наполняет её духом безмятежности ночного неба.\n\nВ этих благословенных водах, омолаживающих разум и тело, уставшая душа находит утешение. Каджиты со всего Эльсвейра ходят в паломничества сюда, чтобы искупаться на отмели Лунного Света или посетить святилища. Здесь они избавляются от тягот жизни и уходят обратно, чувствуя обновление и прилив жизненных сил. Лунные жрецы предлагают мне сделать небольшое пожертвование и взять в залог полотенце, чтобы испытать на себе чудеса этой бухты и её священных вод. Они ждут моего ответа."
 ek_travel_events_elsweyr.8000.a:0 "Наконец-то, облегчение."
 ek_travel_events_elsweyr.8000.b:0 "Прошу, снимите с меня бремя этого проклятия!"
 ek_travel_events_elsweyr.8000.c:0 "Исцелите меня от этой болезни!"
 ek_travel_events_elsweyr.8000.d:0 "Мне не интересно."
 
 ek_travel_events_elsweyr.8005.t:0 "$travel_event_prefix$ Яркие каджиты"
 ek_travel_events_elsweyr.8005.desc:0 "Среди тихих склонов в Тенмарском лесу лежат Чёрные Холмы, крохотная деревня, которая так и пышет творческими порывами. Больше половины её населения, будь это ремесленники или художники, с головой погружено в работу: в «красильне» они изготавливают пигменты, которые популярны по всему Тамриэлю.\n\nПейзаж деревни украшают с заботой раскрашенные камни, в которых проявляются поколения традиций. «Стена жизни», трогательная композиция, отражающая смену поколений и жизненный цикл, приглашает каждого селянина внести свой вклад. Чёрные Холмы, это скрытое чудо, может с новой стороны открыть для вас каджитскую культуру — ту, что не увидишь на богатых улицах Сенчала."
 ek_travel_events_elsweyr.8005.a:0 "Я тоже [Select_CString(ROOT.Char.IsFemale, 'должна', 'должен')] попробовать рисовать!"
 ek_travel_events_elsweyr.8005.b:0 "Должно быть, это очень прибыльная статья экспорта!"
 ek_travel_events_elsweyr.8005.a.success:0 "Вы зарабатываете на продаже пигментов"
 ek_travel_events_elsweyr.8005.a.critical_success:0 "Вы очень много зарабатываете на продаже пигментов"
 ek_travel_events_elsweyr.8005.a.failure:0 "Вы продаёте пигменты в убыток"
 ek_travel_events_elsweyr.8005.a.critical_failure:0 "Вы продаёте пигменты с серьёзным убытком"

### Summerset
# Summerset Flavor
 ek_travel_events_summerset.0001.t:0 "$travel_event_prefix$ Красота розы"
 ek_travel_events_summerset.0001.desc:0 "Исследуя земли [ROOT.Char.GetCurrentLocation.GetName], я [Select_CString(ROOT.Char.IsFemale, 'набрела', 'набрёл' )] на безмятежную рощу, в которой цвела великолепная роза архонта. По разным причинам её стремятся добыть почтенные сапиархи. Завораживающие цветки захватили мой взор. Передо мной лежал сложный выбор, как поступить с редким растением."
 ek_travel_events_summerset.0001.a:0 "Я лично займусь их изучением!"
 ek_travel_events_summerset.0001.b:0 "Пусть все знают, что я — [Select_CString(ROOT.Char.IsFemale, 'настоящая покровительница', 'настоящий покровитель' )] наук!"
 ek_travel_events_summerset.0001.c:0 "Собирать цветы времени нет."

 ek_travel_events_summerset.0005.t:0 "$travel_event_prefix$ Ода Ауридону"
 ek_travel_events_summerset.0005.desc:0 "Исследуя прекрасный Ауридон, один из островов Саммерсетского архипелага, нельзя не поддаться его очарованию. От блистательных мраморных залов и возвышающихся шпилей до величественного Вулхельского Дозора, выполняющего роль рубежа: каждая грань этой страны сияет.\n\nНо красота Ауридона не ограничивается изысканностью его архитектуры: это также безмятежные затенённые поляны и древние руины, пребывание рядом с которыми создаёт чувство покоя. Бурная торговля сталью, судами и свежайшей рыбой свидетельствует о процветании этого острова, а изящество и мудрость его народа не знают равных."
 ek_travel_events_summerset.0005.a:0 "Торговые пути Ауридона представляют интерес!"
 ek_travel_events_summerset.0005.b:0 "Я хочу исследовать его богатую историю!"
 ek_travel_events_summerset.0005.c:0 "Мы можем уже идти?"

# Summerset Danger
 ek_travel_events_summerset.4000.t:0 "$travel_danger_prefix$ Грифонья обида"
 ek_travel_events_summerset.4000.desc:0 "Наше путешествие через провинцию [ROOT.Char.GetCurrentLocation.GetName] приняло драматический поворот, когда [kidnapped_character.GetFirstName] [Select_CString(kidnapped_character.IsFemale, 'попыталась', 'попытался' )] похитить грифонье яйцо из гнезда.\n\nГрифон бросился на защиту своего гнезда и атаковал в ответ. Во время начавшейся неразберихи [kidnapped_character.GetFirstName] [Select_CString(kidnapped_character.IsFemale, 'пропала', 'пропал' )] из виду."
 ek_travel_events_summerset.4000.a:0 "Бежим, пока грифон не добрался и до нас!"
 ek_travel_events_summerset.4000.b:0 "[kidnapped_character.GetFirstNameNoTooltip], я тебя спасу!"
 ek_travel_events_summerset.4000.b.success:0 "Вам удаётся победить грифона"
 ek_travel_events_summerset.4000.b.failure:0 "[kidnapped_character.GetFirstNameNoTooltip] [Select_CString(kidnapped_character.IsFemale, 'похищена', 'похищен' )] грифоном"

 ek_travel_events_summerset.4005.t:0 "$travel_danger_prefix$ Необузданная природа"
 ek_travel_events_summerset.4005.desc:0 "В провинции [ROOT.Char.GetCurrentLocation.GetName] передо мной предстало самое впечатляющее зрелище за всю мою жизнь. Вокруг — [ROOT.Char.GetCurrentLocation.GetTerrain.GetNameNoTooltip], и там скачет, сверкая, древний индрик. Эти создания наделены глубокой связью с И'ффре и способны разрушить целый город, если под угрозой будет их древнее обиталище.\n\nПока я [Select_CString(ROOT.Char.IsFemale, 'приходила', 'приходил')] в себя от увиденного, я [Select_CString(ROOT.Char.IsFemale, 'заметила', 'заметил')], что могучее животное обратило на меня своё внимание и сочло меня угрозой, о чём говорила его агрессивная поза."
 ek_travel_events_summerset.4005.a.success:0 "Вы побеждаете индрика"
 ek_travel_events_summerset.4005.a.failure:0 "Индрик вам не под силу"
 ek_travel_events_summerset.4005.c:0 "Так что там за заклинание использовали сапиархи?"

# Summerset Location

### Skyrim
# Skyrim Flavor
 ek_travel_events_skyrim.0001.t:0 "$travel_event_prefix$ Там, где покоятся драконы"
 ek_travel_events_skyrim.0001.desc:0 "Скайрим усеян драконьими курганами — древними сооружениями с таинственным прошлым. Наружная их часть представляет собой уложенные в концентрические кольца камни. Их невозможно найти на карте и сложно найти на местности, из которой они почти не выделяются, но в ходе путешествия через провинцию [ROOT.Char.GetCurrentLocation.GetName], я кажется, [Select_CString(ROOT.Char.IsFemale, 'заметила', 'заметил')] один такой загадочный курган, расположившийся в местности [ROOT.Char.GetCurrentLocation.GetTerrain.GetNameNoTooltip].\n\nВ #LORE [Concept('compendium_first_era', 'Первую эру')]#! их строили выжившие последователи драконьего культа, чтобы хоронить в них драконов, павших во время Войны драконов. Эти культисты, не усомнившиеся в своей вере, ожидали их воскрешения."
 ek_travel_events_skyrim.0001.a:0 "Поистине великолепно! Я ненадолго останусь осмотреть."
 ek_travel_events_skyrim.0001.b:0 "Нам надо идти…"
 ek_travel_events_skyrim.0001.c:0 "Такая… Сила…"

 ek_travel_events_skyrim.0005.t:0 "$travel_event_prefix$ Друзья познаются в мёде"
 ek_travel_events_skyrim.0005.desc:0 "Скайрим славится питным мёдом, и норды им очень гордятся. Остановившись в местной таверне провинции [ROOT.Char.GetCurrentLocation.GetName], я [Select_CString(ROOT.Char.IsFemale, 'решила', 'решил' )] отведать мёда из этих земель. Вслед за одной кружкой последовала другая, и, не успев заметить, я [Select_CString(ROOT.Char.IsFemale, 'завязала', 'завязал' )] беседу с [Select_CString(nord.IsFemale, 'местной', 'местным' )] гулякой по имени [nord.GetFirstName], [Select_CString(nord.IsFemale, 'которую', 'которого' )] впервые вижу!\n\nЭтот мёд — и впрямь сильная штука…"
 ek_travel_events_skyrim.0005.a:0 "Прекрасно! Думаю, я ненадолго задержусь."
 ek_travel_events_skyrim.0005.b:0 "Почему бы тебе не отправиться с нами?"
 ek_travel_events_skyrim.0005.c:0 "Ладно, пора ехать дальше."

 ek_travel_events_skyrim.0010.t:0 "$travel_event_prefix$ Победа или Совнгард!"
 ek_travel_events_skyrim.0010.desc:0 "Когда мы пересекали провинцию [ROOT.Char.GetCurrentLocation.GetName], я [Select_CString(ROOT.Char.IsFemale, 'встретила', 'встретил' )] [Select_CString(old_nord.IsFemale, 'одну женщину', 'одного мужчину' )]. [old_nord.GetSheHe|U] [Select_CString(old_nord.IsFemale, 'была облачена', 'был облачён' )] в слегка ржавый доспех и [Select_CString(old_nord.IsFemale, 'кричала', 'кричал' )] в нашу сторону.\n\nЯ [Select_CString(ROOT.Char.IsFemale, 'повелела', 'повелел' )] свите приблизиться к н[old_nord.GetHerHim]. [Select_CString(old_nord.IsFemale, 'Женщина назвалась', 'Мужчина назвался' )] именем [old_nord.GetFirstName] и [Select_CString(old_nord.IsFemale, 'поведала', 'поведала' )] о том, как [Select_CString(old_nord.IsFemale, 'билась', 'бился' )] в жестоких сражениях и о вырученном золоте. Затем [old_nord.GetSheHe] [Select_CString(old_nord.IsFemale, 'затихла', 'затих' )]. Отчаянным голосом [old_nord.GetSheHe] [Select_CString(old_nord.IsFemale, 'попросила', 'попросил' )] меня дать [old_nord.GetHerHim] смерть, достойную воина, чтобы [old_nord.GetSheHe] [Select_CString(old_nord.IsFemale, 'получила', 'получил' )] возможность встретиться со старыми друзьями в Совнгарде."
 ek_travel_events_skyrim.0010.a:0 "Обещаю, я буду посылать тебя в самые опасные битвы!"
 ek_travel_events_skyrim.0010.b:0 "Что ж. Вот и пришёл твой конец."
 ek_travel_events_skyrim.0010.b.tt:0 "Вы и [old_nord.GetFirstNameNoTooltip] сразитесь насмерть!"
 ek_travel_events_skyrim.0010.c:0 "Уходи прочь, [Select_CString(old_nord.IsFemale, 'старая', 'старый' )] [old_nord.Custom('InsultNoun')]!"

 ek_travel_events_skyrim.0011.t:0 "$travel_event_prefix$ Победа"
 ek_travel_events_skyrim.0011.desc:0 "Облако пара от [old_nord.GetHerHis] последнего выдоха растворилось в холодном воздухе Скайрима. [old_nord.GetHerHis|U] смерть я [Select_CString(ROOT.Char.IsFemale, 'ощутила', 'ощутил' )] своим духом; это была не казнь, но исполнение священного обычая, последняя глава жизни, прожитой с отвагой и честью, достойными древних нордов."
 ek_travel_events_skyrim.0011.a:0 "Да примет тебя Совнгард, [old_nord.GetFirstName]."

# Skyrim Danger
 ek_travel_events_skyrim.4000.t:0 "$travel_danger_prefix$ Бледный Гигант"
 ek_travel_events_skyrim.4000.desc:0 "Жуткое зрелище нам довелось наблюдать в провинции [ROOT.Char.GetCurrentLocation.GetName]. Безмятежное небо внезапно затянулось грозовыми тучами. Среди зловещего пейзажа появилась призрачная, окутанная жутким туманом фигура — Бледный Гигант.\n\nОн приближался к нам с намерением, от которого пробирало душу: забрать кого-то из нашей группы. Обуздав страх, мы приготовились к борьбе с этой потусторонней угрозой. Всю ночь Белдный Гигант мучил нас, шепча свои угрозы, которые эхом проносились по глуши. На рассвете он исчез, а вместе с ним и [kidnapped_character.GetFirstName]."
 ek_travel_events_skyrim.4000.a:0 "Какая потеря…"
 ek_travel_events_skyrim.4000.b:0 "Я [Select_CString(ROOT.Char.IsFemale, 'сама', 'сам' )] найду  [kidnapped_character.GetHerHis]!"
 ek_travel_events_skyrim.4000.b.success:0 "[kidnapped_character.GetFirstNameNoTooltip] [Select_CString(kidnapped_character.IsFemale, 'найдена', 'найден' )] вами в пещере"
 ek_travel_events_skyrim.4000.b.failure:0 "Бледный Гигант забирает и вас тоже"

 ek_travel_events_skyrim.4005.t:0 "$travel_danger_prefix$ Мать-дымок"
 ek_travel_events_skyrim.4005.desc:0 "Во время своих опасных странствий по Скайриму, мне довелось путешествовать по обледенелой всеми забытой местности под названием [ROOT.Char.GetCurrentLocation.GetTerrain.GetNameNoTooltip], когда на неё уже опустились зловещие сумерки. Стоя в тумане, от которого шёл мороз по коже, я [Select_CString(ROOT.Char.IsFemale, 'разглядела', 'разглядел' )] вдалеке жуткую призрачную фигуру. Она была одета в лохмотья и укрыта невесомой завесой. Внушающее трепет лицо было скрыто, и это добавляло нашей встрече налёт мистики.\n\nЯ осторожно [Select_CString(ROOT.Char.IsFemale, 'начала', 'начал' )] приближаться, и постепенно в воздухе нарастала тревожная тишина. Внезапно раздался вопль, пронизывающий кости, и из морозной бури воплотилась мать-дымок. Её облик, напоминающий привидение, не сулил ничего хорошего. Бледными трясущимися руками она творила магию холода. Она была словно воплощённый страх. Воздух вокруг похолодел: она готовилась напасть."
 ek_travel_events_skyrim.4005.a:0 "Готовься к смерти, проклятое создание!"
 ek_travel_events_skyrim.4005.a.success:0 "Вы побеждаете мать-дымок"
 ek_travel_events_skyrim.4005.a.failure:0 "Мать-дымок побеждает вас"

# Skyrim Location
 ek_travel_events_skyrim.8000.t:0 "$travel_event_prefix$ Тайна крипты"
 ek_travel_events_skyrim.8000.desc:0 "Наконец, исследование провинции [ROOT.Char.GetCurrentLocation.GetName] принесло свои плоды. Я [Select_CString(ROOT.Char.IsFemale, 'добралась', 'добрался')] до большого зала, отличавшегося оформлением от остальной крипты. В этой крупной пещере выделяется каменный островок, окружённый сложной конструкцией из уникальных арок и колонн, имеющей какое-то церемониальное предназначение. Всюду расставлены грозные статуи горгулий, усиливающие контраст с традиционной нордской архитектурой.\n\nМоё открытие подтверждает предположение, что к постройке этого зала приложил руку кто-то другой, возможно, его создатели имели отношение к вампиризму или некромантии. Такая архитектурная сложность заставляет задуматься о происхождении и предназначении этого сооружения."
 ek_travel_events_skyrim.8000.a:0 "Расследовать влияние вампиров в этом регионе."
 ek_travel_events_skyrim.8000.b:0 "Расспросить местных об истории некромантии в этих землях."
 ek_travel_events_skyrim.8000.c:0 "Эти вопросы меня не интересуют."

 ek_travel_events_skyrim.8005.t:0 "$travel_event_prefix$ Легенда, рассказанная камнями"
 ek_travel_events_skyrim.8005.desc:0 "Богатое прошлое Маркарта восходит ещё к #LORE [Concept('compendium_first_era', 'Первой эре')]#!, когда гномы построили Нчуанд-Зел в сердце горы Картмад. После их загадочного исчезновения примерно в 1Э 700, город заняли предельцы, создав Мар-Карт, крепость, которой правил ард, то есть король.\n\nВ 1Э 1033 императрица Гестра и её легионы захватили Маркарт, включив его в состав Алессианской империи. Невзирая на постоянное сопротивление со стороны предельцев, город был превращён в кипящий жизнью метрополис, коим он остаётся и по сей день. В стенах и постройках Маркарта сохранилась поразительная двемерская архитектура. "
 ek_travel_events_skyrim.8005.a:0 "Какая удивительная архитектура, я хочу узнать больше!"
 ek_travel_events_skyrim.8005.b:0 "Замечательно, что дальше?"
 
### Cyrodiil
# Cyrodiil Flavor
 ek_travel_events_cyrodiil.0001.t:0 "$travel_event_prefix$ Олень и Волк"
 ek_travel_events_cyrodiil.0001.desc:0 "Проезжая по живописным пейзажам провинции [ROOT.Char.GetCurrentLocation.GetName], я не [Select_CString(ROOT.Char.IsFemale, 'смогла', 'смог')] удержаться от размышления о тонком природном равновесии, которое даёт о себе знать в Сиродиле каждый день.\n\nКаждый рассвет открывает новую главу в вечной борьбе. История о выживании вплетена в саму ткань земли. Вот благородный олень, в его глазах — решимость, и он принимает вызов на гонку с самыми быстрыми волками этой части света. Ежедневный ритуал, который может значить жизнь или смерть.\n\nЭтот завораживающий спектакль служит ярким напоминанием, что в сердце сиродильской глуши неустанно, не давая продыху, идёт гонка на выживание. И неважно, кто вы: олень или волк, ибо когда солнце озаряет земля, погоня продолжается. "
 ek_travel_events_cyrodiil.0001.a:0 "Лучшее, что мы можем сделать, так это бежать."

 ek_travel_events_cyrodiil.0005.t:0 "$travel_event_prefix$ Холм Кватча"
 ek_travel_events_cyrodiil.0005.desc:0 "В прекрасном коловианском графстве Кватч моё внимание приковывает доминанта этой местности, город, что расположился на одиноком холме, возвышающемся над знаменитой Золотой дорогой. За его пределами простираются южные нагорья, земля изолированных деревень, вотчина животноводов, шахтёров и работников на карьерах.\n\nВ этой суровой местности мне удаётся познать дух кватчцев, людей, что отличаются неутомимостью и удивительной теплотой характера. Я предвкушаю возможность обрести незабываемые знакомства и приятные воспоминания в этом уголке Коловии."
 ek_travel_events_cyrodiil.0005.a:0 "[new_friend.GetFirstName] составит отличную компанию!"
 ek_travel_events_cyrodiil.0005.b:0 "У меня нет времени заводить дружбу."

 ek_travel_events_cyrodiil.0010.t:0 "$travel_event_prefix$ Транснибенские угощения"
 ek_travel_events_cyrodiil.0010.desc:0 "Во время исследования провинции [ROOT.Char.GetCurrentLocation.GetName] мне довелось попробовать местный деликатес — салат из мяса рака.\n\nЕго рецепт — секрет одного из местных племён. Чтобы его приготовить, нужно отыскать в приливных заводях рака и сварить его. К отварному мясу нужно добавить свежую зелень, семена и фрукты и на выбор. Мой милостивый гостеприимец предложил добавить цитрусовые. Это сделало вкус зелени куда более изысканным, чем обычно."
 ek_travel_events_cyrodiil.0010.a:0 "Очень вкусно! Можно запишу рецепт?"
 ek_travel_events_cyrodiil.0010.b:0 "Я здесь не из-за кулинарии."

 ek_travel_events_cyrodiil.0015.t:0 "$travel_event_prefix$ Wines of Blackwood"
 ek_travel_events_cyrodiil.0015.desc:0 "Amidst the enchanting Nibenese Lowlands, I chance upon a unique collection of local wines, which are often overlooked in discussions of Imperial vintages.\n\nThe diverse terroir here yields an array of wines, each embodying the distinct characteristics of its origin."
 ek_travel_events_cyrodiil.0015.a:0 "The prestigious vintages from the Left Banks are truly noble!"
 ek_travel_events_cyrodiil.0015.b:0 "The sweet wines from the Niben Forest are simply divine!"
 ek_travel_events_cyrodiil.0015.c:0 "The wines from the southern border are real conversation starters!"
 ek_travel_events_cyrodiil.0015.d:0 "Я что, сомелье?"

 ek_travel_events_cyrodiil.0020.t:0 "$travel_event_prefix$ An Eye for Fashion"
 ek_travel_events_cyrodiil.0020.desc:0 "As I travel across Tamriel, I've learned the art of clothing and its vital role in understanding cultures and forging connections. Each region has its unique style, revealing hidden meanings and facilitating smooth interactions.\n\nIn war-torn Cyrodiil, I've realized the importance of donning the right colors to avoid unwanted affiliations with warring factions. Adapting to local preferences has helped me secure advantageous deals and ensure my safety. Moreover, spotting distinctive clothing choices has often led to unique opportunities and valuable encounters. In this ever-evolving journey, fashion remains a powerful tool for navigating diverse landscapes."
 ek_travel_events_cyrodiil.0020.a:0 "One should dress as a local to learn their customs."
 ek_travel_events_cyrodiil.0020.b:0 "Foreign fashion tendencies are very much prestigious!"
 ek_travel_events_cyrodiil.0020.c: "I won't waste money on travel garb."

# Cyrodiil Danger
 ek_travel_events_cyrodiil.4000.t:0 "$travel_danger_prefix$ Среди никсадов"
 ek_travel_events_cyrodiil.4000.desc:0 "На дороге в провинции [ROOT.Char.GetCurrentLocation.GetName] случилась трагедия. Пока мы ехали, земля вдруг затряслась и появились крохотные крылатые существа, «никсады», как их называют. Они стали донимать нас и началась неразбериха.\n\n$travel_leader_court_position$ [caravan_master.GetTitledFirstName] [Select_CString(caravan_master.IsFemale, 'попыталась', 'попытался' )] защитить наши припасы, но весь наш обоз был разграблен. Ранее приятная атмосфера путешествия оказалось разрушена, осталось только эхо нашей общей катастрофы."
 ek_travel_events_cyrodiil.4000.a:0 "Проклятые создания!"

# Cyrodiil Location
 ek_travel_events_cyrodiil.8000.t:0 "$travel_event_prefix$ Слава и забвение"
 ek_travel_events_cyrodiil.8000.desc:0 "Прибыв в приорат Готтлесфонт, я [Select_CString(ROOT.Char.IsFemale, 'решилась', 'решился')] на небольшой путешествие к руинам Кейататар, название которых на древнем айлейдском языке означает «тень отчих лесов». В конце моего пути, пролегавшего через чащу леса, передо мной открылся потрясающий вид: пять белоснежных колонн, оплетённых лианами. Я [Select_CString(ROOT.Char.IsFemale, 'спустилась', 'спустился')] изучить подземное святилище, посвящённое #LORE [Concept('compendium_magnus', 'Магнусу')]#!, Богу Света и Зрения.\n\nМраморные стены, на которые падает тусклый свет магических бассейнов, отбрасывают небесно-голубое сияние. Я некоторое время [Select_CString(ROOT.Char.IsFemale, 'восхищалась', 'восхищался')] архитектурой и [Select_CString(ROOT.Char.IsFemale, 'размышляла', 'размышлял')] об уникальной айлейдской элементальной философии, сосредоточенной вокруг земли, воды, воздуха и света. Но в этих руинах айлейды также спроектировали и опасные ловушки. Некогда они должны были охранять секреты своих создателей, ныне же это ироническое свидетельство их падения."
 ek_travel_events_cyrodiil.8000.a:0 "Какая прекрасная архитектура!"
 ek_travel_events_cyrodiil.8000.c:0 "Магнус поистине велик…"

 ek_travel_events_cyrodiil.8005.t:0 "$travel_event_prefix$ Дверь в Нибенейской бухте"
 ek_travel_events_cyrodiil.8005.desc:0 "До меня дошли слухи, что в провинции [ROOT.Char.GetCurrentLocation.GetName]. появилась необычная дверь. Я не [Select_CString(ROOT.Char.IsFemale, 'придала', 'придал')] этому большого значения, потому что приняла за обычную крестьянскую байку.\n\nИ вот она перед моими глазами: обыкновенная дверь, но со сломанными петлями, дрейфующая по водам Нибенейской бухты."
 ek_travel_events_cyrodiil.8005.a:0 "Хм, занимательно."

 ek_travel_events_cyrodiil.8010.t:0 "$travel_event_prefix$ The Mysterious Mermaid of Anvil"
 ek_travel_events_cyrodiil.8010.desc:0 "In the heart of Anvil stands the captivating Mermaid, a legendary statue carved from ancient stone. With a form that has earned her many names, this enigmatic figure has remained a symbol of Anvil's allure.\n\nDespite speculation about her origins and purpose, her true history remains a mystery. Yet, the Mermaid's enduring presence continues to enchant and inspire the people of Anvil, making her an integral part of the city's identity."
 ek_travel_events_cyrodiil.8010.a:0 "I wonder what the people of Anvil have to say about her."
 ek_travel_events_cyrodiil.8010.b:0 "An enigmatic figure of mysterious origins? I must seek answers!"
 ek_travel_events_cyrodiil.8010.c:0 "Very beautiful, but we better get going."

 ek_travel_events_cyrodiil.8015.t:0 "$travel_event_prefix$ The History of Sutch"
 ek_travel_events_cyrodiil.8015.desc:0 "Sutch's intriguing history traces back to its origins as a strategic fort during the First Era, defending against Yokudan invaders.\n\nIts transformation into a thriving town was driven by its crucial role as a trade gateway between Colovia and the Redguard settlements along the Hammerfell coast. The town rapidly evolved into a bustling trading hub, facilitating the exchange of various goods, including contraband, and leaving a profound mark on the region's history."
 ek_travel_events_cyrodiil.8015.a:0 "This cultural hub can teach me so much!"
 ek_travel_events_cyrodiil.8015.b:0 "So many trade opportunities!"
 ek_travel_events_cyrodiil.8015.c:0 "A single fort to defend such an important border? I must see that."
 ek_travel_events_cyrodiil.8015.d:0 "We're not here as tourists!"

 ek_travel_events_cyrodiil.8020.t:0 "$travel_event_prefix$ Топальская академия легионеров"
 ek_travel_events_cyrodiil.8020.desc:0 "Проезжая провинцию [ROOT.Char.GetCurrentLocation.GetName], я [Select_CString(ROOT.Char.IsFemale, 'увидела', 'увидел' )] Топальскую академию легионеров, занимательное заведение с богатой историей. Некогда на её месте был простой имперский лагерь, а теперь это элитный центр подготовки имперских военных.\n\nАкадемия произвела на меня неизгладимое впечатление, и я [Select_CString(ROOT.Char.IsFemale, 'задумалась', 'задумался' )] о том, сколько ценной информации хранится в её стенах."
 ek_travel_events_cyrodiil.8020.a:0 "Каким тактикам они здесь обучают?"
 ek_travel_events_cyrodiil.8020.b:0 "Где хранятся местные записи?"
 ek_travel_events_cyrodiil.8020.c:0 "Продолжим путь…"

 ek_travel_events_cyrodiil.8025.t:0 "$travel_event_prefix$ История форта Редмейн"
 ek_travel_events_cyrodiil.8025.desc:0 "Посетив форт Редмейн, я [Select_CString(ROOT.Char.IsFemale, 'узнала', 'узнал' )] об уникальной истории его названия. Постройка форта была инициирована генералом Немением Гестором в ранние годы Второй империи. Чтобы привлечь финансирование он сочинил грозного каджитского налётчика по прозвищу Красная Грива и выбрал на его роль малоизвестного вождя Хунзура-ри.\n\nПо иронии судьбы, разгневавшись, Хунзур-ри сам и убил генерала Гестора, но при этом погиб, а за фортом закрепилось название Редмейн, несмотря на преобразование региона под властью Империи."
 ek_travel_events_cyrodiil.8025.a:0 "А как проходила сама битва?"
 ek_travel_events_cyrodiil.8025.b:0 "Мы должны учиться на ошибках прошлого…"
 ek_travel_events_cyrodiil.8025.c:0 "Я здесь не ради урока истории."

 ek_travel_events_cyrodiil.8030.t:0 "$travel_event_prefix$ Культ Мотылька Предков"
 ek_travel_events_cyrodiil.8030.desc:0 "В ходе путешествия по провинции [ROOT.Char.GetCurrentLocation.GetName], мы узнали об уникальной традиции, связанной с культом Мотылька Предков. Как рассказал нам местный учёный, [local.GetFirstName], в прошлом сиро-норды пряли шёлковые платки из шёлка мотылька-шелкопряда, на которых изображали свои семейные древа, сплетая природу с наследием предков.\n\nПод влиянием культа возник ритуал, где тема предков объединилась с мотыльками, в ходе которого создавалась особая ткань, насыщенная голосами предков. В шорохе этих одеяний эхом были слышна голоса древних духов, завораживавших древних нибенейцев. Монахи культа окружали себя священными мотыльками, привлекая их особыми мантрами и измельчённой древесной корой. Своим пением они поддерживали космическое равновесие, приводя мотыльков в движение каждым словом и успокаивая тишиной."
 ek_travel_events_cyrodiil.8030.a:0 "[local.GetFirstNameNoTooltip], прошу, расскажи мне ещё!"
 ek_travel_events_cyrodiil.8030.b:0 "На этот мистицизм у нас нет времени."

### Ocean
# Ocean Flavor
 ek_travel_events_ocean.0001.t:0 "$travel_event_prefix$ Underwater Lights"
 ek_travel_events_ocean.0001.desc:0 "During a tranquil night at sea, I decided to take a leisurely stroll on the ship's deck, allowing my feet and thoughts to roam freely. However, something else quickly captured my interest: I spotted lights shimmering beneath the dark waters. Initially, I mistook them for some kind of marine creatures, but they remained still, and the pattern they formed resembled the lights of a city at night. Could it be possible? Was there a civilization hidden beneath the sea? Such phenomena are not unheard of. The Sea Sload are rumored to construct entire cities, and who knows what other civilizations might reside in those uncharted depths of Tamriel?\n\nAs I stand there, I am captivated by this glimpse into a mysterious and strangely beautiful world."
 ek_travel_events_ocean.0001.a:0 "Let your thoughts drift away."
 ek_travel_events_ocean.0001.b:0 "Ponder about those hidden cultures."

# Ocean Danger
 ek_travel_events_ocean.4000.t:0 "$travel_danger_prefix$ The Scaled Elves"
 ek_travel_events_ocean.4000.desc:0 "Our journey took a sinister turn as a colossal figure emerged from the depths: [leviathan.GetFirstName], a Maormer leviathan, a sea elf of tremendous proportions. Towering over us, [leviathan.GetHerHis] appearance was eerie with scales glistening like cerulean waves, and dead, white eyes staring intently.\n\nWe scrambled to defend ourselves, though the odds remained stacked against us. Despite our desperate efforts, the leviathan refused to yield, thrashing ominously and retaliating with incredible might."
 ek_travel_events_ocean.4000.a:0 "We'll fight [leviathan.GetHerHim] off!"
 ek_travel_events_ocean.4000.defeated_leviathan:0 "You defeated [leviathan.GetFirstName]"
 ek_travel_events_ocean.4000.defeated_by_leviathan:0 "You were defeated by [leviathan.GetFirstName]"
 ek_travel_events_ocean.4000.b:0 "Just let [leviathan.GetHerHim] take what [leviathan.GetSheHe] wants."
 ek_travel_events_ocean.4000.c:0 "Attempt to lose [leviathan.GetHerHim] in the fog!"
 ek_travel_events_ocean.4000.d:0 "My silver tongue will make allies of [leviathan.GetHerHim] yet!"
 ek_travel_events_ocean.4000.offer_accepted:0 "[leviathan.GetFirstName] accepts your offer"
 ek_travel_events_ocean.4000.offer_refused:0 "[leviathan.GetFirstName] refuses your offer"

 ek_travel_events_ocean.4005.t:0 "$travel_danger_prefix$ The Myth of the Sea Sloads"
 ek_travel_events_ocean.4005.desc:0 "As we sail across the [ROOT.Char.GetCurrentLocation.GetName], an unnatural darkness begins to envelop our ship. At first, it seems like a sudden, ominous storm. However, as we struggle to find our bearings in this shadowy abyss, it becomes clear that this is no ordinary tempest. Whispers of eldritch incantations fill the air, and eerie lights flicker like malevolent spirits dancing on the waves.\n\nThe crew grows restless, and fear takes hold. The navigational equipment malfunctions, and we are now adrift in this magical void, unable to discern friend from foe. We must act swiftly to counter this malevolent magic before it engulfs us entirely."
 ek_travel_events_ocean.4005.a:0 "[char_next_in_line.GetName], with me, let's ward our boat!"
 ek_travel_events_ocean.4005.a.success:0 "You successfully ward the boat"
 ek_travel_events_ocean.4005.a.failure:0 "The Shadow Magic is too strong"
 ek_travel_events_ocean.4005.d:0 "[char_next_in_line.GetName], can you dispel this thing?"
 ek_travel_events_ocean.4005.d.success:0 "[char_next_in_line.GetName] successfully wards the boat"
 ek_travel_events_ocean.4005.d.failure:0 "The Shadow Magic is too strong"
 ek_travel_events_ocean.4005.b:0 "I will pray for the souls of the fallen…"
 ek_travel_events_ocean.4005.c:0 "Such darkness, such power…"

 ek_travel_events_ocean.4010.t:0 "$travel_danger_prefix$ A Sea Serpent!"
 ek_travel_events_ocean.4010.desc:0 "The first thing we noticed was a looming shadow, ascending quite fast from the depths toward our ship. Some of us held out hope that it might be nothing more than a sizable piece of kelp, but their optimism was swiftly shattered when a colossal sea serpent was thrusting its head out of the waves.\n\nAlthough not massive enough to engulf our entire vessel, it certainly appeared ravenous and poised to seize an unfortunate soul from the deck, to pull them back into the curshing ocean depths."
 ek_travel_events_ocean.4010.a:0 ""I am a Maormer, that beast has to respect me!""
 ek_travel_events_ocean.4010.b:0 "Gather everyone to fight for their lives."
 ek_travel_events_ocean.4010.b.success:0 "The serpent will be driven off."
 ek_travel_events_ocean.4010.b.failure:0 "[sea_serpent_food.GetFirstNameNoTooltip|U] was killed by the sea serpent."
 ek_travel_events_ocean.4010.c:0 "I will have its head!"
 ek_travel_events_ocean.4010.c.success:0 "You slay the sea serpent."
 ek_travel_events_ocean.4010.c.failure:0 "You are killed by the sea serpent."

 ek_travel_events_ocean.4015.t:0 "$travel_danger_prefix$ Dragons of the Sea"
 ek_travel_events_ocean.4015.desc:0 "They may be called sea dragons, but the enormous creature that suddenly appeared beneath our ship bore no resemblance to those winged beasts. In fact, it looked more like a gigantic crocodile, with colossal flippers in place of legs. While it follows our ship, it doesn't exhibit any signs of aggression, at least for now. However, given its apparent strength, it could pose a serious threat to our vessel if it were to turn hostile.\n\nPerhaps it would be wise to navigate towards safer waters or consider feeding it to keep it content. [unlucky_character.GetFirstName|U] is staying perilously close to the rail, and everyone is momentarily distracted by the situation…"
 ek_travel_events_ocean.4015.a:0 "Push [unlucky_character.GetFirstName] over board, to feed it."
 ek_travel_events_ocean.4015.b:0 "Order the ship into more shallow waters."
 ek_travel_events_ocean.4015.c:0 ""If we ignore it, it will ignore us, right?""
 ek_travel_events_ocean.4015.c.success:0 "The sea dragon leaves you alone."
 ek_travel_events_ocean.4015.c.failure:0 "The sea dragon damages the ship."
 ek_travel_events_ocean.4015.c.critical_failure:0 "The sea dragon sinks the ship."

 ek_travel_events_ocean.4020.t:0 "$travel_danger_prefix$ Colossal Hunters"
 ek_travel_events_ocean.4020.desc:0 "I had heard about the Sea Giants that roam the northern oceans of Tamriel in vessels as massive as small villages, but I did not expect to spot them on the horizon myself. It is a sight as frightening as it is fascinating. The waves created by their enormous ship would probably be enough to sink us if they decided to come closer, and their weapons, crafted to slay whales and who knows what other beasts, could easily split anyone in half.\n\nFortunately for us, they seem distracted for now as they are hunting down a whole school of whales. However, if we continue on our current course, they will surely notice us and may decide to switch targets."
 ek_travel_events_ocean.4020.a:0 "To the coast, avoid them at all cost!"
 ek_travel_events_ocean.4020.b:0 ""They are hunting whales, not ships. Stay on course.""
 ek_travel_events_ocean.4020.b.success:0 "The sea giants are distracted by their hunt."
 ek_travel_events_ocean.4020.b.failure:0 "The sea giants decide to attack."

 ek_travel_events_ocean.4025.t:0 "$travel_danger_prefix$ Stench of the Depth"
 ek_travel_events_ocean.4025.desc:0 "While traversing the eltheric ocean, an overpowering stench suddenly assaulted our senses, unlike anything I had ever encountered. The noxious odor enveloped the entire ship, leaving the sailors gasping for air and prompting most passengers to flee to their cabins, desperately trying to keep the contents of their stomachs in check.\n\nAs I am pondering the source of this foul stench, [sailor_character.GetFirstName], one of the sailors, begin to speak, [sailor_character.GetHerHis] expression filled with dread: "That's the breath of Ithguleoir, the undying Leviathan that haunts these waters! It is said that the air from Oblivion itself shrouds this monstrous creature. If it's this close, our fate is sealed!""
 ek_travel_events_ocean.4025.a:0 ""Superstitious Nonsense!""
 ek_travel_events_ocean.4025.b:0 ""There has to be another explanation for this.""
 ek_travel_events_ocean.4025.b.success:0 "You convince everyone that this is a harmless phenomenon"
 ek_travel_events_ocean.4025.b.failure:0 "You fail to deliver a convincing explanation"
 ek_travel_events_ocean.4025.c:0 ""Are we all going to die?""

 ek_travel_events_ocean.4026.t:0 "$travel_danger_prefix$ A Concerning Sight"
 ek_travel_events_ocean.4026.desc:0 "I'm not entirely sure why I stayed up so late that night on the ship. Perhaps I had a lingering feeling that something wasn't quite right, preventing me from falling asleep. To clear my mind, I decided to take a stroll on the deck, inhaling the crisp air and gazing up at the night sky. And then, I witnessed it.\nInitially, I mistook it for an unfamiliar island until I realized this massive form was moving through the dark sea! It was challenging to discern details because the creature's skin was as black as crude oil itself, but it was large enough to obscure the stars, appearing as a shadow even darker than the night itself.\n\nI stood in shock, still unable to move, even after the creature disappeared beneath the waves and the foaming waters it left behind settled down."
 ek_travel_events_ocean.4026.a:0 ""What in Oblivion was that?""

 ek_travel_events_ocean.4027.t:0 "$travel_danger_prefix$ Ithguleoir!"
 ek_travel_events_ocean.4027.desc:0 "We should never have ventured into these waters! The unsettling sightings and the foul odor occasionally emanating from the sea should have served as a warning to us. Now, I fear it is too late. Our ship is utterly helpless in the tumultuous, churning sea, whille something colossal is rising to the surface. Some of the people on board are screaming or praying, while others are scrambling for their weapons. However, as the massive form breaches through the waves, all action came to an abrupt halt as everyone froze in pure shock.\n\nIndeed, it was Ithguleoir, the immortal and legendary Leviathan that haunts this ocean. And as it opened a maw large enough to swallow our entire ship, we knew that all hope is now meaningless."
 ek_travel_events_ocean.4027.a:0 "May [ROOT.Char.GetFaith.DeathDeityName] have mercy on our souls!"

 ek_travel_events_ocean.4030.t:0 "$travel_danger_prefix$ Sea Wraiths!"
 ek_travel_events_ocean.4030.desc:0 "I always assumed the Sea of Ghosts got its name solely from ancient legends dating back to the times when the first Nords were settling in Cyrodiil. I never expected these legends to hold true to this very day!\n\nHowever, there is no doubt anymore. The eerie, otherworldly apparitions floating above the waves and encircling our ship are undeniably real, their ghostly glow standing out unnaturally under the moonlight. There's no time for speculation about whether they are actual haunting souls or some other mysterious phenomenon, because one thing is abundantly clear: they are on a vengeful quest for blood."
 ek_travel_events_ocean.4030.a:0 "Use a restoration spell to ward the ship."
 ek_travel_events_ocean.4030.b:0 ""[resto_mage.GetFirstName|U] can you ward the ship?""
 ek_travel_events_ocean.4030.c:0 ""Those lost souls will serve #bold me#! now!""
 ek_travel_events_ocean.4030.d:0 ""Ghosts or not, I will fight them!""
 ek_travel_events_ocean.4030.d.success:0 "You drive the wraiths off"
 ek_travel_events_ocean.4030.d.failure:0 "You are killed by the wraiths"
 ek_travel_events_ocean.4030.e:0 "Hide under deck until they are gone"
 ek_travel_events_ocean.4030.e.t:0 "[ghost_victim.GetFirstName|U] was dragged away by the wraiths"

 ek_travel_events_ocean.4035.t:0 "$travel_danger_prefix$ A Sudden Collision!"
 ek_travel_events_ocean.4035.desc:0 "An otherwise uneventful sea voyage came to an abrupt halt as our ship collided with something massive out of the blue. The impact shook the entire vessel, and an eerie sound reverberated through the air as wooden planks scraped against… something. Everyone rushed to the deck to see what had caused this disturbance, but whatever it was, it remained elusive.\n\nDid we just bump into a gigantic sea creature lurking beneath the waves? Or had we brushed against the roof of an enigmatic underwater structure? The sea surrounding us is deep, and there are no known cliffs or shallows in the region. While the crew began inspecting the damage caused by the collision, speculation ran rampant among the rest of us, trying to fathom the cause of this unexpected event."
 ek_travel_events_ocean.4035.a:0 "Concerning…"

 ek_travel_events_ocean.4040.t:0 "$travel_danger_prefix$ The Abyssal Cephaliarch"
 ek_travel_events_ocean.4040.desc:0 "The ship I've chosen for this voyage has certainly weathered its fair share of storms before. However, the current tempest is really testing its limits. The howling wind tears through the sails, the rolling thunder overshadows even the deafening crash of colossal waves, and constant lightning streaks across the sky, pushing the ship to its limits. It's evident that even the experienced crew aboard this vessel is gripped by fear.\n\nSuddenly, [mora_character.GetFirstName] approaches me, [mora_character.GetHerHis] voice trembling. "My [ROOT.Char.GetLadyLord], it's no secret that the Daedric Lord Hermaeus Mora has a certain power over the sea. I've been following him for quite some time, and if you too pledge your soul to him, I believe he will protect us in this dire moment.""
 ek_travel_events_ocean.4040.a:0 ""I am already under Moras protection!""
 ek_travel_events_ocean.4040.b:0 ""I pledge my soul to Mora if I have to!""
 ek_travel_events_ocean.4040.c:0 ""Never, I prefer to face this storm!""
 ek_travel_events_ocean.4040.c.success:0 "The storm leaves you unharmed"
 ek_travel_events_ocean.4040.c.failure:0 "The storm damages the ship"
 ek_travel_events_ocean.4040.c.critical_failure:0 "The storm sinks the ship"

 ek_travel_events_ocean.4045.t:0 "$travel_danger_prefix$ A Gaping Maelstrom"
 ek_travel_events_ocean.4045.desc:0 "I've heard tales of the enigmatic maelstrom in the Abecean Sea before - a swirling vortex believed to be a direct gateway to the realm of the Daedric Prince Molag Bal. At first, I dismissed it as a mere scholarly theory or a sailor's tall tale.\n\nHowever, the deafening, churning whirlpool that has materialized right before our very eyes is undeniably tangible, and our ship is now locked in a fierce struggle against its formidable suction.\n\nIf we were to be drawn into its clutches, our fate would be far worse than death."
 ek_travel_events_ocean.4045.a:0 "A testament of Molag Bals might."
 ek_travel_events_ocean.4045.b:0 "Let someone else navigate the ship into safety."
 ek_travel_events_ocean.4045.success:0 "The ship escapes the maelstroms pull"
 ek_travel_events_ocean.4045.failure:0 "The ship gets sucked in by the maelstrom"
 ek_travel_events_ocean.4045.c:0 "Take the helm yourself."

 ek_travel_events_ocean.4050.t:0 "$travel_danger_prefix$ Пираты!"
 ek_travel_events_ocean.4050.desc:0 "Море таит множество опасностей, но самая частая из них — это пираты, и увы, мне не удалось её миновать. Какое-то время назад мы увидели их жуткие паруса, но так и не смогли уйти от преследования — их корабль оказался быстрее. Теперь они всё ближе и ближе, и нужно что-то решить.\n\nВозможно, стоит попробовать провести с ними переговоры и предложить золото? Или взять в руки оружие и дать бой? Быть может, есть ещё какой-то выход из этого отчаянного положения?"
 ek_travel_events_ocean.4050.a:0 "Убедить пиратов присоединиться к вам."
 ek_travel_events_ocean.4050.a.success:0 "[pirate_character.GetFirstName|U] присоединяется к вашему двору"
 ek_travel_events_ocean.4050.a.failure:0 "Пираты не убеждены"
 ek_travel_events_ocean.4050.b:0 "Пригрозить запустить в пиратов огненный шар."
 ek_travel_events_ocean.4050.c:0 "Заплатить пиратам."
 ek_travel_events_ocean.4050.d:0 "Дать бой пиратам."
 ek_travel_events_ocean.4050.d.success:0 "Вы побеждаете пиратов"
 ek_travel_events_ocean.4050.d.failure:0 "Пираты ранят вас"
 ek_travel_events_ocean.4050.d.critical_failure:0 "Пираты убивают вас"

# Ocean Location
 ek_travel_events_ocean.8000.t:0 "$travel_event_prefix$ Об Артейуме"
 ek_travel_events_ocean.8000.desc:0 "Во время плавания в водах, омывающих архипелаг Саммерсет, я [Select_CString(ROOT.Char.IsFemale, 'вспомнила', 'вспомнил' )] историю о загадочном острове Артейум. Он располагался к югу от Потансы и к западу от Рунсибея. Артейум заслужил легендарный статус как убежище ордена Псиджиков, мастеров Старого пути — уникальной философии о подчинении сил природы.\n\nОднако главная тайна Артейума — это его загадочное исчезновение несколько веков назад, совпавшее с возвышением в Тамриэле Гильдии магов. Возникло множество гипотез, но, что произошло на самом деле, знают только сами Псиджики."
 ek_travel_events_ocean.8000.a:0 "Я могу погрузиться в историю этого острова на многие часы…"
 ek_travel_events_ocean.8000.b:0 "Я изучу магические отголоски в этих местах."
 ek_travel_events_ocean.8000.c:0 "Это всего лишь народные сказки."

 ek_travel_events_ocean.8005.t:0 "$travel_event_prefix$ Повидаться с Систрами"
 ek_travel_events_ocean.8005.desc:0 "Пока мы проплывали у захватывающего дух систрийского побережья сквозь солёный морской ветер, я [Select_CString(ROOT.Char.IsFemale, 'услышала', 'услышал')] мелодичные куплеты чувственной песни.\n\nЛиричная баллада повествовала о глубокой связи между путешественником и его любимыми Систрами и его неугасимом стремлении вернуться к ним. Оно сопровождает странника и в землях данмеров, и у лейавинских берегов, предвещая новые встречи и приключения, которые в конце концов приведут его обратно на Систры.\n\nКаждый припев эхом раздавался у меня в душе, напоминая о том, что эта моряцкая песня рассказывает о нашем путешествии по жизни, которое наполнено надеждой вернуться к любимой родине. "
 ek_travel_events_ocean.8005.a:0 "Пойте дальше, моряки!"
 ek_travel_events_ocean.8005.b:0 "Мы доплывём быстрее, если вы будете молчать!"

### Reach
# Reach Flavor
 ek_travel_events_reach.0001.t:0 "$travel_event_prefix$ Народы Предела"
 ek_travel_events_reach.0001.desc:0 "Во время визита в Предел, мне довелось увидеть разнообразие населяющих его народов и сложное взаимодействие различных сил в нём. Выделяется местный коренной народ предельцев с их уникальным наследием и непонятыми остальным миром шаманскими практиками. Хотя существуют отдельные фракции орков-отщепенцев, которые продолжают идти по пути насилия, большинство даже некогда враждебных орочьих племён предпочли мирное сосуществование.\n\nГордые и злопамятные норды также называют Предел своим домом, живя в гармонии с редгардами и бретонцами. Хотя Предел никогда не покидает напряжённость, количество культур в нём завораживает."
 ek_travel_events_reach.0001.a:0 "Такое хрупкий мир между народами заслуживает дальнейшего изучения…"
 ek_travel_events_reach.0001.b:0 "Столько различных боевых тактик — и всё в одном месте!"
 ek_travel_events_reach.0001.c:0 "Наверняка между этими культурами много торговых контактов."
 ek_travel_events_reach.0001.d:0 "Я сосредоточусь на продолжении пути…"

 ek_travel_events_reach.0005.t:0 "$travel_danger_prefix$ Politics of the Reach"
 ek_travel_events_reach.0005.desc:0 "As our party ventures deep into [ROOT.Char.GetCurrentLocation.GetName], the wild beauty of the [ROOT.Char.GetCurrentLocation.GetTerrain.GetNameNoTooltip] is marred by the signs of unrest—clan banners, crude markings, and wary eyes watching from the shadows. This fractured land, divided by old grudges and rivalries, is ruled as much by tradition as by the [chief.GetTitleAsName], a figure respected by some and resented by others.\n\nA group of [chief.GetCulture.GetName] warriors halts our path, weapons drawn, their leader stepping forward. "I am [chief.GetTitledFirstNameNoTooltip]," [chief.GetSheHe] declares, [chief.GetHerHis] gaze sharp. "State your purpose, traveler.""
 ek_travel_events_reach.0005.a:0 "Maybe we can negotiate passage?"
 ek_travel_events_reach.0005.a.success:0 "The negotiations were short"
 ek_travel_events_reach.0005.a.failure:0 "The offer was unsufficient"
 ek_travel_events_reach.0005.failure.death.tt:0 "The interaction was insulting!"
 ek_travel_events_reach.0005.b:0 "Do not hurt me, I'm with the… Blue… Er… Elk Clan!"
 ek_travel_events_reach.0005.b.success:0 "Weapons are sheated"
 ek_travel_events_reach.0005.b.failure:0 ""That's not a real clan""
 ek_travel_events_reach.0005.c:0 "I'm warning you, don't come any closer."
 ek_travel_events_reach.0005.c.success:0 "They back off"
 ek_travel_events_reach.0005.c.failure:0 "They see it as an insult"
 ek_travel_events_reach.0005.d:0 "Nevermind, I'm… Actually going that way."

# Reach Danger 
