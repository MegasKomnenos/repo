 murder_outcome.5002.option_pet_scorpion:0 "Он будет моим питомцем!"
 
 ek_pet_animal.1001.t:0 "Скорпион"
 ek_pet_animal.1001.desc:1 "Скорпион ползает по комнате, весело щёлкая клешнями, и я думаю, как бы [ROOT.Char.Custom('ScorpionStoryHerHis')] назвать? Что-нибудь историческое? Что-то, намекающее на [ROOT.Char.Custom('ScorpionStoryHerHis')] [ROOT.Char.Custom('ScorpionColor')] тело? Что-нибудь, что передаст то умиротворение, что я испытываю, когда [ROOT.Char.Custom('ScorpionStorySheHe')] ползает рядом со мной?\n\nО, знаю! Назову [ROOT.Char.Custom('ScorpionStoryHerHis')]… "
 ek_pet_animal.1001.a:1 "Какое чудесное имя!"
 
 ### Random scorpion events
 # You observe your scorpion, smol intrigue modifier
 ek_pet_animal.1101.t:0 "[ROOT.Char.Custom('ScorpionStoryName')]: ползучее коварство"
 ek_pet_animal.1101.desc:0 "Я [Select_CString(ROOT.Char.IsFemale, 'завела', 'завёл')] себе новую привычку: в конце дня я наблюдаю за тем, как передвигается [ROOT.Char.Custom('ScorpionStoryName')].\n\nВидя, как [ROOT.Char.Custom('ScorpionStorySheHe')] ползает, осторожно щёлкая клешнями по разным поводам, я задумываюсь о том, что возможно, и мне стоит проявлять больше осторожности по отношению к окружающим."
 ek_pet_animal.1101.a:0 "Интригующе!"
 
 # Your scorpion goes with you into battle!
 ek_pet_animal.1102.t:0 "[ROOT.Char.Custom('ScorpionStoryName')]: клешни и жало"
 ek_pet_animal.1102.desc:0 "Мой скорпион, [ROOT.Char.Custom('ScorpionStoryName')], в своей отваге не знает пределов! В масштабных битвах ли, мелких стычках или даже поединках, [ROOT.Char.Custom('ScorpionStorySheHe')] всюду сопровождает меня и дерётся бок о бок.\n\nМои противники, даже мои товарищи, кажется, опасаются [ROOT.Char.Custom('ScorpionStoryHerHis')],и не раз я [Select_CString(ROOT.Char.IsFemale, 'выходила', 'выходил')] победителем, благодаря тому, что их отвлекало [ROOT.Char.Custom('ScorpionStoryHerHis')] [ROOT.Char.Custom('ScorpionColor')] тело или же [ROOT.Char.Custom('ScorpionStoryHerHis')] укусы."
 ek_pet_animal.1102.a:0 "Со мной в гущу битвы!"
 
 # Your scorpion attacked a vassal! Wound or possibly death
 ek_pet_animal.1103.t:0 "[ROOT.Char.Custom('ScorpionStoryName')]: ужалили!"
 ek_pet_animal.1103.desc_wounded:0 "Тронный зал охвачен ужасом! Пока [vassal.GetName] [Select_CString(vassal.IsFemale, 'ожидала', 'ожидал')] у меня аудиенции, мой скорпион, [ROOT.Char.Custom('ScorpionStoryName')], как будто ни с того ни с сего напал на н[vassal.GetHerHis]!\n\n[vassal.GetFirstName] [Select_CString(vassal.IsFemale, 'сумела', 'сумел')] выбежать из зала, хоть и с серьёзным ранением…"
 ek_pet_animal.1103.desc_poisoned:0 "Тронный зал охвачен ужасом! Пока [vassal.GetName] [Select_CString(vassal.IsFemale, 'ожидала', 'ожидал')] у меня аудиенции, мой скорпион, [ROOT.Char.Custom('ScorpionStoryName')], как будто ни с того ни с сего напал на н[vassal.GetHerHis]!\n\nРаздался оглушительный вопль, и после того как скорпиона вернули в [ROOT.Char.Custom('ScorpionStoryHerHis')] клетку, все видели, как [vassal.GetFirstName] [Select_CString(vassal.IsFemale, 'тряслась', 'трясся')] от страха.\n\n«ОНО МЕНЯ УЖАЛИЛО! — [Select_CString(vassal.IsFemale, 'кричала она', 'кричал он')]. — ЭТО ВСЁ ТЫ И ТВОЙ ДУРАЦКИЙ ЖУК!»"
 ek_pet_animal.1103.a:0 "Надеюсь, [vassal.GetFirstName] поправится…"
 ek_pet_animal.1103.b:0 "О нет…"
 
 # Scorpion dies :(
 ek_pet_animal.1199.t:0 "[ROOT.Char.Custom('ScorpionStoryName')]: печальный день"
 ek_pet_animal.1199.desc:0 "[ROOT.Char.Custom('ScorpionStoryName')] уже давно не личинка, [ROOT.Char.Custom('ScorpionStoryHerHis')] походка уже не такая размеренная и стабильная как когда-то.\n\nЯ нежно поглаживаю [ROOT.Char.Custom('ScorpionStoryHerHis')] [ROOT.Char.Custom('ScorpionColor')] тело и ощущаю, как [ROOT.Char.Custom('ScorpionStorySheHe')] слегка покачивается и пытается щёлкать клешнями, но, когда наступает тишина, я понимаю, что следующим утром меня уже не разбудит [ROOT.Char.Custom('ScorpionStoryHerHis')] утренняя прогулка по комнате."
 ek_pet_animal.1199.a:0 "[ROOT.Char.Custom('ScorpionStoryName')], мне будет тебя не хватать!"
 
 pet_scorpion_decision:0 "[ROOT.Char.Custom('ScorpionStoryName')]: поиграться"
 pet_scorpion_decision_desc:0 "Я знаю, как [ROOT.Char.Custom('ScorpionStoryName')] любит ползать вокруг меня, и мне всегда отрадно наблюдать, как [ROOT.Char.Custom('ScorpionStorySheHe')] весело щипает меня и ласкается. Да, на уход и еду уходит много труда и денег, но я знаю: что бы ни случилось, [ROOT.Char.Custom('ScorpionStorySheHe')] всегда будет со мной!"
 pet_scorpion_decision_tooltip:0 "Поиграться со скорпионом"
 pet_scorpion_decision_confirm:0 "Поиграться со скорпионом"
 
 # You play with your scorpion :)
 ek_pet_animal.1501.t:0 "[ROOT.Char.Custom('ScorpionStoryName')]: приятное время вместе"
 ek_pet_animal.1501.desc:0 "Войдя в комнату, я тут же слышу, как [ROOT.Char.Custom('ScorpionStoryName')] радостно щёлкает клешнями.\n\nС улыбкой на лице я открываю [ROOT.Char.Custom('ScorpionStoryHerHis')] клетку, чтобы дать размять педипальпы.\n[ROOT.Char.Custom('ParrotStoryName')] делает несколько кругов по комнате, прежде чем залезть мне на руку и поласкаться со мной.\n\nЯ смеюсь, и чувствую, как тяжесть этого мира перестаёт давить мне на плечи."
 ek_pet_animal.1501.a:0 "Щекотно!"
 
 ek_pet_animal.1502.desc:0 "Держа в руках любимое лакомство моего скорпиона по кличке [ROOT.Char.Custom('ScorpionStoryName')], я вхожу в свой маленький сад, где [ROOT.Char.Custom('ScorpionStorySheHe')] проводит большую часть времени.\nВскоре после того, как [ROOT.Char.Custom('ScorpionStoryName')] замечает меня или, может быть, жуков у меня в руке, [ROOT.Char.Custom('ScorpionStorySheHe')] начинает радостно щёлкать клешнями и наворачивать круги вокруг меня.\nЗатем [ROOT.Char.Custom('ScorpionStorySheHe')] опирается мне на руку и хватает лакомство.\n\nМне становится лучше, я смеюсь и уже чувствую, как [Select_CString(ROOT.Char.IsFemale, 'готова', 'готов')] ко всему, что предложит мне этот мир."
 ek_pet_animal.1502.a:0 "Оставь и мне, [ROOT.Char.Custom('ScorpionStoryName')]!"

