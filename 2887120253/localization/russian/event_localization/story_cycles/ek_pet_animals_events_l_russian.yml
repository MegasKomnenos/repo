 scorpion_story_observing_modifier:0 "Скорпионье чутьё"
 scorpion_story_observing_modifier_desc:0 "Этот персонаж развил в себе чувство внимательности и осторожности, наблюдая за своим питомцем-скорпионом"
 scorpion_story_fighting_with_you_modifier:0 "Боевой скорпион"
