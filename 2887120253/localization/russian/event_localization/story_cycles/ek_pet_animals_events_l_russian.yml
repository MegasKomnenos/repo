 ek_pet_animal.2001.desc:1 "Скриб ползает по комнате, весело цокоча своими крохотными ножками, и я думаю, как бы [ROOT.Char.Custom('ScribStoryHerHis')] назвать? Что-нибудь историческое? Что-то, намекающее на [ROOT.Char.Custom('ScribStoryHerHis')] [ROOT.Char.Custom('ScribColor')] тело? Что-нибудь, что передаст то умиротворение, что я испытываю, когда [ROOT.Char.Custom('ScribStorySheHe')] ползает рядом со мной?\n\nО, знаю! Назову [ROOT.Char.Custom('ScribStoryHerHis')]… "
