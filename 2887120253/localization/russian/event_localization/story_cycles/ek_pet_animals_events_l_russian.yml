 bantam_story_modifier:0 "Питомец — бентамский гуар"
 bantam_story_modifier_desc:0 "Этот персонаж наслаждается компанией маленького и послушного существа, сопровождающего его всюду, куда бы он ни пошёл"
 bantam_story_eating_fruit_modifier:0 "Ест свежие фрукты вместе с бентамским гуаром"
 bantam_story_eating_fruit_modifier_desc:0 "Этот персонаж любит делить трапезу с бентамским гуаром, поедая свежие фрукты"
 bantam_story_fighting_with_you_modifier:0 "Боевой бентамский гуар"
 bantam_story_fighting_with_you_modifier_desc:0 "В бою этого персонажа всегда сопровождает бентамский гуар, который ходит где-то неподалёку, отвлекая врагов и иногда досаждая им."
 
