 ek_pet_animal.3001.t:0 "Бентамский гуар"
 ek_pet_animal.3001.desc:1 "Бентамский гуар ходит по комнате, весело поклёвывая с пола, и я думаю, как бы [ROOT.Char.Custom('BantamStoryHerHis')] назвать? Что-нибудь историческое? Что-то, намекающее на [ROOT.Char.Custom('BantamStoryHerHis')] крохотное  [ROOT.Char.Custom('BantamColor')] тело? Что-нибудь, что передаст то умиротворение, что я испытываю, когда [ROOT.Char.Custom('BantamStorySheHe')] ходит вразвалку рядом со мной?\n\nО, знаю! Назову [ROOT.Char.Custom('BantamStoryHerHis')]… "
 ek_pet_animal.3001.a:1 "Какое чудесное имя!"
 
 ### Random bantam guar events
 # You eat some fruits with your bantam guar, smol health modifier
 ek_pet_animal.3101.t:0 "[ROOT.Char.Custom('BantamStoryName')]: свежие фрукты"
 ek_pet_animal.3101.desc:0 "Я [Select_CString(ROOT.Char.IsFemale, 'завела', 'завёл')] себе новую привычку: конец дня я и [ROOT.Char.Custom('BantamStoryName')] проводим вместе за трапезой свежими фруктами.\n\nНе знаю в чём причина: может быть в фруктах, а может а может во времени, которое я и [ROOT.Char.Custom('BantamStorySheHe')] проводим вместе, но я ощущаю себя более [Select_CString(ROOT.Char.IsFemale, 'здоровой и энергичной', 'здоровым и энергичным')]!"
 ek_pet_animal.3101.a:0 "Оставь мне немного, [ROOT.Char.Custom('BantamStoryName')]!"
 
 # Your bantam guar goes with you into battle!
 ek_pet_animal.3102.t:0 "[ROOT.Char.Custom('BantamStoryName')]: клюв и когти"
 ek_pet_animal.3102.desc:0 "Мой бентамский гуар, [ROOT.Char.Custom('BantamStoryName')], в своей отваге не знает пределов! В масштабных битвах ли, мелких стычках или даже поединках, [ROOT.Char.Custom('BantamStorySheHe')] всюду сопровождает меня и дерётся бок о бок.\n\nМои противники, даже мои товарищи, кажется, опасаются [ROOT.Char.Custom('BantamStoryHerHis')], и не раз я [Select_CString(ROOT.Char.IsFemale, 'выходила', 'выходил')] победителем, благодаря тому, что их отвлекало [ROOT.Char.Custom('BantamStoryHerHis')] [ROOT.Char.Custom('BantamColor')] тело или же травмы от  [ROOT.Char.Custom('BantamStoryHerHis')] клюва."
 ek_pet_animal.3102.a:0 "Со мной в гущу битвы!"
 
 # Your bantam guar attacked a vassal! Wound or possibly an eye removal
 ek_pet_animal.3103.t:0 "[ROOT.Char.Custom('BantamStoryName')]:… тому глаз вон"
 ek_pet_animal.3103.desc_wounded:0 "Тронный зал охвачен ужасом! Пока [vassal.GetName] [Select_CString(vassal.IsFemale, 'ожидала', 'ожидал')] у меня аудиенции, мой бентамский гуар, [ROOT.Char.Custom('BantamStoryName')], как будто ни с того ни с сего напал на н[vassal.GetHerHis]!\n\n[vassal.GetFirstName] [Select_CString(vassal.IsFemale, 'сумела', 'сумел')] выбежать из зала, хоть и с серьёзным ранением…"
 ek_pet_animal.3103.desc_eye_removed_not_one_eyed:0 "Тронный зал охвачен ужасом! Пока [vassal.GetName] [Select_CString(vassal.IsFemale, 'ожидала', 'ожидал')] у меня аудиенции, мой бентамский гуар, [ROOT.Char.Custom('BantamStoryName')], как будто ни с того ни с сего напал на н[vassal.GetHerHis]!\n\nРаздался оглушительный вопль, и после того как бентамского гуара выдворили из зала, видно было, как [vassal.GetFirstName] закрывает окровавленной рукой один глаз…"
 ek_pet_animal.3103.desc_eye_removed_one_eyed:0 "Тронный зал охвачен ужасом! Пока [vassal.GetName] [Select_CString(vassal.IsFemale, 'ожидала', 'ожидал')] у меня аудиенции, мой бентамский гуар, [ROOT.Char.Custom('BantamStoryName')], как будто ни с того ни с сего напал на н[vassal.GetHerHis]!\n\nРаздался оглушительный вопль, и после того как бентамского гуара выдворили из зала, видно было, как [vassal.GetFirstName] закрывает окровавленной рукой единственный глаз.\n\n«Я НИЧЕГО НЕ ВИЖУ, — [Select_CString(vassal.IsFemale, 'кричала она', 'кричал он')]. — ЭТО ВСЁ ТЫ И ТВОЯ ДУРАЦКАЯ ПТИЦА!»"
 ek_pet_animal.3103.a:0 "Надеюсь, [vassal.GetFirstName] поправится…"
 ek_pet_animal.3103.b:0 "О нет…"
 
 ek_pet_animal.3104.t:0 "Бентамский феномен"
 ek_pet_animal.3104.desc:0 "С тех пор как мудрецы из культа Мотылька Предков рассказали о своих вычислениях, согласно которым бентамский гуар — самое милое животное в Тамриэле, многие значимые и выдающиеся тамриэльцы стали стремиться завести себе такого питомца. Обладание бентамским гуаром через короткое время стало символом статуса и достатка, а торговцы в погоне за выгодой стали продавать куклы и плюшевые игрушки, походящие на это крохотное существо.\n\nОдним из самых известных бентамских гуаров в моей державе является мой маленький друг по имени [ROOT.Char.Custom('BantamStoryName')].\n\n[noble.GetFullName] [Select_CString(noble.IsFemale, 'попросила', 'попросил')] у меня аудиенции, чтобы обсудить нечто важное. [noble.GetSheHe|U] хочет, чтобы мой бентамский гуар, [ROOT.Char.Custom('BantamStoryName')], достался [noble.GetHerHim], и [Select_CString(noble.IsFemale, 'готова', 'готов')] предложить крупную сумму денег."
 ek_pet_animal.3104.a:0 "Сколько, говорите? По рукам!"
 ek_pet_animal.3104.b:0 "Мой друг не продаётся!"
 ek_pet_animal.3104.c:0 "Возьмите [ROOT.Char.Custom('BantamStoryHerHis')] в знак нашего союза!"

 rival_bantam_denied:0 "[TARGET_CHARACTER.GetShortUIName|U] [Select_CString(TARGET_CHARACTER.IsFemale, 'отказалась', 'отказался')] продавать своего питомца — бентамского гуара персонажу [CHARACTER.GetShortUIName]."
 rival_bantam_denied_corresponding:0 "Персонажу [CHARACTER.GetShortUIName|U] было отказано в продаже бентамского гуара — питомца персонажа [TARGET_CHARACTER.GetShortUIName]."

 # Bantam guar dies :(
 ek_pet_animal.3199.t:0 "[ROOT.Char.Custom('BantamStoryName')]: печальный день"
 ek_pet_animal.3199.desc:0 "[ROOT.Char.Custom('BantamStoryName')] уже давно не птенец, [ROOT.Char.Custom('BantamStoryHerHis')] пение уже не такое звучное и ровное, как несколько лет назад.\n\nЯ нежно поглаживаю [ROOT.Char.Custom('BantamStoryHerHis')] [ROOT.Char.Custom('BantamColor')] тело и слушаю, как [ROOT.Char.Custom('BantamStorySheHe')] тихо щебечет и пытается расправить крылья, но, когда наступает тишина, я понимаю, что следующим утром меня уже не разбудит [ROOT.Char.Custom('BantamStoryHerHis')] щебетание."
 ek_pet_animal.3199.a:0 "[ROOT.Char.Custom('BantamStoryName')], мне будет тебя не хватать!"
 
 pet_bantam_decision:0 "[ROOT.Char.Custom('BantamStoryName')]: погладить"
 pet_bantam_decision_desc:0 "Я знаю, как [ROOT.Char.Custom('BantamStoryName')] любит вразвалку ходить вокруг меня, и мне всегда отрадно наблюдать, как [ROOT.Char.Custom('BantamStorySheHe')] весело поёт и ласкается. Да, на уход и еду уходит много труда и денег, но я знаю: что бы ни случилось, [ROOT.Char.Custom('BantamStorySheHe')] всегда будет со мной!"
 pet_bantam_decision_tooltip:0 "Погладить бентамского гуара"
 pet_bantam_decision_confirm:0 "Погладить бентамского гуара"
 
 # You pet your bantam guar :)
 ek_pet_animal.3501.t:0 "[ROOT.Char.Custom(BantamStoryName')]: приятное время вместе"
 ek_pet_animal.3501.desc:0 "Войдя в комнату, я тут же слышу, как [ROOT.Char.Custom('BantamStoryName')] радостно щебечет.\n\nС улыбкой на лице я впускаю [ROOT.Char.Custom('BantamStoryHerHis')] и даю расправить крылья, прежде чем идти.\n[ROOT.Char.Custom('BantamStoryName')] делает несколько кругов по комнате, прежде чем потереться о мои ноги своим крохотным тельцем.\n\nЯ смеюсь, и чувствую, как тяжесть этого мира перестаёт давить мне на плечи."
 ek_pet_animal.3501.a:0 "Милашка!"
 
 ek_pet_animal.3502.desc:0 "Держа в руках любимое лакомство моего бентамского гуара по кличке [ROOT.Char.Custom('BantamStoryName')], я вхожу в свой маленький сад, где [ROOT.Char.Custom('BantamStorySheHe')] проводит большую часть времени.\nВскоре после того, как [ROOT.Char.Custom('BantamStoryName')] замечает меня или, может быть, фрукты у меня в руке, [ROOT.Char.Custom('BantamStorySheHe')] начинает радостно щебетать и бегать вокруг меня.\nЗатем [ROOT.Char.Custom('BantamStorySheHe')] взбирается мне на ногу и хватает лакомство из руки.\n\nМне становится лучше, я смеюсь и уже чувствую, как [Select_CString(ROOT.Char.IsFemale, 'готова', 'готов')] ко всему, что предложит мне этот мир."
 ek_pet_animal.3502.a:0 "Оставь и мне, [ROOT.Char.Custom('BantamStoryName')]!"

