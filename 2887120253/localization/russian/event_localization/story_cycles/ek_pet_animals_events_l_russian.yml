 vvardvark_name_master_scaly_tale:0 "Господин Чешуйчатых Историй"

 ek_pet_animal.4001.t:0 "Пеплозуб"
 ek_pet_animal.4001.desc:1 "Пеплозуб ходит по комнате, весело обнюхивая окружение, и я думаю, как бы [ROOT.Char.Custom('VvardvarkStoryHerHis')] назвать? Что-нибудь историческое? Что-то, намекающее на [ROOT.Char.Custom('VvardvarkStoryHerHis')] крохотное  [ROOT.Char.Custom('VvardvarkColor')] тело? Что-нибудь, что передаст то умиротворение, что я испытываю, когда [ROOT.Char.Custom('VvardvarkStorySheHe')] ходит вразвалку рядом со мной?\n\nО, знаю! Назову [ROOT.Char.Custom('VvardvarkStoryHerHis')]… "
 ek_pet_animal.4001.a:1 "Какое чудесное имя!"
 
 ### Random vvardvark events
 # You eat some fruits with your vvardvark, smol health modifier
 ek_pet_animal.4101.t:0 "[ROOT.Char.Custom('VvardvarkStoryName')]: свежие фрукты"
 ek_pet_animal.4101.desc:0 "Я [Select_CString(ROOT.Char.IsFemale, 'завела', 'завёл')] себе новую привычку: конец дня я и [ROOT.Char.Custom('VvardvarkStoryName')] проводим вместе за трапезой свежими фруктами.\n\nНе знаю в чём причина: может быть в фруктах, а может во времени, которое я и [ROOT.Char.Custom('VvardvarkStorySheHe')] проводим вместе, но я ощущаю себя более [Select_CString(ROOT.Char.IsFemale, 'здоровой и энергичной', 'здоровым и энергичным')]!"
 ek_pet_animal.4101.a:0 "Оставь мне немного, [ROOT.Char.Custom('VvardvarkStoryName')]!"
 
 # Your Vvardvark goes with you into battle!
 ek_pet_animal.4102.t:0 "[ROOT.Char.Custom('VvardvarkStoryName')]: зубы и язык"
 ek_pet_animal.4102.desc:0 "Мой пеплозуб, [ROOT.Char.Custom('VvardvarkStoryName')], в своей отваге не знает пределов! В масштабных битвах ли, мелких стычках или даже поединках, [ROOT.Char.Custom('VvardvarkStorySheHe')] всюду сопровождает меня и дерётся бок о бок.\n\nМои противники, даже мои товарищи, кажется, опасаются [ROOT.Char.Custom('VvardvarkStoryHerHis')], и не раз я [Select_CString(ROOT.Char.IsFemale, 'выходила', 'выходил')] победителем, благодаря тому, что их отвлекало [ROOT.Char.Custom('VvardvarkStoryHerHis')] [ROOT.Char.Custom('VvardvarkColor')] тело или же раны от  [ROOT.Char.Custom('VvardvarkStoryHerHis')] лап."
 ek_pet_animal.4102.a:0 "Со мной в гущу битвы!"
 
 # Your Vvardvark attacked a vassal! Wound or possibly an eye removal
 ek_pet_animal.4103.t:0 "[ROOT.Char.Custom('VvardvarkStoryName')]: не в бровь, а в глаз"
 ek_pet_animal.4103.desc_wounded:0 "Тронный зал охвачен ужасом! Пока [vassal.GetName] [Select_CString(vassal.IsFemale, 'ожидала', 'ожидал')] у меня аудиенции, мой пеплозуб, [ROOT.Char.Custom('VvardvarkStoryName')], как будто ни с того ни с сего напал на н[vassal.GetHerHis]!\n\n[vassal.GetFirstName] [Select_CString(vassal.IsFemale, 'сумела', 'сумел')] выбежать из зала, хоть и с серьёзным ранением…"
 ek_pet_animal.4103.desc_eye_removed_not_one_eyed:0 "Тронный зал охвачен ужасом! Пока [vassal.GetName] [Select_CString(vassal.IsFemale, 'ожидала', 'ожидал')] у меня аудиенции, мой пеплозуб, [ROOT.Char.Custom('VvardvarkStoryName')], как будто ни с того ни с сего напал на н[vassal.GetHerHis]!\n\nРаздался оглушительный вопль, и после того как пеплозуба выдворили из зала, видно было, как [vassal.GetFirstName] закрывает окровавленной рукой один глаз…"
 ek_pet_animal.4103.desc_eye_removed_one_eyed:0 "Тронный зал охвачен ужасом! Пока [vassal.GetName] [Select_CString(vassal.IsFemale, 'ожидала', 'ожидал')] у меня аудиенции, мой пеплозуб, [ROOT.Char.Custom('VvardvarkStoryName')], как будто ни с того ни с сего напал на н[vassal.GetHerHis]!\n\nРаздался оглушительный вопль, и после того как пеплозуба выдворили из зала, видно было, как [vassal.GetFirstName] закрывает окровавленной рукой единственный глаз.\n\n«Я НИЧЕГО НЕ ВИЖУ, — [Select_CString(vassal.IsFemale, 'кричала она', 'кричал он')]. — ЭТО ВСЁ ТЫ И ТВОЯ ДУРАЦКАЯ СВИНЬЯ!»"
 ek_pet_animal.4103.a:0 "Надеюсь, [vassal.GetFirstName] поправится…"
 ek_pet_animal.4103.b:0 "О нет…"
 
 # Vvardvark dies :(
 ek_pet_animal.4199.t:0 "[ROOT.Char.Custom('VvardvarkStoryName')]: печальный день"
 ek_pet_animal.4199.desc:0 "[ROOT.Char.Custom('VvardvarkStoryName')] уже давно не детёныш, [ROOT.Char.Custom('VvardvarkStoryHerHis')] мычание и сопение уже не такое звучное и ровное, как несколько лет назад.\n\nЯ нежно поглаживаю [ROOT.Char.Custom('VvardvarkStoryHerHis')] [ROOT.Char.Custom('VvardvarkColor')] тело и слушаю, как [ROOT.Char.Custom('VvardvarkStorySheHe')] тихо дышит и пытается облизать свой нос, но, когда наступает тишина, я понимаю, что следующим утром меня уже не разбудит прикосновение [ROOT.Char.Custom('VvardvarkStoryHerHis')] языка."
 ek_pet_animal.4199.a:0 "[ROOT.Char.Custom('VvardvarkStoryName')], мне будет тебя не хватать!"
 
 pet_vvardvark_decision:0 "[ROOT.Char.Custom('VvardvarkStoryName')]: погладить"
 pet_vvardvark_decision_desc:0 "Я знаю, как [ROOT.Char.Custom('VvardvarkStoryName')] любит расхаживать вокруг меня, и мне всегда отрадно наблюдать, как [ROOT.Char.Custom('VvardvarkStorySheHe')] издаёт звуки радости и ласкается. Да, на уход и еду уходит много труда и денег, но я знаю: что бы ни случилось, [ROOT.Char.Custom('VvardvarkStorySheHe')] всегда будет со мной!"
 pet_vvardvark_decision_tooltip:0 "Погладить пеплозуба"
 pet_vvardvark_decision_confirm:0 "Погладить пеплозуба"
 
 # You pet your vvardvark :)
 ek_pet_animal.4501.t:0 "[ROOT.Char.Custom('VvardvarkStoryName')]: приятное время вместе"
 ek_pet_animal.4501.desc:0 "Войдя в комнату, я тут же вижу, как [ROOT.Char.Custom('VvardvarkStoryName')] радостно облизывается.\n\nС улыбкой на лице я впускаю [ROOT.Char.Custom('VvardvarkStoryHerHis')] и даю покататься по полу, прежде чем идти.\n[ROOT.Char.Custom('VvardvarkStoryName')] делает несколько кругов по комнате, прежде чем потереться о мои ноги своим крохотным тельцем.\n\nЯ смеюсь, и чувствую, как тяжесть этого мира перестаёт давить мне на плечи."
 ek_pet_animal.4501.a:0 "Давай, иди сюда!"
 
 ek_pet_animal.4502.desc:0 "Держа в руках любимое лакомство моего пеплозуба по кличке [ROOT.Char.Custom('VvardvarkStoryName')], я вхожу в свой маленький сад, где [ROOT.Char.Custom('VvardvarkStorySheHe')] проводит большую часть времени.\nВскоре после того, как [ROOT.Char.Custom('VvardvarkStoryName')] замечает меня или, может быть, фрукты у меня в руке, [ROOT.Char.Custom('VvardvarkStorySheHe')] начинает радостно перекатываться и бегать вокруг меня.\nЗатем [ROOT.Char.Custom('VvardvarkStorySheHe')] взбирается мне на ногу и хватает лакомство из руки.\n\nМне становится лучше, я смеюсь и уже чувствую, как [Select_CString(ROOT.Char.IsFemale, 'готова', 'готов')] ко всему, что предложит мне этот мир."
 ek_pet_animal.4502.a:0 "Оставь и мне, [ROOT.Char.Custom('VvardvarkStoryName')]!"

