 vvardvark_story_modifier:0 "Питомец-пеплозуб"
 vvardvark_story_modifier_desc:0 "Этот персонаж наслаждается компанией чудного, но милого существа, сопровождающего его всюду, куда бы он ни пошёл"
 vvardvark_story_eating_fruit_modifier:0 "Ест свежие фрукты вместе с пеплозубом"
 vvardvark_story_eating_fruit_modifier_desc:0 "Этот персонаж любит делить трапезу с пеплозубом, поедая свежие фрукты"
 vvardvark_story_fighting_with_you_modifier:0 "Боевой пеплозуб"
 vvardvark_story_fighting_with_you_modifier_desc:0 "В бою этого персонажа всегда сопровождает пеплозуб, который ходит где-то неподалёку, отвлекая врагов и иногда досаждая им."
 
