l_russian:
 ek_religious_decision.1013.t:0 "Контакт с тотемным духом"
 ek_religious_decision.1013.desc.beginning:1 "Я [Select_CString(ROOT.Char.IsFemale, 'провела', 'провёл')] много ночей, с нетерпением ожидая, когда наша мудрая женщина завершит свой контакт.\n\nЯ едва не [Select_CString(ROOT.Char.IsFemale, 'начала', 'начал')] забывать об этом, прежде чем она наконец вызвала меня после нескольких дней ритуального транса. Она сообщила, что уверена в этом предсказании: «Значение знаков очевидно, — она начала свой рассказ. —"
 ek_religious_decision.1013.desc.great_battle:0 "Великая битва ожидает наш клан»."
 ek_religious_decision.1013.desc.new_friends:0 "Пришло время для нашего клана залечить старые раны и завести новых друзей»."
 ek_religious_decision.1013.desc.hard_work:0 "Тяжёлый труд сулит великую выгоду для нашего клана в будущем»."
 ek_religious_decision.1013.desc.betrayal:0 "Наши представления о наших союзниках отличаются от действительности»."
 ek_religious_decision.1013.desc.new_beginnings:0 "Пришло время для нового начала, с открытым разумом»."
 ek_religious_decision.1013.a:0 "Отлично. Благодарю тебя, мудрая женщина."

 ek_religious_decision.1014.t:0 "Даэдрическая сделка"
 ek_religious_decision.1014.desc:0 "Пришлось потратить много денег, времени и усилий, но я наконец-то [Select_CString(ROOT.Char.IsFemale, 'получила', 'получил')] возможность призвать Сангвина, чтобы переговорить об условиях нашей сделки.\n\nОн предстаёт передо мной с выразительной ухмылкой на его вызывающем трепет лице. «Так ты [Select_CString(ROOT.Char.IsFemale, 'устала, смертная', 'устал, смертный')]? Моё проклятие слишком тяжело давит на твою несчастную хрупкую душу? Теперь ты выполнишь свою часть сделки?»"
 ek_religious_decision.1014.c:0 "Всем своим сердцем, да!"

 ek_religious_decision.1015.t:0 "Собор Восьми"
 ek_religious_decision.1015.desc.nord:0 "«Некоторые противоречия, в частности, вопрос Акатоша и Алдуина, только предстоит решить, но этот Собор верит, что, так как наиболее важные обряды и организации, посвящённые Акатошу, останутся в Сиродиле, а доктринальных проблем с другими #LORE [Concept('compendium_divines', 'Божествами')]#! нет, этот вопрос можно отложить до наступления «Бесконечной поры», описываемой в нордской теологии».\n\nАдресатом [arch_primate.GetHerHis] заключительных слов становятся [root_faith.BishopNeuterPlural]: «Но норды — народ благоразумный. Я уверен, что мы можем позволить диоцезу Скайрима принимать решения о деталях самостоятельно».\n\nНа этих словах завершается длительное заседание Собора, и отныне мы считаемся его полноправными членами. Собравшееся духовенство расходится под одобрительный гул, но некоторые [root_faith.PriestNeuterPlural] падают ниц и вскрикивают: \n\n #italic «Слава Скайриму! Слава Божествам!»#!"
 ek_religious_decision.1015.desc.nedic:0 "«Пожалуй, отправка миссионеров в Чернотопье станет достойным экуменическим предприятием, поскольку в данный момент там наблюдается нехватка религиозных организаций. Как и всех прочих организаций, в общем-то. Для нас также будет важно построить там храмы Акатоша, главное — возвести их на века…»\n\n[arch_primate.GetSheHe|U] поворачивается туда, где собрались [root_faith.GetNameNoTooltip]ие [root_faith.BishopNeuterPlural], и кивает головой. «Неважно. Блудные дети Алессии, мы вновь приветствуем вас у тепла Драконьих огней».\n\nНа этих словах завершается длительное заседание Собора, и отныне мы считаемся его полноправными членами. Собравшееся духовенство расходится под одобрительный гул, но некоторые [root_faith.PriestNeuterPlural] падают ниц и вскрикивают: \n\n #italic «Слава Дибе-Маре-Кин! Слава Божествам!»#!"
 ek_religious_decision.1015.desc.reman:0 "«Реман был не столько богом, — слегка осторожно говорит [arch_primate.GetNameNoTooltip], повышая тон голоса, — сколько любимцем богов, парагоном #LORE [Concept('compendium_divines', 'Восьми божеств')]#! и следующим после Алессии воплощением монарха — божественного избранника».\n\n[arch_primate.GetSheHe|U] поворачивается туда, где собрались мои [root_faith.PriestNeuterPlural] и [root_faith.BishopNeuterPlural], и добавляет: «При условии, что это будет разъяснено прихожанам, мы не видим проблемы в дальнейшем существовании тайного культа реманитов, и с этих пор [root_faith.GetAdherentNamePluralNoTooltip] получат возможность литургического общения с нашей конфессией».\n\nНа этих словах завершается длительное заседание Собора, и отныне мы считаемся его полноправными членами. Собравшееся духовенство расходится под одобрительный гул, но некоторые [root_faith.PriestNeuterPlural] падают ниц и вскрикивают:\n\n #italic «Слава Реману! Слава Божествам!»#!"
 ek_religious_decision.1015.desc.base:0 "«Верующие, именующие себя [root_faith.GetAdherentNamePluralNoTooltip], принадлежат к новой церкви, за которой не стоит древняя традиция и народные религиозные практики, однако за короткое время они проявили себя как истинные верующие в наших богов. Любой намёк на ересь должно искоренять, — на этих словах архипримас осматривает собравшихся в поисках недовольных, — а все прочие… доктринальные разногласия могут быть вынесены на этом великом Соборе, когда придёт время».\n\nНа этих словах завершается длительное заседание Собора, и отныне мы считаемся его полноправными членами. Собравшееся духовенство расходится, но я замечаю, что не все, похоже, согласны с этим решением. Но придёт время, и мы, [root_faith.GetAdherentNamePluralNoTooltip], начнём пользоваться уважением. Меж тем некоторые [root_faith.PriestNeuterPlural] падают ниц и вскрикивают:\n\n #italic «Славься, [root_faith.HighGodName]! Слава Божествам!»#!"
 ek_religious_decision.1015a:0 "Объединение конфессии…"
 ek_religious_decision.1015b:0 "…станет достойной частью моего наследия!"

 ek_religious_decision.1016.t:0 "Новый диоцез"
 ek_religious_decision.1016.desc:0 "Новости из Сиродила!\n\nСобор Восьми, авторитетная религиозная организация, объединяющие разные течения поклоняющихся #LORE [Concept('compendium_divines', 'Божествам')|E]#!, обрёл нового члена. Большая делегация, в которой были [root_faith.PriestNeuterPlural] и [root_faith.BishopNeuterPlural], прибывшие из провинции [faith_ruler.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip], которую [Select_CString(faith_ruler.IsFemale, 'спонсировала', 'спонсировал')] [faith_ruler.GetNameNoTooltip], посетила великое заседание Собора в Имперском городе. После длительных переговоров и дебатов о доктринах, архипримас [arch_primate.GetFirstNameNoTooltip] [Select_CString(arch_primate.IsFemale, 'объявила', 'объявил')] о достигнутом согласии:\n\nКонфессия [root_faith.GetAdjectiveNoTooltip] отныне интегрирована в сиродильскую церковную иерархию, она считается полноправным членом Собора Восьми и будет подчиняться его авторитету в вопросах веры. Это должно укрепить религиозные связи между различными диоцезами религии Восьми божеств и улучшить дипломатические отношение между светскими правителями, принадлежащими к этим конфессиям."
 ek_religious_decision.1016a:0 "Слава Восьми!"
 ek_religious_decision.1016b:0 "Занимательно… Стоит ли нам тоже это обдумать?"
 ek_religious_decision.1016c:0 "Ба, глупцы собрались вместе!"
 ek_religious_decision.1016d:0 "Я не понимаю, какое это имеет для нас значение."
 
 ek_religious_decision.1017.t:0 "Чумная благодать"
 ek_religious_decision.1017.desc:0 "Как и следовало ожидать, Князь Чумы ответил на мои молитвы. Я слышу его голос в своей голове, словно злокрысий шорох, а моя кожа покрывается мурашками от одной мысли о его божественном прикосновении.\n\nПришло время вновь ощутить преобразовательную силу болезни и расцвести в той форме, которую изберёт для меня сегодня Периайт."
 ek_religious_decision.1017.a:0 "Я [Select_CString(ROOT.Char.IsFemale, 'готова', 'готов' )]"
 ek_religious_decision.1017.a.t:0 "За ваш [Concept( 'piety_level', 'уровень набожности' )|E] Периайт благословит вас лёгкой болезнью."
 ek_religious_decision.1017.b:0 "Я [Select_CString(ROOT.Char.IsFemale, 'готова', 'готов' )]"
 ek_religious_decision.1017.b.t:0 "За ваш [Concept( 'piety_level', 'уровень набожности' )|E] Периайт благословит вас болезнью на свой выбор."
 ek_religious_decision.1017.c:0 "Я [Select_CString(ROOT.Char.IsFemale, 'готова', 'готов' )]"
 ek_religious_decision.1017.c.t:0 "За ваш [Concept( 'piety_level', 'уровень набожности' )|E] Периайт благословит вас болезнью на свой выбор, это может привести к небольшой эпидемии."
 ek_religious_decision.1017.d:0 "Я [Select_CString(ROOT.Char.IsFemale, 'готова', 'готов' )]"
 ek_religious_decision.1017.d.t:0 "За ваш [Concept( 'piety_level', 'уровень набожности' )|E] Периайт благословит вас болезнью на свой выбор, это может привести к серьёзной эпидемии."
 ek_religious_decision.1017.e:0 "Я [Select_CString(ROOT.Char.IsFemale, 'готова', 'готов' )]"
 ek_religious_decision.1017.e.t:0 "За ваш [Concept( 'piety_level', 'уровень набожности' )|E] Периайт благословит вас болезнью на свой выбор, это может привести к апокалиптической эпидемии."
 
