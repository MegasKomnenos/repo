l_russian:

 #heritage_aldmeri_name:0 "Aldmeri"
 heritage_aldmeri_name:0 "[Select_CString( Or(Not(GetVariableSystem.HasValue( 'ek_ruler_designer_open', 'true' ) ), GetVariableSystem.HasValue( 'ek_race', Localize('RACE_MER') ) ), 'Альдмерск', Localize('no') )]"

 heritage_aldmeri_collective_noun:0 "Альдмеры"
 heritage_aldmeri_desc:0 "Альдмеры занимают особое место среди детей эльнофей. Они беспрестанно стремятся возродить утраченное величие прошедших веков. Заселение островов Саммерсет они начали в #LORE [Concept('compendium_merethic_era', 'Меретическую эру')]#! , первым основав город Фёстхолд на Ауридоне. Впоследствии в их обществе появлялось множество волн инакомыслящих, отплывавших на континент. Клан Кореланья судьба вела в лежавшие за морем земли Хегата, а каймеры в своём путешествии дошли до Ресдайна, далеко на востоке. Ещё позже клан Диренни переселился на Балфиеру.\n\nТе из жителей Саммерсета, кто остался, — их ныне называют альтмерами — развили общество с ярко выраженной социальной стратификацией. Апраксичные изгои несут наказание за нарушение социальных норм. Альтмеры крайне самодостаточны, и, пока Ауридон более или менее расположен к чужеземцам, Алинор — это тщательно оберегаемое сердце их земель. Напротив, балфиерцы Хай-Рока отличаются большей открытостью ума, и даже сочетались браком с дворянами других культур — нечто совершенно немыслимое для острова их предков, Саммерсета."

 #heritage_ayleid_name:0 "Ayleid"
 heritage_ayleid_name:0 "[Select_CString( Or(Not(GetVariableSystem.HasValue( 'ek_ruler_designer_open', 'true' ) ), Or(GetVariableSystem.HasValue( 'ek_race', Localize('RACE_MER') ),GetVariableSystem.HasValue( 'ek_race', Localize('RACE_MAN') ) ) ), 'Айлейдск', Localize('no') )]"

 heritage_ayleid_collective_noun:0 "Айлейды"
 heritage_ayleid_desc:0 "Айлейды, также известные как салиачи, дикие эльфы и высокие эльфы центрального Сиродила, — народ с запутанной и обросшей легендами историей, что логично вытекает из множества их имён. Истоки их цивилизации тянутся к альдмерским колонистам Альд-Сирода. Города-государства, в которых жили айлейды, отличались великим многообразием и склочными взаимоотношениями между собой — каждый из них стремился быть настолько непохожим на другие, насколько это вообще было возможно. Так называемая кровавая Империя айлейдов, Императум Салиачи, что свергла Алессия, была скорее не самостоятельным государством, но конгломератом союзных айлейдских городов и их вассалов.\n\nАйлейды, некогда пресытившиеся жизнью волшебники и искусники с неуёмной страстью к жестокому и диковинному, ныне лишь беженцы в поисках пристанища, мечтающие о давно потерянной родине в тени Бело-Золотой."

 #heritage_falmeri_name:0 "Falmeri"
 heritage_falmeri_name:0 "[Select_CString( Or(Not(GetVariableSystem.HasValue( 'ek_ruler_designer_open', 'true' ) ), Or(GetVariableSystem.HasValue( 'ek_race', Localize('RACE_MER') ),GetVariableSystem.HasValue( 'ek_race', Localize('RACE_MAN') ) ) ), 'Фалмерск', Localize('no') )]"
 heritage_falmeri_collective_noun:0 "Фалмеры"
 heritage_falmeri_desc:0 "Фалмеры, или «снежные эльфы» — это бледнокожие меры альдмерского происхождения, коренные жители земель, которые сейчас зовутся Скайримом. После разрушения Саартала и событий Возвращения, разрозненные фалмеры были сокрушены, их подвергли истреблению или обращению в рабство переселенцы-норды, оставив лишь незначительные памятники их цивилизации. Считается, что они вымерли или по крайней мере где-то скрываются, однако некоторые свидетельства говорят о встречах с некими бледного цвета мерами; однако описание этих призрачных убийц скота с большим трудом вписывается в определение эльфов."

 #heritage_dwemeri_name:0 "Dwemeri"
 heritage_dwemeri_name:0 "[Select_CString( Or(Not(GetVariableSystem.HasValue( 'ek_ruler_designer_open', 'true' ) ), Or(GetVariableSystem.HasValue( 'ek_race', Localize('RACE_MER') ),GetVariableSystem.HasValue( 'ek_race', Localize('RACE_MAN') ) ) ), 'Двемерск', Localize('no') )]"
 heritage_dwemeri_collective_noun:0 "Двемеры"
 heritage_dwemeri_desc:0 "Двемеры некогда населяли весь северный Тамриэль: от песков Хаммерфелла до пепельных земель Морровинда, уединённо живя в своих подземных городах.\n\nВ их глазах не существовало бога достойного их почитания, а религиозные устремления других разумных рас для глубинного народа казались странностью. Им, в свою очередь, хотелось раскрывать тайны Аурбиса и искать путь к более высокой ступени бытия. То, с какой лёгкостью они использовали древние свитки, показывает сколь велико было их знание секретов мироздания.\n\nОбитатели двемерских владений полагались на анимункулов из нержавеющего металла, автоматонов работающих на энергии пара и камней душ. Как правило, поселения глубинного народа были независимы и автономны, однако существуют сведения о великих двемерских королевствах в Воленфелле и Вварденфелле.\n\nДвемеры полностью исчезли после битвы у Красной горы в 700 год Первой эры."

 #heritage_bosmeri_name:0 "Bosmeri"
 heritage_bosmeri_name:0 "[Select_CString( Or(Not(GetVariableSystem.HasValue( 'ek_ruler_designer_open', 'true' ) ), Or(GetVariableSystem.HasValue( 'ek_race', Localize('RACE_MER') ),GetVariableSystem.HasValue( 'ek_race', Localize('RACE_MAN') ) ) ), 'Босмерск', Localize('no') )]"
 heritage_bosmeri_collective_noun:0 "Босмеры"
 heritage_bosmeri_desc:0 "Босмеры — раса эльфов из Валенвуда, обитатели покрытого лесами юго-запада Тамриэля, живущие клановым устройством. Во время событий #LORE [Concept('compendium_dawn_era', 'эры Рассвета')]#! И'ффре слепил их из первородного #LORE [Concept('compendium_ooze', 'ила')]#! в обмен на требование соблюдать Зелёный пакт, запрещающий наносить вред растениям в пределах Валенвуда и предписывающий строгую плотоядную диету. Типичные представители этого народа отличаются низким ростом, загорелой кожей, у них могут присутствовать рога, а глаза — либо с вытянутыми зрачками, либо чёрные словно ночь. Эти прирождённые лучники принадлежат тесно сплочённым кланам, а испытания, посланные природой и междоусобные конфликты закаляют их.\n\nТочкой отсчёта для конца #LORE [Concept('compendium_merethic_era', 'Меретической эры')]#! стало именно объединение провинции под единой властью Эплира Каморана — событие, которое можно считать зенитом истории босмеров. Пройдёт время, и к концу #LORE [Concept('compendium_first_era', 'Первой эры')]#! Валенвуд будет завоёван Империей Ремана, и какие-то из его обитателей отрекутся от традиционного уклада в пользу обычаев альтмеров или сиродильцев. Ко времени #LORE [Concept('compendium_second_era', 'Второй эры')]#! клан Каморанов пребывает в ослабленном состоянии, однако его члены всё ещё удерживают обширные территории и грызутся между собой за то, чтобы в наступившем Междуцарствии вновь обрести титул Короля-Оленя."

 #heritage_chimeri_name:0 "Chimeri"
 heritage_chimeri_name:0 "[Select_CString( Or(Not(GetVariableSystem.HasValue( 'ek_ruler_designer_open', 'true' ) ), Or(GetVariableSystem.HasValue( 'ek_race', Localize('RACE_MER') ),GetVariableSystem.HasValue( 'ek_race', Localize('RACE_MAN') ) ) ), 'Каймерск', Localize('no') )]"
 heritage_chimeri_collective_noun:0 "Каймеры"
 heritage_chimeri_desc:0 "Тысячи лет тому назад в #LORE [Concept('compendium_merethic_era', 'Меретическую эру')]#! один мер по имени Велот получил откровение. Согласно ему, он должен был отправиться на восток вместе со всеми, кто его послушает. И вскоре такие нашлись: по всем островам Саммерсет Велот собрал инакомыслящих, которые хотели отвергнуть привычный альтмерский пантеон аэдра в пользу свободного поклонения #LORE [compendium_daedra|l]#!.\n\nВ процессе этого исхода велотийцы проявляли себя, преодолевая испытания своей веры: даже король-бог был не в силах остановить их переселение! Наконец они достигли точки назначения — земель Ресдайна. С течением времени их покровители — «Хорошие Даэдра»: Азура, Мефала и Боэтия — научили их урокам: пророчеству, предательству и интригам. Под их руководством они выстроили процветающую цивилизацию, невзирая на междоусобицы и конкуренцию за ресурсы с воинственными людьми и безбожниками-двемерами.\nОни стали каймерами — «северным народом»."

 #heritage_dunmeri_name:0 "Dunmeri"
 heritage_dunmeri_name:0 "[Select_CString( Or(Not(GetVariableSystem.HasValue( 'ek_ruler_designer_open', 'true' ) ), Or(GetVariableSystem.HasValue( 'ek_race', Localize('RACE_MER') ),GetVariableSystem.HasValue( 'ek_race', Localize('RACE_MAN') ) ) ), 'Данмерск', Localize('no') )]"
 heritage_dunmeri_collective_noun:0 "Данмеры"
 heritage_dunmeri_desc:0 "Родина пепельнокожих красноглазых данмеров — Морровинд, мрачная земля в северо-восточной части Тамриэля. Свой облик и название они получили после того, как их предки, $chimer_collective_noun$, были прокляты в ходе событий, последовавших за битвой у Красной горы. С тех пор большинство данмеров живут под властью Совета Великих домов под взором Храма Трибунала. Однако существуют и эшлендеры, придерживающиеся древнего велотийского пантеона и поругающие АЛЬМСИВИ как ложных богов и предателей.\n\nВо времена #LORE [Concept('compendium_second_era', 'Второй эры')]#! Морровинд сосредоточен на происходящем внутри страны, и потому он не ощутил последствия падения потентата так же сильно, как и прочие. Могущество Великих домов велико и они пользуются поддержкой Живых Богов, но пути их неисповедимы, и малые дома могут пошатнуть статус-кво, если поймут, в какую сторону дуют ветра перемен."

 #heritage_maormeri_name:0 "Maormeri"
 heritage_maormeri_name:0 "[Select_CString( Or(Not(GetVariableSystem.HasValue( 'ek_ruler_designer_open', 'true' ) ), Or(GetVariableSystem.HasValue( 'ek_race', Localize('RACE_MER') ),GetVariableSystem.HasValue( 'ek_race', Localize('RACE_MAN') ) ) ), 'Маормерск', Localize('no') )]"
 heritage_maormeri_collective_noun:0 "Маормеры"
 heritage_maormeri_desc:0 "Маормеры — потомки альдмеров-бунтовщиков, изнгнанных с #LORE[Concept('compendium_aldmeris', 'Альдмериса')]#! на Пиандонею за преступление, выражавшееся в желании перемен. Общепризнанно считается, что их возглавляет король-бог Оргнум, но далеко не все маормеры признают его духовное или светское главенство. И в самом деле, многие представители этого народа-изгоя не имели ничего общего с Оргнумом и его восстанием, но альдмеры просто собрали всех инакомыслящих вместе и изгнали на юг, за завесу тумана.\nСейчас в Пиандонее неспокойно, её терзают раздоры между религиозными сторонниками Оргнума с главного острова и инакомыслящими жителями островов поменьше, которые всё ещё держатся за вычурный альдмерский образ мышления. Родина маормеров не знает мира: острова воюют друг с другом, пока сторонники Оргнума стремятся удовлетворить его переменчивую волю — таков он, их таинственный хозяин."

 #heritage_khajiiti_name:0 "Khajiiti"
 heritage_khajiiti_name:0 "[Select_CString( Or(Not(GetVariableSystem.HasValue( 'ek_ruler_designer_open', 'true' ) ), GetVariableSystem.HasValue( 'ek_race', Localize('RACE_KHAJIIT') ) ), 'Каджитск', Localize('no') )]"
 heritage_khajiiti_collective_noun:0 "Каджиты"
 heritage_khajiiti_desc:0 "Кошачий народ каджитов (в переводе с та'агра — «пустынные странники») — коренное население Эльсвейра, страны пустынь и джунглей. Архетипичные представители каджитов — человекоподобные катай — являются лишь одной из множества их форм-пород, которые каджит обретает при рождении в зависимости от текущей фазы Лун. \n\nМногообразие каджитских обличий не уступает глубине их культуры, которую примерно подразделяют по границе природных зон южного и северного Эльсвейра."

 #heritage_tsaesci_name:0 "Tsaesci"
 heritage_tsaesci_name:0 "[Select_CString( Or(Not(GetVariableSystem.HasValue( 'ek_ruler_designer_open', 'true' ) ), Or(GetVariableSystem.HasValue( 'ek_race', Localize('RACE_MER') ),GetVariableSystem.HasValue( 'ek_race', Localize('RACE_MAN') ) ) ), 'Цаэсск', Localize('no') )]"
 heritage_tsaesci_collective_noun:0 "Цаэски"
 heritage_tsaesci_desc:0 "Дом цаэски — это пышные изумрудные долины Акавира, хотя их предки некогда жили по другую сторону Падомаического океана. Ключевая черта всех культур цаэски — их приверженность к искусству и философии цаэссенции. Жуткая, но изящная практика, которую очерняют те, кто её не понимает."

 #heritage_atmoran_name:0 "Atmoran"
 heritage_atmoran_name:0 "[Select_CString( Or(Not(GetVariableSystem.HasValue( 'ek_ruler_designer_open', 'true' ) ), Or(GetVariableSystem.HasValue( 'ek_race', Localize('RACE_MER') ),GetVariableSystem.HasValue( 'ek_race', Localize('RACE_MAN') ) ) ), 'Атморск', Localize('no') )]"
 heritage_atmoran_collective_noun:0 "Атморцы"
 heritage_atmoran_desc:0 "Горяч и воинственен народ нордов — потомков последних переселенцев в Скайрим из Атморы. Впервые они прибыли в Тамриэль под предводительством Исграмора, и хотя поначалу отношения с местными фалмерами выстраивались в мирном ключе, норды вскоре мечом покорили весь Скайрим, после того как снежные эльфы уничтожили их первый город — Саартал. Это люди отважные и стойкие; по всему Тамриэлю они славятся как лучшие солдаты и воители. Сами себя норды считают извечными чужеземцами и захватчиками: они не чувствуют родства с покорёнными народами, даже когда правят ими."

 #heritage_old_breton_name:0 "Old Breton"
 heritage_old_breton_name:0 "[Select_CString( Or(Not(GetVariableSystem.HasValue( 'ek_ruler_designer_open', 'true' ) ), Or(GetVariableSystem.HasValue( 'ek_race', Localize('RACE_MER') ),GetVariableSystem.HasValue( 'ek_race', Localize('RACE_MAN') ) ) ), 'Древнебретонск', Localize('no') )]"
 heritage_old_breton_collective_noun:0 "Древние бретонцы"
 heritage_old_breton_desc:0 "wow much desc"

 #heritage_breton_name:0 "Breton"
 heritage_breton_name:0 "[Select_CString( Or(Not(GetVariableSystem.HasValue( 'ek_ruler_designer_open', 'true' ) ), Or(GetVariableSystem.HasValue( 'ek_race', Localize('RACE_MER') ),GetVariableSystem.HasValue( 'ek_race', Localize('RACE_MAN') ) ) ), 'Бретонск', Localize('no') )]"
 heritage_breton_collective_noun:0 "Бретонцы"
 heritage_breton_desc:0 "Ни один людской народ не чувствует на себе след эльфийской культуры больше, чем бретонцы. И хотя их имя происходит от слова берату («полукровка»), употреблявшегося в период власти клана Диренни, в жилах большинства бретонцев осталось мало крови меров. После битвы при Гленумбрийских пустошах они избавились от гегемонии Диренни и устремились навстречу собственным амбициям.\n\nУ бретонцев есть поговорка: на каждом холме по замку, в каждом замке по королю. Бретонцы рьяно чтут независимость и дух соперничества и готовы на любые риски ради власти. Они гордятся своими познаниями в магии и приверженностью рыцарскому кодексу."

 #heritage_nedic_north_name:0 "North Nedic"
 heritage_nedic_north_name:0 "[Select_CString( Or(Not(GetVariableSystem.HasValue( 'ek_ruler_designer_open', 'true' ) ), Or(GetVariableSystem.HasValue( 'ek_race', Localize('RACE_MER') ),GetVariableSystem.HasValue( 'ek_race', Localize('RACE_MAN') ) ) ), 'Северонедийск', Localize('no') )]"
 heritage_nedic_north_collective_noun:0 "Северные неды"
 heritage_nedic_north_desc:0 "Неды — это собирательный термин для племён коренного человеческого населения Тамриэля, первоначально обитавших в заливе Илиак, южном Скайриме, Сиродиле и Аргонии. Впоследствии многие из этих племён были поглощены или вытеснены в результате волн миграций людей и эльфов. Крупнейшая из существующих популяций недов — это предельцы Предела (эндоним — «Карт»). Некогда он был самостоятельным королевством, пока Реман не поделил его территории между Хай-Роком и Скайримом.\n\nБольшинство из этих народов вымерли, либо находятся на грани исчезновения, но целеустремлённый правитель может возглавить их возрождение…"

 #heritage_nedic_south_name:0 "South Nedic"
 heritage_nedic_south_name:0 "[Select_CString( Or(Not(GetVariableSystem.HasValue( 'ek_ruler_designer_open', 'true' ) ), Or(GetVariableSystem.HasValue( 'ek_race', Localize('RACE_MER') ),GetVariableSystem.HasValue( 'ek_race', Localize('RACE_MAN') ) ) ), 'Южнонедийск', Localize('no') )]"
 heritage_nedic_southe_noun:0 "Южные неды"
 heritage_nedic_south_desc:0 "Неды — это собирательный термин для племён коренного человеческого населения Тамриэля, первоначально обитавших в заливе Илиак, южном Скайриме, Сиродиле и Аргонии. Впоследствии многие из этих племён были поглощены или вытеснены в результате волн миграций людей и эльфов. Крупнейшая из существующих популяций недов — это предельцы Предела (эндоним — «Карт»). Некогда он был самостоятельным королевством, пока Реман не поделил его территории между Хай-Роком и Скайримом.\n\nБольшинство из этих народов вымерли, либо находятся на грани исчезновения, но целеустремлённый правитель может возглавить их возрождение…"

 #heritage_nedic_central_name:0 "Central Nedic"
 heritage_nedic_central_name:0 "[Select_CString( Or(Not(GetVariableSystem.HasValue( 'ek_ruler_designer_open', 'true' ) ), Or(GetVariableSystem.HasValue( 'ek_race', Localize('RACE_MER') ),GetVariableSystem.HasValue( 'ek_race', Localize('RACE_MAN') ) ) ), 'Центральнонедийск', Localize('no') )]"
 heritage_nedic_central_collective_noun:0 "Центральные неды"
 heritage_nedic_central_desc:0 "Неды — это собирательный термин для племён коренного человеческого населения Тамриэля, первоначально обитавших в заливе Илиак, южном Скайриме, Сиродиле и Аргонии. Впоследствии многие из этих племён были поглощены или вытеснены в результате волн миграций людей и эльфов. Крупнейшая из существующих популяций недов — это предельцы Предела (эндоним — «Карт»). Некогда он был самостоятельным королевством, пока Реман не поделил его территории между Хай-Роком и Скайримом.\n\nБольшинство из этих народов вымерли, либо находятся на грани исчезновения, но целеустремлённый правитель может возглавить их возрождение…"

 #heritage_lilmothiit_name:0 "Lilmothiit"
 heritage_lilmothiit_name:0 "[Select_CString( Or(Not(GetVariableSystem.HasValue( 'ek_ruler_designer_open', 'true' ) ), GetVariableSystem.HasValue( 'ek_race', Localize('RACE_LILMOTHIIT') ) ), 'Лилмотитск', Localize('no') )]"
 heritage_lilmothiit_collective_noun:0 "Лилмотиты"
 heritage_lilmothiit_desc:0 "Народ хитроумных лилмотитов, основателей Чёрной Розы и Лилмота, по некоторым сведениям является дальним родственником каджитов и, что уже сомнительно, босмеров. Череда катастроф привела к тому, что эти некогда обитатели всего Чернотопья ныне живут в небольшом количестве на приграничных территориях Мрачнолесья. Они ведут полукочевой образ жизни: их небольшие города-меритократии ведут тесное сотрудничество со скитающимися кланами, объединёнными по родству. Любопытной деталью физиологии лилмотитов является отсутствие внешних признаков полового диморфизма, что находит отражение в их мифах о Лорхане."

 #heritage_cyrodiilic_name:0 "Cyrodiilic"
 heritage_cyrodiilic_name:0 "[Select_CString( Or(Not(GetVariableSystem.HasValue( 'ek_ruler_designer_open', 'true' ) ), Or(GetVariableSystem.HasValue( 'ek_race', Localize('RACE_MER') ),GetVariableSystem.HasValue( 'ek_race', Localize('RACE_MAN') ) ) ), 'Сиродильск', Localize('no') )]"
 heritage_cyrodiilic_collective_noun:0 "Сиродильцы"
 heritage_cyrodiilic_desc:0 "Сиродильцы, или, как их ещё называют, имперцы, — коренные жители сердца Тамриэля, занимавшие доминирующую позицию на культурной и политической арене континента ещё со времён падения империи айлейдов, к кончине которой приложила руку святая Алессия Королева Рабов. Расположение в центральных землях сделало их подверженными влиянию со стороны народов соседних держав, преимущественно нордов и бретонцев. \n\nСиродильцы гордятся своей высокой культурой поведения и всесторонним развитием: они хороши и в военном деле, и в управлении, и в науке. Именно из-под пера имперских учёных (не всегда при этом объективных в своих изысканиях) вышла значительная часть тамриэльской литературы, что является очевидным следствием налаженных путей сообщения и развитой образовательной инфраструктуры. \n Обширность сиродильских земель привела к образованию множества локальных культурных ответвлений, наиболее известными из которых являются коловианцы — жители запада — и нибенейцы с вотчиной на востоке."


 #heritage_yokudan_name:0 "Yokudan"
 heritage_yokudan_name:0 "[Select_CString( Or(Not(GetVariableSystem.HasValue( 'ek_ruler_designer_open', 'true' ) ), Or(GetVariableSystem.HasValue( 'ek_race', Localize('RACE_MER') ),GetVariableSystem.HasValue( 'ek_race', Localize('RACE_MAN') ) ) ), 'Йокуданск', Localize('no') )]"
 heritage_yokudan_collective_noun:0 "Йокуданцы"
 heritage_yokudan_desc:0 "Йокуданцы — людская раса с тёмной кожей и кучерявыми волосами, происходящая из земель Йокуды по ту сторону Эльтерического океана. В раннюю #LORE [Concept('compendium_first_era', 'Первую эру')]#! Yokuda was destroyed as a conclusion of a long series of civil wars, though some scholars dispute it and blame its destruction on natural catastrophic quakes. Это событие вызвало кровавую миграцию йокуданцев за океан, в земли, ныне известные как Хаммерфелл. Сейчас в Тамриэле их называют редгардами, термин, родившийся из искажённого «Ра Гада», «волна воителей»."

 #heritage_orsimeri_name:0 "Orsimeri"
 heritage_orsimeri_name:0 "[Select_CString( Or(Not(GetVariableSystem.HasValue( 'ek_ruler_designer_open', 'true' ) ), Or(GetVariableSystem.HasValue( 'ek_race', Localize('RACE_MER') ),GetVariableSystem.HasValue( 'ek_race', Localize('RACE_MAN') ) ) ), 'Орсимерск', Localize('no') )]"
 heritage_orsimeri_collective_noun:0 "Орсимеры"
 heritage_orsimeri_desc:0 "«Отверженный народ» орсимеров, более известных как орки, — это человекоподобная раса, наделённая зелёной кожей и клыками. Их культура строится вокруг автаркических сообществ — крепостей, которые являются основной политической единицей, формируемой орками. \n\nНаиболее распространённая история о происхождении орков рассказывает, что свой текущий облик они получили после того, как их бога-покровителя Тринимака прокляли и обезобразили, превратив в Малаката. Эта версия однако подвергается сомнениям ввиду наличия свидетельств о существовании орков до этого события"

 #heritage_goblinken_name:0 "Goblinken"
 heritage_goblinken_name:0 "[Select_CString( Or(Not(GetVariableSystem.HasValue( 'ek_ruler_designer_open', 'true' ) ), GetVariableSystem.HasValue( 'ek_race', Localize('RACE_GOBLINKEN') ) ), 'Гоблинкенск', Localize('no') )]"
 heritage_goblinken_collective_noun:0 "Гоблинкены"
 heritage_goblinken_desc:0 "Нелёгкая доля гоблинкенской расы ничуть не облегчается их обликом приземистых, сгорбленных карликов. Насмешки и пренебрежение — вот всё, что они испытывают от представителей других рас, большинство из которых даже не считает их равными себе разумными созданиями, несмотря на обильные доказательства обратного. И тем не менее гоблинкенам не занимать стойкости перед лицом остального мира, встречающего их в штыки."

 #heritage_argonian_name:0 "Argonian"
 heritage_argonian_name:0 "[Select_CString( Or(Not(GetVariableSystem.HasValue( 'ek_ruler_designer_open', 'true' ) ), GetVariableSystem.HasValue( 'ek_race', Localize('RACE_ARGONIAN') ) ), 'Аргонианск', Localize('no') )]"
 heritage_argonian_collective_noun:0 "Аргониане"
 heritage_argonian_desc:0 "Саксхлил, на джеле «народ корня», которых в обиходе называют аргонианами — это зверолюди-рептилии, коренные жители Аргонии, земель в юго-восточной части Тамриэля. Зловещие топи населяет множество разрозненных племён, такие как $naga$, $hleel$, $paatru$ и другие, которые добывают себе пропитание охотой и сельским хозяйством.\n\nДо времён #LORE [Concept('compendium_first_era', 'Первой эры')]#! старая цивилизация саксхлил была высоко урбанизирована — они даже строили монументальные каменные пирамиды, занмиры. Но в какой-то момент она пала вслед за событиями таинственного «Сумеречья». Деревья Хиста предвидели катастрофу и приютили племена саксхлил. Аргониане стали сильнее поклоняться Хисту и начали в большинстве своём вести более простой образ жизни.\n\nДеревья поддерживают симбиотические отношения с племенем, которое о нём заботятся: древохранители осуществляют за ним ежедневный уход, а Хист помогает потомству вылупляться из яиц и придаёт ему гуманоидную форму — путём выпивания живицы."

 #heritage_dremora_name:0 "Dremora"
 heritage_dremora_name:0 "[Select_CString( Or(Not(GetVariableSystem.HasValue( 'ek_ruler_designer_open', 'true' ) ), GetVariableSystem.HasValue( 'ek_race', Localize('RACE_DREMORA') ) ), 'Дреморск', Localize('no') )]"
 heritage_dremora_collective_noun:0 "Дремора"
 heritage_dremora_desc:0 "Если попросить описать #LORE [compendium_daedra|l]#!, большинство смертных вообразят дремора, высоких облачённых в доспехи человекоподобных созданий с зловещими рогами, боевыми татуировками и цветом кожи варьирующимся от бледно-серого до пепельно-чёрного.\n\nКланы дремора подчиняются строгой иерархии, а скрепляют их клятвы верности и поклонение богу-покровителю. Дремора, как правило, крайне воинственны, высшие позиции в их социальной структуре занимают полководцы. Неудивительно, что многие из их кланов находятся в услужении Молагу Балу и Мерунесу Дагону."

 #heritage_imgan_name:0 "Imga"
 heritage_imgan_name:0 "[Select_CString( Or(Not(GetVariableSystem.HasValue( 'ek_ruler_designer_open', 'true' ) ), GetVariableSystem.HasValue( 'ek_race', Localize('RACE_IMGA') ) ), 'Имганск', Localize('no') )]"
 heritage_imgan_collective_noun:0 "Имга"
 heritage_imgan_desc:0 "Обезьяний народ имга населяют Лесную Сень и, как они сами говорят, жили там ещё даже до босмеров. Распространённое среди них многоязычие служит почвой для множества слухов о крайней степени ксенофилии имга. На самом деле, имга высоко ценят отвагу и благородство, черты, часто присущие странникам. Это можно отследить до времён ранней #LORE [Concept('compendium_first_era', 'Первой эры')]#!, когда многие имга заняли управленческий вакуум и под властью Каморана стали странствующими губернаторами или купцами.\n\nОбретя богатство, многие покинули родной Валенвуд в поисках новых возможностей. Ходят живучие легенды, что в каком-то из этих племён были предки Марука, Пророка Единого. Источника, который бы подтверждал, что он был имга, не существует, однако повсеместно считается, что так и было, ввиду сведений о его внещнем облике."
