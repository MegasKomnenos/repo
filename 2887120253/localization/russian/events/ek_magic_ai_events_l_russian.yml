l_russian:

 ek_magic_ai_events.0001.t:0 "Магические указания"
 ek_magic_ai_events.0001.desc:0 "Хотя [court_mage.GetFirstName|U] хорошо разбирается в магических искусствах, мой долг как правителя — интересоваться работой своих подданых и при необходимости следить за ними. Своими действиями мой придворный маг будет влиять и на меня, и на всю державу. Пришло время решить, как [court_mage.GetHerHim] предстоит использовать свои способности.\n\nСможет ли [court_mage.GetSheHe] колдовать без моих прямых указаний или я сохраню за собой полный контроль над [court_mage.GetHerHis] действиями?\n\nЕсли я не хочу наживать себе врагов, было бы мудро по меньшей мере ограничить использование враждебных заклинаний."
 ek_magic_ai_events.0001.a:0 "Я доверяю тебе принимать решения по своему усмотрению."
 ek_magic_ai_events.0001.a.tt:0 "[court_mage.GetFirstNameNoTooltip|U] попытается в равной мере использовать заклинания вам на пользу и против врагов."
 ek_magic_ai_events.0001.b:0 "Действуй независимо, но не используй враждебные заклинания."
 ek_magic_ai_events.0001.b.tt:0 "[court_mage.GetFirstNameNoTooltip|U] будет использовать только заклинания с положительным эффектом вам на пользу, и не будет применять магию кому-то во вред."
 ek_magic_ai_events.0001.c:0 "Твори заклинания только по моему прямому указанию."
 ek_magic_ai_events.0001.c.tt:0 "Чтобы [court_mage.GetFirstNameNoTooltip] [Select_CString(ROOT.Char.IsFemale, 'использовала', 'использовал')] магию, вы должны будете напрямую отдать [court_mage.GetHerHim] приказ через книгу заклинаний."
 ek_magic_ai_events.0001.d:0 "У меня есть предложение по поводу фокуса твоих изысканий."
 ek_magic_ai_events.0001.d.tt:0 "Открывает окно события для дальнейшей настройки использования магии."

 ek_magic_ai_events.0002.t:0 "Фокус придворного мага"
 ek_magic_ai_events.0002.desc:0 "Хотя [court_mage.GetFirstName] имеет свои предпочтения на этот счёт, я могу в некотором роде направить фокус [court_mage.GetHerHis] внимания на какую-то одну школу магии — в конце концов, я [court_mage.GetHerHis] содержу!\n\n[court_mage.GetSheHe|U] с большей вероятностью будет изучать и применять заклинания соответствующей школы."
 ek_magic_ai_events.0002.a:0 "Погрузись в тёмную магию некромантии"
 ek_magic_ai_events.0002.b:0 "Сосредоточься на изменении"
 ek_magic_ai_events.0002.c:0 "Углубись в загадки школы колдовства"
 ek_magic_ai_events.0002.d:0 "Разрушение — отличный выбор"
 ek_magic_ai_events.0002.e:0 "Используй иллюзию мне на благо"
 ek_magic_ai_events.0002.f:0 "У восстановления больше всего применений"
 ek_magic_ai_events.0002.g:0 "Действуй по своему усмотрению"
 
