l_russian:

 ############################
 #      ATTREBUS VICTORY    #
 ############################
 attrebus_change_amount_pseudo_emperor_years_ec_immediate_action_ct:0 "#N #bold Совет старейшин немедленно попытается отстранить вас от власти!#!#!"
 
 ek_attrebus_potentate.0001.t:0 "[attrebus.GetFirstName] празднует триумф!"
 ek_attrebus_potentate.0001.desc:0 "Когда вы созывали первое ополчение в землях Коловии, никто не ожидал, что ваше восстание увенчается успехом. Но ваша армия росла, а вместе с ней поддержка среди дворянства и вскоре даже Совет старейшин поддержал ваши притязания. Война между вашими силами и #LORE [Concept('compendium_akaviri_potentate', 'Акавирским потентатом')]#! несколько лет сотрясала Сиродил, и вот последние отголоски акавирского вторжения утратили свою власть в Имперской провинции!\n\nКогда вы с солдатами шли парадом по улицам Имперского города, собравшиеся толпы взрывались возгласами радости, празднуя свободу от тирании акавирского потентата.\n\nВас пригласили в залы Совета старейшин, который единогласно проголосовал за то, чтобы предоставить вам чрезвычайные полномочия на время, пока ситуация в Сиродиле не стабилизируется."
 attrebus_potentate_cb_victory_zenas_allies_deal_ct:0 "[current_zenas_ally.GetFirstName] получит все земли, которые удерживал павший потентат в пределах всех [de_jure|El] герцогств, в которых [current_zenas_ally.GetSheHe] имеет владения"
 attrebus_potentate_cb_victory_first_legion_disbanded_ct:0 "Первый легион, поддержавший потентата, распущен, его члены лишены командования.\nСовет легиона фактически будет ликвидирован, ведь у него не осталось подконтрольного легиона."
 ek_attrebus_potentate.0001.a:0 "Я буду вести Сиродил, покуда он не будет в состоянии идти сам."
 attrebus_temporary_potentate_tooltip:0 "Совет старейшин наделил вас обширной властью над землями, которые ранее были подконтрольны потентату. Вы можете воспользоваться этим, чтобы удовлетворить собственные чаяния или пожелания Совета старейшин, выполняя [required_tasks|El] и [optional_tasks|El.\nВаш прогресс можно отследить в решении #V $attrebus_interregnum_decision$#!.\n#N Вы ограничены по времени, ведь придёт время, и совет захочет вернуть власть себе.#!\n#N Если вы умрёте до отречения, то Совет старейшин захватит власть над Имперским островом, а большинство ваших бывших вассалов получит свободу.#!"
 
 ek_attrebus_potentate.0002.desc:0 "Сиродил потрясён. [attrebus.GetFirstName], фанатичный военачальник, вознамерившийся уничтожить Акавирский потентат, захватил Имперский город, а вместе с ним и корону Сиродила!\n\nИ хотя говорят, что власть вскоре будет передана Совету старейшин, который станет правящим органом Имперского острова и большей части провинции, молодой военачальник всё-таки останется у руля на несколько лет, чтобы разобраться с последствиями войны…\n\nВсем известна его ненависть к акавирцам, и ходят слухи, что [attrebus.GetFirstName] воспользуется предоставленным временем, чтобы удовлетворить собственные амбиции…"
 ek_attrebus_potentate.0002.a:0 "Какая судьба уготована остальному Сиродилу?"
 
 ek_attrebus_potentate.0003.t:0 "Цаэски Сиродила"
 ek_attrebus_potentate.0003.desc:0 "Новая насущная проблема возникла вслед за поражением потентата. Не секрет, что [potentate.GetsSheHe] наделил землями некоторых из своих сторонников, и часть Сиродила всё ещё остаётся под властью акавирцев.\n\n"
 ek_attrebus_potentate.0003.desc.potentate_executed:0 "Казнь потентата привела к тому, что многие землевладельцы теперь опасаются за свою жизнь, а некоторые даже готовы разделить [potentate.GetHerHis] судьбу…"
 ek_attrebus_potentate.0003.desc.potentate_imprisoned:0 "Лорды, чей бывший потентат оказался в заточении, ожидают вашего решения."
 ek_attrebus_potentate.0003.desc.potentate_banished:0 "Похоже, некоторые из этих лордов ждут, что их постигнет судьба их потентата и готовятся к скорой эвакуации в другую провинцию вместе с семьёй и свитой."
 ek_attrebus_potentate.0003.desc.potentate_dead:0 "Теперь, когда их бывший потентат мёртв, лорды-акавирцы, похоже, не знают чего ожидать от вас…"
 ek_attrebus_potentate.0003.a:0 "Они покинут Сиродил, если не захотят разделить его судьбу!"
 tsaesci_rulers_leave_criminal_tooltip:0 "Всем правителям-цаэски в Сиродиле будет предоставлен выбор:\nОтправиться в изгнание и покинуть провинцию или стать преступниками.\n •Прямые вассалы #G скорее всего#! уедут\n •Непрямые вассалы#G возможно#! уедут\n •Независимые правители или вассалы других держав #R возможно#! останутся"
 tsaesci_rulers_leave_development_culture_convert_tooltip:0 "Все графства цаэски потеряют [development|El], но в них будет легче распространить другую культуру"
 tsaesci_rulers_leave_future_counties_ban_tooltip:0 "Акавирцы будут покидать все графства, которые в будущем будут под вашим контролем"
 tsaesci_rulers_leave_elder_council_tooltip:0 "Совет старейшин обеспокоен экономическими последствиями такого резкого решения."
 ek_attrebus_potentate.0003.b:0 "Они склонятся передо мной!"
 remove_all_special_contract_tooltip:0 "Все особые феодальные права будут отменены"
 ek_attrebus_potentate.0003.c:0 "Мои врагом был потентат, а не они."
 tsaesci_rulers_reform_potentate_tooltip:0 "Амбициозные правители-цаэски могут предпринять попытку реформировать потентат…"
 
 ek_attrebus_potentate.0004.desc.tsaesci_exile:0 "Похоже, победив потентата, [attrebus.GetName] не умерил свой гнев. Военачальник приказал всем до единого правителям-цаэски покинуть Имперскую провинцию, а иначе их будет ждать судьба предателей и преступников!"
 ek_attrebus_potentate.0004.desc.tsaesci_kneel:0 "Когда война с потентатом подошла к концу, молодой военачальник [attrebus.GetFirstName] призвал вассалов-цаэски со всего Сиродила! Многие испытывали тревогу за своё будущее, но, как говорят, некоторые с облегчением выдохнули, когда [attrebus.GetFirstName] приказал им преклонить колено перед Рубиновым троном и отказаться от многих привилегий.\n\nОтныне у них гораздо больше обязательств перед правителями Сиродила."
 ek_attrebus_potentate.0004.desc.tsaesci_let:0 "Пыль после войны улеглась, и  [attrebus.GetFirstName] издал имперский указ об амнистии всех правителей-цаэски, оставшихся в Сиродиле, поскольку военачальник не считает их виновными в преступлениях потентата.\n\nФанатичные вассалы военачальника и некоторые члены Совета старейшин возразили из опасений, что несостоявшееся возмездие может подготовить почву для возвышения нового #LORE [Concept('compendium_akaviri_potentate', 'акавирского потентата')]#!, но большинство согласились, что Сиродилу нужен мир."
 ek_attrebus_potentate.0004.a:0 "Наложить запрет!"
 ek_attrebus_potentate.0004.b:0 "Защитить наши поселения цаэски"
 tsaesci_rulers_refuse_enforce_ban_tooltip:0 "Хочется надеяться, что [attrebus.GetFirstName] не продержится у власти достаточно долго, чтобы распространить запрет на наши земли…"
 ek_attrebus_potentate.0004.c:0 "Сиродил действительно слишком опасен. Нам придётся его покинуть."
 tsaesci_rulers_get_exiled_tooltip:0 "Случайный персонаж из Сиродила займёт ваши провинции"
 tsaesci_rulers_game_over_tooltip:0 "#R Выбор этого варианта повлечёт за собой конец игры#!"
 ek_attrebus_potentate.0004.d:0 "Мы остаёмся!"
 ek_attrebus_potentate.0004.e:0 "Так тому и быть"
 ek_attrebus_potentate.0004.f:0 "Могло бы быть и хуже…"
 ek_attrebus_potentate.0004.g:0 "Давайте оставим это в прошлом."
 
 ek_attrebus_potentate.0005.t:0 "Земля тысячи верований"
 ek_attrebus_potentate.0005.desc:0 "Пожалуй, самым серьёзным из преступлений потентата было полнейшее неуважение к #LORE [Concept('compendium_divines', 'Божествам')]#! — вплоть до того, что он закрыл Храм Единого и регулярно посещал Храмовый район, игнорируя религиозную значимость этой части Имперского города.\n\nОдним из первых предложений, с которым [Select_CString(traditionalist_priest.IsFemale, 'выступила', 'выступил')] [Select_CString(traditionalist_priest.IsFemale, 'одна', 'один')] из наших религиозных лидеров, [traditionalist_priest.GetFirstName], было вновь открыть Храмовый район для религиозных церемоний и провести великий обряд в Храме Единого.\n\n[militant_priest.GetFirstName] же, в свою очередь, [Select_CString(militant_priest.IsFemale, 'предложила', 'предложил')] перестроить район для базирования там вновь созданного военного ордена, организации внутри нашей конфессии для защиты Имперского города и всех праведников от змей и других неверных."
 ek_attrebus_potentate.0005.a:0 "Наша вера должна быть вооружена!"
 attrebus_leases_temple_district_transform_td_not_existing:0 "[temple_district.GetName] будет перестроен в замковое владение и послужит базой для вновь основанного священного ордена"
 attrebus_leases_temple_district_transform_td:0 "[temple_district.GetName] будет перестроен в замковое владение, и [order.GetName] получат его в аренду"
 attrebus_leases_temple_district_unpopular:0 "Лишь малая часть духовенства одобрит такое решение, и потому #R вы потеряете часть их поддержки#!"
 attrebus_leases_temple_district_militaristic_faith:0 "Это возможность для амбициозного правителя из сделать из Имперского культа более воинственную и военизированную конфессию…"
 attrebus_leases_temple_district_elder_council:0 "Присутствие военного ордена посреди Имперского города вызовет беспокойство у Совета старейшин"
 ek_attrebus_potentate.0005.b:0 "Храмовый район будет открыт для народа, а не для фанатиков."
 
 ek_attrebus_potentate.0007.t:0 "Лорды Нибенея"
 ek_attrebus_potentate.0007.desc:0 "В то время как народ и лорды Коловии ревностно поддержали наше правое дело, большая часть вероломных лордов Нибенея предпочли выступить на стороне бывшего потентата и встретиться с нами на поле боя.\n\nМы вызвали этих вассалов, и все они откликнулись, тревожно ожидая своей участи.\n\nСамо собой, мы можем успокоить и простить их…"
 ek_attrebus_potentate.0007.a:0 "Предатели! Все они!"
 former_potentate_vassals_traitors_tooltip:0 "Все бывшие вассалы потентата будут объявлены [Concept('criminals', 'преступниками')|E] "
 former_potentate_vassals_elder_council_tooltip:0 "Совет старейшин предпочёл бы, чтобы вассалы на слово отреклись от потентата или были отпущены без санкций"
 ek_attrebus_potentate.0007.b:0 "Потребовать клятвы верности."
 former_potentate_vassals_hook_tooltip:0 "Вы получите [Concept('hook', 'влияние')|E] на каждого из бывших вассалов потентата"
 ek_attrebus_potentate.0007.c:0 "Потентат побеждён. Они не представляют для нас опасности."
 
 ek_attrebus_potentate.0009.t:0 "Долг Совету старейшин"
 ek_attrebus_potentate.0009.desc:0 "Не секрет, что победа в нашей войне против потентата не была бы возможна без финансовой поддержки Совета старейшин. Хотя они и не могли помочь нам в сражениях войсками, большинство его членов предоставили нам денежные средства, на которые мы нанимали и, снаряжали и содержали своих солдат.\n\nСегодня прибыла делегация от Совета — они ждут, что мы покроем часть расходов.\n\nЗлить Совет старейшин может быть опасно, однако цена, которую они просят, возможно, слишком велика…"
 ek_attrebus_potentate.0009.a:0 "Я лично выплачу им долг."
 ek_attrebus_potentate.0009.b:0 "Повысьте налоги в Сиродиле."
 ek_attrebus_potentate.0009.c:0 "С них хватит свободы от потентата!"
 attrebus_anger_elder_council:0 "Это #R разозлит#! Совет старейшин. Было бы мудро отплатить им, если только вы не собираетесь идти с ними на прямую конфронтацию…"
 
 ek_attrebus_potentate.0051.t:0 "Мир и процветание"
 ek_attrebus_potentate.0051.desc_intro:0 "Прошли годы с тех пор как я дал бой отголоску #LORE [Concept('compendium_akaviri_potentate', 'Акавирского потентата')]#! и сразил его, освободив Сиродил от остатков змеиного притеснения. С тех пор Совет старейшин позволял мне править от своего имени, пока Сиродилу требовались руководство и защита от наших врагов — внешних и внутренних."
 ek_attrebus_potentate.0051.desc_duties_fulfilled:0 "\n\nТеперь же мой долг выполнен, и пришла пора отойти от дел и позволить Совету старейшин руководить Тамриэлем, пока не придёт драконорождённый император."
 ek_attrebus_potentate.0051.desc_duties_unfulfilled:0 "\n\nНесмотря на полномочия, предоставленные мне Советом старейшин, я, похоже, не сумел оправдать их ожидания. У них кончилось терпение, и они приняли официальное решение забрать назад выданные мне полномочия, установив собственный контроль над Имперским островом и всем Румаре.\n\nМне остаётся только с чувством горечи покинуть Имперский город, передав власть новому Верховному канцлеру."
 ek_attrebus_potentate.0051.a:0 "Для меня было честью служить Сиродилу."
 ek_attrebus_potentate.0051.b:0 "Похоже, я подвёл вас…"
 imperial_commune_creation_tooltip:0 "Власть над Имперским островом получит новое правительство под управлением Совета старейшин."
 imperial_commune_creation_full_heartlands_tooltip:0 "Ваши действия #P позволят ему править над всеми землями центрального Сиродила#! как #weak лорд-протектор Румаре#!."
 imperial_commune_creation_not_full_heartlands_tooltip:0 "Так как вы #N не смогли распространить власть над территориями Румаре#!, он получит контроль только над Имперским островом и теми из румарских правителей, кто признает его притязания. Он будет известен как #weak лорд-протектор Имперского острова#!."
 rest_cyrodiil_independent_tooltip:0 "Остальной Сиродил сможет последовать собственным путём уже как независимые державы, свободные от гнёта тиранов и иноземных потентатов."
 attrebus_repay_debts_decision_effect_shattering:0 "Так как вы #P сумели выплатить долг Совету старейшин#!, стартовая сумма в казне лорда-протектора будет гораздо больше."
 interregnum_starts_tooltip:0 "Началось Междуцарствие, которое продлится, пока кто-то достойный не займёт Рубиновый трон и не объединит Тамриэль…\n(Тот, кто будет удерживать империю Сиродил получит доступ к решению по создании Империи Тамриэль.)"
 interregnum_loses_lingua_tamrielis:0 "Все сиродильские культуры утратят инновацию «Лингва Тамриэлис»."
 
 ek_attrebus_potentate.0052.t:0 "Междуцарствие"
 ek_attrebus_potentate.0052.desc:0 "Несколько веков Сиродилом и большей частью Тамриэля правила династия Реманов, а затем — потентаты. Последние десятилетия авторитет Имперской провинции в других регионах падал, пока в руках потентатов не осталась лишь власть над отдельными частями Сиродила.\n\nКогда потентат наконец пал, в Сиродиле образовался вакуум власти, который быстро заполнил Совет старейшин, принявший управление над Имперским городом и его окрестностями.\n\nЭтот новый игрок, величающий себя «Имперская коммуна», свою легитимность обосновывает полномочиями, выданными совету династиями Алессии и Ремана.\n\nПо всему миру терпит крах центральная власть, и народ обращается за защитой к местным лордам. Междуцарствие официально началось."
 ek_attrebus_potentate.0052.a:0 "Интересное развитие событий."
 ek_attrebus_potentate.0052.b:0 "Не пойму с какой стати это моя забота."
 
 ek_attrebus_potentate.0053.t:0 "Судьба Сиродила"
 ek_attrebus_potentate.0053.desc:0 "Хотя Совет старейшин всё ещё доверяет мне выполнение возложенной миссии, порой мне кажется, что это не под силу одному человеку. Призревать за Сиродилом и влиять на него, выполняя при этом приказы Совета старейшин — это бремя, нести которое, возможно слишком тяжело…\n\nВозможно, мне следует в последний раз обратиться к Совету и вернуть обратно им полномочия, которыми меня наделили?\n\nИли, быть может…"
 ek_attrebus_potentate.0053.a:0 "Мне нужно ещё время. Совет старейшин подождёт."
 attrebus_interregnum_decision_more_time_required_tt:0 "У вас есть ещё несколько лет на то, чтобы выполнить задание Совета старейшин и повлиять на Сиродил."
 ek_attrebus_potentate.0053.b:0 "Пора отступить и позволить Сиродилу управлять самим собой."
 ek_attrebus_potentate.0053.c:0 "Я — истинный правитель Сиродила!"
 attrebus_will_become_potentate_for_life_tooltip:0 "Так как вы выполнили [Concept('optional_tasks', 'дополнительные задания')|E], вы упрочили свою власть в Сиродиле достаточно, чтобы принудить Совет признать вас полноправным правителем Имперского острова.\n#P Вы сохраните за собой титул потентата до конца жизни!#!."
 attrebus_interregnum_after_death_tooltip:0 "Однако, ваш век этом мире измерен. Титул потентата #N исчезнет после вашей кончины#!, но #P ваши наследники сохранят за собой Имперский остров#!."
 attrebus_interregnum_decision_colovian_caesar_civil_war_tt:0 "#bold Это приведёт к ещё одной гражданской войне, в которой вашего врага будет поддерживать Совет старейшин#!!\nВ случае #P победы#!, вы будете коронованы как пожизненный потентат и #p сохраните за собой чрезвычайные полномочия до конца жизни#!.\nКогда вы покинете этот мир, Совет старейшин вступит в дело, и начнётся Междуцарствие, если только вы не [Concept('optional_task_4', 'решите вопрос наследования')|E]."
 attrebus_interregnum_decision_colovian_caesar_civil_war_rulers_sides_tt:0 "Все правители Сиродила предстанут перед выборов: поддержать вас или Совет старейшин. #I Сильнейший правитель, который выступит против вас, станет лидером войны.#!\nРешения, которые вы приняли при выполнении [Concept('required_tasks', 'обязательных заданий')|E] склонят правителей на ту или иную сторону.\n#N Все правители-цаэски, оставшиеся в Сиродиле, поддержат Совет старейшин. Правители-цаэски за его пределами смогут передать войска в аренду Совету.#!"
 attrebus_interregnum_decision_colovian_caesar_civil_war_follow_up_event_tt:0 "#weak В следующем событии будет отражено, в какую сторону будет склоняться чаша весов по результатам выполненных вами [Concept('required_tasks', 'обязательных')|E] и [Concept('optional_tasks', ' дополнительных заданий')|E] и принятых при этом решений.\nУ вас останется возможность отступить, если расклад покажется вам слишком рискованным… на данный момент.#!"
 
 attrebus_interregnum_decision_colovian_caesar_civil_war_debt_not_repaid_tt:0 "Так как вы не выполнили второе [required_task|El], «[required_task_2|E]», Совету старейшин придётся платить своим солдатам из остаточных средств. Это #p уменьшит стартовую численность их войск#!."
 attrebus_interregnum_decision_colovian_caesar_civil_war_cyrodiilic_hero_tt:0 "Так как вы выполнили второе [optional_task|El], «[optional_task_2|E]», #p все правители, почитающие пантеон «[GetFaithDoctrine('doctrine_pantheon_heroes').GetBaseName]» поддержат вас#!."
 attrebus_interregnum_decision_colovian_caesar_civil_war_legion_side_ec_tt:0 "Так как при выполнении [Concept('optional_task', 'дополнительного задания')|E] «[optional_task_3|E]» во главе Имперского легиона был поставлен #n лоялист Совета старейшин#!, #n Первый легион поддержит Совет старейшин#!."
 
 ek_attrebus_potentate.0054.t:0 "Пожизненный потентат"
 ek_attrebus_potentate.0054.desc:0 "Вызвав Совет старейшин к Рубиновому трону, я замечаю, как большинство его членов ожидали моего отречения и были готовы получить власть над Имперским островом после моего отъезда.\n\n#S \"В последние несколько лет мы победили многих врагов, но до сих пор есть те, кто желает нашей смерти. Наша родина пребывает в смертельной опасности, и ей нужен сильный правитель, который поможет ей выстоять в грядущую бурю. Времена требуют тяжёлых решений, и ради блага моей страны я вынужден сказать, что остаюсь у власти в Сиродиле до конца моих дней.\"#!\n\nБольшинство советников разгневались и потребовали от легионеров, охранявших Рубиновый трон, арестовать меня, но вскоре послышались крики толпы. В Башню Белого Золота пришли представители духовенства, напомнившие Совету о моём статусе среди народа. Легионеры опустили оружие и объявили, что будут верны мне.\nСовет старейшин потерпел поражение, и я останусь у власти."
 ek_attrebus_potentate.0054.a:0 "За народ Сиродила!"
 attrebus_become_potentate_for_life_tooltip:0 "Совет старейшин потерпел поражение. #P Я сохраню за собой титул потентата и власть над большей частью Сиродила до конца жизни#!."
 attrebus_loses_potentate_after_death_tooltip:0 "Однако после моей смерти #N потентат будет уничтожен, и начнётся Междуцарствие#!.\nМои наследники тем не менее сохранят за собой Имперский остров и будут выступать его защитниками, покуда не объявится достойный драконорождённый император."
 
 ek_attrebus_potentate.0060.t:0 "Прославленный Аттреб"
 ek_attrebus_potentate.0060.desc:0 "Слава о ваших деяниях эхом разносится по Сиродилу.\n\nВы объединили разрозненные державы коловианских королей и уничтожили Акавирский потентат, погрузивший Тамриэль в опустошительную гражданскую войну. Словно герои древности вы восстали и выступили защитником Сиродила и его народа тогда, когда он более всего в вас нуждался.\n\nХотя никто и не скажет, что вы равны Королеве Рабов Алессии или Реману Свет Людей, ваше имя шёпотом произносят во время молитв, и оно неофициально пополнило ряд, в котором уже были Пелинал и Бенду Оло."
 ek_attrebus_potentate.0060.a:0 "Правь служа примером."
 attrebus_potentate_attrebus_new_ch_patron_desc:0 "Последователи конфессий, почитающих пантеон «[GetFaithDoctrine('doctrine_pantheon_heroes').GetBaseName]» теперь смогут выбрать Аттреба в качестве [Concept('patron_deity', 'божества-покровителя')|E]."
 attrebus_potentate_optional_task_2_fulfilled_desc:0 "Вы #P выполнили#! второе [optional_task|El], «[optional_task_2|E]»"
 
 ek_attrebus_potentate.0061.desc:0 "WIP"
 ek_attrebus_potentate.0061.a:0 "Интересно."
 
 ek_attrebus_potentate.0062.t:0 "Выплаченный долг"
 ek_attrebus_potentate.0062.desc:0 "В годы, предшествовавшие войне, и во время её начала щедрость Совета старейшин была движущей силой восстания.\nХотя во время боевых действий ожидать от них открытой поддержки не приходилось, именно финансовая поддержка Совета позволила одержать верх над потентатом.\nИ теперь они ждут, что им заплатят по долгам.\n\nК счастью, вы как раз отправили последнюю часть суммы в золоте, и отныне ваш долг считается полностью выплаченным."
 ek_attrebus_potentate.0062.a:0 "[ROOT.Char.GetDynasty.GetName] всегда платит по долгам."
 
 ek_attrebus_potentate.0063.t:0 "Подчинение центрального Сиродила"
 ek_attrebus_potentate.0063.desc:0 "Когда разразился конфликт между потентатом и остальной частью Сиродила, самое сердце его земель стало уязвимым для налётов и нападений.\n\nЧтобы упрочить собственное положение и обезопасить Имперский город, Совет старейшин попросил вас распространить его власть на весь Имперский остров и окружающие его берега Румаре.\n\nТеперь, когда позиции во власти в этих землях занимают верные лорды, а на территорию вокруг Башни Белого Золота пришло умиротворение, Совет старейшин чувствует себя в гораздо большей безопасности и считает вашу задачу выполненной."
 ek_attrebus_potentate.0063.a:0 "Мир и процветание."
 
 ek_attrebus_potentate.0064.t:0 "Обновлённый Имперский легион"
 ek_attrebus_potentate.0064.desc:0 "С тех самых пор как он был основан тысячи лет назад по воле святой Алессии, Имперский легион защищал империи людей и расширял их владения. При драконорождённом императоре Ремане он был обновлён, однако со времён гибели его династии и возвышения Акавирского потентата, легион переживал резкий упадок.\n\nТеперь, когда солдаты со всего Сиродила стягиваются, чтобы присоединится к обновлённому Первому легиону, назревает вопрос кто встанет у него во главе, который может перерасти в конфликт.\nСовет старейшин желает поставить собственного лоялиста, и всё же было бы полезно гарантированно обеспечить себе поддержку Первого легиона, если таковая потребуется…"
 ek_attrebus_potentate.0064.a:0 "Я поддержу выбор Совета старейшин."
 attrebus_potentate_first_legion_ec_loyalist_desc:0 "Первым легионом будет руководить лоялист Совета старейшин.\nОн #N займёт сторону Совета#! в случае конфронтации между ним и вами."
 attrebus_potentate_attrebus_please_elder_council_desc:0 "Совет будет рад такому решению и немного продлит ваши властные полномочия. #P Совет старейшин подождёт ещё 3 года прежде чем вернёт себе контроль над Имперским островом#!."
 ek_attrebus_potentate.0064.b:0 "[imperial_legion_neutral.GetFirstName] — безопасный выбор, который не повлечёт за собой конфликты…"
 attrebus_potentate_first_legion_legion_desc:0 "Первый легион сосредоточится на миротворческой деятельности. Он не будет вмешиваться в политику и занимать чью-либо сторону."
 ek_attrebus_potentate.0064.c:0 "Первый легион будет верен мне!"
 attrebus_potentate_first_legion_attrebus_loyalist_desc:0 "Первым легионом будет руководить кто-то из ваших лоялистов.\nОн #P займёт вашу сторону#! в случае конфронтации между вами и Советом старейшин."
 attrebus_potentate_attrebus_anger_elder_council_desc:0 "Совет старейшин с тревогой и беспокойством отнесётся к тому, как вы централизируете свою власть и влияние. #N Совет старейшин вступит в дело на 3 года раньше, чем планировалось#!."
 attrebus_potentate_attrebus_increase_personal_power_desc:0 "Выполнение этого задания привело к #P усилению#! вашей личной власти и легитимности."
 attrebus_potentate_attrebus_fort_legion_headquarters_desc:0 "Улучшенный Бастион даёт своему владельцу бонусы к силе [Concept( 'men_at_arms', 'профессиональных полков' )|El] и снижает стоимость их содержания. Пока Имперский город остаётся вашей столицей, вы будете получать эти бонусы."
 
 ek_attrebus_potentate.0065.t:0 "Акт о цаэски"
 ek_attrebus_potentate.0065.desc:0 "Вот уже несколько веков Сиродилом и значительной Тамриэля правили не его уроженцы, а чужеземцы-цаэски. Хотя служа Империи Ремана они проявили себя как достойные союзники, их действия после её краха принесли разрушения на большую часть континента.\n\nНаконец в наших силах это исправить. Акавирский потентат за последние десятилетия утратил власть над остальными провинциями, а восстание самого Сиродила против него послужило последним гвоздём в крышку его гроба.\n\nОстаётся только убедиться, что ни один акавирский лорд никогда не сможет править нами…\nПодготовленный с этой целью акт о цаэски был предоставлен на ознакомление лордам Сиродила. Все правители-цаэски отныне немедленно утрачивают права на любой надел земли, а все обитатели их поселений будут принудительно изгнаны из нашей родины."
 ek_attrebus_potentate.0065.a:0 "Необходимая жестокость."
 
 ek_attrebus_potentate.0066.t:0 "Обезглавленная змея"
 ek_attrebus_potentate.0066.desc:0 "После нескольких веков властвования акавирцев Сиродил наконец-то сбросил оковы их правления. Во всей провинции не осталось ни одного акавирского лорда и ни одного крупного акавирского поселения…\n\nВы достигли своей главной цели — змеи-цаэски потерпели поражение. Представители Совета старейшин только что выдохнули с облегчением, и весь Сиродил сегодня будет спать спокойнее."
 ek_attrebus_potentate.0066.a:0 "Победа за нами!"
 
 ek_attrebus_potentate.0070.t:0 "Воинственная вера"
 ek_attrebus_potentate.0070.desc:0 "Наша конфессия, [ROOT.Char.GetFaith.GetAdjective], веками сосуществовала со множеством других культов. Хотя это помогало обеспечивать столь необходимую стабильность, часть священников призывает к масштабной религиозной реформации, которая должна будет подготовить нашу конфессию к будущим испытаниям.\n\nНаше духовенство поделилось на три основные фракции.\nПервая настаивает на том, чтобы оставить всё как есть, но призвать к единству в грядущие времена.\nВторая хочет, чтобы мы сосредоточили силы на мирном обращении иноверцев и расширении штата миссионеров.\nТретья призывает к более агрессивному подходу и хочет, чтобы наша конфессия была готова к решительным действиям.\n\nЧёткого согласия нет, и [hof.GetFirstName] ждёт вашего совета, ведь вашему выбору доверяет весь Сиродил."
 ek_attrebus_potentate.0070.a:0 "Оставить всё как есть. Традиционный уклад — залог стабильности."
 fervor_gain_a_militant_faith:0 "Последствия решения «Воинственная вера»"
 ek_attrebus_potentate.0070.b:0 "Нам надо сосредоточить силы на обращении иноверцев."
 ek_attrebus_potentate.0070.c:0 "Времена требуют решительных мер. Мы должны быть сильными."
 
 ############################
 #      POTENTATE VICTORY   #
 ############################
 ek_attrebus_potentate.0101.t:0 "Подавленное восстание"
 ek_attrebus_potentate.0101.desc:0 "Военачальник-выскочка [attrebus.GetFirstName] потерпел поражение. Лорды, поддержавшие [attrebus.GetHerHis], вынуждены плестись обратно в свои владения, поджав хвосты.\n\nКогда побеждённого генерала приводят в Бастион, я чувствую облегчение и одновременно с этим сильную тревогу… Да, #LORE [Concept('compendium_akaviri_potentate', 'Акавирский потентат')]#! продолжает жить, но наша власть над провинцией понесла непоправимый ущерб.\n\nПобеда позволила нам выиграть немного времени, но кто может сказать наверняка что ждёт нас в будущем?.."
 ek_attrebus_potentate.0101.a:0 "Победа… Возможно, переломный момет?"
 attrebus_potentate_potentate_win_colovian_estates_shattered:0 "Конфедерация Коловианских воеводств #v развалилась#! — провал восстания Аттреба ознаменовал её кончину."
 attrebus_potentate_potentate_win_only_control_heartlands:0 "После нашей победы над коловианскими лордами правители из Нибенея и других частей Сиродила, поддержавшие нас, #N отказались от своих вассальных клятв#!.\nМы можем сохранить за собой потентатский титул, #V но наша власть будет распространяться только на Румаре#!. "
 
 ek_attrebus_potentate.0102.desc:0 "Произошло немыслимое. Окружённый со всех сторон потентат выходил победителем из одного сражения за другим, пока нам не оставалось только принять поражение. Закованных в цепи, нас доставили в Имперский город ждать суда потентата, который наверняка хочет только нашей смерти.\n\nСиродил рыдает, ведь змеи по-прежнему правят им."
 ek_attrebus_potentate.0102.a:0 "Это кошмар наяву…"
 
 ek_attrebus_potentate.0103.desc:0 "Восстанию [attrebus.GetFirstName]а не суждено было увенчаться успехом. В кровопролитных сражениях между военачальником и потентатом правители Имперского города вновь и вновь побеждали лидера восстания.\n\n[attrebus.GetFirstName] под конвоем охраны был доставлен в имперскую темницу, а потентат, похоже, выиграл себе немного времени, устранив непосредственную угрозу.\n\nНесмотря на победное завершение войны, нибенейские лорды, из страха перед очередным коловианским императором на троне поддержавшие потентата, решили отказаться от своих вассальных обязательств перед ним. Сейчас, когда [potentate.GetFirstName] пользуется только поддержкой Имперского острова и части побережья Румаре, никто не ждёт, что потентат продержится достаточно долго."
 ek_attrebus_potentate.0103.a:0 "Какая судьба уготована Сиродилу и остальному миру?"
 
 ek_attrebus_potentate.0110.t:0 "Потентат Румаре"
 ek_attrebus_potentate.0110.desc:0 "Наш народ прибыл сюда много веков назад в поисках прославленного драконорождённого. И когда мы нашли [reman_cyrodiil.GetHerHis], им оказался [reman_cyrodiil.GetFirstName], которому мы поклялись в верности.\n\nПосле того как [reman_cyrodiil.GetHerHis] династия оборвалась, мы стали слугами Империи, и несколько веков поддерживал порядок по всему Тамриэлю…\n\nНо времена меняются, и старый мир рушится. Дни потентата остались в прошлом, но [ROOT.Char.GetCulture.GetName] обрели в Тамриэле новый дом в том самом месте, где властвовали уже много лет!"
 ek_attrebus_potentate.0110.a:0 "Наш новый дом!"
 culture_now_native_heartlands_tooltip:0 "Наша [culture|El] теперь является [Concept('native', 'коренной')|E] для региона [GetGeographicalRegion('mundus_tamriel_cyrodiil_heartlands').GetName]"
 
 ############################
 #      WAR INVALIDATED     #
 ############################
 ### Attrebus died
 ek_attrebus_potentate.0201.t:0 "Смерть военачальника"
 
 ek_attrebus_potentate.0202.desc:0 "Судьба порой бывает жестока. Столь велика была наша уверенность в нашей цели, нашей победе, нас самих, что мы даже не думали о том, что произойдёт, если мы покинем Мундус до победы над потентатом. Но теперь, когда вести о нашей смерти достигают лордов Сиродила, похоже, наша цель терпит крах.\n\nПотентат, затаившийся в Имперском городе, должно быть, смеётся над таким концом. Наши союзники и подданые, клявшиеся во что бы то ни стало продолжать борьбу, предпочли вернуться обратно в свои города и замки.\n\nНаш народ, утративший своего лидера, похоже, останется под властью потентата."
 ek_attrebus_potentate.0202.a:0 "Нет! Я нужен им!"
 
 ek_attrebus_potentate.0203.desc:0 "Вести о смерти военачальника [attrebus.GetFirstName]а распространяются по Сиродилу как пожар.\nПока лорды, поддерживавшие его, в смятении готовятся к отступлению, в нашем стане развиваются похожие события…\n\nНаш враг мёртв, а вместе с ним, похоже, исчезла и причина для наших сторонников поддерживать нас… Но мы выстояли. Пока что."
 ek_attrebus_potentate.0203.a:0 "Все они непокорные предатели!"
 attrebus_potentate_status_quo_only_control_imperial_isle:0 "Пыль улеглась, и лорды, которые были нашими сторонниками, больше не видят причин поддерживать нашу претензию на Сиродил.\nМы выстояли, #N но Акавирский потентат погиб#!.\n\nПосле всех событий мы сохранили контроль только над #V Имперским островом#!."
 
 ek_attrebus_potentate.0204.desc:0 "Новости из Имперской провинции! Умер [attrebus.GetFirstName], возглавлявший восстание против потентата Сиродила. [attrebus.GetHerHis|U] союзники и подданные возвращаются в свои города и замки, и похоже, что его цель погибла вместе с ним.\n\nНо и у потентата не так много поводов для ликования — лорды, которые некогда были [potentate.GetHerHis] сторонниками, отозвали его поддержку и больше не признают [potentate.GetHerHis] своим законным потентатом.\n\nТамриэль. кажется, погружается в хаос, и нас ждут тяжёлые времена…"
 ek_attrebus_potentate.0204.a:0 "Тревожный мир…"
 
 ek_attrebus_potentate.0251.t:0 "Обезглавленная змея"
 
 ek_attrebus_potentate.0252.desc:0 "Похоже, дни нашего смертного врага были сочтены. [potentate.GetFirstName] умер. Наши войска схлестнулись в битве, но судьба тем временем решила забрать [potentate.GetHerHis] из этого мира! К этому моменту лорды Нибенея уже приняли решение отказаться от своей бессмысленной затеи и в разразившемся хаосе Совет старейшин решил выйти на сцену и установить контроль над Имперским островом!\n\nЛишившись общей цели, наши союзники возвращаются в свои замки, а конфедерация, которая должна была сокрушить потентат, мирно распалась.\n\nМногие задумываются, что бы произошло, если бы мы одержали победу, до того как умер змея-[potentate.GetFirstName], но этот вопрос лучше оставить богам…"
 ek_attrebus_potentate.0252.a:0 "Какая судьба ждёт меня?"
 attrebus_potentate_potentate_death_colovian_estates_disband:0 "#V Коловианские воеводства#! разваливаются, и наши союзники возвращаются в свои вотчины к своим семьям."
 attrebus_potentate_potentate_death_elder_council_imperial_isle:0 "#V Совет старейшин#! захватывает власть над Имперским островом, Имперским городом теперь правит кто-то из их числа."
 
 ek_attrebus_potentate.0253.desc:0 "Пока два титана, [attrebus.GetFirstName] и [potentate.GetFirstName] готовились в грядущем противостоянии устроить в Сиродиле пожар, судьба, похоже подготовила мирное решение для конфликта.\n\nКогда вести о том, что [potentate.GetFirstName] умер, достигли берегов Румаре, Совет старейшин отправил вместе с небольшим сопровождением своих представителей для захвата политически важных учреждений, прежде чем объявить об уничтожении #LORE [Concept('compendium_akaviri_potentate', 'Акавирского потентата')]#!.\n\nВойна завершилась, и союзники военачальника возвращаются в свои замки, а сторонники почившего потентата надеются, что ничего плохого с ними не случится…"
 ek_attrebus_potentate.0253.a:0 "Удивительно мирное развитие событий…"
 
 ek_attrebus_potentate.0300.t:0 "Конец потентата"
 ek_attrebus_potentate.0300.desc:0 "Ни военачальник [attrebus.GetFirstName], ни потентат [potentate.GetFirstName] не удерживают титул Сиродильского потентата, и сторонники обоих решили вернуться в родные города и замки.\n\nАкавирская напасть лишилась власти, а перед коловианским военачальником больше никто не держит обязательств. В связи с этим Совет старейшин решил вмешаться и объявить об упразднении потентата."
 ek_attrebus_potentate.0300.a:0 "Какая судьба уготована Сиродилу и остальному миру?"
 
 
 #############################
 #  POTENTATE FAMILY LAAMP?  #
 #############################
  ek_attrebus_potentate.0310.t:0 "Flames on the Horizon"
  ek_attrebus_potentate.0310.desc.intro.tower:0 "I stand on a white balcony, far above the Imperial City. Letting my gaze wander, I can see the declining city, the ruins of the outer districts and, on the horizon, the flames of [attrebus.GetFirstNamePossessive] army of locusts, coming to tear down everything the #LORE [compendium_akaviri_potentate]#! has built. The war is not going well."
  ek_attrebus_potentate.0310.desc.intro.generic:0 "I stand on a balcony, far above the capital. Letting my gaze wander, on the horizon I spot the flames of [attrebus.GetFirstNamePossessive] army of locusts, coming to tear down everything the #LORE [compendium_akaviri_potentate]#! has built. The war is not going well."
  ek_attrebus_potentate.0310.desc.nephew.sister:0 "\n\nEventually the calm voice of [adventurer.GetFirstName] interrupts the foreboding silence: "Uncle, you must hear me out. I know you too see the flames in the dusk and sense the smoke on your scales. I tried to convince my mother, but she is blind to the signs. If the Elementals wills it, I will face the night, but is there not nobility in survival?""
  ek_attrebus_potentate.0310.desc.nephew.generic:0 "\n\nEventually the calm voice of [adventurer.GetFirstName] interrupts the foreboding silence: "Uncle, you must hear me out. I know you too see the flames in the dusk and sense the smoke on your scales. If the Elementals wills it, I will face the night, but is there not nobility in survival?""
  ek_attrebus_potentate.0310.desc.outro:0 "\n\nI ponder his words. Would sending him away be an admission of defeat? But it would only be for a little while, until this warlord is felled."
  ek_attrebus_potentate.0310.a:0 "Victory is assured! You will remain."
  ek_attrebus_potentate.0310.a.tt:0 "[adventurer.GetFirstName] will support you to the bitter end."
  ek_attrebus_potentate.0310.a.flavor:0 "Continue playing as [ROOT.Char.GetTitledFirstName]"
  ek_attrebus_potentate.0310.b:0 "Go through the sewers. Make haste for Nibenay."
  ek_attrebus_potentate.0310.b.tt:0 "[adventurer.GetFirstName] will flee the Imperial City alongside your family."
  ek_attrebus_potentate.0310.b.flavor:0 "Continue playing as [adventurer.GetFirstName], becoming an [adventurer|E]!"

  ek_attrebus_potentate.0311.t:0 "Escape from White-Gold"
  ek_attrebus_potentate.0311.desc:0 "I draw a breath of relief. We've made it to Lake Rumare unnoticed and chartered a small vessel at the [GetBuilding('imperial_city_harbor_01').GetName]. We have to get as far away from Cyrodiil as possible before the Warlord catches wind of our disappearance and sends his lackeys after us."
  ek_attrebus_potentate.0311.a:0 "Our flight must be swift, to Leyawiin."
  ek_attrebus_potentate.0311.flavor:0 "Having successfully escaped, you will now play as [adventurer.GetName]"
  
  ek_attrebus_potentate.0312.t:0 "The Shores of Topal Bay"
  ek_attrebus_potentate.0312.desc:0 "Arriving in [GetTitleByKey('b_leyawiin').GetNameNoTier], I am left to ponder my next move as my entourage stocks up on supplies. I stare into the endless blue of Topal Bay. We are foreigners on Tamriel, with no province to call our own. Where will my escape lead me?\n\nWe were once honoured guests in [GetTitleByKey('d_senchal').GetNameNoTier]. [GetBuilding('potentate_retreat_01').GetName], our old embassy, could grant us shelter.\n\n[GetTitleByKey('d_southpoint').GetNameNoTier] in Valenwood is a busy port. From there, we could disappear on the edges of Valenwood.\n\nThere's also the crumbling Imperial holdout in [GetTitleByKey('d_south_argonia').GetNameNoTier]. Lilmoth New City has a dreadful reputation, but it would be easy to keep a low profile and vanish from the records."
  ek_attrebus_potentate.0312.a:0 "Potentate's Retreat. We will find shelter in Elsweyr."
  ek_attrebus_potentate.0312.a.tt:0 "You secure a vessel to Potentate's Retreat"
  ek_attrebus_potentate.0312.b:0 "Southpoint. Valenwood will hide us well."
  ek_attrebus_potentate.0312.b.tt:0 "You secure a vessel to Southpoint"
  ek_attrebus_potentate.0312.c:0 "South Argonia. No one will search for us there."
  ek_attrebus_potentate.0312.c.tt:0 "You secure a vessel to New Lilmoth"
  
  ek_attrebus_potentate.0313.t.potentates_retreat:0 "Arrival at Potentate's Retreat: Who am I?"
  ek_attrebus_potentate.0313.t.southpoint:0 "Arrival at Soutpoint: Who am I?"
  ek_attrebus_potentate.0313.t.south_argonia:0 "Arrival at South Argonia: Who am I?"
  ek_attrebus_potentate.0313.t.fallback:0 "Arrival: Who am I?"
  ek_attrebus_potentate.0313.desc.potentates_retreat:0 "At last I reach the former embassy at Potentate's Retreat. I have never visited before, but my mother told me stories of spending time here in her youth. Now the old walls are crumbling and some parts of the estate seem to have fallen into disrepair. Many of the locals seem to share my Akaviri heritage, though they treat us with suspicion."
  ek_attrebus_potentate.0313.desc.southpoint:0 "At last we make landfall at Southpoint. The trading port has doubtlessly seen better days, but I can spot ships from various regions of Tamriel docked here. Just outside the city, Valenwood truly begins, an impenetrable jungle of dense foliage."
  ek_attrebus_potentate.0313.desc.south_argonia:0 "At last we arrive at New Lilmoth. The rumors about South Argonia were false; the state of the city is far worse than I could have imagined. Everywhere are crumbling, half-finished foundations, slowly sinking back into the Black Marsh. Few visitors arrive here, and the natives eye me with curiosity and disbelief."
  ek_attrebus_potentate.0313.desc.fallback:0 "At last we have arrived. As we prepare to head out, we are disrupted."
  ek_attrebus_potentate.0313.desc.outro:0 " Unfortunately, my arrival has attracted some attention, and I am brought before [local_ruler.GetTitledFirstName].\n\n[local_ruler.GetSheHe|U] looks me up and down with clear curiosity, before asking me what should be a simple question: #V "Who are you?"#!\n\nI freeze. Who am I? Should I cling to my legacy as a scion of the #LORE [compendium_potentate]#! of old? Such a proclamation would surely attract some attention to my cause, but also danger.\nAnd yet, Tamriel has entered a new age, one without a Potentate, and perhaps I can change alongside it? Shedding my old name, I could move on and find my own purpose."
  ek_attrebus_potentate.0313.a:0 "I am Cazuras, heir of the Potentate!"
  ek_attrebus_potentate.0313.a.tt:0 "Your proclamation may attract unwanted attention..."
  ek_attrebus_potentate.0313.b:0 "I don't know yet, but I will find out."
  ek_attrebus_potentate.0313.b.tt:0 "You shed your old name, having outgrown it."
  cazuras_change_name_tt:0 "You will adopt the name #V Kasir#!"

  ek_attrebus_potentate.0314.t:0 "The Fallen Potentate"
  ek_attrebus_potentate.0314.desc:0 "Devastating news reach me this morning. The Warlord [attrebus.GetFirstName], the soulless scourge, finally seized the Imperial City and with it the crown of Cyrodiil. My Uncle has failed, and suffered the consequences.\n\nThey say that the Elder Council will rule now, eager to fill their coffers with the rotting carcass of Reman's Empire. The Warlord's hatred for the Akaviri is unmatched, and he will no doubt soon begin his purge of my people.\n\nMy small entourage is all that remains of the #LORE [compendium_akaviri_potentate]#!, the wise stewards of Tamriel."
  ek_attrebus_potentate.0314.a:0 "Devastating news."
  ek_attrebus_potentate.0314.a.tt:0 "You will reflect upon your future..."
  ek_attrebus_potentate.0314.b:0 "I will assume my birthright."
  ek_attrebus_potentate.0314.c:0 "And so the wheel keeps turning..."
  potentate_in_exile_rename_tt:0 "You will assume your position as the #V Potentate-In-Exile#!"

  ek_attrebus_potentate.0315.t:0 "Potentate-In-Exile"
  ek_attrebus_potentate.0315.desc:0 "When I led my army into the Imperial City to finally destroy the #LORE [compendium_akaviri_potentate]#!, I had my men hunt down most of these serpent-men without issue. However, the close family of [old_potentate.GetFirstNamePossessive], the last Potentate, mysteriously vanished and slipped my grasp, apparently having abandoned the city in a hurry some time prior.\n\nNow I know what became of that vile spawn! [adventurer.GetFirstName] has proclaimed himself [adventurer.GetPrimaryTitle.GetNameNoTier], and seems to be active around [supposed_area.GetNameNoTier]. Though he is likely doomed to fade into obscurity, it wouldn't hurt to accelerate his fate."
  ek_attrebus_potentate.0315.a:0 "I will hunt him down."

  ek_attrebus_potentate.0316.t:0 "Serpents in Hiding"
  ek_attrebus_potentate.0316.desc:0 "When I led my army into the Imperial City to finally destroy the #LORE [compendium_akaviri_potentate]#!, I had my men hunt down most of these serpent-men without issue. However, the close family of [old_potentate.GetFirstNamePossessive], the last Potentate, mysteriously vanished and slipped my grasp, apparently having abandoned the city in a hurry some time prior.\n\nAs of yet, I still don't know what happened to them. Reports seem to suggest that they were last spotted in [GetTitleByKey('b_leyawiin').GetNameNoTier], hurriedly boarding a vessel en route towards [supposed_area.GetNameNoTier]. Whatever became of Cazuras, he is likely doomed to fade into obscurity."
  ek_attrebus_potentate.0316.a:0 "I wonder where that serpent fled..."
  cazuras_changes_his_name_tt:0 "#V Cazuras#! adopted the name Kasir"
 
