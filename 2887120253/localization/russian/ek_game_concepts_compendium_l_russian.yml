l_russian:
### COMPENDIUM
 game_concept_compendium:0 "Компендиум"
 game_concept_compendium_desc:0 "Содержание компендиума предоставляет исторический контекст для Elder Kings 2.\n\nСодержание компендиума:\nРелигия:\n$BULLET_WITH_TAB$#LORE [compendium_aedra]#!\n$TAB$$BULLET_WITH_TAB$#LORE [compendium_divines]#!\n$BULLET_WITH_TAB$#LORE [compendium_daedra]#!\n$BULLET_WITH_TAB$#LORE [compendium_magnus]#!\n$BULLET_WITH_TAB$#LORE [compendium_missing_god]#!\nИстория:\n$BULLET_WITH_TAB$#LORE [compendium_akaviri_potentate]#!\n$BULLET_WITH_TAB$#LORE [compendium_narfinsel_schism]#!\n$BULLET_WITH_TAB$#LORE [compendium_ragada_na_totambu]#!\n$BULLET_WITH_TAB$#LORE [compendium_sixteen_kingdoms]#!\n$BULLET_WITH_TAB$#LORE [compendium_elsweyr_confederacy]#!\nЭры:\n$BULLET_WITH_TAB$#LORE [compendium_dawn_era]#!\n$BULLET_WITH_TAB$#LORE [compendium_merethic_era]#!\n$BULLET_WITH_TAB$#LORE [compendium_first_era]#!\n$BULLET_WITH_TAB$#LORE [compendium_second_era]#!\nПрочее:\n$BULLET_WITH_TAB$#LORE [compendium_aldmeris]#!\n$BULLET_WITH_TAB$#LORE [compendium_ooze]#!"

 
 game_concept_compendium_aedra:0 "Аэдра"
 game_concept_compendium_ancestors:0 "Предки"
 game_concept_compendium_aedric:0 "Аэдрический"
 game_concept_compendium_aedra_desc:0 "#bold Аэдра#!, что в переводе с древнего альдмерского языка означает «предки», — это боги, которые участвовали в создании Мундуса. В ходе этого процесса они утратили большую часть своих божественных сил и потому, в отличие от даэдра, не способны принимать активное участие в его жизни. Ещё одной частью божественного договора сотворения является то, что аэдра можно убить. Убитым считается бог-обманщик #LORE [compendium_lorkhan]#!, чьё тело — две Луны — по сей день можно наблюдать на небе.\n\nАэдра поклоняются в большей части Тамриэля, но наибольшую известность обрёл культ #LORE [Concept('compendium_divines', 'Восьми богов')]#!.\n\nБольше информации по истории игрового мира вы найдёте в #LORE [Concept('compendium', 'компендиуме')]#!."
 
 game_concept_compendium_daedra:0 "Даэдра"
 game_concept_compendium_daedric:0 "Даэдрический"
 game_concept_compendium_daedric_prince:0 "Князь даэдра"
 game_concept_compendium_daedric_princes:0 "Князья даэдра"
 game_concept_compendium_daedra_desc:0 "#bold Даэдра#!, что в переводе с древнего альдмерского языка означает «не наши предки», — это духи, отказавшиеся участвовать в сотворении Мундуса. В связи с этим они сохранили большую часть своих божественных сил и действуют гораздо активнее, чем #LORE [compendium_aedra]#!.\nШестнадцать самых могущественных даэдра известны как #bold князья даэдра#!. Каждый из них правит собственным планом Обливиона, которые, как говорят, являются частью их собственной сущности. Другие даэдра предстают в разных обличьях и известны как дремора, атронахи или скампы. Они, как правило, служат князьям.\n\nПоклонение даэдра и заключение с ними сделок часто считается незаконной деятельностью во многих регионах Тамриэля, поэтому этим занимаются в тайне. Некоторые народы, в частности предельцы, орки и данмеры, открыто поклоняются даэдра, навлекая на себя недоверие иноземцев. Каджиты же вообще не делают различий между аэдра и даэдра.\n\nБольше информации по истории игрового мира вы найдёте в #LORE [Concept('compendium', 'компендиуме')]#!."
 
 
 game_concept_compendium_alchemy:0 "Алхимия"
 game_concept_compendium_alchemy_desc:0 "#bold Алхимия#! — искусство древнее как само время — изучает процессы создания ядов или зелий путём смешивания, кипячения или дистилляции нескольких ингредиентов. Считается, что впервые его описал Аслиэль Диренни, но уже к тому моменту в Тамриэле знали, каким отваром можно вылечить лихорадку и какие кости надо растолочь для приготовления яда.\n\nСуществуют самые разные алхимические ингредиенты: это могут быть растения, листья, части тела животных, останки нежити или даже даэдра. Это делает алхимию занятием потенциально очень плодотворным, но при этом и рискованным: для приготовления самых сильных ядов и зелий требуются самые дорогие ингредиенты, искать которые нужно в опаснейших местах Аурбиса.\n\nБольше информации по истории игрового мира вы найдёте в #LORE [Concept('compendium', 'компендиуме')]#!."
 
 game_concept_compendium_divines:0 "Божества"
 game_concept_compendium_eight_divines:0 "Восемь богов"
 game_concept_compendium_divines_desc:0 "#bold Восемь богов#! — это самые могущественные из #LORE [compendium_aedra]#!, которые, как считается, остались таковыми даже после этого как они утратили свои силы в ходе создания Мундуса. Поклонение им берёт начало с момента основания Алессией новой империи, в которой предстояло сосуществовать нордским и эльфийским божествам.\n\nВ своём договоре с Алессией Акатош, Бог-Дракон Времени, поклялся защищать Мундус от влияния даэдра, покуда Алессия и её наследники несут свет этой веры в Тамриэле. Помимо #italic Акатоша#! в пантеон также входят #italic Аркей#!, #italic Дибелла#!, #italic Джулианос#!, #italic Кинарет#!, #italic Мара#!, #italic Стендарр#! и #italic Зенитар#!. В разных культурах отдельные божества представлены под разными именами. Кинарет, к примеру, среди нордов известна как Кин, а каджиты называют её Кенарти. Другие аэдра, такие, как #LORE [compendium_magnus]#! или И'ффре, часто почитаются наряду с Восемью.\n\nБольше информации по истории игрового мира вы найдёте в #LORE [Concept('compendium', 'компендиуме')]#!."
 
 game_concept_compendium_magnus:0 "Магнус"
 game_concept_compendium_magrus:0 "Магрус"
 game_concept_compendium_sun:0 "Солнце"
 game_concept_compendium_magnus_desc:0 "Бог Магии, #bold Магнус#! — один из сильнейших Изначальных духов, эт'Ада. Когда другие аэдра по наущению #LORE [Concept('compendium_lorkhan', 'Лорхана')]#! создавали план смертных, Магнус был «Архитектором Мундуса»: он чертил схемы, которым следовали другие божества.\n\nУзнав об обмане Лорхана, Магнус был сильнейшим из духов и одним из первых, кто решил покинуть молодой мир, прорвав завесу, ограничивающую Мундус, позволив чистой энергии Этериуса проникать в план. Его последователи, магна ге, уходя, тоже оставили дыры, ставшие звёздами.\n\nПочитатели Магнуса по-прежнему встречаются по всему Тамриэлю, в частности он входит в пантеоны альтмеров и бретонцев. При этом вопрос о том, можно ли его считать аэдра, остаётся спорным.\n\nБольше информации по истории игрового мира вы найдёте в #LORE [Concept('compendium', 'компендиуме')]#!."
 
 game_concept_compendium_missing_god:0 "Потерянный Бог"
 game_concept_compendium_lorkhan:0 "Лорхан"
 game_concept_compendium_shezarr:0 "Шезарр"
 game_concept_compendium_shor:0 "Шор"
 game_concept_compendium_sheor:0 "Шеор"
 game_concept_compendium_sep:0 "Сеп"
 game_concept_compendium_lorkhaj:0 "Лорхадж"
 game_concept_compendium_lorkh:0 "Лорх"
 game_concept_compendium_tseol:0 "Цеол"
 game_concept_compendium_missing_god_desc:0 "#bold Потерянный Бог#! — общий термин, под которым подразумевается божество известное под разными именами: #italic Лорхан#!, #italic Шезарр#!, #italic Шор#!, #italic Шеор#!, #italic Сеп#!, #italic Лорхадж#!, #italic Лорх#! или #italic Цеол#!. Это прозвище он получил за роль, которую ему отводят большинство космогонических концепций: он стал жертвой сотворения, убитый другими божествами, разгневанными за его обман.\n\nОн убедил их принять участие в своём плане и создать новый мир. В процессе #LORE [compendium_magnus]#!, Архитектор, узнал правду о замысле Потерянного Бога и ушёл, возглавив исход богов, ставших известными как магна ге.\n\nОставшиеся боги, решившие завершить проект, потеряли почти все свои силы и стали в дальнейшем #LORE [compendium_aedra|l]#!, Костями Мира и эльнофей — предтечами смертных рас.\n\nИ почитатели, и ненавистники Лорханы единогласны в том, что он сыграл ключевую роль в появлении плана смертных и жизни, которую мы знаем. Существуют разные мнения о том, что есть жизнь смертного: благословение — так считают в большинстве верований, нейтральных или благосклонных по отношению к Потерянному Богу — или же проклятие — так думают те, для кого Мундус — символ грехопадения и препятствие на пути к бессмертию.\n\nБольше информации по истории игрового мира вы найдёте в #LORE [Concept('compendium', 'компендиуме')]#!."

 game_concept_compendium_aldmeris:0 "Альдмерис"
 game_concept_compendium_aldmeris_desc:0 "#bold Альдмерис#! — мифическая прародина альдмеров, из которой по легенде происходят все меры. Неясно, действительно ли это реально существовашее место или проявление общей памяти о древних временах.\n\nБольше информации по истории игрового мира вы найдёте в #LORE [Concept('compendium', 'компендиуме')]#!."
 
 game_concept_compendium_sixteen_kingdoms:0 "Шестнадцать королевств"
 game_concept_compendium_sixteen_kingdoms_desc:0 "#bold Шестнадцать королевств#!, или Шестнадцать племён: #italic Не-Квин-Ал (Анеквина), Рим'ха (Риммен), Равла-Кей (Риверхолд), Дюней (Дюна), Орхадж (Оркрест), Веркарт, Мейрвейл, Хелкарн, Аль'басти (Алебастр), Брук'ра, Коринф, Па'алатин (Пеллитина), Тенмар, Торвал, Кенартия и Сенчал#! — старые королевства древнего Эльсвейра, существовашие до их объединения в Анеквину и Пеллитину, произошедшего после 1Э 2260 вслед за завершением Трассианской чумы.\n\nБольше информации по истории игрового мира вы найдёте в #LORE [Concept('compendium', 'компендиуме')]#!."
 
 game_concept_compendium_elsweyr_confederacy:0 "Конфедерация Эльсвейр"
 game_concept_compendium_elsweyr_confederacy_desc:0 "Каджиты утверждают, что их цивилизация одна из древнейших в Тамриэле, однако идея о едином Эльсвейре возникла сравнительно недавно. Конфедерация Эльсвейр была образована в 2Э 309, когда король Анеквины Кейрго и королева Пеллитины Эшита поженились, и впервые за всю историю Эльсвейр был объединён. Единство продлилось недолго, и в 2Э 326 столица, город Не Квин-ал, была разорена восставшими племенными подданными Конфедерации, и королевская семья была убита. Однако духовный лидер Эльсвейра, Грива Рид-Тар-ри'Датта, восстановил мир, введя изобретённую им систему разделения власти между дворянством и лидерами племён в соответствии с фазами лун. Вскоре он обрёл официальную власть над всей Конфедерацией Эльсвейр и стал первым из Грив, кто правил им.\n\nБольше информации по истории игрового мира вы найдёте в #LORE [Concept('compendium', 'компендиуме')]#!."
 
 game_concept_compendium_dawn_era:0 "Эра рассвета"
 game_concept_compendium_dawn_era_desc:0 "#bold Эра рассвета#! — период, характеризующийся нелинейным течением времени и непостоянством самих законов природы. Она завершилась, когда боги собрались в Адамантиновой башне, и бог времени упорядочил его течение. Вслед за Эрой рассвета последовала #LORE [compendium_merethic_era]#!.\n\nБольше информации по истории игрового мира вы найдёте в #LORE [Concept('compendium', 'компендиуме')]#!."
 
 game_concept_compendium_merethic_era:0 "Меретическая эра"
 game_concept_compendium_mythic_era:0 "Мифическая эра"
 game_concept_compendium_merethic_era_desc:0 "#bold Меретическая эра#!, также известная как Эра мифов, не имеет чёткого начала: самая ранняя из известных дат — 2500 год Меретической эры, им археологи датируют постройку Адамантиновой башни. Магическая хронология того, что происходило до этого, невозможна ввиду нелинейности течения времени в Эру рассвета. Летоисчисление Меретической эры ведётся в обратном порядке вплоть до нулевого года #LORE [Concept('compendium_first_era', 'Первой эры')]#!, когда Эплир Каморан объединил Валенвуд в первое в мире королевство.\n\nБольшинство современных культур воспринимают эти времена как доисторические: в эту эпоху предки альтмеров альдмеры населяли Тамриэль, атморцы приплыли в Скайрим, и началось расселение древних недов.\n\nБольше информации по истории игрового мира вы найдёте в #LORE [Concept('compendium', 'компендиуме')]#!."
 
 game_concept_compendium_first_era:0 "Первая эра"
 game_concept_compendium_first_era_desc:0 "Вслед за #LORE [Concept('compendium_merethic_era', 'Меретической эрой')]#! последовала #bold Первая эра#!. Она продолжалась тридцать веков и закончилась убийством императора Ремана III и его наследников от рук Мораг Тонг, что привело к возвышению первого #LORE [Concept('compendium_akaviri_potentate', 'Акавирского Потентата')]#! и началу текущей, #LORE [Concept('compendium_second_era', 'Второй эры')]#!.\n\nПервая эра видела рассвет и падение двух Сиродильских империй, Сумеречье древней Аргонии, прибытие в Тамриэль редгардов и многие другие определяющие события в истории мира.\n\nБольше информации по истории игрового мира вы найдёте в #LORE [Concept('compendium', 'компендиуме')]#!."

 game_concept_compendium_second_era:0 "Вторая эра"
 game_concept_compendium_second_era_desc:0 "Текущая эра в истории Тамриэля — #bold Вторая#!. О её начале объявил [Concept('compendium_akaviri_potentate', 'акавирский потентат')]#! Версидью-Шайе в 2920 году Первой эры после гибели императора Ремана III и его наследников. События Elder Kings 2 происходят в эту эру.\n\nБольше информации по истории игрового мира вы найдёте в #LORE [Concept('compendium', 'компендиуме')]#!."
 
 game_concept_compendium_ooze:0 "Ил" #I wanna get c_ouze clickable
 game_concept_compendium_ooze_desc:0 "Согласно босмерским преданиям, #bold Ил#! был неопределённой формой существования, до того как И'ффре благословил мир устойчивым обличьем. Детям босмеров с ранних лет рассказывают о бесформенном хаосе, царившем до этого момента, и о том, как И'ффре своей песней объяснил каждому живому существу: от мельчайшего жука до высочайшего дуба — его предназначение.\n\nПервым из его творений стал Зелёный лес, получивший способность влиять на собственную форму. Вторыми стали эльфы, которых он наставил слагать истории, но запретил менять свою форму или форму Зелёного леса: так гласит первая часть Зелёного пакта. И'ффре вместо этого наказал эльфам уважать Зелёный лес и при помощи доброго слова просить его изменять своё обличье и превращаться в убежище для них. Третья песнь И'ффре была о зверях, которых он даровал для пропитания босмерам: так гласит вторая часть Зелёного пакта. Он сказал им никогда не употреблять в пищу растения, есть только мясо и не допускать, чтобы оно пропадало зря.\n\nКогда все истории были рассказаны, И'ффре, удовлетворившись, из остатков Ила сделал тюрьму в наказание для тех, кто нарушит пакт, осквернив Зелёный лес или свои тела.\n\nБольше информации по истории игрового мира вы найдёте в #LORE [Concept('compendium', 'компендиуме')]#!."
 
 game_concept_compendium_na_totambu:0 "На-Тотамбу"
 game_concept_compendium_ragada:0 "Ра Гада"
 game_concept_compendium_ragada_na_totambu:0 "Ра Гада и На-Тотамбу"
 game_concept_compendium_warrior_wave: "Волна воителей"
 game_concept_compendium_ragada_na_totambu_desc:0 "Ра Гада в переводе с йокуданского означает «волна воителей». Это общий термин, под которым понимают четыре последовательные волны йокуданских переселенцев, колонизаторов и захватчиков Хаммерфелла в раннюю #LORE [Concept('compendium_first_era', 'Первую эру')]#!. Вскоре вслед за ними последовали #bold На-Тотамбу#!, правящее дворянское сословие Йокуды, которое продолжило править и на новом континенте.\n\nХотя термином «редгарды», представляющим собой искажённое «Ра Гада», называют обе группы бывших йокуданцев, сами Ра Гада консолидировались во фракцию Предшественников, а потомки На-Тотамбу во времена Второй империи известны как Венценосцы.\n\nБольше информации по истории игрового мира вы найдёте в #LORE [Concept('compendium', 'компендиуме')]#!."
 
 game_concept_compendium_narfinsel_schism:0 "Нарфинсельский раскол"
 game_concept_compendium_narfinsel_schism_desc:0 "Корни #bold Нарфинсельского раскола#! практически невозможно отследить, и историки давно оставили всякие попытки это сделать. Известно, однако, что в период поздней Меретической эры он уже был в самом разгаре. Раскол ознаменовал начало заката Императум салиачи и айлейдской цивилизации в целом. Кто-то называет его гражданской войной, и отчасти это верная характеристика. Несколько веков опосредованных конфликтов и кровавых столкновений между аэдропоклонниками барсебическими айлейдами и даэдропоклонниками ататарскими айлейдами разобщили айлейдское общество, накалили страсти и привели к тому, что в Альд-Сироде пролилось много крови невинных. Казалось, конфликту не будет конца, но в 198 году Первой эры Аран Ататарский сокрушил аэдропоклонников во время печально известной Зачистки Венделбека. Остатки сил барсебических айлейдов были слабы и дезорганизованы. Они бежали на юго-восток в сторону приграничных земель Аргонии: Тенетопи, Чёрного Леса и Плачущего Берега. На несколько лет ататарские айлейды и поклонение даэдра стали доминировать в Сиродиле влпоть до начала Алессианского восстания в 242 году Первой эры, когда не прошло и полувека с кульминации раскола.\n\nБольше информации по истории игрового мира вы найдёте в #LORE [Concept('compendium', 'компендиуме')]#!."

 game_concept_compendium_akaviri_potentate:0 "Акавирский потентат"
 game_concept_compendium_potentate:0 "Потентат"
 game_concept_compendium_potentates:0 "Потентаты"
 game_concept_compendium_akaviri_potentate_desc:0 "#bold Акавирский потентат#! обозначил второй период в истории Второй Тамриэльской империи. Его учредил акавирский потентат Версидью-Шайе после гибели императора Ремана III и его наследников от рук Мораг Тонг в 1Э 2920. До этого момента потентаты служили наиболее доверенными советниками императоров династии Ремана.\nХотя властвование потентата продлилось почти пятьсот лет, его тяжело было назвать стабильным: Версидью-Шайе и Савириен-Чораку приходилось подавлять множество восстаний против своего подчас тиранического правления. Однако в этот период также был издан Имперский Акт о гильдиях, вслед за которым было основано множество гильдий, действующих в Тамриэле и поныне.\nКонец периода Акавирского потентата пришёлся на 2Э 430, когда Савириен-Чорак вместе со всеми его наследниками за одну ночь был убит Мораг Тонг (хотя некоторые говорят, что за этим стояло Тёмное Братство). Империя рухнула, и началось Междуцарствие.\n\nБольше информации по истории игрового мира вы найдёте в #LORE [Concept('compendium', 'компендиуме')]#!"
 ### End of Compendium
 
