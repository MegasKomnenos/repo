 #Trinimac Cult
 
 trinimac_cult:0 "Тринимакск"
 trinimac_cult_adj:0 "Культ Тринимака"
 trinimac_cult_adherent:0 "Культист Тринимака"
 trinimac_cult_adherent_plural:0 "Культисты Тринимака"
 trinimac_cult_desc:0 "Тринимак — альдмерский бог-герой правды, чести и справедливости; повсеместно верят, что его, преданного, пожрал #LORE [compendium_daedric_prince|l]#! Боэтия, после чего последователи Тринимака превратились в первых орков, а сам он стал князем даэдра Малакатом, богом всех гонимых и прозябающих, богом войны, клятв и проклятий. Однако, хотя большинство орков поклоняются Малакату как новому обличью Тринимака, многие верят, что он никак не связанный с ним демон, пленивший их бога, который однажды вернётся, чтобы возглавить поход своих последователей в новую эпоху. Эти культисты стремятся прожить жизнь, подражая своему герою — исповедуя идеалы чести, добродетели и единства всего народа Тринимака."
 trinimac_cult_religious_head_title:0 "Эксиларх"
 
 #Vosh Rakh
 
 vosh_rakh:0 "Вош-рахийск"
 vosh_rakh_adj:0 "Вош Рах"
 vosh_rakh_adherent:0 "Вош-рахиец"
 vosh_rakh_adherent_plural:0 "Вош-рахийцы"
 vosh_rakh_desc:0 "Вош Рах, что переводится как «Клинок Отваги», — это особенно радикальное и конспиратическое ответвление культа Тринимака, возникшее среди орков Ротгара. Они восславляют Тринимака как бога войны и выступают сторонниками модернизации, объединения всех орков, изгнания иноземного влияния и непримиримой борьбы со всеми, кто встанет у них на пути."
 vosh_rakh_religious_head_title_name:0 "Вош Рах"
 vosh_rakh_religious_head_title:0 "Вош Рах"