 mephala_cult_desc:0 "Культисты Мефалы, посвятившие себя своему князю, строго соответствуют её сфере — секретов и лжи. Процветая под покровом тьмы, они влияют на окражующий мир, манипулируя словом и кинжалом — так, как желает их госпожа."
