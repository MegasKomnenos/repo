 mephala_religion_desc:0 "Объединение из малосвязанных верований, почитающих Мефалу, Прядильщицу Сетей. Для разума смертного неисповедимо бытие любого князя даэдра, однако даже на их фоне загадочность Мефалы выделяется. Она проявляет странный интерес к делам смертных, и многие верят, что она плетёт нити судеб тех, кто поклоняется ей, а также тех, кому не посчастливилось оказаться в её сфере. Мефалу в той или иной форме почитают данмеры Морровинда и каджиты Эльсвейра."
