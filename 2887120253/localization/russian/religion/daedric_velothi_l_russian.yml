 tribunal_cult_adherent:1 "Культист Трибунала"
 tribunal_cult_adherent_plural:1 "Культисты Трибунала"
 tribunal_cult_desc:0 "Культ Трибунала — устойчивое южное гетеродоксальное религиозное течение, восходящее корнями к каймерским народным верованиям. Его обряды и традиции воспроизводят оные у древних велотийцев. Культ Трибунала признаёт главенство Живых Богов в миру, сохраняя потомственное право открыто и истово поклоняться Хорошим Даэдра. В нём подчёркивается важность поддержания хороших отношений с Трибуналам при жизни и с его Предтечами — в смерти. Благодаря этому органичному и тщательно оговоренному синтезу старого и нового, культ мирно сосуществует с доктринами Храма."

 #High Velothi
 old_velothi:1 "Высоко-велотийск"
 old_velothi_adj:1 "Высокая велотийская вера"
 old_velothi_adherent:1 "Велотист"
 old_velothi_adherent_plural:1 "Велотисты"
 old_velothi_desc:0 "Исконная вера Велота и его последователей. Из-за того, что они поклонялись Трём Хорошим Даэдра: Азуре, Боэтии и Мефале, последователи Велота вынуждены были покинуть острова Саммерсет и начать свой исход в новую родину — Ресдайн. После вознесения Трибунала, большинство признало в АЛЬМСИВИ своих новых богов. Но говорят, что далеко-далеко, вне досягаемости Трибунала, всё ещё живут каймеры, проповедующие слово Велота…"
