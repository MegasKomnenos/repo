 tribunal_temple_desc:0 "Храм Трибунала — религия коренных жителей Морровинда, основанная св. Велотом после его исхода вместе с последователями на восток. Она совмещает избирательное почитание «Хороших Даэдра» и обличение «Дома Забот» наряду с поклонением Трибуналу, трём бессмертным королям-богам Морровинда, достигшим божественности в ходе событий, последовавших за битвой у Красной горы. Храм Трибунала организован по строгим канонам и оказывает серьёзное влияние на большую часть данмерского общества."
