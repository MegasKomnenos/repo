 sixth_house_custom_desc:0 "[GetPlayer.Custom('sixth_house_dynamic_desc')]"
 sixth_house_nonfollower_desc:0 "Шестой Дом, или Великий дом Дагот, был одним из древних Великих домов Морровинда. Он впал в безвестность после событий битвы у Красной горы. Правды о падении этого дома мы никогда не узнаем, однако распространено убеждение, что Неревар Индорил доверил главе этого дома, Ворину Даготу, охранять инструменты Кагренака, прежде чем удалиться на совещание с советниками. Дагот же погрузился в изучение инструментов и, попробовав вытянуть силу из Сердца #LORE [Concept('compendium_lorkhan', 'Лорхана')]#!, решил украсть её для собственных корыстных целей. Неревар со своими советниками в великой битве сразились с ним, ставшим известным как Дагот Ур, загнав глубоко в недра Красной горы. Там, под Сердцем, глубоко в жерле вулкана, он ждёт своего часа чтобы восстать."
 sixth_house_follower_desc:0 "Я ШАРМАТ\nЯ СТАРШЕ МУЗЫКИ\nЧТО Я ПРИНОШУ, ЕСТЬ СВЕТ\nЧТО Я ПРИНОШУ, ЕСТЬ ЗВЕЗДА\nЧТО Я ПРИНОШУ, ЕСТЬ\nДРЕВНЕЕ МОРЕ"
