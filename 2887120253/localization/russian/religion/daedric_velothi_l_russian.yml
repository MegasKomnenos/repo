 velothi_faiths_desc:0 "История всех велотийских конфессий началась с исхода, возглавленного пророком Велотом. Во всех них почитаются Хорошие Даэдра — три князя, которые помогали каймерам до, во время и после завершения их опасного путешествия в Ресдайн. После возвышения Трибунала образовалось несколько раскольнических религиозных течений, признающих либо отвергающих авторитет Живых Богов Морровинда."
