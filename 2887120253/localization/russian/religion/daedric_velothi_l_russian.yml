 #Cantemiric Sect
 cantemiric_sect:1 "Кантемирск"
 cantemiric_sect_adj:1 "Кантемирская секта"
 cantemiric_sect_adherent:1 "Кантемирец"
 cantemiric_sect_adherent_plural:1 "Кантемирцы"
 cantemiric_sect_desc:0 "История не сохранила имена многих из бесчисленных продолжателей пастырства Велота… Многих, но не Кантемира. Выдающаяся харизма позволила ему объединить вокруг себя велотийцев-отступников и обосноваться не в пепельном Вварденфелле и цветущем Дешаане, но в южных топях Ресдайна и даже во внешней Аргонии.\n\nКо времени его смерти, «кантемирская» секта сформировала догмы, выделяющие её среди других каймерских храмов. Мундус — это место испытаний, где достойные души избираются для вечного служения Хорошим Даэдра. Души прочих поглощаются Домом Забот, подготавливаясь к возвращению в Мундус для следующей попытки. Чтобы выйти за пределы плана смертных и спастись от Дома Забот, нужно без устали бороться с заурядностью.\n\nКантемирцы часто медитируют, чтобы распознать пороки, стоящие на их пути к совершенствованию. За годы кантемирцы придумали множество замысловатых мантр, выдержки из которых дома кантемирцев помещают в свои гробницы. Многие племена считают деревья Хиста святыми-хранителями, так как те сыграли ключевую роль в достижении Кантемиром просветления."
