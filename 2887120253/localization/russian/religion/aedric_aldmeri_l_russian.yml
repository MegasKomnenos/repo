 malada_adj:0 "Малада"
 malada_adherent:0 "Малабуро"
 malada_adherent_plural:0 "Малабуро"
 malada_desc:0 "Айлейдов, лишившихся отчизны и своих домов, но верных поклонению #LORE [compendium_aedra|l]#!, горечь обиды заставила пересмотреть свои духовные ориентиры: разуверившись в «близости» с богами, которые содействовали их врагам-людям, эльфы разделили аэдра на две категории вне зависимости от родства: Малада — высшие боги, отвечающие за идеалы правды, добродетельности и славы, и Эльнада — смертные боги, олицетворяющие низость, вероломство и горе. Маладаические эльфы поклоняются магна ге как наиболее гордым и благородным среди Малада, а имена Кинарет и #LORE [Concept('compendium_lorkhan', 'Лорхана')]#! употребляют только в самых страшных из проклятий." 
