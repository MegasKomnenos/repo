 #Alessian Order
 
 alessian:0 "Алессианск"
 alessian_adj:0 "Алессианский орден"
 alessian_adherent:0 "Последователь Алессианства"
 alessian_adherent_plural:0 "Последователи Алессианства"
 alessian_desc:0 "Алессианский орден — фанатичная, суровая и сложная конфессия, созданная в #LORE [Concept('compendium_first_era', 'Первую эру')]#! обезьяньим пророком Маруком после того, как он получил откровение свыше от духа святой Алессии. В её центре находится проповедование веры в верховного бога, Единого, которого часто отождествляют с Акатошем; но по прошествии времени, вместе с усложнением структуры ордена, в неё начали включать всё больше и больше малых святых и божков. Её краеугольным камнем являются Семьдесят Семь Неколебимых Доктрин Марука, в которых объясняются эльфийские злодеяния, способ побороть смерть и ныне знаменитое высказывание: «Все виновны, пока не доказано обратное»."
 
 #Temple of the One
 
 temple_one:0 "Монотеистическ"
 temple_one_adj:0 "Храм Единого"
 temple_one_adherent:0 "Последователь Единого"
 temple_one_adherent_plural:0 "Последователи Единого"
 temple_one_desc:0 "Храм Единого — единственная легализованная конфессия марукатизма в Сиродиле, основанная императором Реманом в #LORE [Concept('compendium_first_era', 'Первую эру')]#! для блюдения за Драконьими огнями, а также для того, чтобы ассимилировать оставшихся членов Алессианского ордена. И хотя она сохраняет свои марукатистские корни, по сравнению с другими конфессиями она обладает более легковесной системой убеждений, делающей акцент на многообразии аспектов бога, чьей основной манифестацией является Верховный Дух Акатош."
