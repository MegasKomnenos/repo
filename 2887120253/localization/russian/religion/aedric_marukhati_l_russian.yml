 marukhati_religion_desc:0 "Марук был имга и пророком времён #LORE [Concept('compendium_first_era', 'Первой эры')]#!, возвысившимся до небывалых вершин после основания Алессианского ордена — радикальной религиозной группы, доминировавшей в Сиродиле на протяжении двух тысячелетий вплоть до своего быстрого краха в 2321 году Первой эры во время Войны справедливости. По словам самого Марука, находясь в изгнании, где он проводил своё искупление, он увидел дух святой Алессии, научивший его Семидесяти Семи неколебимым Доктринам, которые он записал на камнях своей кровью. Помимо своей веры в высшего бога, именуемого Единым, они также утверждают, что смерть — это иллюзия, и что ведя праведную жизнь и избавляясь от всякой эльфийской порчи, можно преодолёть её оковы."
