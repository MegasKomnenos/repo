 #Green Pact
 
 greenpact:0 "Пактистск"
 greenpact_adj:0 "Зелёный Пакт"
 greenpact_adherent:0 "Приверженец Зелёного Пакта"
 greenpact_adherent_plural:0 "Приверженцы Зелёного Пакта"
 greenpact_desc:0 "Зелёный Пакт — священный свод правил, ниспосланный народу босмеров И'ффре-Рассказчиком в глубокой древности, чтобы помочь им жить в согласии с Лесом. Его законы просты: «Не причиняй вреда лесам Валенвуда. Не употребляй в пищу приготовленное из растений. Ешь только мясо. Сразив врага, поглоти его плоть. Убив, не дай тому, что осталось, пропасть зря. Не принимай облик зверя.»"
 greenpact_religious_head_title:0 "Сильвенар"
 greenpact_religious_head_title_name:0 "Сильвенар"
 
 #Blacksap Movement
 
 blacksapmovement:0 "Черноживическ"
 blacksapmovement_adj:0 "Движение Черноживицы"
 blacksapmovement_adherent:0 "Сторонник Черноживицы"
 blacksapmovement_adherent_plural:0 "Сторонники Черноживицы"
 blacksapmovement_desc:0 "Черноживица — националистическое политико-религиозное движение, зародившееся в босмерском обществе в городе Кормаунт после «резни в Новой Отраде», где целый городок переселенцев был уничтожен фанатиками из числа лесных эльфов за неуважительное отношение к Зелёному Пакту. Сторонники этого движения настаивают на письменной кодификации догматов Зелёного Пакта и беспрекословном следовании им, а также требуют исключения иноземного влияния в Валенвуде."
 blacksapmovement_religious_text:0 "Скреплённый Пакт"
 
 #Wilderking's Law
 
 wilderking:0 "Лесо-подданическ"
 wilderking_adj:0 "Закон Лесного короля"
 wilderking_adherent:0 "Подданый Лесного короля"
 wilderking_adherent_plural:0 "Подданые Лесного короля"
 wilderking_desc:0 "Поклонение Лесному королю, которого в юго-западном Валенвуде почитают на уровне божества, восходит ещё к #LORE [Concept('compendium_first_era', 'Первой эре')]#!. Это дух-страж леса, который направляет босмеров на пути жизни в гармонии с природой. После смерти очередного Лесного короля, его место занимает новый избранник с врождённой связью с природой. Воплощая божественную сущность, он теряет все воспоминания о своей прошлой жизни и приобретает сверхестественные способности Лесного короля. Хотя привычный босмерский пантеон и Зелёный Пакт также почитаются в его землях, слово Лесного короля в них — закон, так как он есть высшее выражение лесов Валенвуда."
 wilderking_religious_head_title:0 "Страж-Выразитель"
 wilderqueen_religious_head_title:0 "Страж-Выразительница"
 wilderking_religious_head_title_name:0 "Двор Лесного короля"
 wilderking_high_god_name:0 "Лесной король"
 wilderking_high_god_name_possessive:0 "Лесного короля"
 
 #Vinedusk Exemptions
 
 vineduskpact:0 "Адогматическ"
 vineduskpact_adj:0 "Освобождённые от Пакта"
 vineduskpact_adherent:0 "Освобождённый от Пакта"
 vineduskpact_adherent_plural:0 "Освобождённые от Пакта"
 vineduskpact_desc:0 "Священный свод правил жизни в гармонии с природой, Зелёный Пакт, босмеры в приграничных землях Валенвуда видят иначе. Несмотря на то, что они всё ещё с глубоким почтением относятся к лесу, соседство с чужеземцами и частые конфликты за годы привели к ослаблению влияния требований Пакта касательно ритуального каннибализма и запрета на рубку деревьев."
 
 
