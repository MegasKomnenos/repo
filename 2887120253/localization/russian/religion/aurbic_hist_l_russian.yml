 hist:0 "Хистск"
 hist_adj:0 "Хист"
 hist_adherent:0 "Последователь Хиста"
 hist_adherent_plural:0 "Последователи Хиста"
 hist_desc:0 "Хист — древняя раса разумных деревьев родом из Чернотопья. Они создали народ аргониан и живут с ними во взаимовыгодных отношениях. Деревья Хиста регулируют весь цикл жизни аргониан: когда они вылупятся из яйца и какие у них будут пол и облик, а, когда они умирают, реинкарнируют их души в новые тела; а также опекают племена, обитающие у их корней, помогая им советом и наставлениями. Из-за этого Хист почитают не как богов, а как, скорее, уважаемых наставников и любящих родителей, которые присматривают за одним или несколькими племенами. Помимо них у современных аргониан есть только один важный бог: Радж-Ситис — олицетворение цикла жизни и смерти и неизбежного изменения."
 hist_evil_god_rajsithis:0 "$god_rajsithis_name$"
 
 amberhist:0 "Янтарнохистск"
 amberhist_adj:0 "Янтарнокровный Хист"
 amberhist_adherent:0 "Последователь Янтарнокровного Хиста"
 amberhist_adherent_plural:0 "Последователи Янтарнокровного Хиста"
 amberhist_desc:0 "После наступления Сумеречья и падения старой цивилизации аргониан, поклонявшейся Ситису, разумные деревья Хист из Чернотопья радушно приняли назад своих детей. Но не все. Среди деревьев Хиста сохранилось меньшинство, стремящееся привести свой народ обратно, к истокам; но восславляя Порядок, а не Перемену и Разрушение, которые олицетворяет собой Ситис."
 amberhist_religious_head_title:0 "Архихранитель"
 amberhist_religious_head_title_name:0 "Ан-Зухил" 
