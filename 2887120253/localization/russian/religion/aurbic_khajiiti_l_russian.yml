 manypathsdance_adj:0 "Танец Многих Путей"
 manypathsdance_adherent:0 "Танцор Многих Путей"
 manypathsdance_adherent_plural:0 "Танцоры Многих Путей"
 manypathsdance_desc:0 "Танец Многих Путей — общий термин, под которым понимают древние каджитские верования, предшествовашие Явлению Риддл'Тара и отсылающие ещё ко временам #LORE [Concept('compendium_sixteen_kingdoms', 'Шестнадцати Королевств')]#! древнего Эльсвейра. Тысячи Путей возникли в засушливых землях Анеквины в период борьбы и конкуренции в каджитской культуре и потому характеризуются уклоном в воинственность и стоицизм, а также выделяют особое место божествам-драконам, таким как Алкош и Аха."
 
