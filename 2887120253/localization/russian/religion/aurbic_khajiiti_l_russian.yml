 khajiiti_religion_desc:0 "В традиционной каджитской религии почитается обширный пантеон богов — #LORE [compendium_aedra|l]#! и #LORE [compendium_daedra|l]#! — с богатой мифологией и связанными с ними историями. Эти устои серьзёно поколебало Явление Риддл'Тара, обретённое в 311 году #LORE [Concept('compendium_second_era', 'Второй эры ')]#! Гривой Рид-Тар-ри'Даттой, который основал новую религиозную философию, отодвигающую привычный пантеон на второй план в пользу полного сосредоточения на Двух Лунах: Джоун и Джоуде."
