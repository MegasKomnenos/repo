 niben_cult_desc:0 "В долине реки Нибен всё ещё представлены традиционные верования восходящие ещё к религиям древних недов; они характеризуются широким разнообразием, замысловатым пантеоном, уклоном в эзотерику и сложными обрядами, посвящёнными конкретным #LORE [compendium_aedra|l]#!, предкам, героям и богам-животным. Всё это, а также пёстрые одеяния, причудливые гобелены, клейма и татуировки и выделяет нибенейцев."
