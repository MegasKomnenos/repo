 nedic_cult_adherent_plural:0 "Недийские сектанты"
 nedic_cult_desc:0 "Неды первыми из людей заселяли Тамриэль в древние времена, распространяясь практически по всему континенту и формируя отдельные сообщества, различавшиеся по культурному и религиозному признаку.\n\nИ пусть на сегодняшний день остались лишь небольшие островки обитания представителей этого народа, современные неды, преимущественно живущие в Чернотопье, поклоняются пантеону #LORE [compendium_aedra|l]#!, не слишком отличному от имперского, с отличиями в виде особого сосредоточения на боге З'ене и трёхликой фигуры богини-матери из Дибеллы, Мары и Кинарет. Примечательное место в ней также занимает #LORE [compendium_lorkh]#!, их версия Шезарра. Некоторые учёные отстаивают позицию, что их религию можно считать близкой к доалессианскому и доайлейдскому недийскому пантеону богов."
