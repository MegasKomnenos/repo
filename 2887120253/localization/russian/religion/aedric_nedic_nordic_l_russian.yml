 hero_cult_desc:0 "История народа Сиродила знает многих легендарных героев, какие-то из которых за их подвиги и добродетели даже почитаются наравне с #LORE [Concept('compendium_eight_divines', 'Восемью богами')]#!. Главными из их числа являются Алессия Королева Рабов, Пелинал Вайтстрейк и Морихаус-Дыхание-Кин, которые в начале #LORE [Concept('compendium_first_era', 'Первой эры')]#! свергли угнетателей людей — айлейдов; при этом основав Первую империю и современную имперскую религию. Но помимо них существуют и местные герои, святые и поборники, которых принимает в себя пластичная и постоянно пополняющаяся мифология сиродильской истории, различающаяся от региона к региону и от человека к человеку."
