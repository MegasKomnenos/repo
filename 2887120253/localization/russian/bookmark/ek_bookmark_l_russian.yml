 # Warlord Rising - Skyrim
 bm_warlordrising_skyrim:0 "Оспоренная Истинность"
 bm_warlordrising_skyrim_desc:0 "Родина нордов разделена.\n\nВерховный король Логрольф был убит, и ярл Солитьюда Сварт оспорил легитимность его законного наследника. Когда выборное собрание избрало наследницей дочь Логрольфа Фрейдис, признанную самой Короной Истинности, Сварт созвал собственное собрание в Солитьюде.\n\nЭто привело к многовековому разделению Скайрима на восток, попавший под власть Фрейдис и её рода, и запад, которым правили Сварт и его наследники.\n\n#bold Сумеет ли один претендент сокрушить другого, объединив провинцию? Или же норды останутся разделены на века, пока чужак не захватит их земли, подчинив этот народ своей власти?#!"
 bm_warlordrising_svartr:0 "Король Сварт"
 bm_warlordrising_svartr_desc:0 "Стареющий ярл Солитьюда Сварт стал первым, кто подверг сомнению легитимность Фрейдис после убийства её отца Логрольфа. Действуя быстро и решительно, он созвал неполное выборное собрание в своих палатах, чтобы его объявили верховным королём. Однако это не позволило ему опередить Фрейдис, проведшую собственное собрание и надевшую Корону Истинности. Сварт вместе со сторонниками, не желая уступать, называет корону не более чем бестолковым артефактом, и предпочитает в своих королевских притязаниях опираться на силу армий.\n\n#bold Сумеет ли претендентка на корону положить конец кампании Сварта, пока тот не успел набрать поддержку? Или же вы сможете взять бразды правления в свои руки и объединить Скайрим под знаменем вашего дома, положив конец векам правления Востока?#!"
 bm_warlordrising_freydis:0 "Королева Фрейдис"
 bm_warlordrising_freydis_desc:0 "Дочь покойного верховного короля Логрольфа Фрейдис не пользуется единогласной поддержкой, и её власть над западной частью Скайрима можно назвать в лучшем случае слабой. Сватр, старый ярл Солитьюда, отказывается признавать её законным правителем. И если она не желает, чтобы Скайрим остался разделён на века, Фрейдис должна отправиться в поход на запад и восстановить свою власть над Солитьюдом и сторонниками Сварта.\n\n#bold Неужели Фрейдис и её род обречены на поражение? Или же вы сумеете сокрушить претендента, объединить провинцию и наконец пройти коронацию как верховная королева Скайрима?#!"
 bm_warlordrising_lodvar:0 "Ярл Лодвар"
 bm_warlordrising_lodvar_desc:0 "Король-норд в королевстве предельцев, Лодвар пришёл к власти, захватив Маркарт и сокрушив окружающие его местные племена. Большая часть Предела всё ещё ему не подвластна, а вассалы плетут заговоры по его свержению, но он ещё может найти союзников к востоку и северу.\n\n#bold Свергнет ли вас непокорный народ Предела, вновь обретя свободу, или же вы сумеете превратить Предел в полноценное нордское ярлство, принеся в него цивилизацию?#!"
 bm_warlordrising_yashnag:0 "Вождь Яшнаг"
 bm_warlordrising_yashnag_desc:0 "После разорения Орсиниума Яшнаг и его племя отправились на восток к землям их предков в Скайриме. Сварт, удерживающий власть в западной части провинции, оказался неспособен остановить орков, и те отвоевали собственное вождество в Фолкрите. После нескольких десятилетий властвования в Фолкрите, Яшнаг и его почётные воины были вызваны на дуэли и побеждены сыном прошлого ярла Фолкрита Хакквильдом.\n\n#bold Яшнаг и его род окружены врагами. Если они канут в забвение, оркам останется лишь в очередной раз разбрестись по миру. Или быть может вам хватит мужества, чтобы сохранить вождество Фолкрит за орками и сковать в местном горниле войны новый Орсиниум?#!"
 bm_warlordrising_yashnag_alt_mahk:0 "Принц Мак"
 bm_warlordrising_yashnag_alt_murzog:0 "Принц Мурзог"
 bm_warlordrising_iliac:0 "Кровь и пена волн"
 bm_warlordrising_iliac_desc:0 "Напиши меня, прошу!" #(я знаю, что эти строчки - плейсхолдеры и перевожу их патаму шо хочу!)
 bm_warlordrising_torygg:0 "Король Торигг"
 bm_warlordrising_torygg_desc:0 "Лишь немногие норды заслужили за свою жизнь такое же уважение, как Торигг Честный, но ещё меньше тех, кто говорит плохо об этом мудром харизматике. Правя владением Вайтран — перекрестьем дорог Скайрима — Торигг принёс мир и процветание землям центральных полей, ведя дружбу с теми, кто её ищет, и раздавая обещания тем, кто их достоин.\n\nОднако сейчас, когда титул верховного короля находится под вопросом и линии фронта строятся вокруг его королевства, Ториггу, возможно, придётся примкнуть к одной из сторон, ведь оба претендента уповают на богатую казну и арсеналы Вайтрана.\n\n#bold Сметут ли его грядущие беспорядки словно шторм, пронизывающий тундру, или же его миротворческих умений окажется достаточно, чтобы уберечь Вайтран в надвигающуюся бурю?#!"
 bm_warlordrising_brynjolfr:0 "Верховный вождь Бриньольф"
 bm_warlordrising_brynjolfr_desc:0 "На плечи верховного вождя Бриньольфа возложены большие ожидания, ведь он последний живой родственник легендарного Эйвара Певца Камней, героя скаалов, что в давнюю пору вернул дары Все-Создателя после их кражи Врагом.\n\nТеперь, когда большая часть земель Солстхейма была утеряна в пользу риклингских племён, народ скаалов надеется, что Бриньольф вернёт принадлежащие им земли, как его предок когда-то вернул божественные дары. Но в душе Бриньольф мало полагается на вырезанные на камнях предания и небылицы и верит, что хорошее случается с теми, кто умеет выжидать.\n\n#bold Сумеет ли он вернуть Солстхейм с миром, как сделал это его предок, или станет героем, каким его хочет видеть его народ?#!"



 # recommanded characters for the iliac bay 440


 # recommanded characters for the topal bay 440
 bm_warlordrising_topal:0 "Море Невзгод" #море бед/море волнуется/буря в море/ветер с моря дул — на твой выбор, Ворм
 bm_warlordrising_topal_desc:0 "Потентат рушится под собственной тяжестью! Его обломки стекают вниз по Нибену, скапливаясь в устье реки, но новопостроенные мосты ни за что не дадут им достигнуть моря. Вместе с властью и коммерческой мощью, что ускользают из рук больного человека Тамриэля, в бассейн Топальского моря и на его берега могучим потоком льются не только возможности, но и опасности — их извечный спутник.\n\nКоролева йеспестов, правящая на востоке, смотрит в будущее с надеждой и опаской. На севере Лейавин и герцогство Голубая Кровь играют с огнём: ценой великой выгоды им приходится разбираться с недовольством. И наконец, Сенчал как никогда раньше может обрести невероятное могущество.\n\n#bold Четверо правителей стоят на обрыве истории, впереди — возможность принести процветание своим землям. Сумеют ли они ей воспользоваться? Или же их владениям суждено обратиться в руины, ценные разве что для археологов?#!"
 bm_warlordrising_auril:0 "Королева Айне"
 bm_warlordrising_auril_desc:0 "Встречайте: Айне из клана Атла, дочь выдающегося короля Аурила, сумевшего в хаосе, возникшем после падения #LORE [Concept('compendium_akaviri_potentate', 'потентата')]#!, объединить йеспестов под знаменем Соулреста. Юной, но проницательной Айне предстоит оправдать возложенные на неё ожидания, если она не хочет остаться в тени своего отца. К тому же, её правление приходится на непростое время: аргонианские набеги становятся всё более частыми, ждущие удачного момента лилмотиты — всё более дерзкими, а Лейавин, сбросивший акавирские оковы, угрожает самой независимости народа йеспестов. Но и среди этих бед, подобных терновому кусту в саду королевы, расцветает роза, что может стать ценным союзником.\n\n#bold Айне знает, что независимость её народа, веками подавлявшаяся при помощи силы, достигнута ценой великих жертв. Сможет ли королева сохранить её, или увянет вместе с ней, померкнув в тени своего отца?#!"
 bm_warlordrising_fabiana:0 "Военачальница Фабиана"
 bm_warlordrising_fabiana_desc:0 "Фабиана Аркатона совершенно без ума от йеспестской королевы Айне, но ещё больший восторг, который, надо сказать, разделяет и её объект обожания, вызывает у неё сама мысль о том, как голова Ловиера Лейавинского отделяется от тела. Лучше отцеубийства двух благородных людей может сблизить только жажда возмездия.\n\nНо состояние владений Фабианы препятствует воплощению её мечты в жизнь — военачальницу-чужеземку не поддерживают местные в Чёрном Лесу. Ей придётся искать компромиссы, иначе её свергнут уже за то, что она не знает имён всех до единого речных святых.\n\n#bold И если Фабиане удастся сохранить стабильность во владениях и угодить своей союзнице, можно быть уверенным — никакой «повелитель» не будет повелевать ни ей, ни кому-либо ещё.#!"
 bm_warlordrising_lovierus:0 "Повелитель Ловиер"
 bm_warlordrising_lovierus_desc:0 "Король Эсдруф Карон оставил своему сыну в наследство множество неоконченных дел. На западе уже слышится грозный рёв транснибенских малапитов. По другую сторону реки — лязг ножей, что точат циснибенские властительницы. Не стоит забывать и про лейавинские мосты, безумный проект, который, хоть и приносит выгоду, но делает из Лейавина мишень для всех, кто находится выше по течению и вплоть до Румаре.\n\nЛовиер находится в раздумьях. Если ему удастся перехитрить врагов, он сможет превратить Топальское море в свой личный источник дохода.\n\n#bold Сможет ли Ловиер справиться с призраком наследия своего отца? Или же собственная самоуверенность станет его погибелью?#!"
 bm_warlordrising_mharra:0 "К'хара Кахада"
 bm_warlordrising_mharra_desc:0 "Сенчал находится в эпицентре идеального шторма, а Кахада мнит себя оком бури. Грива с трудом борется за удержание власти над подданными, #LORE [Concept('compendium_potentate', 'потентат')]#! с трудом борется за собственную жизнь, ну а Кахаде остаётся только наблюдать за процветанием своих земель. Безусловно, есть и те, кто может позариться на власть над побережьем — Соулрест и Лейавин, если быть точным, — но история не знает больше одной Жемчужины Топальского моря. Сенчал, унаследованный Кахадой Таслуз, процветает так, как не процветал со времён расцвета па'алатитов, но ветер перемен силён как никогда, так что Город Воров может в любой момент сдуть с полуострова Куин'рол.\n\n#bold Удастся ли Кахаде оседлать волну и стать провозвестницей нового золотого века или же бахвальство её погубит? Возможно, новое веяние поможет ей преуспеть там, где раньше бы она не справилась?#!"

 # recommanded characters for reaper's march 440
 bm_warlordrising_reaper:0 "Доля Смерти"
 bm_warlordrising_reaper_desc:0 "На перекрестье дорог Валенвуда и Эльсвейра лежит Марка Смерти. Эти засушливые поля столетиями оставались спорной территорией, пока Цицерон Пуллия, коловианский военачальник, не зашёл с набегом в земли, которые он прозвал «Южным Вельдом». Но даже после того, как он объявил себя королём, здесь сохранились ещё некоторые очаги босмерского сопротивления. Так местный потомок Каморана, Мэвэль, собирает свой народ для борьбы с иноземным захватчиком, а худородный Нендер Железная Кора претендует на древождество Сумеречной Лозы. К'хар из Дюны, видя как Арентия погружается в хаос, может, подражая Дарлоку Брэю, воспользоваться данным шансом, чтобы распространить власть каджитов на запад.\n\n#bold Многие годы Марка Смерти остаётся гробницей людских амбиций. Кто же выйдет победителем из предстоящей схватки?#!"
 bm_warlordrising_reaper_cicero:0 "Король Цицерон"
 bm_warlordrising_reaper_cicero_desc:0 "Знать к северу от Стрида пришла в изумление, узнав, что один из них с поддержкой отряда наёмников, сумел завоевать Арентию. В самом начале вторжения дела у Цицерона Пуллии шли хорошо, но даже в упадке стражи Арентии сумели развязать бесконечную партизанскую войну, ставшую занозой в его боку. Ещё большее беспокойство вызывали доклады о том, что древождество Сумеречной Лозы собирает значительные силы, чтобы отбросить его обратно в Западный вельд. И пусть его разнообразные вассалы пока покладисты, и они начнут активное сопротивление его власти, если учуят его слабость.\n\n#bold «Южный Вельд» ещё далёк от полного усмирения и, чтобы основать долгоживущее королевство к югу от Стрида, Цицерону понадобится подавить все очаги соспротивления. Заберёт ли коварная Смерть свою долю в срок?.. Или же вы сумеете одолеть испытания на вашем пути и создать наследие, что останется в веках?#!"
 bm_warlordrising_reaper_maevelle:0 "Хранитель Мэвэль Каморан"
 bm_warlordrising_reaper_maevelle_desc:0 "Пусть корни древа Каморан и раскинулись по всему Валенвуду, жалкое положение его арентийской ветви после утраты родовых земель вызывает немалое беспокойство. Мэвэль предстоит ещё долгий путь, если она желает обеспечить себе прочное положение в Марке Смерти. Сейчас же положение её слабо, и она уязвима для налётов со стороны коловианцев и босмеров, что стремятся съесть, чтоб самими не быть съеденными. Хуже того, худородный, прозванный Нендером Железной Корой, нагло претендует на все её владения! Благо кровь Эплира ещё имеет вес в этих землях, и, быть может, ей удастся заключить удачный брак или союз?\n\n#bold Судьба рода лежит в её руках, пока она танцует на лезвии ножа. Возможно, Смерть пришла, чтобы подрезать древо… Или же вы сумеете вынести груз ответственности, свергнуть короля-узурпатора и сокрушить всех предателей вашего правления?#!"
 bm_warlordrising_reaper_habais:0 "К'хар Хабаис"
 bm_warlordrising_reaper_habais_desc:0 "С радостным спокойствием наблюдает Хабаис за хаосом, разворачивающимся в Арентии, ведь королевство его сильно и окружено слабыми соседями. Единственная крупная для него угроза, Южный Вельд, рушится от внутренних конфликтов, вызванных неумением коловианского короля подчинить босмеров, населяющих его земли. Если Хабаис воспользуется возможностью, то вынудит военачальников, что не принимают его власть, преклонить колена, и даже процветающая Арентия может быть возвращена в лоно Анеквины.\n\n#bold Многие возможности разворачиваются перед Хабаисом, но, затяни он с действиями, и враги окопаются, а великие амбиции его будут разрушены. Хорошие вещи случаются с теми, кто умеет ждать, но возьмёте ли вы бразды в свои руки, воспользовавшись шансом пройти по пути Дарлока Брэя, восстановив величие Не-Квин-Ала?#!"
 bm_warlordrising_reaper_nendaer:0 "Древождь Нендер Железная Кора"
 bm_warlordrising_reaper_nendaer_desc:0 "Коловианские «авантюристы» для Сумеречной Лозы не в новинку, но крах влиятельных семей около десятка лет тому назад, подтолкнул к действию ранее незначимых акторов. И Нендер Железная Кора стал частью такой «свежей крови», не убоявшись Мэвэль Каморан, претендуя на её вождество и намереваясь свергнуть пришедшего в Арентию короля-самозванца. Цицерон, как и Камораны, потерпит крах, и Нендер имеет все шансы стать освободителем и в дальнейшем — хранителем Марки Смерти. Но возможность ещё не гарантирует успех, и Нендер, разгневавший сразу столько значимых фигур, может рано встретить смерть…\n\n#bold Егеря Сумеречной Лозы заявили о больших планах на Марку Смерти, но могут ли они надеяться прожить долго в регионе, известном павшими в нём героями?.. Быть может, вы сможете привести их к славе и заложить порядок, что защитит Арентию в будущем?#!"

 # recommanded characters for hammerfell 440
 bm_warlordrising_hammerfell:0 "Венец песков"
 bm_warlordrising_hammerfell_desc:0 "Ар-Азал Достойный, покойный верховный король Хаммерфелла, сумел установить шаткое перемирие между Предшественниками и Венценосцами, взяв в жёны Ферешту и Арлимахеру, дочерей сановника-Предшественника Сентинеля и короля-Венценосца Рихада соответственно. Увы, этот дипломатический манёвр, словно мираж оазиса, оказался лишь короткой передышкой в череде невзгод в истории Хаммерфелла.\n\nЕдва прошёл день с коронации короля К'Авара, как сановник Сентинеля сообщил, что схватил и тут же казнил убийцу из Тёмного Братства, якобы посланного королевой-матерью Арлимахерой убить детей королевы Ферешты, тем самым лишив Предшественников возможности занять престол. Заявив, что такое предательство избавляет их от вассальных обязательств, Предшественники начали восстание.\n\n#bold Смогут ли Венценосцы удержать власть и сохранить целостность Хаммерфелла, или же мятеж увенчается успехом?#!"
 bm_warlordrising_hammerfell_kavar:0 "Верховный король К'авар"
 bm_warlordrising_hammerfell_kavar_desc:0 "К'авар, старший из детей верховного короля Ар-Азала и королевы Арлимахеры, считал, что сумеет сохранить среди своих подданных непрочный союз Венценосцев и Предшественников, выстроенный его отцом. Но всякие надежды на это были потеряны, когда коварный сановник Сентинеля предъявил родной матери К'авара лживые обвинения в найме Тёмного Братства с целью убийства детей Ар-Азала от королевы-Предшественницы Ферешты и спровоцировал тем самым восстание против власти Венценосцев, возглавляемое принцем Алемом, братом нового верховного короля.\n\n#bold Сможет ли К'авар предотвратить полноценную революцию Предшественников и сохранить свой королевский венец? И простит ли он Алему его измену?#!"
 bm_warlordrising_hammerfell_ahlam:0 "Принц Алем"
 bm_warlordrising_hammerfell_ahlam_desc:0 "Алем, любимец верховного короля Ар-Азала из числа детей королевы Ферешты, всегда восхищался своим старшим братом К'аваром. И потому он был потрясён, когда его дядя по матери раскрыл заговор матери К'авара, безжалостной королевы Арлимахеры, нанявшей Тёмное Братство для убийства Алема и его единоутробных братьев-Предшественников. Прошло совсем немного времени, и вот юный принц уже возглавляет восстание против верховного короля.\n\n#bold Сможет ли Алем освободить Предшественников из-под кровавого гнёта Венценосцев, и что, в таком случае, будет с самим верховным королём, его старшим братом?#!"
 bm_warlordrising_hammerfell_murahd:0 "Король Мурад"
 bm_warlordrising_hammerfell_murahd_desc:0 "Король Мурад, влиятельнейший из сановников-Венценосцев, предложил верховному королю Ар-Азалу руку своей любимой дочери Арлимахеры в надежде, что это поможет сдержать недовольство Предшественников в провинции. Каждый Венценосец знает, что неугомонным Предшественникам доверять нельзя, а потому король Мурад не был удивлён, когда сановник Сентинеля сфабриковал доказательства покушения на жизнь членов королевской семьи из числа Предшественников, спровоцировав тем самым восстание против власти Венценосцев.\n\n#bold Сумеет ли король Мурад подавить волнения в собственных владениях? И если он преуспеет, склонится ли Рихад вновь перед верховным королём?#!"
 bm_warlordrising_hammerfell_isobel:0 "Изобель Королева Пиратов"
 bm_warlordrising_hammerfell_isobel_desc:0 "Команда Изобель, грозной пиратской предводительницы родом из Сиродила, давно наводила ужас как на купцов, так и на правителей абесинского региона. Но в конечном итоге, когда восстание Предшественников парализовало всю прибрежную торговлю в Хаммерфелле, она решила осесть в Причале Абы и основать торговый дом «Гургит и партнёры», ставший чуть ли не крупнейшим из местных и специализирующийся на азартных играх, организации боёв, угоне судов и отмывании денег.\n\n#bold Действительно ли Изобель уготована судьба осёдлой жизни или же Королева пиратов вновь поднимет парус и продолжит держать в страхе Абесинское море?#!"
 bm_warlordrising_hammerfell_madara:0 "Вельможная дама Мадара"
 bm_warlordrising_hammerfell_madara_desc:0 "Когда Ар-Азал признал право владения Танетом за королём Амиром, возмущению вельможной дамы Мадары, также претендовавшей на него, не было предела, ведь это шло вразрез с заявленными самим верховным королём принципами баланса сил между Венценосцами и Предшественниками. Однако теперь в свете восстания последних у вельможной дамы появилась возможность отбить то, что принадлежит ей по праву рождения и вернуть Танет под власть Предшественников. Да будет проклят коварный заговор Арлимахеры!\n\n#bold Сумеет ли Мадара вырвать Танет из когтей ненавистного рода Данобия, и сыграет ли её ставка на независимость?#!"
 bm_warlordrising_hammerfell_yarana:0 "Королева Ярана"
 bm_warlordrising_hammerfell_yarana_desc:0 "Тёплыми улыбками встречают добросердечную Ярану ат-Оджва, Саблю Халлина, Защитницу Предшественников. Её народ ответил на призыв к бою, и по всему Хаммерфеллу вспыхивают мятежи против Венценосцев и подлого верховного короля К'авара! Не жалея средств для поддержки восстания, Ярана направляет войска к Антифиллосу, чтобы сдержать наступление противника. Однако, если воины королевы надолго задержатся в Хегате, Оджвамбу будет беззащитно перед налётчиками по сторону реки или гор. К тому же, смелость всегда сопровождает опасность, и её жизнь могут оборвать как вражеский солдат, так и подосланный убийца.\n\n#bold Ярана должна тщательно обдумывать каждый бой, и одерживать в них решительные победы, а иначе её королевство канет в небытие. Сумеете ли вы преодолеть грядущие испытания, или последнее Илиакское королевство Предшественников исчезнет с лица Нирна?#!"
 bm_warlordrising_hammerfell_azzan:0 "Король Аззан"
 bm_warlordrising_hammerfell_azzan_desc:0 "Аззан, король Гилейна, находится между молотом и наковальней: племена пустыни Алик'р на севере покушаются на его законные владения, а пираты и ушлые дельцы на юге захватили Проклятие Хью, а с ним и обломки множества кораблей вместе с их ценным грузом. А теперь ещё и война на горизонте: выскочки-Предшественники, сделав ставку на принца Алема, дерзнули подвергнуть сомнению все представления о законе, традициях и праве наследования, что, разумеется, остаётся за верховным королём К'аваром.\n\n#bold Сумеет ли Аззан в окружении врагов исполнить свой долг перед союзниками и перед наследием #LORE [compendium_na_totambu]#! или же потерпит неудачу и оставит Гилейн беззащитным? И, если он преуспеет, то сможет ли извлечь из победы выгоду и восстановить власть Венценосцев — свою власть — над Абесинским морем?#!"

 # recommanded characters for black marsh 440
 bm_warlordrising_blackmarsh:0 "Ку-вастей"
 bm_warlordrising_blackmarsh_desc:0 "С тех пор как потентат перестал обеспечивать хоть и непрочный, но стабильный мир, тревога смотрителей хиста росла, ведь #italic необходимое изменение#! может сопровождать разрушение…\n\nСразу несколько претендуют на власть над народом корня: от членов пришедшей в упадок королевской династии Средней Аргонии до процветающих конфедераций Онкобры и долин Боа. В эти неспокойные времена нельзя быть излишне самоуверенным, но, пока Хелстром и Архонт довольствуются властью над вотчинами, вождь Су-Залил из мести дерзнул притязать на Стормхолд!\n\nДругие обитатели Чернотопья ходят по лезвию ножа: лилмотиты находятся на грани жестокой междоусобицы, хорвалли из Архонта пытаются угнаться за процветанием йеспестов. Наконец, айлейды горюют за своих собратьев из Сильянорна, попавших под пяту Дреса.\n\n#bold Собьёт ли ветер перемен вас с ног, или вам с Ку-вастей по пути?#!" 
 bm_warlordrising_blackmarsh_morilye:0 "Арана Морилие"
 bm_warlordrising_blackmarsh_morilye_desc:0 "Морилие Карандол, правительница Лориаселя, происходит из почтенной династии айлейдских королей: её предки бежали из Альд-Сирода во времена #LORE [Concept('compendium_narfinsel_schism', 'Нарфинсельского раскола')]#! и обрели новый дом в негостеприимном Чернотопье. Пять лет назад Сильянорн пал от рук данмерских захватчиков. Важнейший союзник был потерян, а баланс сил лишился определённости, и теперь её народу вновь грозит опасность. Ближайшие племена аргониан и котринги могут в любой момент попытаться оборвать историю её королевства.\n\n#bold Сможет ли Морилие, окружённая потенциальными врагами со всех сторон, одержать верх? Или же Лориаселю, как и множеству айлейдских королевств до него, суждено пасть?#!"
 bm_warlordrising_blackmarsh_xir:0 "Землепроходец Хир Узурпатор"
 bm_warlordrising_blackmarsh_xir_desc:0 "Хир Изгнанник, ныне известный как Хир Узурпатор, — старший сын и законный преемник Аиисхара из Чёрной Розы. Он должен был унаследовать от своего отца титул землепроходца, но не далее чем два года назад из-за внутренних распрей оказался изгнан и нашёл приют у родичей своей матери в Бувомусе. Теперь же, когда после смерти отца его младшая сестра заняла трон, он сплотил под своим знаменем лояльные ему племена и надеется силой отобрать то, что по праву принадлежит ему…\n\n#bold Преуспеет ли Хир в своих начинаниях и захватит ли Чёрную Розу, а после и земли за её пределами? Или же его сестра Миспаха докажет, кто из них двоих на деле хитрый лис?#!"
 bm_warlordrising_blackmarsh_alt_mispaxa:0 "Землепроходец Миспаха"
 bm_warlordrising_blackmarsh_vraseth:0 "Верховный вождь Вра'сет"
 bm_warlordrising_blackmarsh_vraseth_desc:0 "Никто не ожидал, что юный охотник за головами по имени Вра'сет, родившийся в семье обыкновенных членов одного из племён хорвалли, добьётся чего-то выдающегося, не говоря уж об объединении всех племён его народа под одним знаменем. Его величайшей победой была, пожалуй, битва за Архонт, в ходе которой он собственноручно одолел Дрикиуса, радж-каала Таруми, и отвоевал для хорвалли право поселиться на стратегически выгодном месте. Но Вра'сет уже не тот юный воин, что прежде, и не только в племени Таруми сейчас жаждут его смерти… \n\n#bold Переживут ли смерть Вра'сета его завоевания и мечты о великом государстве хорвалли? Или же его наследникам не суждено их сохранить?#!"
 bm_warlordrising_blackmarsh_brandshei:0 "Радж-каал Бранд-Шей"
 bm_warlordrising_blackmarsh_brandshei_desc:0 "Мало кто может похвастаться таким же количеством шрамов, как у Бранд-Шея. Годы рабства у дома Дрес в Стормхолде были ужасающими, но всё же сыграли ключевую роль в формировании его целеустремлённости. Когда Бранд-Шей горбатился, вкалывая на пригородных полях, он поклялся самому себе, что подчинит это место своей власти и насадит голову губернатора на пику! Но сперва он должен помочь своему шурину ни много ни мало в восстании против коалиции магнатов из дома Дрес. \n\n#bold Сумеет ли Бранд-Шей обеими руками ухватиться за свою мечту, или же его могильный столб станет одним из множества на кладбище несостоявшихся освободителей?#!"
 bm_warlordrising_blackmarsh_milos:0 "Радж-каал Милос"
 bm_warlordrising_blackmarsh_milos_desc:0 "Вожди Таруми когда-то были королями всего Архонта, но те дни давно прошли. С течением времени они утрачивали всё больше земель, а пять лет назад хорвалли разорили и заняли сам Архонт, попутно убив отца Милоса, радж-каала Дрикиуса. Милос сохраняет власть лишь над некоторыми северными провинциями, в то время как его сестра — над Арчалом.\n\n#bold Неужели народу Таруми суждено пасть в пучины безвестности? Или же Милос сумеет отвоевать Архонт и, быть может, даже восстановить власть над одноимённым королевством?#!"
 bm_warlordrising_blackmarsh_talenjei:0 "Радж-каал Тален-Джей Возрождённый"
 bm_warlordrising_blackmarsh_talenjei_desc:0 "За тысячи лет до нынешней эры в Чернотопье правил Король Теней. Порядок, прогресс и долгосрочные цели были законом на этой земле. С помощью загадочной магии занмиров король подготовил своё перерождение. Но что-то — ошибка ли в расчётах или разрушительное влияние времени — внесли свои корректировки в его планы, и его новый сосуд оказался куда более… скромным. Тален-Джей — наследник разорённого королевства, чей народ погряз в нищете и убогости. \n\n#bold Сумеет ли Тален-Джей восстановить величие Сумеречья или же ему не удастся найти своё место в сердцах подданных?#!"

 # Interregnum
 bm_group_450:0 "2Э 450"
 bm_interregnum:0 "Междуцарствие"
 bm_interregnum_desc:0 "Двадцать лет назад последний акавирский потентат и все его наследники были убиты, что положило конец Второй империи.\nОтныне Сиродил и Хай-Рок поделены на десятки враждующих государств, претендующих на их наследие. Скайрим, в свою очередь, страдает от народных волнений, вызванных борьбой двоих претендентов на верховный трон провинции. Те, кто ещё недавно называл себя подданными Империи, ныне грызутся даже по самым мелким поводам. На остальном материке дела обстоят не лучше: по всем уголкам Тамриэля — кроме, разве что, Алинора — вспыхивают локальные войны.\n\n#bold Есть ли шанс, что, несмотря на разгоревшийся хаос, Империя сумеет восстать из пепла? Смеет ли хоть кто-нибудь надеяться, что обуздает нестабильность, возвысится над всеми и провозгласит себя императором не только Сиродила, но и всего Тамриэля? В условиях хаоса, что посеяло Междуцарствие, возможно всё.#!"
 bm_interregnum_marandrujo:0 "Грива Ма'рандру-джо"
 bm_interregnum_marandrujo_desc:0 "Грива направлял верующих с незапамятных времён. В эти нелёгкие времена «корону из кос» носит Его Превосходительство Ма'Рандру-джо, законный правитель Эльсвейра!\n\nИ если Пеллитина ещё подчиняется власти Гривы, то Анеквина сопротивляется себе же во вред. Какое-то подобие порядка сохраняет лишь Дюна, Риверхолд же, Оркрест и Риммен погрузились в пучину анархии. Даже дом Брэев не обошли беды: они сражаются в ужасной войне против собственных римменейских подданных, объявивших себя королями.\nСогласно светскому закону, Анеквина должна подчиниться Танцу Двух Лун, но сумеет ли Ма'Рандру-джо преодолеть свой отстранённый характер, чтобы добиться этого?\n\n#bold Вырвется ли Анеквина из хватки Гривы, или же вам удастся восстановить безраздельную власть иерократии?#!"
 bm_interregnum_hakkvild:0 "Ярл Хакквильд"
 bm_interregnum_hakkvild_desc:0 "Хакквильд не рос в роскоши. Почти два десятка лет назад назад клан Ял отнял у него отца и земли по праву рождения. Служба у его дяди Энгара в Хелгене дала ему времени довольно, чтоб истереть в порошок не один топор.\n\nТеперь, когда он унаследовал трон своего покровителя, ему не терпится вернуть владение в нордские руки — #italic свои#! руки. И учитывая, что теперь в борьбе против мародёрствующих орков он заручился поддержкой Вайтрана, а столица его - прекрасная точка как для начала атаки, так и для отступления, цель эта видится достижимой.\n\n#bold С орсимерами, врагами коварными и жестокими, готовыми для победы на всё, нельзя быть «чрезмерно» осторожным. Сможете ли вы сломить их защиту и прогнать Малоховых отродий или будете лишь бессильно наблюдать за тем, как Хакквильд сокрушается о мощь орков?#!"
 bm_interregnum_mariette:0 "Королева Мариэтта"
 bm_interregnum_mariette_desc:0 "Дом Риэль восходит корнями ко многим великим людям: от Фабре Железного Сына, сумевшего выстроить сферу влияния в пост-нордском Хай Роке, до Себастьяна Великого, официально аннексировавшего зависимые территории, вошедшие в современное королевство Камлорн. А Фабре Чёрному быть может даже удалось бы объединить Гленумбру и земли за её пределами, если бы не злодейство клана Диренни. У королевы Мариэтты подобных амбиций нет: она полностью сосредоточена лишь на том, чтобы держать своих вассалов на коротком поводке. Но если она когда-нибудь устанет играть у них на нервах, князья и мелкие монархи Камлорна останутся  ждать своего часа.\n\n#bold Должна ли Мариэтта тенью нависать на своими владениями, или же наводимый ей гнетущий ужас станет её же погибелью?#!"
 bm_interregnum_kaidarbul:0 "Ашхан Каид-Арбул"
 bm_interregnum_kaidarbul_desc:0 "Уршилаку. Одно из четырех великих племён эшлендеров находится в надёжных руках Каид-Арбула, сына Энкиду. Мало что может потревожить велотийцев Валенвариона под управлением такого набожного, стоического и добросердечного соплеменника, как он.\n\nУвы, жадность чужеземцев порой даёт о себе знать, неизбежно подталкивая их посягать на принадлежащее велотийцам и идти с ними на конфликт. Сказки о герое, который придёт и покарает злого данмера, могут успокоить кротких и слабых, но Каид-Арбул знает одну-единственную истину: #bold Сила есть право!#!\n\n#bold Смогут ли уршилаку отбросить чужаков в море или же вскоре начнётся начало их конца?#!"
 bm_interregnum_bhalarix:0 "Регент Баларикс"
 bm_interregnum_bhalarix_desc:0 "Дом Силла осел в Тамриэле ещё в начале существования Империи Ремана. Они разделяли испытания и невзгоды империи вплоть до восхождения клана Версидью-Шайе. Пережив изгнание в место с ироничным названием «Бухта Шайе», они сумели избежать жестоких чисток в центральных землях. Регент-Бастард Баларикс взял на себя управление кланом после смерти матери, но до сих пор тоскует по лживому отпрыску Зидакье — своему родителю.\n\nНыне же он стоит на пороге войны с испытывающим подъём домом Дрес, который готов нанести ему сокрушительный удар после победы в тотальной войне с мятежными аргонианами.\n\n#bold Сможет ли Регент-Бастард сохранить изолированный оплот илнивирцев несмотря ни на что? Возьмёте ли вы в свои руки его судьбу, дабы вырвать победу из пасти поражения?#!"
 bm_interregnum_torg:0 "Вождь Торг гро-Брог"
 bm_interregnum_torg_desc:0 "Клан железных орков Рубедит, чей девиз: «Кровь алых вен», достиг своего благодаря добыче одноимённой руды. Заполучив немалые богатства и сильные войска, Торг гро-Брог оказался на перепутье.\n\nСоплеменники недовольны его мягким нравом, который является противоположностью упрямости и безжалостности, которые требуются от ош орним. Его собственный отец однажды сказал, что он «робкий козлёнок, порождённый свирепым кабаном». Вождь Брог не был плодовитым орком, что позволило Торгу беспрепятственно занять место вождя.\n\n#bold Потерпит ли Торг крах, столкнувшись с ожиданиями ош орним в отношении власти, или же вы проведёте чёткую черту между его истинным «я» и долгом?#!"

 bm_interregnum_cyrodiil:0 "Расколотый красный алмаз"
 bm_interregnum_cyrodiil_desc:0 "Двадцать лет назад последний акавирский потентат и все его наследники были убиты, что положило конец Второй империи.\nСпустя одиннадцать лет Аттреб Сосильдор одолел последнего змеиного отпрыска акавирской династии, взяв в свои руки власть над Имперским островом. Однако его амбициозными планами по подготовке Сиродила к грядущей смуте Междуцарствия остались недовольны нибенейские аристократы, чьё влияние на Румаре оказалось под угрозой. Таким образом, совсем не удивительно, что спустя всего три года правители Нибенейской долины, возглавляемые Венаром Куптором, восстали против Аттреба.\n\n#bold И хотя Аттреб нашёл в этой войне свою смерть, Венар не добился своих целей и вызвал в Сиродиле раскол, ещё больший, чем тот, что произошёл во времена войны с потентатом.#!"
 bm_interregnum_caius:0 "Лорд-протектор Кай"
 bm_interregnum_caius_desc:0 "Междуцарствие — время, когда ничего нельзя принять на веру, кроме высокой вероятности войны, и лорд-протектор Кай нажился на неопределённости и суматохе за два года после смерти Аттреба больше, чем, вероятно, любой другой человек в Сиродиле.\n\nОн не император, но правит как защитник самого сердца провинции. Его вотчина, расположенная по берегам озера Румаре, была чрезвычайно прибыльной. Тем не менее, прямое политическое влияние лорда-протектора на Сиродил незначительно, а военная мощь — ничтожна.\n\n#bold Кай должен быстро укрепить свою власть или столкнуться с натиском врагов, жаждущих заполучить его главное сокровище — Имперский город.#!"
 bm_interregnum_venaros:0 "Великий повелитель Венар"
 bm_interregnum_venaros_desc:0 "Пятьдесят лет назад, когда Кирилл II нанёс оскорбление Савириен-Чораку и был казнён, дом Куптор впал в немилость. Свергнутый принц Венар оттягивал время, служа слабеющему акавирскому потентату, ни дня не выпуская из головы мысль о позоре своей семьи.\n\nКогда Айксниерас потерпел поражение перед Аттребом, Венар, не теряя времени, возглавил сопротивление в Нибенее, увенчавшееся триумфом в Поппадских лесах два года назад. Теперь он бесспорный великий повелитель Нибенея, хотя его родовая резиденция Бравил всё ещё не принадлежит ему.\n\n#bold Должен ли Венар отложить свои планы относительно Нибенея, чтобы вернуть Бравил, или же нерешительность Куптора вернётся ему сторицей?#!"
 bm_interregnum_hieron:0 "Генерал Иерон"
 bm_interregnum_hieron_desc:0 "Иерон, воочию видевший трагическую смерть Аттреба, не стал менее решительным. Он твёрдо убеждён, что именно он — тот великий человек, который нужен Сиродилу, и что он #bold добьётся#! успеха там, где Аттреб потерпел неудачу!\n\nК его чести, некоторые лоялисты провозгласили Иерона генералом Коловианских воеводств, пусть ему и пришлось разбить лагерь на крутых холмах, а не на богатых равнинах. Конфедерации предстоит «умиротворить» всю Коловию, прежде чем они смогут перенести фокус внимания на лорда-протектора. Пост-реманские идеи не всем по душе, но это можно изменить.\n\n#bold Восстанут ли Коловианские воеводства из пепла при Иероне, или коловианские претенденты потерпят неудачу во второй раз?#!"
 bm_interregnum_ilnori:0 "Герцог Ильнори"
 bm_interregnum_ilnori_desc:0 "Не так-то просто понять, выиграл ли Аквиларий больше от резкого взлёта Аттреба или же от его внезапного падения. Длительные кампании генерала сначала помогли Гельвидию прийти к власти, а затем его сын Ильнори нагло захватил власть, как только увидел признаки наступления времени перемен.\n\nНо как бы то ни было, герцогу Коррола придётся столкнуться с непокорными Коловианскими воеводствами, территория которых сократилась до нагорья в его вотчине, а также с различными независимыми сторонниками восстания. Имперский город недостижим, пока Ильнори не разберётся с проблемами на собственном заднем дворе.\n\n#bold Превзойдёт ли Ильнори наследие Аттреба или пребывание Аквилария на троне окажется ещё более недолговечным?#!"
 bm_interregnum_abnur:0 "Повелитель Абнур"
 bm_interregnum_abnur_desc:0 "«Нерешительность — погибель судьбы». Так говорил Абнур в начале своего «регентства». Тарну очевидны окружающие его проблемы: великий повелитель Куптор теперь пользуется поддержкой Нижнего Нибенея, в то время как ярлы на севере пользуются полной свободой после окончательного падения #LORE [Concept('compendium_potentate', 'Потентата')]#!.\n\nЕго взор также устремлён на Имперский город, где бывший студент Университета волшебства, ставший имперским боевым магом, может оказаться могущественным — и столь необходимым — союзником для Чейдинхола.\n\n#bold Абнур даёт смелые обещания, в то время как стоящие перед ним задачи куда сложнее, чем десять лет назад. Сможет ли он прыгнуть выше головы и оставить свой след в истории? Или его переворот станет гротескным вступлением к падению дома Тарн?#!"
 bm_interregnum_harald:0 "Король Харальд"
 bm_interregnum_harald_desc:0 "Харальд, сменивший на троне своего отца, легендарного завоевателя, стал потрясением для кланов Брумы. Король-дипломат должен был выгодно выделяться на фоне своего воинственного предшественника, и всё же главы кланов отвергают авторитет Инеевой Бороды.\n\nТрудно представить, что Харальд является сыном авантюриста, короля-бандита (который, в свою очередь, был сыном охотника на троллей). Морозный Утёс и Хорунн открыто насмехаются над его властью, несмотря на то, что поддержали его когда-то на выборном собрании. Важнейшие территории остаются под контролем Коловии или даже илнивирцев… Возможно, ещё не поздно поднять меч. Харальд мог бы показать силу и подчинить силой непокорные кланы…\n\n#bold Должен ли он отказаться от своего мягкого нрава или король Брумы останется первым среди равных?#!"



 # recommanded characters for the iliac bay 450
 bm_interregnum_iliac:0 "В тени Башни"
 bm_interregnum_iliac_desc:0 "Адамантиновая Башня, колыбель Нирна на острове Балфиера, уже в который раз становится молчаливой свидетельницей того, как торговля уступает место войне в тихих водах Илиака.\n\nИстория залива как естественной границы между Хай-Роком и Хаммерфеллом всегда являла собой причудливое переплетение происходящих здесь завоеваний, интриг, эпидемий и восстаний. Бретонцы, альтмеры, редгарды и даже пришлые акавирские пираты да орки-налётчики — все желают заполучить в свои руки власть над одним из богатейших регионов Тамриэля.\n\nЗа прошедший век благодаря хаосу Междуцарствия даже для самых ничтожных баронов открылась возможность назваться королями собственных клочков земли, открыв новую главу в истории вечной грызни за Илиак.\n\n#bold Суждено ли кому-нибудь стать новым неоспоримым владыкой залива? Или же этот регион обречён на раздробленность?#!"
 bm_interregnum_iliac_donella:0 "Королева Донелла"
 bm_interregnum_iliac_donella_desc:0 "Королева Донелла выросла, слыша истории о завоевании острова Бетони племенем Морской Скалы. Орки жестоко расправились с местной королевской семьёй, включая её любимую тетю Нурезу, создав орочий плацдарм у входа в залив Илиак. И это бельмо на глазу сохраняется до сих пор.\n\nПосле этого проявления слабости лорды Гленумбры постепенно теряют веру в способность Даггерфолла защитить их, выдвигая требования о независимости, которые угрожают самому существованию королевства.\n\n#bold Сможет ли королева Донелла изменить этот сценарий или Даггерфолл будет низведён до второстепенной державы региона?#!"
 bm_interregnum_iliac_lywel:0 "Король Ливель"
 bm_interregnum_iliac_lywel_desc:0 "Король Ливель, ветеран великой войны против Орсиниума, стал свидетелем того, как торговые сделки его королевства терпят крах, поскольку богатые порты Хаммерфелла постепенно закрываются на фоне недавней Революции Предшественников.\n\nБанкротство Вэйреста, что некогда был известен как жемчужина залива, позволило некоторым недовольным вассалам, всё больше сомневающимся в способности короля защитить их от вторжений Диренни и редгардов, разорвать связи со столицей, объявить о своей независимости и ещё больше подорвать финансы королевства.\n\n#bold Сможет ли король Ливель вернуть своему королевству былую славу или Вэйрест останется лишь в древней истории?#!"
 bm_interregnum_iliac_ancotar:0 "Кинлорд Анкотар"
 bm_interregnum_iliac_ancotar_desc:0 "Мечтая подражать своим предкам Эйдену и Рейвену Диренни, Кинлорд Анкотар медленно восстанавливает господство своего клана над их бывшими владениями в Великой Бретонии.\n\nОн лично наблюдал за хаосом, вызванным Междуцарствием после убийства #LORE [Concept('compendium_potentate', 'потентата')]#!, и поэтому Анкотар уверен, что лишь возрождение гегемонии Диренни над Хай-Роком может принести столь необходимый мир в регион.\n\n#bold Сможет ли Анкотар достичь своих целей или Диренни так и останутся всего лишь кастелянами Адамантиновой башни?#!"
 bm_interregnum_iliac_vhosek:0 "Король Восек"
 bm_interregnum_iliac_vhosek_desc:0 "Король Восек, старший сын легендарной королевы Яраны, героя недавней Революции Предшественников, унаследовал вновь созданное королевство.\n\nКоролевство Халлин, или Оджвамбу на местном йокуданском языке, занимает стратегически выгодное положение на границе между Хай-Роком и Хаммерфеллом, но никогда не занимало активной позиции в регионе, действуя в основном как оборонительный буфер для бретонцев и редгардов, всегда стремящихся к борьбе за контроль над рекой Бьюлси и заливом Илиак.\n\n#bold Сможет ли Восек обхитрить своих соперников и стать одним из главных игроков в заливе Илиак или же его королевство останется ограниченным песками Алик'ра?#!"
 bm_interregnum_iliac_saffir:0 "Сановница Саффир"
 bm_interregnum_iliac_saffir_desc:0 "После завершения Революции Предшественников и распада Верховного королевства Хаммерфелл сановница Саффир стала одной из последних правительниц-Венценосцев на берегах залива Илиак.\n\nКоролевством Сентинель правит её формальный сюзерен, мерзкий Намасур из числа Предшественников. Саффир, опасающейся его растущей мощи, придётся действовать быстро, чтобы укрепить свою власть и восстановить правление Венценосцев в регионе, а иначе она лишится своего форпоста в выгодном месте на берегу Илиака.\n\n#bold Сможет ли Саффир утвердить независимость и стать региональной державой или же её судьба — подчиниться власти Предшественников?#!"
 bm_interregnum_iliac_ulmug:0 "Верховный вождь Улмуг"
 bm_interregnum_iliac_ulmug_desc:0 "Улмуг гро-Гаротмук вырос в причудливой тени своего отца Гаротмука, необычного орка и необычного отца. Поражённый культурными потерями от утраты Орсиниума, он закопался в писания давно умерших орков, не заботясь о воинских качествах вождя.\nНо это не про Улмуга. Задавшись целью стать образцом воинской культуры орков, он, ещё будучи юнцом, со звериной свирепостью постигал путь воителя. Что-то и досталось Улмугу в наследство от отца, к примеру, грамотность, что молодой орк с неохотой признаёт, в остальном он отбросил пережитки Гаротмука и взамен взял в руки топор, избрав стезю налётчика.\n\n#bold Удастся ли ему вновь наладить набеговую экономику Фаруна? Заберёт ли Улмуг для орков богатства землевладельцев Предела? Или он будет грезить о том чтобы последовать за отцом, в архивы, отчаянно искать тот последний манускрипт, который спасёт ему жизнь?..#!"

 # recommanded characters for the abecean 450
 bm_interregnum_abecean:0 "Приливные стремления" 
 bm_interregnum_abecean_desc:0 "Феномен карпаччо из абесинского окуня — деликатеса, вхожего и в альтмерскую, и в бретонскую, и в йокуданскую, и в сиродильскую кухню — иллюстрирует, сколь велико культурное разнообразие Абесинского региона.\n\nС падением Потентата безопасность в море существенно снизилась, и вместе с тем пришла в упадок торговля. Страховщики страхуют только самые оснащённые корабли, да и те нередко грабят ещё на виду у докеров. Покой уступил место организованному хаосу, создавшему две противоборствующих стороны: на одной — те, кто продолжает заниматься честной торговлей, а на другой — те, кто за их счёт предпочитает заниматься нечестной.\n\nВолны этих противоречий обернулись качкой для торговых узлов, таких как Строс М'Кай, Систры и Причал Абы, — им придётся выбирать сторону. Но вот периферия Абесин давно сделала выбор в пользу корсаров.\n\n#bold Приливы приходят и уходят, а старые волны смываются новыми. Солнечные деньки подошли к концу, и пришло время решить, кто вы: беспомощный государь или свирепый пират?#!"
 bm_interregnum_abecean_afshuur:0 "Сановник Афшур"
 bm_interregnum_abecean_afshuur_desc:0 "Афшур ат-Аддин, некогда проходимец, промышлявший торговлей, десять лет назад внезапно обнаружил себя в ботинках лорда. Ставший привычным экономический спад на морских путях Абесинского моря достиг критической точки, поставив народ на колени. Это тяжкое бремя побудило Причал Абы назначить своим сановником Афшура — лихого предпринимателя, обладающим всеми необходимыми для правителя навыками.\nЦелые деревни заковывают в цепи, а налётчики проникают всё дальше вглубь страны. Афшуру потребуются мужество и смекалка, чтобы повлиять на ситуацию.\n\n#bold Обратится ли сановник Афшур к каперству, чтобы поддержать свою болеющую экономику и защитить порты? Или вы будете молча страдать, пока ваш народ грабят и порабощают?#!"
 bm_interregnum_abecean_arctur:0 "Король Арктур"
 bm_interregnum_abecean_arctur_desc:0 "Арктур Дральгонер принадлежит к той редкой породе королей-пиратов, которые промышляют как на путях снабжения, так и в портах своих соперников. Он сверг Дом Оло практически в одночасье, убив короля Рогата в бою в весьма удачном для него году 2Э 444. Арктур провозгласил себя королём Анвила по праву завоевания.\n\nЕго дальновидность и военная смекалка не вызывают сомнений, и немало мелкого люда опасается за свою жизнь и конечности, гадая, что выберет свой новой целью этот коварный и своенравный корсар. В конце концов, пираты всегда ищут где бы поживится.\n\n#bold Сможете ли вы угомонить своих каперов и стать уважаемым королём или морская жизнь не отпустит вас?#!"
 bm_interregnum_abecean_fabrelle:0 "Герцогиня Фабрель"
 bm_interregnum_abecean_nizran:0 "Король Низран"
 bm_interregnum_abecean_nizran_desc:0 "На долю Короля Низрана выпало восстановление порядка в Рихаде после бессмысленной и бесславной смерти его деда во время Революции Предшественников. Низран глубоко разочаровался в борьбе предков с Предшественниками и не стремится ни к политическим бракам, ни к открытым столкновениям.\n\nСпособный, проницательный, хоть и осторожный король считает, что положит начало возрождению Рихада, и обеспечит ему господство над востоком Абесинского региона и даже Золотым Берегом.\n\n#bold Сможет ли монета Низрана принести прочный мир там, где раньше не помогали ни клятвы, ни мечи, или план короля лишь сделает Рихад предметом зависти и желания соседних правителей и пиратов?#!"
 bm_interregnum_abecean_fabrelle_desc:0 "Фабрель Морнар правит островами Систры, что лежат посреди Эльтерического океана. Вместе с континентальным хаосом пришла как свобода, так и её свита проблем: алинорские дипломаты, редгардские или бретонские купцы, а теперь ещё и #LORE [Concept('compendium_daedra', 'даэдра')]#!-корсары!\n\nГерцогиня Морнар не ждёт облегчения ни от Хаммерфелла, ни от Хай-Рока. Нет, как всегда, ситрийцам придётся проявить стойкость, и выстоять в эту бурю в одиночку! Фабрель предстоит подавить даэдрическую угрозу на Панкоре, если она хочет идти по королевским стопам Бенду Оло…\n\n#bold Систры — это местный островной вариант Хай-Рока, где «на каждом острове по королю». Сможет ли Фабрель доказать, что она могущественнее соперников, или же её дом обречен на безвестность?#!"
 bm_interregnum_abecean_uhrih:0 "Сановник Урих"
 bm_interregnum_abecean_uhrih_desc:0 "Сестра Мысли, или «Строс М'Кай», должно быть, насмехается над своим именем, ибо мало кого на континенте волнует её судьба во время Междуцарствия! Посему Уриху Фаросу предстоит выводить свои владения из кипящих вод в одиночку. Строс М'кай до сих пор остаётся важным узлом для легальной и нелегальной торговли, но надолго ли?\nУрих чувствует, как знать побуждает его одобрить пиратство как раз в тот момент, когда он собирается на аудиенцию к обеспокоенным торговым воротилам. Было бы гораздо проще, если бы он управлял всем архипелагом Митана, а не вёл бесплодные переговоры…\n\n#bold Сможет ли сановник Урих объединить под своей властью всех абесинских редгардов, или грёзы приведут его на морское дно?#!"
 bm_interregnum_abecean_velehk:0 "Верховный адмирал Велек"
 bm_interregnum_abecean_velehk_desc:0 "Велек Сейн — #LORE [Concept('compendium_daedric', 'даэдрический')]#! лорд, пребывающий в Нирне необычайно долго. Он родился из хаоса Обливиона и успел изгнать многих своих противников во тьму, прежде чем скромный йокуданский колдун призвал его в Нирн.\nБыстро расправившись с глупым смертным, он остался с избытком времени и избытком жестокости. Так он и выбрал своим занятием пиратство. Неисчислимое количество «героев» пытались изгнать его, но были сломлены разумом и телом либо убиты — в лучшем случае.\n\n#bold Захват Панкора было первым шагом на пути ко всемирному опустошению… или господству? Поглотит ли тьма отголосок Сейна или перед нами рождение легендарного короля-пирата?#!"

 # recommanded characters for valenwood 450
 bm_interregnum_valenwood:0 "Королевы и военачальники"
 bm_interregnum_valenwood_desc:0 "Тростник лишь гнётся на ветру, а могучий дуб страдает под натиском бури… Смятение проносится по Валенвуду вихрем, что не делает сословных различий. Город Фалинести бесследно исчез вместе с королём и всей его семьёй! На устах древождей застыл молчаливый вопрос: кому доверить своё будущее? На ум приходят королевы из династии Каморан: Филандра, правящая Сильвенаром, и Нилвен из Древлего Корня. Последней, однако, активно досаждают её племянник, стремящийся реформировать Зелёный Пакт, и «герцог Саутпойнта», коловианский пришелец. Военачальники юго-запада, такие как Малгот и наследник Древочага Орейн, могут стать для древождей как защитниками, так и врагами.\n\n#bold Отголоски Междуцарствия раздаются в Валенвуде, как повторные толчки землетрясения. Они выкорчёвывают из земли могучие племена и освобождают место для новых побегов. Грядут войны, и неясно, кому удастся сохранить наследие предков, а кому — заронить зерно собственного.#!"
 bm_interregnum_valenwood_nilwen:0 "Королева Нилвен"
 bm_interregnum_valenwood_nilwen_desc:0 "Король Галандир посеял семена раздора, когда разделил державу между своими детьми. Он передал трон Древлего Корня своей дочери Нилвен, а Кормаунт — бастарду Андриэлю.\n\nКоролева Нилвен теперь борется с набравшими влияние магнатами, в то время как её племянник перенял ересь, которой позволил укорениться Андриэль. На юге Гавань встревожена коловианскими пришельцами в Саутпойнте.\n\n#bold Несмотря на все эти трудности, Нилвен — сила, с которой нужно считаться. Её джакспуры, затянув пояса, вовсю готовятся к грядущим временам войны. Сломят ли Нилвен тяготы, доставшиеся ей в наследство от отца? Или она сможет выйти из этой непростой ситуации, искоренить ересь и покарать людей за их дерзость?#!"
 bm_interregnum_valenwood_phylandra:0 "Королева Филандра"
 bm_interregnum_valenwood_phylandra_desc:0 "Держава Филандры, — вероятно, самое стабильное королевство в Валенвуде. Отсутствие внутренних врагов даже позволило ей занять Малабал Тор. У Филандры развязаны руки, но ей нельзя забывать про коловианцев на востоке в Южном Вельде. И пусть сейчас их отвлекают арентийцы, если не притормозить их, они обратят взор на королевство Филандры. Судьба северного Валенвуда определяется хрупким равновесием.\n\n#bold Хаос Междуцарствия угрожает распространиться на Сильвенар. Прежде чем обезвредить сиродильскую угрозу на границе, Филандре потребуется укрепить силы. Сможете ли вы помочь ей защитить духовную столицу босмеров?#!"
 bm_interregnum_valenwood_gelthior:0 "Древождь Гельтиор"
 bm_interregnum_valenwood_gelthior_desc:0 "Гельтиор достиг совершеннолетия через десять лет после резни в Новой Отраде. Он засыпал под рассказы об аморальных вегетарианцах и развратных лесорубах. Через своего сына опосредованно жил принц Андриэль. Король Галандир, отрёкшийся от него, был слишком занят своей «маленькой королевой-ланью», чтобы заметить тёмный путь, избранный младшим отпрыском: Кормаунт затеял игру в долгую.\nСобытия в Новой Отраде повлекли за собой возникновение скриптуралистского реформистского движения. Его сторонники — интеллектуалы, поддержанные Андриэлем, готовили Гельтиора к роли глашатая радикальных перемен: движения Черноживицы. Бездельников отчитывали, грешников наказывали, а контрабандистов изгоняли.\n\n#bold Сможет ли это движение укорениться по всему Валенвуду или королева Нилвен положит конец заблуждениям племянника?#!"
 bm_interregnum_valenwood_oreyn:0 "Вождь Орейн"
 bm_interregnum_valenwood_oreyn_desc:0 "Орейн Медвежий Коготь, сын босмерского шамана и данмерки-мистика, в раннем возрасте отправился на поиски приключений и славы. После убийства ведьмы-змеи Гленвифаунвы Орейна прославляли как героя во всем Валенвуде, и он даже на короткое время получил место при дворе королевы Нилвен.\n\nНо до него дошли слухи, что его безжалостный отец с помощью нечестивой некромантии захватил Древочаг. Услышав эту новость, Орейн помчался домой, собрав под свои знамёна племена Лесной Сени, дабы спасти город от #LORE [Concept('compendium_daedric', 'даэдрического')]#! проклятия.\n\n#bold Его мощь велика, но легионы нежити практически неисчислимы… Сможете ли вы одержать верх в неравной борьбе и сотворить легенду, что будет известна от Древочага до Шеогорада?#!"
 bm_interregnum_valenwood_malgoth:0 "Древождь Малгот"
 bm_interregnum_valenwood_malgoth_desc:0 "Большинство хранителей кланов довольствуются тем, что защищают своих сородичей. Это не про Малгота — он мечтает быть верховным королём. Но на пути к цели ему придётся выкорчевать раскидистое семейное древо Короля-Оленя.\nМалготу придётся тщательно обдумать первый шаг. Малабал Тор пока раздроблен, а в Древочаге идёт гражданская война. Нельзя забывать о сильной армии Сильвенара, способной перевернуть ход игры.\n\n#bold Малготу выпала возможность ловить рыбу в мутной воде. Ему потребуется вся его хитрость и находчивость, чтобы не сбиться с пути и воплотить свои грандиозные амбиции. Погибнет ли он на пороге бессмертной славы? Или кто-то укажет ему путь к заслуженному королевскому трону?#!"
 bm_interregnum_valenwood_gallus:0 "Герцог Галл"
 bm_interregnum_valenwood_gallus_desc:0 "В десятилетия, предшествовавшие падению Потентата, многие поселенцы из Коловии решались попытать удачу в Валенвуде, стекаясь в Саутпойнт — островок имперской культуры в океане босмерских земель. В хаосе Междуцарствия Галл Зантоний хочет использовать это ради удовлетворения собственных амбиций.\nОтсиживаясь за надёжными стенами Саутпойнта, Галлу предстоит поразмыслить о своей судьбе: местным жителям отнюдь не близки коловианские элиты. Должен ли он принять их обычаи или силой установить имперскую власть со своего плацдарма? Древлий Корень нацелил на него свой лук и выпустит стрелу, стоит только Галлу оступиться.\n\n#bold Каждое упущенное мгновение приближает погибель на головы коловианцев. И только в ваших руках изменить это и утвердить сиродильскую гегемонию в сердце Валенвуда.#!"

 # recommanded characters for summerset 450
 bm_interregnum_summerset:0 "Сумерки эпохи"
 bm_interregnum_summerset_desc:0 "Острова Саммерсет. Именно здесь в Меретическую эру нашли пристанище самые прославленные дети Альдмериса, и с тех пор местные кинлорды, продолжая дело предков, постепенно вырывают эту землю из лап варварства.\n\nНо необузданное #italic пламя#!, разгорающееся из-за падения змеиного тирана, угрожает вновь нарушить покой этих земель. Путь к Алаксону строг, но даже любимец подданных Аран-Эль должен следовать ему, ведь апраксис обходится дорого.\nИ нет лучше примеров этому, чем Элендари V Ауноро, нынешняя кинледи Лилландрила, вовлечённая в разрушительный династический кризис, или Рилис XII, теряющий рассудок от паранойи. Что ещё более тревожно, так это объединение гоблинских племён, положивших глаз на Пристанище Короля, из-за чего Эндарону Мотрилу в наследство достались руины.\n\n#bold Покою дома альтмеров угрожают расхождения в выбранном курсе. Удастся ли вам удержать державу на плаву, или вы не сможете сбросить оковы иерархий прошлого?#!"
 bm_interregnum_summerset_hidellith:0 "Аран-Эль Хиделлит 'лен Имари"
 bm_interregnum_summerset_hidellith_desc:0 "Хиделлиту 'лен Имари Тандилу 'ата Неймону Тамлиену, церемониарху альтмеров, королю Алинора и островов Саммерсет выпало вести свою державу через неспокойные воды.\n\nЛучшие из предсказателей видят, как опасности грядущих лет окружают прекрасный Алинор. Апраксис будоражит сердца масс, сея по всему королевству семена хаоса. Элендари V из Лилландрила ведёт войну за престол из-за своей #italic сомнительной#! родословной. То, что принято называть мудростью, давно оставило нынешнего Рилиса из Фёстхолда, и вот он уже исполняет нечестивые #LORE [Concept('compendium_daedric', 'даэдрические')]#! ритуалы. Если не пресечь это, то вскоре он начнёт собирать приспешников.\n\n#bold Что станет с родиной альдмеров под властью этого Аран-Эля? Раем мира или пристанищем бедствий? Это зависит лишь от вас.#!"
 bm_interregnum_summerset_rilis:0 "Верховный кинлорд Рилис XII"
 bm_interregnum_summerset_rilis_desc:0 "Рилис XII — потомок великого Торинана Первопоселенца, легендарного альдмера, открывшего острова Саммерсет.\n\nВ начале правления кинлорда Рилиса считали героем, он даже помог Ванусу Галериону открыть Гильдию магов. Амбициозность Рилиса ни для кого не была секретом, но до недавнего момента его стремления не принимали такой тёмный характер. Ко всеобщему удивлению, он публично поклялся в вечной верности Молагу Балу и отверг поклонение Аэдра.\n\n#bold Верховный кинлорд в безопасности, пока внимание короля Хиделлита отвлечено. Но если Рилис не укрепит свою позицию, то перед силами Алинора ему не выстоять. Увенчается ли успехом его стремление к власти или он падёт так же, как и другие даэдропоклонники на островах до него?#!"
 bm_interregnum_summerset_elendarie:0 "Верховная кинледи Элендари V Босмерка"
 bm_interregnum_summerset_elendarie_desc:0 "Кинледи Элендари III Просветлённая как-то сказала: «Быть апраксичным — значит отвергнуть свой долг перед альтмерским обществом»… Но это самое общество ни разу не давало Элендари V Босмерке шанса: всё, на что она могла рассчитывать, — это презрение.\nЕй пришлось изгнать собственного отца, но это не спасло её от очередного восстания: единоутробные братья Элендари при поддержке отверженца Фанорна Ауноро ведут войну против неё.\n\n#bold Будут ли Элендари считать несчастливой случайностью в истории дома Ауноро или же вы выкуете судьбу, свободную от ограничений праксиса?#!"
 bm_interregnum_summerset_endaron:0 "Оптимат Эндарон"
 bm_interregnum_summerset_endaron_desc:0 "Внезапная гибель Эльпиона Мотрила и его супруги погрузила Пристанище Короля в хаос. Власть Эндарона 'ата Эльпиона не простирается дальше столичного владения: подстрекаемые недоброжелателями, члены младших ветвей его дома восстали, а гоблины захватили Гралан, отрезав помощь из Клаудреста. Эндарону придётся подавить сопротивление, а иначе ситуация станет для него неразрешимой. Его юный возраст, к тому же, требует регентства, что потенциально может погубить державу.\n\n#bold Эндарону III придётся бороться, чтобы забрать своё по праву рождения. Хватит ли его усилий или же он станет печальным примером номинального монарха?.. Сможете ли вы сделать так, чтобы род Мотрил перенёс эту бурю?#!"
 bm_interregnum_summerset_sanyon:0 "Верховный кинлорд Санион II"
 bm_interregnum_summerset_sanyon_desc:0 "Санион II как брат королевы Туинден является одним из ключевых дворян Алинора. Верность короне течёт в крови кинлордов Даска, и Санион не отступает от этой традиции… Но лишь потому, что Хиделлит не позволяет альдархам обличать его выходки. И несмотря на это Санион всё равно презирает и королевскую милость, и сестринскую любовь, и лишь с удвоенной силой упорствует в своей дерзости. Нахальство Саниона угрожает погубить многовековую репутацию дома Аунсамиран и взрастить радикальные идеи.\n\n#bold Санион угрожает уничтожить всё, над чем работали его предки. Сможет ли он взять себя в руки, пока не стало слишком поздно… или же шурин короля пойдёт по пути, с которого нет возврата, погрузившись в апраксис?#!"
 bm_interregnum_summerset_tragrim:0 "Кинлорд Трагрим"
 bm_interregnum_summerset_tragrim_desc:0 "Трагрим словно бы боится утонуть. Такое поведение подстать разве что робкому монарху родом с равнин Илувамира.\n\nСоседний кинлорд Мерандил на каждом праксическом мероприятии не упускает возможность «образумить» его и считает воспитание нерадивого юнца долгом состоявшегося верховного кинлорда. Однако начинания Мерандила могут порушиться о скрытный характер Трагрима… В уши юноши, страдающего от собственной неуверенности, проникают успокаивающие апраксичные речи недовольных меров.\n\n#bold К праксичным мерам благородного происхождения относятся с большим почётом и уважением, но всегда ли они этого заслуживают? Стоит ли подчиниться или пойти наперекор устоям? Путь, по которому пойдёт этот молодой кинлорд, зависит от вас!#!"
 bm_interregnum_summerset_zyg:0 "Вождь Зыг"
 bm_interregnum_summerset_zyg_desc:0 "Вождь Зыг прожил славную жизнь, более славную, чем кто-либо мог предсказать.\n\nЗыга, уроженца южного Алинора, за дерзкий дух изгнали его собственные родичи, которые боялись полного истребления со стороны «Горнаса». Рассказы о свободных гоблинах в горах Нир подпитывали его поход на север.\n\nДлинные дома Калкракта не спешили доверять чужаку, пока он не защитил ныне покойного вождя Морга от попытки убийства. Зыг уничтожил предателей при поддержке смертельно раненного вождя. На похоронах он поклялся отомстить племенам Клаудреста…\n\n#bold Сможет ли Зыг выполнить клятву на крови, данную своему покровителю? Или его глупое обещание обернётся гибелью для Калкракта?#!"

 # Alliance War
 bm_alliancewar:0 "Война Альянсов"
 bm_alliancewar_desc:0 "Когда несколько лет назад Маннимарко, Король Червей, осквернил Амулет Королей незадолго до ритуала коронации Императора Варена, он добился отмены действия завета между Алессией и Акатошем, и лишил Нирн защиты от даэдрического вторжения. Князь даэдра Молаг Бал, по чьей указке действовал Маннимарко, воспользовался возможностью инициировать Слияние Планов, при помощи ужасающих Тёмных якорей призывая даэдрические войска и затягивая Нирн в Хладную Гавань. Но три политических альянса: Эбонхартский Пакт, Даггерфолльский Ковенант и Альдмерский Доминион — противостоят даэдрическому князю и его войскам.\n\n#bold Армии трёх альянсов сходятся вместе, готовые сражаться до последнего, чтобы сохранить свою свободу. Никогда раньше разрозненные расы не сотрудничали так тесно, но никогда прежде угроза не была такой ужасной.#!"
