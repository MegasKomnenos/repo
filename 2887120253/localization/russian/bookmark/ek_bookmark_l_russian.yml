 # Warlord Rising - Cyrodiil
 bm_warlordrising_cyrodiil:0 "Восстание генерала"
 bm_warlordrising_cyrodiil_desc:0 "Десять лет прошло с тех пор, как гнусный акавирский потентат был убит Мораг Тонг. Но некоторые цаэски продолжают ещё держаться за Имперский город. Их поддерживает сильная нибенейская знать на востоке, которая боится утратить влияние в сердце Сиродила. Кто-то должен положить этому конец.\n\nДекорации расставлены и пришло время для выхода на сцену молодого Аттреба Сосильдора — фанатичного последователя Восьми и заклятого врага поклонения даэдра и прочих ересей. Он уже сумел объединить разрозненную Коловию в Коловианские воеводства и теперь выступает защитником Сиродила. В это же время весь Тамриэль охвачен хаосом, ведь неизбежно грядёт Междуцарствие, угрожающее уничтожить то, что осталось от Империи.\n\n#bold Сможет ли Аттреб восстановить кажущееся утраченным или же воцарятся «дни и ночи злобы и крови»?#!"
 bm_warlordrising_attrebus:0 "Генерал Аттреб"
 bm_warlordrising_attrebus_desc:0 "Истинный воин, Аттреб был взращён в аббатстве Восьми, чтобы посвятить свою жизнь служению #LORE [Concept( 'compendium_eight_divines', 'Восьми богам' )]#!. Разгневанный пренебрежением #LORE [Concept('compendium_potentate', 'потентата')]#! к Божествам, он собрал армию вместе с правителями-единомышленниками из Коловии и поклялся положить конец власти потентата и его языческих вассалов.\n\n#bold В близящейся войне определится судьба Тамриэля. Обернутся ли начинания Аттреба крахом, а значит, потентат сохранит статус главной силы в Имперской провинции? Или же он сумеет сокрушить потентат, завладеть короной Красного Дракона Сиродила и стать истинным императором Тамриэля?#!"
 bm_warlordrising_attrebus_alt_claber:0 "Прелат Клабр"
 bm_warlordrising_attrebus_alt_vesta:0 "Леди Веста"
 bm_warlordrising_aixnieras_ves:0 "Потентат Айксниерас-Вес"
 bm_warlordrising_aixnieras_ves_desc:0 "Внуку предыдущего #LORE [Concept('compendium_potentate', 'потентата')]#! Савириен-Чорака, Айксниерасу-Весу пришлось спешно покидать место своего отдыха, когда от рук Мораг Тонг погибли его дед и отец. Новый потентат, ожидавший, что править ему не предстоит ещё минимум несколько столетий, столкнулся теперь с кажущимися непосильными испытаниями. С запада наступает генерал Аттреб, оставшиеся ещё вассалы всё больше думают о независимости и даже в самом его дворе плетут интриги. На что остаётся уповать молодому цаэски, если он хочет сохранить власть и одержать победу?\n\n#bold Падёт ли потентат? Станет ли Айксниерас-Вес свидетелем того, как власть ускользает у него из рук, пока Сиродил и Тамриэль вступают в эру тьмы и хаоса? Или же вы сумеете взять бразды правления в свои руки, одолеть неумытых коловианских рыцарей и сковать новую судьбу Тамриэля?#!"
 bm_warlordrising_caius:0 "Военачальник Кай"
 bm_warlordrising_caius_desc:0 "Кай Лекс — румарский военачальник, находящийся в шатком положении. К западу от него растянулись Коловианские воеводства, на севере лежат королевства сиро-нордов, а большая часть родных ему земель Румаре находится под властью #LORE [Concept('compendium_potentate', 'потентата')]#!. Богатства Румаре всегда привлекали нибенейских и коловианских захватчиков, но если текущая война против потентата не принесёт решительных результатов, Кай Лекс может стать тем, кто удержит эти земли от впадения в анархию и хаос.\n\n#bold Кай Лекс взвалил на свои плечи миссию по защите Румаре в это неспокойное время. Сможете ли вы возвыситься, став лордом-протектором Имперского острова или же окажетесь лишь незначительным препятствием на пути захватчиков, желающих подчинить себе сердце Тамриэля?#!"
 bm_warlordrising_humilio:0 "Виконт Гумилион"
 bm_warlordrising_humilio_desc:0 "Чейдинхол — жемчужина Нибенея и резиденция Тарнов, благословлённых долголетием и, как ходят слухи, предрасположенностью к магии. Положение виконта Гумилиона нельзя назвать ни слишком завидным, ни тревожным. Он пока не последовал за другими правителями Сиродила, узурпировавшими власть и объявившими независимость, и остаётся верен #LORE [Concept('compendium_potentate', 'потентату')]#! из столицы. В случае поражения коловианцев, это сыграет ему на руку и обеспечит защиту… После чего ему придётся столкнуться с сиро-нордскими ярлствами к северу и нибенейскими военачальниками на юге. И сразиться с ними всеми — если он намеревается надеть однажды королевскую мантию.\n\n#bold Гумилиону под силу заложить прочный фундамент для потомков. Станете ли вы выжидать, поддерживая потентата в надежде на награду, или храбро ринетесь в бой, чтобы стать владыкой Нибенейского бассейна?#!"
 bm_warlordrising_humilio_alt_abnur:0 "Абнур Тарн"

