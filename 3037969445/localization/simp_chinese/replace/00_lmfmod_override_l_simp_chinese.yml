 ChildhoodPersonalityTrait_curious:0 "[GetTrait('curious').GetNameNoTooltip( ROOT.Char )]"
 ChildhoodPersonalityTrait_pensive:0 "[GetTrait('pensive').GetNameNoTooltip( ROOT.Char )]"
 
